            --extract-overwrite \
            -E 'package(=g5d-isolation) and kind(=lib) and test(isolation)' \
            --no-fail-fast -j2
          unset LLVM_PROFILE_FILE
          cargo llvm-cov report --nextest-archive-file /workspace/nextest-archives/rust-ci.tar.zst -p g5d-isolation --lcov --output-path lcov-g5d-isolation-unit.info || true
        else
          cargo llvm-cov nextest \
            --no-report \
            -p g5d-isolation --lib --all-features \
            --no-fail-fast -j2 \
            -E 'test(isolation)'
          cargo llvm-cov report -p g5d-isolation --lcov --output-path lcov-g5d-isolation-unit.info || true
        fi
        sccache --show-stats || true
    env:
      - CARGO_HOME=/opt/g5-cargo-home
      - SQLX_OFFLINE=true
      - DATABASE_URL=postgres://g5:g5_test@postgres:5432/g5_test
      - RUST_LOG=info
      - CARGO_INCREMENTAL=${_G5_CI_CARGO_INCREMENTAL}
      - RUSTC_WRAPPER=${_G5_CI_RUSTC_WRAPPER}
      - G5_CI_SKIP_BAKED_ARTIFACT_CLEAN=${_G5_CI_RUST_TARGET_PRIME}
      - G5_CI_NEXTEST_ARCHIVE=${_G5_CI_NEXTEST_ARCHIVE}
      - G5_CI_RUST_XFS_ORCHESTRATOR=${_G5_CI_RUST_XFS_ORCHESTRATOR}
    waitFor: ['setup-kvm-cloud-hypervisor', 'rust-nextest-archive']

  # ---------------------------------------------------------------------------
  # 7e. Release binaries for runtime image packaging
  # ---------------------------------------------------------------------------
  - id: rust-release-artifacts
    name: gcr.io/cloud-builders/docker
    dir: .
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail

        rm -rf .ci-release-artifacts/api .ci-release-artifacts/api.tmp

        # CI-speed experiment (b484d078): GCS-backed sccache on a FRESH target dir.
        # Plain docker run (no XFS namespaces); fresh CARGO_TARGET_DIR avoids the
        # baked-target hash collision; persists to GCS so unchanged crates hit on
        # warm builds. Safe fallback: if GCS is unreachable, compiles without caching.
        if [[ -n "${_G5_CI_SCCACHE_GCS_BUCKET}" ]]; then
          docker run --rm \
            --network=cloudbuild \
            -v /workspace:/workspace \
            -w /workspace \
            -e CARGO_HOME=/opt/g5-cargo-home \
            -e CARGO_TARGET_DIR=/workspace/sccache-release-target \
            -e CARGO_BUILD_JOBS=${_G5_CI_RELEASE_BUILD_JOBS} \
            -e CARGO_INCREMENTAL=0 \
            -e CARGO_BUILD_PIPELINING=false \
            -e RUSTC_WRAPPER=sccache \
            -e SCCACHE_GCS_BUCKET=${_G5_CI_SCCACHE_GCS_BUCKET} \
            -e SCCACHE_GCS_KEY_PREFIX=${_G5_CI_SCCACHE_GCS_PREFIX} \
            -e SCCACHE_GCS_RW_MODE=READ_WRITE \
            -e SCCACHE_DIR=/workspace/sccache-local \
            -e SCCACHE_IDLE_TIMEOUT=0 \
            -e SQLX_OFFLINE=true \
            -e DATABASE_URL=postgres://g5:g5_test@postgres:5432/g5_test \
            -e TEST_DATABASE_URL=postgres://g5:g5_test@postgres:5432/g5_test \
            -e G5_CI_RELEASE_ARTIFACTS_DIR=/workspace/.ci-release-artifacts/api \
            -e G5_CI_SKIP_BAKED_ARTIFACT_CLEAN=true \
            "${_RUST_LANE_IMAGE}" \
            bash -lc '
              set -euo pipefail
              export PATH="$${CARGO_HOME}/bin:$${PATH}"
              sccache --start-server || true
              echo "=== sccache stats (pre-build) ==="; sccache --show-stats || true
              bash ./scripts/build-release-artifacts.sh
              echo "=== sccache stats (post-build) ==="; sccache --show-stats || true
            '
          exit 0
        fi

        TARGET_CACHE_SKIP_CLEAN=false
        if [[ -n "${_RUST_TARGET_CACHE_IMAGE}" ]]; then
          TARGET_CACHE_SKIP_CLEAN=true
        fi

        if [[ "${_G5_CI_RUST_XFS_ORCHESTRATOR}" =~ ^(1|true|TRUE|yes|YES)$ ]]; then
          docker run --rm \
            --privileged \
            --network=cloudbuild \
            -v /workspace:/workspace \
            -w /workspace \
            -e CARGO_HOME=/opt/g5-cargo-home \
            -e CARGO_TARGET_DIR=/opt/g5-rust-target-cache/target \
            -e CARGO_BUILD_JOBS=${_G5_CI_RELEASE_BUILD_JOBS} \
            -e CARGO_INCREMENTAL=${_G5_CI_CARGO_INCREMENTAL} \
            -e RUSTC_WRAPPER=${_G5_CI_RUSTC_WRAPPER} \
            -e SQLX_OFFLINE=true \
            -e DATABASE_URL=postgres://g5:g5_test@postgres:5432/g5_test \
            -e TEST_DATABASE_URL=postgres://g5:g5_test@postgres:5432/g5_test \
            -e G5_CI_RUST_XFS_ROOT=/workspace/rust-release-artifacts-xfs \
            -e G5_CI_RUST_XFS_MOUNT=/mnt/g5-rust-release-xfs \
            -e G5_CI_RUST_XFS_SIZE_GB=${_G5_CI_RUST_XFS_SIZE_GB} \
            -e G5_CI_RELEASE_ARTIFACTS_DIR=/workspace/.ci-release-artifacts/api \
            -e G5_CI_SKIP_BAKED_ARTIFACT_CLEAN="$${TARGET_CACHE_SKIP_CLEAN}" \
            -e RUST_LOG=info \
            "${_RUST_XFS_ORCHESTRATOR_IMAGE}" \
            --release-artifacts
        else
          docker run --rm \
            --network=cloudbuild \
            -v /workspace:/workspace \
            -w /workspace \
            -e CARGO_HOME=/opt/g5-cargo-home \
            -e CARGO_TARGET_DIR=/opt/g5-rust-target-cache/target \
            -e CARGO_BUILD_JOBS=${_G5_CI_RELEASE_BUILD_JOBS} \
            -e CARGO_INCREMENTAL=${_G5_CI_CARGO_INCREMENTAL} \
            -e RUSTC_WRAPPER=${_G5_CI_RUSTC_WRAPPER} \
            -e SQLX_OFFLINE=true \
            -e DATABASE_URL=postgres://g5:g5_test@postgres:5432/g5_test \
            -e TEST_DATABASE_URL=postgres://g5:g5_test@postgres:5432/g5_test \
            -e G5_CI_RELEASE_ARTIFACTS_DIR=/workspace/.ci-release-artifacts/api \
            -e G5_CI_SKIP_BAKED_ARTIFACT_CLEAN="$${TARGET_CACHE_SKIP_CLEAN}" \
            "${_RUST_LANE_IMAGE}" \
            bash ./scripts/build-release-artifacts.sh
        fi
    waitFor: ['build-rust-xfs-orchestrator-image', 'rust-target-prime']

  # ---------------------------------------------------------------------------
  # 7d. Optional Rust XFS orchestrator (compile once, reflink fanout lanes)
  # ---------------------------------------------------------------------------
  - id: rust-xfs-orchestrator
    name: gcr.io/cloud-builders/docker
    dir: .
    entrypoint: bash
    timeout: 1800s
    args:
      - -c
      - |
        set -euo pipefail

        if [[ ! "${_G5_CI_RUST_XFS_ORCHESTRATOR}" =~ ^(1|true|TRUE|yes|YES)$ ]]; then
          echo "Rust XFS orchestrator disabled"
          exit 0
        fi

        if [[ "${_G5_CI_NEXTEST_ARCHIVE}" =~ ^(1|true|TRUE|yes|YES)$ ]]; then
          echo "Rust XFS orchestrator and nextest archive are mutually exclusive experiments"
          exit 2
        fi

        TARGET_CACHE_SKIP_CLEAN=false
        if [[ -n "${_RUST_TARGET_CACHE_IMAGE}" ]]; then
          TARGET_CACHE_SKIP_CLEAN=true
        fi

        # CARGO_BUILD_JOBS is memory-matched to the c3-highcpu-22 pool (44 GB),
        # not vCPU-matched: the big crate units peak at multiple GB of rustc RSS
        # each and 44 jobs OOM-SIGKILLed the largest rustc while the compile was
        # coverage-instrumented (cicd spec D26). Instrumentation is now off; the
        # resource-sampler summary is the evidence for raising the cap.
        docker run --rm \
          --privileged \
          --cgroupns=host \
          -v /sys/fs/cgroup:/sys/fs/cgroup:ro \
          --network=cloudbuild \
          -v /workspace:/workspace \
          -w /workspace \
          -e CARGO_HOME=/opt/g5-cargo-home \
          -e CARGO_TARGET_DIR=/opt/g5-rust-target-cache/target \
          -e CARGO_BUILD_JOBS=${_G5_CI_RUST_XFS_BUILD_JOBS} \
          -e G5_CI_SUPERSET_COMPILE_JOBS=${_G5_CI_RUST_XFS_BUILD_JOBS} \
          -e CARGO_INCREMENTAL=${_G5_CI_CARGO_INCREMENTAL} \
          -e RUSTC_WRAPPER=${_G5_CI_RUSTC_WRAPPER} \
          -e SQLX_OFFLINE=true \
          -e DATABASE_URL=postgres://g5:g5_test@postgres:5432/g5_test \
          -e TEST_DATABASE_URL=postgres://g5:g5_test@postgres:5432/g5_test \
          -e G5_TEST_DATABASE_TEMPLATE=${_G5_CI_INTEGRATION_TEMPLATE_DB} \
          -e G5_TEST_RUNTIME_ROLES_BOOTSTRAPPED=true \
          -e G5_CI_INTEGRATION_JOBS=${_G5_CI_INTEGRATION_JOBS} \
          -e G5_CI_G5D_INTEGRATION_JOBS=${_G5_CI_G5D_INTEGRATION_JOBS} \
          -e G5_CI_RUST_XFS_SIZE_GB=${_G5_CI_RUST_XFS_SIZE_GB} \
          -e G5_CI_SKIP_BAKED_ARTIFACT_CLEAN="$${TARGET_CACHE_SKIP_CLEAN}" \
          -e RUST_LOG=info \
          "${_RUST_XFS_ORCHESTRATOR_IMAGE}"
        # CI-speed assumption (b484d078): run the critical-path rust-release-artifacts
        # compile FIRST (it is defined just above) so this off-critical orchestrator no
        # longer competes with it for the 22-vCPU pool's CPU and two concurrent ~120GB
        # XFS reflink builds. Full test set still runs; it only starts later. (Cloud
        # Build requires waitFor targets to be defined earlier, hence the ordering.)
    waitFor: ['rust-release-artifacts', 'build-rust-xfs-orchestrator-image', 'db-bootstrap-runtime-users-integration-template', 'setup-kvm-cloud-hypervisor']

  - id: g5d-self-contained-artifact-test
    name: ${_RUST_XFS_ORCHESTRATOR_IMAGE}
    dir: .
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        bash ./scripts/test-g5d-self-contained.sh \
          .ci-release-artifacts/api/g5d \
          .ci-release-artifacts/worker/g5d
    waitFor: ['rust-release-artifacts']

  # ---------------------------------------------------------------------------
  # 7f. microVM boot smoke quick gate
  # ---------------------------------------------------------------------------
  # Strict real-guest boot and network boundary gate. No process fallback.
  - id: smoke-cloud-hypervisor
    name: gcr.io/cloud-builders/docker
    dir: .
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        docker run --rm --privileged --device=/dev/kvm \
          -v /workspace:/workspace -w /workspace \
          -e G5D_BIN=/workspace/.ci-release-artifacts/api/g5d \
          -e G5_TEST_QA_DISK_INCIDENT=1 \
          ${_CI_IMAGE} bash scripts/test-cloud-hypervisor-ci.sh
    waitFor: ['build-ci-image', 'rust-release-artifacts']

  # ---------------------------------------------------------------------------
  # 10. Stop Postgres sidecar (deferred — runs after every DB-consuming lane in this build)
  # ---------------------------------------------------------------------------
  - id: stop-postgres
    name: gcr.io/cloud-builders/docker
    args: ['rm', '-f', 'postgres']
    waitFor: ['rust-integration', 'rust-integration-g5d', 'isolation-backends', 'isolation-unit', 'rust-xfs-orchestrator', 'sqlx-check', 'db-assert-migrator-revoke']

  # ---------------------------------------------------------------------------
  # 11. Fail the build if any deferred test stage failed
  # ---------------------------------------------------------------------------
  - id: assert-ci-status
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail

        # Release the background resource sampler. The orchestrator, clippy
        # and sqlx lanes are transitive dependencies of this step; the release
        # build and doctests finish earlier in practice, so the recorded
        # envelope covers every compile-heavy window.
        touch /workspace/resource-sampler-stop

        failed=()
        for step_log in /workspace/step-results-*.txt; do
          [[ -f "$$step_log" ]] || continue
          while IFS='=' read -r key value; do
            [[ -n "$$key" ]] || continue
            if [[ "$$value" == "failed" ]]; then
              failed+=("$$key")
            fi
          done < "$$step_log"
        done

        if (( $${#failed[@]} > 0 )); then
          echo "CI stages failed: $${failed[*]}"
          exit 1
        fi

        echo "All deferred CI stages passed"
    waitFor: ['stop-postgres', 'rust-test', 'rust-integration-g5d', 'rust-clippy']


timeout: 14400s   # 240 minutes — matches the sibling E2E pipeline; generous headroom for cold caches

artifacts:
  objects:
    location: 'gs://${PROJECT_ID}-build-artifacts/ci/$BUILD_ID/'
    paths:
      - 'resource-samples/**'
