# =============================================================================
# Cloud Build — CI Rust Pipeline (g5-ci-rust)
# =============================================================================
# One of the TWO parallel PR quality-gate pipelines (see also
# infra/ci/cloudbuild-ci-e2e.yaml). Runs on every PR via GitHub trigger.
# This file owns the compile/static/unit/integration/isolation lanes; the
# sibling file owns the live E2E stack and browser lanes. Partition contract:
# .semlift/specs/software_architecture/integration-stack/cicd.semlift.md D23.
# Steps duplicated in both files (CI image, Postgres/migrator spine, Rust
# cache spine, setup-kvm-cloud-hypervisor, rust-release-artifacts) must stay
# byte-identical except for the documented lane-specific deltas
# (cancel-stale-pr-builds expected-trigger env line — the body delegates to
# scripts/cancel-stale-ci-builds.sh — and
# the E2E file's rust-release-artifacts XFS fallback, which fails closed —
# build-rust-xfs-orchestrator-image lives only in this file; cicd D23).
#
# Runs on the Terraform-managed private Cloud Build WorkerPool, which is
# currently provisioned as c3-highcpu-22 in us-central1 (dev.tfvars ci_worker_machine_type). This is a
# capacity-routing choice only; keep the same gates and assertions.
#
# Phase graph:
#   [cancel-stale-pr-builds]  (best-effort, independent)
#   [migration-version-uniqueness + migration-checksums] → [db-migrate]
#   [postgres] → [wait-pg] → [db-migrate] → [runtime roles] → [integration template]
#   [verify-rust-target-cache] → [cargo-fetch] → [rust-target-prime] → [rust-nextest-archive]
#        │                                                              ├→ [rust-test]
#        │                                                              ├→ [integration-api ← integration template]
#        │                                                              ├→ [integration-g5d]
#        │                                                              └→ [isolation-*]
#        ├→ [fmt] ─┬→ [clippy]
#        │         ├→ [deny]
#        │         └→ [sqlx-check ← db-migrate]
#        ├→ [doc-tests]
#        └→ [rust-release-artifacts] → [g5d-self-contained-artifact-test]
#                                    → [smoke-cloud-hypervisor]
#                                    → [rust-xfs-orchestrator ← setup-kvm + integration template]
#   [setup-kvm + Cloud Hypervisor] ────→ [isolation-backends]
#                              → [isolation-unit]
#
# Compile-time: All Rust compile steps use SQLX_OFFLINE=true (offline cache)
# for sqlx::query!() macro validation — no live DB needed at compile time.
# Runtime: Test steps that execute against the DB also set DATABASE_URL for
# runtime connections (SQLX_OFFLINE takes precedence at compile time).
#
# Trigger (created by Terraform cloudbuild module):
#   - Event: Pull Request (branch ^.*$; PR-only — no push-to-main trigger)
#   - Config: infra/ci/cloudbuild-ci-rust.yaml
#   - Pool:   supplied by the environment-specific trigger as _POOL
#   - Machine: c3-highcpu-22 (defined by the WorkerPool)
#
# The substitutions block is kept identical in both CI files so shared steps
# stay byte-identical; keys used only by the sibling file are inert defaults.
# =============================================================================

options:
  logging: CLOUD_LOGGING_ONLY
  dynamic_substitutions: true
  # Event-derived keys (_PR_NUMBER, _HEAD_BRANCH, _HEAD_REPO_URL) are used but
  # deliberately NOT declared below — a config-declared default MASKS the
  # trigger event's value (#1328; cicd D18). ALLOW_LOOSE keeps manual
  # `gcloud builds submit` runs working by rendering absent keys empty
  # (triggered builds already default to ALLOW_LOOSE).
  substitution_option: 'ALLOW_LOOSE'
  pool:
    name: ${_POOL}

substitutions:
  _POOL: projects/${PROJECT_ID}/locations/us-central1/workerPools/g5-ci-pool
  _AR_REGION: us-central1
  _CI_REPOSITORY: g5-ci
  _CI_IMAGE: g5-ci-builder
  _NODE_VERSION: '22'
  _PG_IMAGE: 'pgvector/pgvector:pg17'
  _PG_MAX_CONNECTIONS: '400'
  _G5_CI_INTEGRATION_JOBS: ''
  _G5_CI_INTEGRATION_TEMPLATE_DB: g5_test_template
  _G5_CI_G5D_INTEGRATION_JOBS: ''
  _G5_CI_CARGO_INCREMENTAL: '0'
  _G5_CI_RUSTC_WRAPPER: ''
  # CI-speed experiment (b484d078): GCS-backed sccache for the release compile.
  _G5_CI_SCCACHE_GCS_BUCKET: '${PROJECT_ID}-build-artifacts'
  _G5_CI_SCCACHE_GCS_PREFIX: 'sccache-experiment/release'
  _G5_CI_RUST_TARGET_PRIME: 'false'
  _G5_CI_NEXTEST_ARCHIVE: 'false'
  _G5_CI_RUST_XFS_ORCHESTRATOR: 'true'
  # Cargo jobs for the XFS orchestrator's one superset test compile, passed
  # through as G5_CI_SUPERSET_COMPILE_JOBS (the script's own default is 16).
  # 16 matches the value the script had been applying while this knob was
  # unwired; the compile is no longer coverage-instrumented, so raise it once
  # the resource-sampler summary shows the headroom on the 44 GB worker.
  _G5_CI_RUST_XFS_BUILD_JOBS: '16'
  # Release optimization/linking is memory-heavy, but a single Cargo job also
  # starves rustc's codegen jobserver: with a 99.5% sccache hit rate the
  # release step still took 7m04s (build 615ad1f1) because the ~120
  # non-cacheable bin/link units ran one at a time. Four jobs keep the peak
  # well inside the 44 GB worker while the sibling clippy/doctest/sqlx compiles
  # run; the resource-sampler step below records the actual envelope. This
  # changes scheduling, not the checked artifact surface.
  _G5_CI_RELEASE_BUILD_JOBS: '4'
  _G5_CI_RUST_XFS_SIZE_GB: '120'
  # E2E lean Rust prime (cicd D24): compile g5d + g5-e2e once into a committed
  # lane image off the critical path. Inert in the Rust file.
  _G5_CI_E2E_RUST_PRIME: 'true'
  # Value-loop lane isolation (cicd D30): dedicated org + single-slot host so
  # the receipt lane runs concurrently with rust-e2e. 'false' re-serializes the
  # lane behind rust-e2e's completion marker against the shared org/host.
  # Inert in the Rust file.
  _G5_CI_VALUE_LOOP_ISOLATED: 'true'
  # Rust-e2e lane isolation (cicd D31): dedicated org + host + stateless API
  # replica in the E2E file so the browser chain runs concurrently with both
  # Rust lanes. Inert in the Rust file.
  _G5_CI_RUST_E2E_ISOLATED: 'true'
  # Provider-agent browser-lane isolation (cicd D32): dedicated org + host in
  # the E2E file so the provider-agent lane overlaps the broad Playwright
  # shards. Inert in the Rust file.
  _G5_CI_PROVIDER_AGENT_ISOLATED: 'true'
  _RUST_LANE_IMAGE: g5-ci-rust-target-prime
  _RUST_TARGET_CACHE_IMAGE: ''
  _RUST_XFS_ORCHESTRATOR_IMAGE: g5-rust-xfs-orchestrator
  # Codex CLI pin: single-sourced from scripts/codex-cli-version (#1342 D-13);
  # the staging scripts default from that file, so no substitution is needed.
  _G5_E2E_STACK_THREADS: ''
  _PLAYWRIGHT_WORKERS: '16'
  _PLAYWRIGHT_RUNNER_IMAGE: g5-playwright-runner
  _PLAYWRIGHT_BASE_IMAGE: 'mcr.microsoft.com/playwright:v1.58.2-noble'
  _PLAYWRIGHT_E2E_WORKSPACE: e2e-playwright
  _PLAYWRIGHT_E2E_REPO_PREFIX: e2e-playwright
  _E2E_DB_NAME: g5_e2e
  _G5_DOCKER_CACHE_DISABLE: 'false'
  # NEVER declare _PR_NUMBER, _HEAD_BRANCH, or _HEAD_REPO_URL here: a config
  # declaration MASKS the trigger event's derived value (a `_PR_NUMBER: ''`
  # default added 2026-05-27 silently killed stale-build cancellation and the
  # PR result comment until #1328). Guard-tested; see cicd D18.
  # E2E runtime substrate. `workspace-vm` starts one `g5d host` container with
  # /dev/kvm and boots the same Cloud Hypervisor workspace VMs used in production. The
  # lane requires the nested-virt pool and fails closed when /dev/kvm is absent.
  _E2E_WORKER: 'workspace-vm'


# =============================================================================
# Steps
# =============================================================================
steps:
  # Rebases can introduce same-numbered SQLx migrations under different
  # filenames without a Git path conflict. Fail with both paths before
  # db-migrate reaches SQLx, instead of an opaque _sqlx_migrations_pkey error
  # (cicd D34; orchestration_scripts D23).
  - id: migration-version-uniqueness
    name: gcr.io/cloud-builders/gcloud
    dir: .
    entrypoint: bash
    args: ['./scripts/check-migration-version-uniqueness.sh']
    waitFor: ['-']

  # Applied migration bytes are immutable, including comment-only edits.
  - id: migration-checksums
    name: gcr.io/cloud-builders/gcloud
    dir: .
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        python3 -m unittest discover -s scripts -p test_migration_checksums.py
        python3 -m unittest discover -s scripts -p test_migration_runner_ci.py
        python3 scripts/check-migration-checksums.py
    waitFor: ['-']

  # ---------------------------------------------------------------------------
  # 0. Best-effort stale PR build cancellation
  # ---------------------------------------------------------------------------
  # Cloud Build does not provide GitHub Actions-style cancel-in-progress groups
  # for PR triggers. Fire-and-forget: request cancellation for older
  # in-progress builds of this trigger on the same change stream (PR number
  # when the event carries one, else head repo + branch — live PR events have
  # been observed with an EMPTY _PR_NUMBER, #1328), without blocking the
  # current build on those builds reaching a terminal state. The body is the
  # shared scripts/cancel-stale-ci-builds.sh (cicd D18); only the
  # G5_CI_EXPECTED_TRIGGER line differs between the two CI files.
  # ---------------------------------------------------------------------------
  # Automated sccache gating/failure-mode contract
  # (test_contract/deploy_build_caching I4). Hermetic docker builds — no GCP
  # credentials, no GCS; asserts disabled-mode purity, checksum fail-soft,
  # strict-preflight fail-open end to end, and harness↔product sync for the
  # deploy Dockerfiles + infra/ci/cloudbuild-deploy.yaml wiring. Independent of every
  # other lane.
  - id: sccache-gating-contract
    name: gcr.io/cloud-builders/docker
    dir: .
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        bash infra/docker/test-sccache-gating.sh
    waitFor: ['-']

  # ---------------------------------------------------------------------------
  - id: cancel-stale-pr-builds
    name: gcr.io/cloud-builders/gcloud
    entrypoint: bash
    args:
      - -c
      - |
        G5_CI_EXPECTED_TRIGGER="g5-ci-rust" \
        G5_CI_TRIGGER_NAME="$TRIGGER_NAME" \
        G5_CI_BUILD_ID="$BUILD_ID" \
        G5_CI_COMMIT_SHA="$COMMIT_SHA" \
        G5_CI_PR_NUMBER="${_PR_NUMBER}" \
        G5_CI_HEAD_BRANCH="${_HEAD_BRANCH}" \
        G5_CI_HEAD_REPO_URL="${_HEAD_REPO_URL}" \
        G5_CI_REGION="${_AR_REGION}" \
        G5_CI_PROJECT="$PROJECT_ID" \
        bash scripts/cancel-stale-ci-builds.sh
    waitFor: ['-']

  # ---------------------------------------------------------------------------
  # 0-bg. Background RAM/CPU sampler (evidence for the compile-parallelism
  # settings above). Mirrors the E2E pipeline's sampler: samples
  # /proc/meminfo, /proc/loadavg and per-container docker stats every 10s
  # until assert-ci-status touches the stop marker (hard 150-min cap), then
  # prints a peak summary (min MemAvailable, OOM markers) and uploads it with
  # the build artifacts. Always exits 0; it never gates the build.
  # ---------------------------------------------------------------------------
  - id: resource-sampler
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -c
      - |
        set -uo pipefail
        OUT_DIR=/workspace/resource-samples
        mkdir -p "$$OUT_DIR"
        CSV="$$OUT_DIR/samples.csv"
        STATS="$$OUT_DIR/container-stats.csv"
        SUMMARY="$$OUT_DIR/summary.txt"
        docker events \
          --filter type=container \
          --filter event=oom --filter event=kill --filter event=die \
          --format '{{.Time}} {{.Action}} {{.Actor.Attributes.name}}' \
          > "$$OUT_DIR/docker-events.log" 2>&1 &
        EVENTS_PID=$$!
        echo "ts,mem_total_kib,mem_available_kib,swap_total_kib,swap_free_kib,load1" > "$$CSV"
        echo "ts,container,mem_usage,cpu_pct" > "$$STATS"
        MIN_AVAIL_KIB=-1
        MIN_SWAP_FREE_KIB=-1
        MAX_LOAD1="0.00"
        START=$$(date +%s)
        while true; do
          NOW=$$(date -u +%Y-%m-%dT%H:%M:%SZ)
          MEM_AVAIL=$$(awk '/^MemAvailable:/{print $$2}' /proc/meminfo)
          SWAP_FREE=$$(awk '/^SwapFree:/{print $$2}' /proc/meminfo)
          LOAD1=$$(awk '{print $$1}' /proc/loadavg)
          awk -v now="$$NOW" '/^MemTotal:/{t=$$2} /^MemAvailable:/{a=$$2} /^SwapTotal:/{st=$$2} /^SwapFree:/{sf=$$2} END{print now","t","a","st","sf}' /proc/meminfo | sed "s/$$/,$$LOAD1/" >> "$$CSV"
          if [[ "$$MIN_AVAIL_KIB" -lt 0 || "$$MEM_AVAIL" -lt "$$MIN_AVAIL_KIB" ]]; then
            MIN_AVAIL_KIB="$$MEM_AVAIL"
          fi
          if [[ "$$MIN_SWAP_FREE_KIB" -lt 0 || "$$SWAP_FREE" -lt "$$MIN_SWAP_FREE_KIB" ]]; then
            MIN_SWAP_FREE_KIB="$$SWAP_FREE"
          fi
          if awk -v a="$$LOAD1" -v b="$$MAX_LOAD1" 'BEGIN{exit !(a>b)}'; then
            MAX_LOAD1="$$LOAD1"
          fi
          docker stats --no-stream --format "$$NOW,{{.Name}},{{.MemUsage}},{{.CPUPerc}}" >> "$$STATS" 2>/dev/null || true
          if [[ -f /workspace/resource-sampler-stop ]]; then
            echo "resource-sampler: stop marker observed"
            break
          fi
          if (( $$(date +%s) - START > 9000 )); then
            echo "resource-sampler: hard 150-min cap reached"
            break
          fi
          sleep 10
        done
        {
          echo "resource-sampler summary ($$(date -u +%Y-%m-%dT%H:%M:%SZ))"
          echo "mem_total_kib=$$(awk '/^MemTotal:/{print $$2}' /proc/meminfo)"
          echo "min_mem_available_kib=$$MIN_AVAIL_KIB"
          echo "min_mem_available_mib=$$(( MIN_AVAIL_KIB / 1024 ))"
          echo "min_swap_free_kib=$$MIN_SWAP_FREE_KIB"
          echo "swap_total_kib=$$(awk '/^SwapTotal:/{print $$2}' /proc/meminfo)"
          echo "max_load1=$$MAX_LOAD1"
          echo "--- containers reporting OOMKilled=true ---"
          docker ps -aq | xargs -r docker inspect --format '{{.Name}} OOMKilled={{.State.OOMKilled}}' 2>/dev/null | grep 'OOMKilled=true' || echo "(none)"
          echo "--- kernel oom markers (best effort) ---"
          if DMESG_OUT="$$(dmesg 2>/dev/null)"; then
            printf '%s\n' "$$DMESG_OUT" | grep -i -E 'out of memory|oom-kill|oom_kill' | tail -20 || echo "(dmesg readable; no oom markers)"
          else
            echo "(dmesg unreadable — oom markers NOT proven absent)"
          fi
        } | tee "$$SUMMARY"
        kill "$$EVENTS_PID" 2>/dev/null || true
        exit 0
    waitFor: ['-']

  # ---------------------------------------------------------------------------
  # 0a. Pull or build CI builder image
  # ---------------------------------------------------------------------------
  # The image is tagged with a hash of the CI Dockerfile, toolchain scripts,
  # Rust manifests/build scripts, and SQLx offline cache. If the image already
  # exists in Artifact Registry, we pull it (~30s). If not, we build and push it
  # once on the configured Cloud Build pool.
  # ---------------------------------------------------------------------------
  - id: build-ci-image
    name: gcr.io/cloud-builders/docker
    dir: .
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail

        # Content-hash tag: changes when the CI toolchain or warmed Rust
        # dependency graph changes.
        HASH=$$(
          {
            # Key the exact platform sources used by the cached CI image.
            printf '%s\n' \
              infra/docker/Dockerfile.ci-builder \
              infra/docker/Dockerfile.base \
              infra/docker/Dockerfile.base-rust \
              infra/docker/Dockerfile.base-rust-warm \
              scripts/build-cloud-hypervisor-runtime.sh \
              scripts/install-cloud-hypervisor-platform.sh \
              infra/guest/versions.env \
              infra/guest/kernel.config \
              infra/guest/init.c \
              infra/packer/g5-worker/scripts/58-install-passt.sh \
              infra/packer/g5-worker/scripts/lib/download-with-retry.sh \
              .cargo/config.toml \
              Cargo.toml \
              Cargo.lock
            find backend tests/e2e \
              -maxdepth 2 \
              \( -name Cargo.toml -o -name build.rs \) \
              -type f | sort
            # .sqlx is deliberately NOT a key input (deployment
            # g5.quality.delivery.ci.image-key): the baked copy only feeds the
            # image's warm-up compile, every CI step reads the checkout's
            # .sqlx, and a changed query recompiles only the crates it touches,
            # exactly like a source edit. Keying on it cost a 20-30 min rebuild
            # per lane for 6 of the 31 key-touching commits in 14 days.
          } | while read -r file; do
            sha256sum "$${file}"
          done | sha256sum | cut -c1-12
        )
        AR_IMAGE="${_AR_REGION}-docker.pkg.dev/$PROJECT_ID/${_CI_REPOSITORY}/${_CI_IMAGE}"
        TAGGED="$${AR_IMAGE}:$${HASH}"
        LATEST="$${AR_IMAGE}:latest"
        printf '%s\n' "$${HASH}" > /workspace/g5-ci-image-hash
        printf '%s\n' "$${AR_IMAGE}" > /workspace/g5-ci-image-repository

        # Try pulling the cached image
        if docker pull "$${TAGGED}" 2>/dev/null; then
          echo "CI image cache hit: $${TAGGED}"
          docker tag "$${TAGGED}" "${_CI_IMAGE}"
        else
          CACHE_FROM_ARGS=()
          if docker pull "$${LATEST}" 2>/dev/null; then
            echo "CI image exact cache miss; using latest layer cache seed: $${LATEST}"
            CACHE_FROM_ARGS+=(--cache-from "$${LATEST}")
          fi

          echo "CI image cache miss — building..."
          # Dockerfile.ci-builder is FROM g5/base-rust-warm:26.04 (docker_images
          # D20); build the common base + Rust + warm tiers locally first so the
          # leaf build resolves its base ARG default (D5: dev base tags are
          # local-only unless explicitly published). Only on a cache miss —
          # a cache hit never runs docker build and needs no base tier.
          # base and base-rust come from the content-keyed CI mirror when
          # published (deployment g5.quality.delivery.ci.base-image-mirror);
          # the workspace-warmed tier is rebuilt locally and never mirrored.
          G5_BASE_IMAGE_REGISTRY="${_AR_REGION}-docker.pkg.dev/$PROJECT_ID/${_CI_REPOSITORY}" \
          G5_BASE_IMAGE_MIRROR_TIERS="base base-rust" \
            bash scripts/ensure-base-images.sh base base-rust base-rust-warm
          docker build \
            "$${CACHE_FROM_ARGS[@]}" \
            -t "${_CI_IMAGE}" \
            -f infra/docker/Dockerfile.ci-builder \
            .

          # Push both :hash and :latest for future runs
          docker tag "${_CI_IMAGE}" "$${TAGGED}"
          docker tag "${_CI_IMAGE}" "$${LATEST}"
          docker push "$${TAGGED}"
          docker push "$${LATEST}"
          echo "Pushed CI image: $${TAGGED}"
        fi
    waitFor: ['-']

  # ---------------------------------------------------------------------------
  # 0a.2. Optional Rust XFS orchestrator image
  # ---------------------------------------------------------------------------
  # Experimental: wraps the baked Rust target cache with an XFS overlay fanout
  # so selected Rust coverage lanes can compile once, reflink-copy the compile
  # delta, and execute in isolated mount namespaces without Cargo target locks.
  # ---------------------------------------------------------------------------
  - id: build-rust-xfs-orchestrator-image
    name: gcr.io/cloud-builders/docker
    dir: .
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail

        if [[ ! "${_G5_CI_RUST_XFS_ORCHESTRATOR}" =~ ^(1|true|TRUE|yes|YES)$ ]]; then
          echo "Rust XFS orchestrator disabled"
          exit 0
        fi

        BASE_HASH="$$(cat /workspace/g5-ci-image-hash)"
        BASE_IMAGE="${_CI_IMAGE}"
        TARGET_CACHE_IMAGE="${_RUST_TARGET_CACHE_IMAGE}"
        if [[ -n "$${TARGET_CACHE_IMAGE}" ]]; then
          echo "Using Rust target cache base image: $${TARGET_CACHE_IMAGE}"
          docker pull "$${TARGET_CACHE_IMAGE}"
          docker tag "$${TARGET_CACHE_IMAGE}" g5-rust-target-cache-base
          BASE_IMAGE=g5-rust-target-cache-base
          BASE_DIGEST="$$(docker image inspect --format='{{index .RepoDigests 0}}' g5-rust-target-cache-base 2>/dev/null || true)"
          BASE_HASH="target-cache:$${TARGET_CACHE_IMAGE}:$${BASE_DIGEST}"
        fi

        RUNNER_IMAGE="${_RUST_XFS_ORCHESTRATOR_IMAGE}"
        HASH=$$(
          {
            printf '%s\n' "$${BASE_HASH}"
            printf '%s\n' \
              infra/docker/Dockerfile.rust-xfs-orchestrator \
              scripts/run-rust-xfs-orchestrator.sh \
              scripts/assert-g5d-self-contained.sh \
              scripts/test-g5d-self-contained.sh \
              scripts/build-release-artifacts.sh \
              scripts/clean-baked-rust-workspace-artifacts.sh | while read -r file; do
                sha256sum "$${file}"
              done
          } | sha256sum | cut -c1-12
        )

        AR_IMAGE="${_AR_REGION}-docker.pkg.dev/$PROJECT_ID/${_CI_REPOSITORY}/$${RUNNER_IMAGE}"
        TAGGED="$${AR_IMAGE}:$${HASH}"
        LATEST="$${AR_IMAGE}:latest"

        if docker pull "$${TAGGED}" 2>/dev/null; then
          echo "Rust XFS orchestrator image cache hit: $${TAGGED}"
          docker tag "$${TAGGED}" "$${RUNNER_IMAGE}"
        else
          echo "Rust XFS orchestrator image cache miss — building..."
          docker build \
            --build-arg BASE_IMAGE="$${BASE_IMAGE}" \
            -t "$${RUNNER_IMAGE}" \
            -f infra/docker/Dockerfile.rust-xfs-orchestrator \
            .

          docker tag "$${RUNNER_IMAGE}" "$${TAGGED}"
          docker tag "$${RUNNER_IMAGE}" "$${LATEST}"
          docker push "$${TAGGED}"
          docker push "$${LATEST}"
          echo "Pushed Rust XFS orchestrator image: $${TAGGED}"
        fi
    waitFor: ['build-ci-image']

  # ---------------------------------------------------------------------------
  # 0b. Start Postgres in the background (container-based sidecar)
  # ---------------------------------------------------------------------------
  - id: start-postgres
    name: gcr.io/cloud-builders/docker
    args:
      - run
      - -d
      - --name=postgres
      - --network=cloudbuild
      # Docker's 64 MB /dev/shm default fails Postgres parallel queries under
      # load (SQLSTATE 53100); tmpfs only consumes what is used.
      - --shm-size=1g
      - -e=POSTGRES_DB=g5_test
      - -e=POSTGRES_USER=g5
      - -e=POSTGRES_PASSWORD=g5_test
      - -p=5432:5432
      - ${_PG_IMAGE}
      - -c
      - max_connections=${_PG_MAX_CONNECTIONS}
      - -c
      - fsync=off
      - -c
      - synchronous_commit=off
      - -c
      - full_page_writes=off
    waitFor: ['-']

  - id: wait-postgres
    name: ${_PG_IMAGE}
    entrypoint: bash
    args:
      - -c
      - |
        for i in $(seq 1 30); do
          pg_isready -h postgres -p 5432 -U g5 -d g5_test 2>/dev/null && exit 0
          sleep 2
        done
        echo "Postgres failed to start" && exit 1
    waitFor: ['start-postgres']

  # ---------------------------------------------------------------------------
  # 0d. Provision a NON-SUPERUSER migrator that mirrors the Cloud SQL admin role
  # ---------------------------------------------------------------------------
  # CD runs migrations as the Cloud SQL admin (`G5_ADMIN_DATABASE_URL`), which has
  # CREATEROLE / CREATEDB but is NEITHER a PostgreSQL superuser NOR BYPASSRLS
  # (verified on the QA instance, 2026-09-22). A superuser can `SET ROLE` to any
  # role, reassign ownership implicitly and read every row of a FORCE ROW LEVEL
  # SECURITY table, so running CI migrations as the stock-image superuser `g5`
  # silently masks two classes of migration bug: one that needs an explicit
  # role membership to `ALTER ... OWNER TO` / `SET ROLE` (fails CD with
  # `must be able to SET ROLE "<role>"`), and one whose UPDATE/INSERT/DELETE
  # targets a FORCE RLS tenant table and therefore sees zero rows without an
  # org context (migration 008 on QA: "constraint ... is violated by some row").
  #
  # To catch both classes before CD, the primary `db-migrate` step below runs as
  # `g5_migrator`, provisioned by scripts/ci-provision-migrator.sh (as superuser)
  # to match the Cloud SQL admin: NOSUPERUSER CREATEDB CREATEROLE NOBYPASSRLS,
  # extensions and the BYPASSRLS `authz_lookup_definer` role pre-created, and
  # membership in authz_ctx_writer / authz_writer (the out-of-band grant CD's
  # bootstrap-runtime-db-users init container makes before the baseline runs).
  # A fresh CI database still cannot prove a data migration against existing
  # rows; required Rust integration tests exercise historical populated
  # upgrades through g5-db-migrate, including guard refusal and repeat no-op.
  # The provisioning SQL lives in a
  # script file, not inline YAML, so its PL/pgSQL dollar-quoting is not mangled
  # by Cloud Build `$$` -> `$` substitution.
  - id: db-provision-ci-migrator
    name: ${_PG_IMAGE}
    dir: .
    entrypoint: bash
    args:
      - ./scripts/ci-provision-migrator.sh
    env:
      - PGHOST=postgres
      - PGPORT=5432
      - PGUSER=g5
      - PGPASSWORD=g5_test
      - PGDATABASE=g5_test
    waitFor: ['wait-postgres']

  # ---------------------------------------------------------------------------
  # 1. Verify Docker-baked Rust target cache
  # ---------------------------------------------------------------------------
  # The CI builder image bakes a dependency-heavy Cargo target baseline under
  # /opt/g5-rust-target-cache/target. Cloud Build's source checkout mount does
  # not hide that path, and each build step gets its own Docker overlay upper
  # layer, so parallel Rust lanes write copy-on-write target state without
  # sharing Cargo artifact-directory locks.
  - id: verify-rust-target-cache
    name: ${_CI_IMAGE}
    dir: .
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        : "$${CARGO_TARGET_DIR:?CARGO_TARGET_DIR must be baked into the CI image}"
        test -d "$${CARGO_TARGET_DIR}"
        echo "Docker-baked Rust target cache: $${CARGO_TARGET_DIR}"
        du -sh "$${CARGO_TARGET_DIR}"
    waitFor: ['build-ci-image']

  # ---------------------------------------------------------------------------
  # 1b. Cargo fetch (validate baked Cargo cache before Rust gates)
  # ---------------------------------------------------------------------------
  # Keep CARGO_HOME on the same baked image path used by Dockerfile.ci-builder's
  # warmup. Cloud Build mounts /workspace over the image layer, so a Cargo home
  # under /workspace would hide prewarmed registry sources and change sccache's
  # path-sensitive Rust cache keys.
  - id: cargo-fetch
    name: ${_CI_IMAGE}
    dir: .
    args: ['cargo', 'fetch']
    env:
      - CARGO_HOME=/opt/g5-cargo-home
    waitFor: ['verify-rust-target-cache']

  # Build the current checkout's production migration entry point. Offline
  # SQLx compilation needs no migrated DB, so this cannot depend on db-migrate.
  # Publish only the executable; each CI step retains its own Cargo COW layer.
  - id: build-db-migration-runner
    name: ${_CI_IMAGE}
    dir: .
    entrypoint: bash
    args: ['./scripts/build-ci-migration-runner.sh']
    env:
      - CARGO_HOME=/opt/g5-cargo-home
      - SQLX_OFFLINE=true
      - CARGO_INCREMENTAL=${_G5_CI_CARGO_INCREMENTAL}
      - RUSTC_WRAPPER=${_G5_CI_RUSTC_WRAPPER}
    waitFor: ['cargo-fetch']

  # ---------------------------------------------------------------------------
  # 1c. Compile current Rust checkout into a per-build Docker COW target layer
  # ---------------------------------------------------------------------------
  # The base CI image only contains dependency-heavy/dummy-source target state.
  # This step compiles the real checkout once into /opt/g5-rust-target-cache and
  # commits that container as a local image. Rust lanes then start from that
  # image, each with an independent Docker overlay upper layer, so they reuse
  # the current-build artifacts without sharing Cargo target-directory locks.
  - id: rust-target-prime
    name: gcr.io/cloud-builders/docker
    dir: .
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail

        RUST_LANE_IMAGE="${_RUST_LANE_IMAGE}"
        TARGET_PRIME="${_G5_CI_RUST_TARGET_PRIME}"

        if [[ ! "$${TARGET_PRIME}" =~ ^(1|true|TRUE|yes|YES)$ ]]; then
          echo "Rust target-prime disabled; tagging ${_CI_IMAGE} as $${RUST_LANE_IMAGE}"
          docker tag "${_CI_IMAGE}" "$${RUST_LANE_IMAGE}"
          exit 0
        fi

        CONTAINER="g5-rust-target-prime-$BUILD_ID"
        docker rm -f "$${CONTAINER}" >/dev/null 2>&1 || true
        cleanup_prime_container() {
          docker rm -f "$${CONTAINER}" >/dev/null 2>&1 || true
        }
        trap cleanup_prime_container EXIT

        docker run \
          --name "$${CONTAINER}" \
          -v /workspace:/workspace \
          -w /workspace \
          -e CARGO_HOME=/opt/g5-cargo-home \
          -e CARGO_BUILD_JOBS=44 \
          -e CARGO_INCREMENTAL=${_G5_CI_CARGO_INCREMENTAL} \
          -e RUSTC_WRAPPER=${_G5_CI_RUSTC_WRAPPER} \
          -e SQLX_OFFLINE=true \
          -e DATABASE_URL=postgres://g5:g5_test@postgres:5432/g5_test \
          -e TEST_DATABASE_URL=postgres://g5:g5_test@postgres:5432/g5_test \
          "${_CI_IMAGE}" \
          bash -lc '
            set -euo pipefail
            export PATH="$${CARGO_HOME}/bin:$${PATH}"

            echo "=== Rust target-prime: cleaning dummy workspace artifacts ==="
            bash ./scripts/clean-baked-rust-workspace-artifacts.sh

            run_prime() {
              echo
              echo "=== Rust target-prime: $* ==="
              "$@"
            }

            run_prime cargo clippy --workspace --all-targets -- -D warnings
            (
              echo
              echo "=== Rust target-prime: cargo llvm-cov show-env --sh ==="
              eval "$$(cargo llvm-cov show-env --sh)"
              run_prime cargo nextest run \
                -p g5-contracts -p g5-auth -p g5-storage -p g5-semantic -p g5-scm -p g5-internal-api -p fake-provider-cli \
                -p g5-api-foundation -p g5-api-data -p g5-api-core -p g5-api-routes -p g5-api \
                -p g5d-foundation -p g5d-isolation -p g5d-agent -p g5d-host -p g5d-dispatch -p g5d \
                --lib --bins --all-features --no-run
              run_prime cargo nextest run \
                -p g5-api --test "*" --all-features --no-run
              run_prime cargo nextest run \
                -p g5d-dispatch -p g5d --test "*" --all-features --no-run
              run_prime cargo nextest run \
                -p g5d-isolation --lib --all-features -E "test(isolation)" --no-run
            )
            cargo test --workspace --exclude g5-e2e --doc -j1 || true
            run_prime cargo build -j"$${CARGO_BUILD_JOBS}" -p g5d
            run_prime cargo test -j"$${CARGO_BUILD_JOBS}" -p g5-e2e --no-run

            echo
            echo "=== Rust target-prime target size ==="
            du -sh "$${CARGO_TARGET_DIR}"
          '

        docker commit "$${CONTAINER}" "$${RUST_LANE_IMAGE}"
        echo "Committed Rust lane image: $${RUST_LANE_IMAGE}"
    waitFor: ['cargo-fetch']

  # ---------------------------------------------------------------------------
  # 1d. Optional nextest archive (compile once, run selected Rust lanes later)
  # ---------------------------------------------------------------------------
  # Experimental only: the first monolithic coverage archive trial proved
  # technically valid but net-negative because the archive/object tree is large.
  # Keep disabled unless measuring a narrower archive/reuse variant.
  # Unlike rust-target-prime, this does not snapshot the whole Cargo target
  # directory into a Docker layer. It builds a zstd archive of coverage-
  # instrumented test binaries that later lanes can execute with
  # `cargo nextest run --archive-file`.
  - id: rust-nextest-archive
    name: ${_RUST_LANE_IMAGE}
    dir: .
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail

        if [[ ! "${_G5_CI_NEXTEST_ARCHIVE}" =~ ^(1|true|TRUE|yes|YES)$ ]]; then
          echo "Rust nextest archive disabled"
          exit 0
        fi

        export PATH="$${CARGO_HOME}/bin:$${PATH}"
        bash ./scripts/clean-baked-rust-workspace-artifacts.sh

        ARCHIVE_DIR=/workspace/nextest-archives
        ARCHIVE_FILE="$${ARCHIVE_DIR}/rust-ci.tar.zst"
        ARCHIVE_TARGET_DIR=/workspace/nextest-archive-target
        rm -rf "$${ARCHIVE_DIR}" "$${ARCHIVE_TARGET_DIR}" /workspace/nextest-coverage /workspace/nextest-extract
        mkdir -p "$${ARCHIVE_DIR}"

        export SQLX_OFFLINE=true

        cargo llvm-cov clean --workspace || true
        cargo llvm-cov nextest-archive \
          --archive-file "$${ARCHIVE_FILE}" \
          --zstd-level 0 \
          -p g5-contracts -p g5-auth -p g5-storage -p g5-semantic -p g5-scm -p g5-internal-api -p fake-provider-cli \
          -p g5-api-foundation -p g5-api-data -p g5-api-core -p g5-api-routes -p g5-api \
          -p g5d-foundation -p g5d-isolation -p g5d-agent -p g5d-host -p g5d-dispatch -p g5d \
          --lib --bins --tests --all-features

        mkdir -p "$${ARCHIVE_TARGET_DIR}/llvm-cov-target"
        cp -a "$${CARGO_TARGET_DIR}/llvm-cov-target/debug" "$${ARCHIVE_TARGET_DIR}/llvm-cov-target/debug"

        echo "Rust nextest archive created: $${ARCHIVE_FILE}"
        du -sh "$${ARCHIVE_FILE}" "$${ARCHIVE_TARGET_DIR}/llvm-cov-target/debug" "$${CARGO_TARGET_DIR}/llvm-cov-target" || true
    env:
      - CARGO_HOME=/opt/g5-cargo-home
      - CARGO_INCREMENTAL=${_G5_CI_CARGO_INCREMENTAL}
      - RUSTC_WRAPPER=${_G5_CI_RUSTC_WRAPPER}
      - G5_CI_SKIP_BAKED_ARTIFACT_CLEAN=${_G5_CI_RUST_TARGET_PRIME}
      - DATABASE_URL=postgres://g5:g5_test@postgres:5432/g5_test
      - TEST_DATABASE_URL=postgres://g5:g5_test@postgres:5432/g5_test
    waitFor: ['rust-target-prime']

  # ---------------------------------------------------------------------------
  # 2. Format check (fast gate)
  # ---------------------------------------------------------------------------
  - id: rust-fmt
    name: ${_CI_IMAGE}
    dir: .
    entrypoint: bash
    args:
      - -c
      - |
        STATUS=passed
        if ! cargo fmt --all -- --check; then
          echo "ERROR: Rust format check failed; deferring failure to the final CI gate"
          STATUS=failed
        fi
        echo "RUST_FMT=$$STATUS" > /workspace/step-results-rust-fmt.txt
    env:
      - CARGO_HOME=/opt/g5-cargo-home
    waitFor: ['cargo-fetch']

  # ---------------------------------------------------------------------------
  # 3. Clippy + Deny (parallel after format)
  # ---------------------------------------------------------------------------
  - id: rust-clippy
    name: ${_RUST_LANE_IMAGE}
    dir: .
    entrypoint: bash
    args:
      - -c
      - |
        status=0
        bash ./scripts/clean-baked-rust-workspace-artifacts.sh || status=$?
        if (( status == 0 )); then
          cargo clippy --workspace --all-targets -- -D warnings || status=$?
        fi
        sccache --show-stats || true
        if (( status == 0 )); then
          echo "RUST_CLIPPY=passed" > /workspace/step-results-rust-clippy.txt
        else
          echo "ERROR: Rust Clippy failed; deferring failure to the final CI gate"
          echo "RUST_CLIPPY=failed" > /workspace/step-results-rust-clippy.txt
        fi
    env:
      - CARGO_HOME=/opt/g5-cargo-home
      - CARGO_INCREMENTAL=${_G5_CI_CARGO_INCREMENTAL}
      - RUSTC_WRAPPER=${_G5_CI_RUSTC_WRAPPER}
      - G5_CI_SKIP_BAKED_ARTIFACT_CLEAN=${_G5_CI_RUST_TARGET_PRIME}
      - SQLX_OFFLINE=true
    waitFor: ['rust-fmt', 'rust-target-prime']

  - id: rust-deny
    name: ${_CI_IMAGE}
    dir: .
    args: ['cargo', 'deny', 'check']
    env:
      - CARGO_HOME=/opt/g5-cargo-home
    waitFor: ['rust-fmt']

  # Harness-catalog freshness gate (g5-contracts model catalog, formerly g5-common/core D8): the committed generated
  # frontend/src/lib/harnessCatalog.gen.ts must match the Rust catalog SoT
  # (backend/g5-contracts/src/claude_models.rs). Regenerates and fails on drift; CI never
  # auto-commits the regenerated output. Runs after rust-clippy so the shared
  # target dir is warm and no two cargo builds contend for the workspace lock.
  # Deployment-gate retirement contract: retired switches stay absent from
  # deployment configuration, Codex browser coverage stays enabled, and the
  # self-hosted smoke validator accepts the standard capability marker.
  # Runs with stdlib Python on the stock image, independently of Rust builds.
  - id: codex-gate-matrix-contract
    name: python:3.12-slim
    dir: .
    entrypoint: bash
    args: ['scripts/test-codex-gate-matrix.sh']
    waitFor: ['-']

  # GCP bootstrap feeds this key directly to jsonwebtoken's ES256 parser.
  # Keep the generated private key in PKCS#8 form, on P-256, and paired with
  # the stored public key; reject the legacy SEC1 form that OpenSSL itself
  # accepts but jsonwebtoken does not.
  - id: jwt-key-generation-contract
    name: gcr.io/cloud-builders/gcloud
    dir: .
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        bash scripts/test-jwt-key-generation.sh
        python3 scripts/test_stack_secrets.py
    waitFor: ['-']

  # Fail-closed G5_WORKER_IMAGE chart-guard contract (helm D27 /
  # cloudbuild_pipelines D30, PR #1885): renders the chart across the
  # accept/reject value matrix — omitted key renders, sentinel/empty/family/
  # malformed values are rejected in every hosted overlay, an injected
  # concrete ref renders — using the same pinned checksum-verified helm the
  # deploy pipeline installs. gcloud builder for curl/tar/sha256sum; no
  # dependency on the rust lane image (waitFor: ['-']).
  - id: worker-image-guard-contract
    name: gcr.io/cloud-builders/gcloud
    dir: .
    entrypoint: bash
    args: ['scripts/test-worker-image-guard.sh']
    waitFor: ['-']

  # Base-image lock race + deploy-lane fetch retry contracts
  # (integration-stack/docker_images D21, infra/docker_images I32/D10;
  # test_contract/base_image_consolidation D13/D14): runs the REAL
  # ensure-base-images.sh lock protocol and the exact Dockerfile RUN text of
  # the helm / Azure Functions Core Tools fetches against PATH-shadowed
  # infra/docker/stat/curl/npm doubles, plus Python checks of staged provider
  # profiles, cloud seed target selection, the g5dev browser gate against
  # real ELF fixtures and the g5dev Rust launcher against proxy doubles, and
  # the QA Slack failure notifier's watched-trigger contract. Also the
  # pinned-download guard (operations
  # g5.quality.delivery.pinned-third-party-tools, G5Labs/G5-Lean#527): the
  # static scan over the image recipes and privileged install scripts, its
  # unittest, and the contract that runs the shipped Dockerfile.g5d-base RUN
  # text and the Azure bootstrap's just install against substituted bytes.
  # No dependency on the rust lane image (waitFor: ['-']).
  - id: image-build-script-contracts
    name: gcr.io/cloud-builders/gcloud
    dir: .
    entrypoint: bash
    args: ['-c', 'scripts/test-ensure-base-images-lock.sh && scripts/test-ensure-base-images-registry.sh && scripts/test-ci-run-playwright-selector.sh && scripts/test-image-fetch-retry.sh && bash infra/docker/test-g5-dev-dockerd-start.sh && python3 scripts/test_pairsoft_preview_image.py && python3 scripts/test_g5dev_browser_gate.py && python3 scripts/test_g5dev_cache_writability.py && python3 scripts/test_g5dev_rust_launcher.py && python3 scripts/test_stage_local_worker_runtime.py && python3 scripts/test_seed_prod_org.py && python3 scripts/test_seed_codex.py && python3 scripts/test_reset_qa.py && python3 scripts/test_qa_slack_notifier.py && scripts/verify-pinned-downloads.sh && python3 scripts/test_verify_pinned_downloads.py && scripts/test-pinned-download-verification.sh && python3 scripts/test_filestore_backup_workflow.py']
    waitFor: ['-']

  # Render the actual notifier template with Go, including quoted approver text.
  - id: slack-notifier-template
    name: mirror.gcr.io/library/golang:1.27.3@sha256:6f1acc898d064a4e9d5773ee574a9af6a9b786306939ac14d7fd806bf62046db
    entrypoint: bash
    args: ['-c', 'GO111MODULE=off go test -v scripts/slack_notifier_template_test.go']
    waitFor: ['-']

  # Plan the delivery root with provider mocks; no backend or cloud operations.
  - id: release-notification-terraform
    name: mirror.gcr.io/hashicorp/terraform:1.9.8@sha256:18f9986038bbaf02cf49db9c09261c778161c51dcc7fb7e355ae8938459428cd
    dir: infra/qa/delivery
    entrypoint: sh
    args: ['-c', 'terraform init -backend=false -input=false -no-color && terraform test -no-color']
    waitFor: ['-']

  # Exercise the ported release steps against local command doubles. As in
  # G5's train image, install tzdata for cutoff calculations; no cloud writes.
  - id: release-pipeline-contracts
    name: gcr.io/cloud-builders/gcloud
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        DEBIAN_FRONTEND=noninteractive apt-get update -qq >/dev/null
        DEBIAN_FRONTEND=noninteractive apt-get install -y -qq tzdata jq >/dev/null
        cd scripts
        python3 -m unittest test_approve_release_train test_notify_deploy_cutoff test_release_notification_helpers test_terraform_bundle_producer test_terraform_release test_app_release test_release_canary test_production_delivery test_cloudbuild_waitfor_order test_check_filestore_binding test_seed_host_allocation test_report_image_cves
    waitFor: ['-']

  # Native publish helper contract: the seed scripts' leased, pinned-SHA
  # publication and sync-response validation, run against local bare
  # mirrors and a fake curl (scripts/test-native-publish.sh). Replaces the
  # retired `g5d push` unit tests. Runs in the primed lane image because the
  # harness needs git and jq (the gcloud builder image has no jq).
  - id: native-publish-contract
    name: ${_RUST_LANE_IMAGE}
    dir: .
    entrypoint: bash
    args: ['scripts/test-native-publish.sh']
    waitFor: ['rust-target-prime']

  - id: model-catalog-freshness
    name: ${_RUST_LANE_IMAGE}
    dir: .
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        cargo run -p g5-contracts --bin gen_model_catalog
        # git diff only reports tracked paths, so a revision that deleted a
        # generated file would regenerate it as untracked and slip through.
        # Assert presence + tracking for every generated catalog artifact
        # first (g5-contracts model catalog, formerly g5-common/core D8).
        for gen_file in frontend/src/lib/harnessCatalog.gen.ts tests/fixtures/native-provider-catalog.json; do
          if [ ! -f "$$gen_file" ]; then
            echo "FATAL: $$gen_file was not emitted by gen_model_catalog." >&2
            exit 1
          fi
          if ! git ls-files --error-unmatch "$$gen_file" >/dev/null 2>&1; then
            echo "FATAL: $$gen_file exists but is not tracked by git." >&2
            echo "The generated catalogs must be committed. Run 'just gen-model-catalog' from  and commit the result." >&2
            exit 1
          fi
        done
        if ! git diff --exit-code -- frontend/src/lib/harnessCatalog.gen.ts tests/fixtures/native-provider-catalog.json; then
          echo "FATAL: a committed generated catalog file is stale vs the Rust catalog." >&2
          echo "Run 'just gen-model-catalog' from  and commit the result." >&2
          exit 1
        fi
    env:
      - CARGO_HOME=/opt/g5-cargo-home
      - CARGO_INCREMENTAL=${_G5_CI_CARGO_INCREMENTAL}
      - RUSTC_WRAPPER=${_G5_CI_RUSTC_WRAPPER}
      - SQLX_OFFLINE=true
    waitFor: ['rust-clippy']

  # Exercise the same greenfield ordering as Helm: the restricted runtime and
  # grant roles must be bootstrapped before the baseline migration can SET ROLE
  # while assigning SECURITY DEFINER ownership.
  - id: db-bootstrap-runtime-users
    name: ${_PG_IMAGE}
    dir: .
    entrypoint: bash
    args:
      - ./scripts/bootstrap-runtime-db-users.sh
    env:
      - PGHOST=postgres
      - PGPORT=5432
      - PGUSER=g5_migrator
      - PGPASSWORD=g5_test
      - PGDATABASE=g5_test
      - G5_RUNTIME_SYSTEM_DB_PASSWORD=g5_system_test
      - G5_RUNTIME_TENANT_DB_PASSWORD=g5_tenant_test
      - G5_AUTHZ_WRITER_DB_PASSWORD=g5_authz_test
    waitFor: ['db-provision-ci-migrator']

  # ---------------------------------------------------------------------------
  # 3b. Migrate ephemeral Postgres (needed by runtime tests + sqlx-check)
  # ---------------------------------------------------------------------------
  - id: db-migrate
    name: ${_CI_IMAGE}
    dir: .
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        # Match Helm's runner AND its non-superuser, non-BYPASSRLS role.
        # Raw SQLx bypasses row-visibility checks and cluster-role coordination.
        /workspace/.ci-migration-artifacts/g5-db-migrate
    env:
      - DATABASE_URL=postgres://g5_migrator:g5_test@postgres:5432/g5_test
      - G5_MIGRATION_SOURCE=/workspace/backend/g5-api/src/db/migrations
    waitFor: ['migration-version-uniqueness', 'migration-checksums', 'wait-postgres', 'build-db-migration-runner', 'db-bootstrap-runtime-users']

  # Gap-A guard (#135): the primary db-migrate above ran migrations as the
  # NON-SUPERUSER g5_migrator on the freshly-created ephemeral Postgres — the one
  # place the fresh-create migrator-self REVOKE in migrations 080/081 actually
  # fires. Assert the migrator handed back the temporary SET-capable membership it
  # granted itself in authz_lookup_definer (the rust integration tests cannot
  # observe this: they run as the superuser, where the snapshot records
  # had_membership=true and the revoke is skipped).
  - id: db-assert-migrator-revoke
    name: ${_PG_IMAGE}
    dir: .
    entrypoint: bash
    args:
      - ./scripts/ci-assert-migrator-revoke.sh
    env:
      - PGHOST=postgres
      - PGPORT=5432
      - PGUSER=g5
      - PGPASSWORD=g5_test
      - PGDATABASE=g5_test
      - G5_MIGRATOR_DB_USER=g5_migrator
    waitFor: ['db-migrate']

  - id: db-migrate-integration-template
    name: ${_CI_IMAGE}
    dir: .
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail

        TEMPLATE_DB="${_G5_CI_INTEGRATION_TEMPLATE_DB}"
        docker exec postgres dropdb -U g5 --if-exists "$${TEMPLATE_DB}"
        docker exec postgres createdb -U g5 "$${TEMPLATE_DB}"
        DATABASE_URL="postgres://g5:g5_test@postgres:5432/$${TEMPLATE_DB}" \
          /workspace/.ci-migration-artifacts/g5-db-migrate
    env:
      - G5_MIGRATION_SOURCE=/workspace/backend/g5-api/src/db/migrations
    waitFor: ['db-migrate']

  - id: db-bootstrap-runtime-users-integration-template
    name: ${_PG_IMAGE}
    dir: .
    entrypoint: bash
    args:
      - ./scripts/bootstrap-runtime-db-users.sh
    env:
      - PGHOST=postgres
      - PGPORT=5432
      - PGUSER=g5
      - PGPASSWORD=g5_test
      - PGDATABASE=${_G5_CI_INTEGRATION_TEMPLATE_DB}
      - G5_RUNTIME_SYSTEM_DB_PASSWORD=g5_system_test
      - G5_RUNTIME_TENANT_DB_PASSWORD=g5_tenant_test
      - G5_AUTHZ_WRITER_DB_PASSWORD=g5_authz_test
    waitFor: ['db-migrate-integration-template']

  # ---------------------------------------------------------------------------
  # 3c. sqlx offline cache check
  # ---------------------------------------------------------------------------
  - id: sqlx-check
    name: ${_RUST_LANE_IMAGE}
    dir: .
    entrypoint: bash
    args:
      - -c
      - |
        export PATH="$${CARGO_HOME}/bin:$${PATH}"
        bash ./scripts/clean-baked-rust-workspace-artifacts.sh
        SQLX_OFFLINE=false cargo sqlx prepare --check --workspace -- --package g5-api --all-targets
        sccache --show-stats || true
    env:
      - CARGO_HOME=/opt/g5-cargo-home
      - CARGO_INCREMENTAL=${_G5_CI_CARGO_INCREMENTAL}
      - RUSTC_WRAPPER=${_G5_CI_RUSTC_WRAPPER}
      - G5_CI_SKIP_BAKED_ARTIFACT_CLEAN=${_G5_CI_RUST_TARGET_PRIME}
      - DATABASE_URL=postgres://g5:g5_test@postgres:5432/g5_test
    waitFor: ['rust-fmt', 'db-migrate', 'rust-target-prime']

  # ---------------------------------------------------------------------------
  # 4. Unit tests + coverage (all crates, nextest, llvm-cov)
  # ---------------------------------------------------------------------------
  - id: rust-test
    name: ${_RUST_LANE_IMAGE}
    dir: .
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        if [[ "$${G5_CI_RUST_XFS_ORCHESTRATOR}" =~ ^(1|true|TRUE|yes|YES)$ ]]; then
          echo "rust-test handled by rust-xfs-orchestrator"
          exit 0
        fi

        # Unit tests with coverage (all crates). A single nextest scheduler
        # can balance short and long tests across packages better than three
        # sequential package slices while preserving the same covered targets.
        bash ./scripts/clean-baked-rust-workspace-artifacts.sh
        if [[ "$${G5_CI_NEXTEST_ARCHIVE}" =~ ^(1|true|TRUE|yes|YES)$ ]]; then
          ARCHIVE_TARGET_DIR=/workspace/nextest-archive-target
          LANE_TARGET_DIR=/workspace/nextest-coverage/rust-test/target
          rm -rf "$${LANE_TARGET_DIR}"
          mkdir -p "$${LANE_TARGET_DIR}/llvm-cov-target/target" /workspace/nextest-extract/rust-test
          ln -s "$${ARCHIVE_TARGET_DIR}/llvm-cov-target/debug" "$${LANE_TARGET_DIR}/llvm-cov-target/target/debug"
          export CARGO_TARGET_DIR="$${LANE_TARGET_DIR}"
          export LLVM_PROFILE_FILE="$${LANE_TARGET_DIR}/llvm-cov-target/rust-test-%p-%14m.profraw"
          cargo nextest run \
            --archive-file /workspace/nextest-archives/rust-ci.tar.zst \
            --extract-to /workspace/nextest-extract/rust-test \
            --extract-overwrite \
            -E '((package(=g5-contracts) | package(=g5-auth) | package(=g5-storage) | package(=g5-semantic) | package(=g5-scm) | package(=g5-internal-api) | package(=fake-provider-cli) | package(=g5-api-foundation) | package(=g5-api-data) | package(=g5-api-core) | package(=g5-api-routes) | package(=g5-api) | package(=g5d-foundation) | package(=g5d-isolation) | package(=g5d-agent) | package(=g5d-host) | package(=g5d-dispatch) | package(=g5d)) and (kind(=lib) | kind(=bin))) | (package(=g5-contracts) and binary(consumer_boundaries)) | (package(=g5d) and binary(=dispatch))' \
            --no-fail-fast
          unset LLVM_PROFILE_FILE
          cargo llvm-cov report --nextest-archive-file /workspace/nextest-archives/rust-ci.tar.zst -p g5-contracts -p g5-auth -p g5-storage -p g5-semantic -p g5-scm -p g5-internal-api -p fake-provider-cli --lcov --output-path lcov-g5-shared.info || true
          cargo llvm-cov report --nextest-archive-file /workspace/nextest-archives/rust-ci.tar.zst -p g5-api-foundation -p g5-api-data -p g5-api-core -p g5-api-routes -p g5-api --lcov --output-path lcov-g5-api.info || true
          cargo llvm-cov report --nextest-archive-file /workspace/nextest-archives/rust-ci.tar.zst -p g5d-foundation -p g5d-isolation -p g5d-agent -p g5d-host -p g5d-dispatch -p g5d --lcov --output-path lcov-g5d.info || true
        else
          cargo llvm-cov nextest \
            --no-report \
            -p g5-contracts -p g5-auth -p g5-storage -p g5-semantic -p g5-scm -p g5-internal-api -p fake-provider-cli \
            -p g5-api-foundation -p g5-api-data -p g5-api-core -p g5-api-routes -p g5-api \
            -p g5d-foundation -p g5d-isolation -p g5d-agent -p g5d-host -p g5d-dispatch -p g5d \
            --lib --bins --test consumer_boundaries --test dispatch --all-features --no-fail-fast
          cargo llvm-cov report -p g5-contracts -p g5-auth -p g5-storage -p g5-semantic -p g5-scm -p g5-internal-api -p fake-provider-cli --lcov --output-path lcov-g5-shared.info || true
          cargo llvm-cov report -p g5-api-foundation -p g5-api-data -p g5-api-core -p g5-api-routes -p g5-api --lcov --output-path lcov-g5-api.info || true
          cargo llvm-cov report -p g5d-foundation -p g5d-isolation -p g5d-agent -p g5d-host -p g5d-dispatch -p g5d --lcov --output-path lcov-g5d.info || true
        fi
        sccache --show-stats || true
    env:
      - CARGO_HOME=/opt/g5-cargo-home
      - SQLX_OFFLINE=true
      - DATABASE_URL=postgres://g5:g5_test@postgres:5432/g5_test
      - TEST_DATABASE_URL=postgres://g5:g5_test@postgres:5432/g5_test
      - RUST_LOG=info
      - CARGO_BUILD_JOBS=44
      - CARGO_INCREMENTAL=${_G5_CI_CARGO_INCREMENTAL}
      - RUSTC_WRAPPER=${_G5_CI_RUSTC_WRAPPER}
      - G5_CI_SKIP_BAKED_ARTIFACT_CLEAN=${_G5_CI_RUST_TARGET_PRIME}
      - G5_CI_NEXTEST_ARCHIVE=${_G5_CI_NEXTEST_ARCHIVE}
      - G5_CI_RUST_XFS_ORCHESTRATOR=${_G5_CI_RUST_XFS_ORCHESTRATOR}
    waitFor: ['rust-nextest-archive']

  # ---------------------------------------------------------------------------
  # 5. Integration tests (need live Postgres)
  # ---------------------------------------------------------------------------
  - id: rust-integration
    name: ${_RUST_LANE_IMAGE}
    dir: .
    entrypoint: bash
    args:
      - -c
      - |
        if [[ "$${G5_CI_RUST_XFS_ORCHESTRATOR}" =~ ^(1|true|TRUE|yes|YES)$ ]]; then
          echo "rust-integration handled by rust-xfs-orchestrator"
          exit 0
        fi

        status=0
        bash ./scripts/clean-baked-rust-workspace-artifacts.sh
        default_ci_test_jobs() {
          cores="$$(getconf _NPROCESSORS_ONLN 2>/dev/null || nproc 2>/dev/null || echo 2)"
          cores="$${cores%%.*}"
          if ! [[ "$${cores}" =~ ^[1-9][0-9]*$$ ]]; then
            cores=2
          fi
          jobs=$$((cores * 3 / 4))
          if (( jobs < 1 )); then
            jobs=1
          fi
          # Each g5-api integration test can open direct, system, authz, and
          # tenant Postgres pools. CI starts Postgres with a larger ephemeral
          # connection budget, and 24 jobs has stayed green on the 44-core pool
          # while preserving headroom for the API, workers, and browser E2E.
          if (( jobs > 24 )); then
            jobs=24
          fi
          echo "$${jobs}"
        }
        INTEGRATION_JOBS="$${G5_CI_INTEGRATION_JOBS:-$$(default_ci_test_jobs)}"
        echo "rust-integration nextest jobs: $${INTEGRATION_JOBS}"
        if [[ "$${G5_CI_NEXTEST_ARCHIVE}" =~ ^(1|true|TRUE|yes|YES)$ ]]; then
          ARCHIVE_TARGET_DIR=/workspace/nextest-archive-target
          LANE_TARGET_DIR=/workspace/nextest-coverage/rust-integration/target
          rm -rf "$${LANE_TARGET_DIR}"
          mkdir -p "$${LANE_TARGET_DIR}/llvm-cov-target/target" /workspace/nextest-extract/rust-integration
          ln -s "$${ARCHIVE_TARGET_DIR}/llvm-cov-target/debug" "$${LANE_TARGET_DIR}/llvm-cov-target/target/debug"
          export CARGO_TARGET_DIR="$${LANE_TARGET_DIR}"
          export LLVM_PROFILE_FILE="$${LANE_TARGET_DIR}/llvm-cov-target/rust-integration-%p-%14m.profraw"
          cargo nextest run \
            --archive-file /workspace/nextest-archives/rust-ci.tar.zst \
            --extract-to /workspace/nextest-extract/rust-integration \
            --extract-overwrite \
            -E '(package(=g5-api) | package(=fake-provider-cli)) and kind(=test)' \
            --no-fail-fast -j "$${INTEGRATION_JOBS}" || status=$?
          unset LLVM_PROFILE_FILE
          cargo llvm-cov report --nextest-archive-file /workspace/nextest-archives/rust-ci.tar.zst -p g5-api --lcov --output-path lcov-g5-api-integration.info || true
        else
          cargo llvm-cov nextest \
            --no-report -p g5-api -p fake-provider-cli --test '*' --all-features --no-fail-fast -j "$${INTEGRATION_JOBS}" || status=$?
          cargo llvm-cov report -p g5-api --lcov --output-path lcov-g5-api-integration.info || true
        fi
        sccache --show-stats || true
        exit "$${status}"
    env:
      - CARGO_HOME=/opt/g5-cargo-home
      - SQLX_OFFLINE=true
      - DATABASE_URL=postgres://g5:g5_test@postgres:5432/g5_test
      - TEST_DATABASE_URL=postgres://g5:g5_test@postgres:5432/g5_test
      - G5_TEST_DATABASE_TEMPLATE=${_G5_CI_INTEGRATION_TEMPLATE_DB}
      - G5_TEST_RUNTIME_ROLES_BOOTSTRAPPED=true
      - RUST_LOG=info
      - CARGO_INCREMENTAL=${_G5_CI_CARGO_INCREMENTAL}
      - RUSTC_WRAPPER=${_G5_CI_RUSTC_WRAPPER}
      - G5_CI_SKIP_BAKED_ARTIFACT_CLEAN=${_G5_CI_RUST_TARGET_PRIME}
      - G5_CI_NEXTEST_ARCHIVE=${_G5_CI_NEXTEST_ARCHIVE}
      - G5_CI_INTEGRATION_JOBS=${_G5_CI_INTEGRATION_JOBS}
      - G5_CI_RUST_XFS_ORCHESTRATOR=${_G5_CI_RUST_XFS_ORCHESTRATOR}
    waitFor: ['db-bootstrap-runtime-users-integration-template', 'rust-nextest-archive']

  # ---------------------------------------------------------------------------
  # 5b. Integration tests — g5d (daemon, needs Postgres)
  # ---------------------------------------------------------------------------
  - id: rust-integration-g5d
    name: ${_RUST_LANE_IMAGE}
    dir: .
    entrypoint: bash
    args:
      - -c
      - |
        if [[ "$${G5_CI_RUST_XFS_ORCHESTRATOR}" =~ ^(1|true|TRUE|yes|YES)$ ]]; then
          echo "rust-integration-g5d handled by rust-xfs-orchestrator"
          exit 0
        fi

        bash ./scripts/clean-baked-rust-workspace-artifacts.sh
        default_ci_test_jobs() {
          cores="$$(getconf _NPROCESSORS_ONLN 2>/dev/null || nproc 2>/dev/null || echo 2)"
          cores="$${cores%%.*}"
          if ! [[ "$${cores}" =~ ^[1-9][0-9]*$$ ]]; then
            cores=2
          fi
          jobs=$$((cores * 3 / 4))
          if (( jobs < 1 )); then
            jobs=1
          fi
          echo "$${jobs}"
        }
        G5D_INTEGRATION_JOBS="$${G5_CI_G5D_INTEGRATION_JOBS:-$$(default_ci_test_jobs)}"
        echo "rust-integration-g5d nextest jobs: $${G5D_INTEGRATION_JOBS}"
        if [[ "$${G5_CI_NEXTEST_ARCHIVE}" =~ ^(1|true|TRUE|yes|YES)$ ]]; then
          ARCHIVE_TARGET_DIR=/workspace/nextest-archive-target
          LANE_TARGET_DIR=/workspace/nextest-coverage/rust-integration-g5d/target
          rm -rf "$${LANE_TARGET_DIR}"
          mkdir -p "$${LANE_TARGET_DIR}/llvm-cov-target/target" /workspace/nextest-extract/rust-integration-g5d
          ln -s "$${ARCHIVE_TARGET_DIR}/llvm-cov-target/debug" "$${LANE_TARGET_DIR}/llvm-cov-target/target/debug"
          export CARGO_TARGET_DIR="$${LANE_TARGET_DIR}"
          export LLVM_PROFILE_FILE="$${LANE_TARGET_DIR}/llvm-cov-target/rust-integration-g5d-%p-%14m.profraw"
          RUN_CMD=(cargo nextest run
            --archive-file /workspace/nextest-archives/rust-ci.tar.zst
            --extract-to /workspace/nextest-extract/rust-integration-g5d
            --extract-overwrite
            -E '(package(=g5d-dispatch) | package(=g5d)) and kind(=test)'
            --no-fail-fast -j "$${G5D_INTEGRATION_JOBS}")
          REPORT_CMD=(cargo llvm-cov report --nextest-archive-file /workspace/nextest-archives/rust-ci.tar.zst -p g5d-dispatch -p g5d --lcov --output-path lcov-g5d-integration.info)
        else
          RUN_CMD=(cargo llvm-cov nextest
            --no-report -p g5d-dispatch -p g5d --test '*' --all-features --no-fail-fast -j "$${G5D_INTEGRATION_JOBS}")
          REPORT_CMD=(cargo llvm-cov report -p g5d-dispatch -p g5d --lcov --output-path lcov-g5d-integration.info)
        fi
        if "$${RUN_CMD[@]}"; then
          echo "RUST_INTEG_G5D=passed" > /workspace/step-results-rust-integration-g5d.txt
        else
          echo "WARN: g5d integration tests had failures"
          echo "RUST_INTEG_G5D=failed" > /workspace/step-results-rust-integration-g5d.txt
        fi
        unset LLVM_PROFILE_FILE
        "$${REPORT_CMD[@]}" || true
        sccache --show-stats || true
    env:
      - CARGO_HOME=/opt/g5-cargo-home
      - SQLX_OFFLINE=true
      - DATABASE_URL=postgres://g5:g5_test@postgres:5432/g5_test
      - TEST_DATABASE_URL=postgres://g5:g5_test@postgres:5432/g5_test
      - RUST_LOG=info
      - CARGO_INCREMENTAL=${_G5_CI_CARGO_INCREMENTAL}
      - RUSTC_WRAPPER=${_G5_CI_RUSTC_WRAPPER}
      - G5_CI_SKIP_BAKED_ARTIFACT_CLEAN=${_G5_CI_RUST_TARGET_PRIME}
      - G5_CI_NEXTEST_ARCHIVE=${_G5_CI_NEXTEST_ARCHIVE}
      - G5_CI_G5D_INTEGRATION_JOBS=${_G5_CI_G5D_INTEGRATION_JOBS}
      - G5_CI_RUST_XFS_ORCHESTRATOR=${_G5_CI_RUST_XFS_ORCHESTRATOR}
    waitFor: ['db-migrate', 'rust-nextest-archive']

  # ---------------------------------------------------------------------------
  # 6. Doc tests
  # ---------------------------------------------------------------------------
  - id: rust-doctests
    name: ${_RUST_LANE_IMAGE}
    dir: .
    entrypoint: bash
    args:
      - -c
      - |
        bash ./scripts/clean-baked-rust-workspace-artifacts.sh
        # Doctests are compiled one rustdoc invocation per test; -j1 serialized
        # them into a 5.9-minute lane (build 615ad1f1) that bounded the phase
        # before rust-xfs-orchestrator. rustdoc test units are small, so four
        # jobs are cheap on memory. The baked target still matches: the crate
        # graph is unchanged, only the doctest fan-out runs in parallel.
        cargo test --workspace --exclude g5-e2e --doc -j4 || true
        sccache --show-stats || true
    env:
      - CARGO_HOME=/opt/g5-cargo-home
      - SQLX_OFFLINE=true
      - DATABASE_URL=postgres://g5:g5_test@postgres:5432/g5_test
      - CARGO_INCREMENTAL=${_G5_CI_CARGO_INCREMENTAL}
      - RUSTC_WRAPPER=${_G5_CI_RUSTC_WRAPPER}
      - G5_CI_SKIP_BAKED_ARTIFACT_CLEAN=${_G5_CI_RUST_TARGET_PRIME}
    waitFor: ['rust-target-prime']

  # ===========================================================================
  # Phase: MicroVM / Isolation Tests
  # ===========================================================================
  # Private pool runs on N2 instances with nested virtualization.
  # /dev/kvm should be available. If not (e.g., running on default pool or
  # E2 for cost), the strict guest gate fails; process mode is never an automatic fallback.
  # ===========================================================================

  # ---------------------------------------------------------------------------
  # 7a. Verify KVM and the pinned Cloud Hypervisor platform
  # ---------------------------------------------------------------------------
  - id: setup-kvm-cloud-hypervisor
    name: ${_CI_IMAGE}
    dir: .
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail

        # --- KVM probe ---
        # The workspace-VM lane boots the VM inside a Docker child container via
        # `docker run --device=/dev/kvm` (the guaranteed KVM surface — see
        # smoke-cloud-hypervisor / start-workers). On some pool hosts the build-step
        # container does not expose /dev/kvm even though a --device child does, so
        # fall back to a Docker-child probe before declaring KVM unavailable.
        KVM_OK=0
        if [ -e /dev/kvm ]; then
          chmod 666 /dev/kvm 2>/dev/null || true
          echo "KVM: /dev/kvm present in the build step (nested virt enabled)"
          KVM_OK=1
        elif docker run --rm --device=/dev/kvm --entrypoint /bin/sh "${_CI_IMAGE}" -c 'test -e /dev/kvm' >/dev/null 2>&1; then
          echo "KVM: /dev/kvm reachable via a Docker child (--device=/dev/kvm)"
          KVM_OK=1
        else
          echo "KVM: /dev/kvm NOT available (neither build step nor Docker child) — strict guest gate will fail"
        fi
        echo "$$KVM_OK" > /workspace/kvm_available

        /opt/g5-host/bin/cloud-hypervisor --version
        test -s /opt/g5-host/boot/vmlinux
        test -s /opt/g5-host/boot/initramfs.cpio
    env:
      - CARGO_HOME=/opt/g5-cargo-home
    waitFor: ['cargo-fetch']

  # ---------------------------------------------------------------------------
  # 7b. Isolation backend tests (process + microVM via KVM)
  # ---------------------------------------------------------------------------
  - id: isolation-backends
    name: ${_RUST_LANE_IMAGE}
    dir: .
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        if [[ "$${G5_CI_RUST_XFS_ORCHESTRATOR}" =~ ^(1|true|TRUE|yes|YES)$ ]]; then
          echo "isolation-backends handled by rust-xfs-orchestrator"
          exit 0
        fi

        bash ./scripts/clean-baked-rust-workspace-artifacts.sh


        KVM_AVAIL=$$(cat /workspace/kvm_available 2>/dev/null || echo "0")
        if [ "$$KVM_AVAIL" = "1" ]; then
          chmod 666 /dev/kvm 2>/dev/null || true
          echo "=== Running isolation backends with KVM (microVM) ==="
        else
          echo "=== Running isolation backends (process isolation only — KVM unavailable) ==="
        fi

        if [[ "$${G5_CI_NEXTEST_ARCHIVE}" =~ ^(1|true|TRUE|yes|YES)$ ]]; then
          ARCHIVE_TARGET_DIR=/workspace/nextest-archive-target
          LANE_TARGET_DIR=/workspace/nextest-coverage/isolation-backends/target
          rm -rf "$${LANE_TARGET_DIR}"
          mkdir -p "$${LANE_TARGET_DIR}/llvm-cov-target/target" /workspace/nextest-extract/isolation-backends
          ln -s "$${ARCHIVE_TARGET_DIR}/llvm-cov-target/debug" "$${LANE_TARGET_DIR}/llvm-cov-target/target/debug"
          export CARGO_TARGET_DIR="$${LANE_TARGET_DIR}"
          export LLVM_PROFILE_FILE="$${LANE_TARGET_DIR}/llvm-cov-target/isolation-backends-%p-%14m.profraw"
          cargo nextest run \
            --archive-file /workspace/nextest-archives/rust-ci.tar.zst \
            --extract-to /workspace/nextest-extract/isolation-backends \
            --extract-overwrite \
            -E 'package(=g5d) and kind(=test) and binary(=isolation_backends)' \
            --no-fail-fast --test-threads=1
          unset LLVM_PROFILE_FILE
          cargo llvm-cov report --nextest-archive-file /workspace/nextest-archives/rust-ci.tar.zst -p g5d --lcov --output-path lcov-g5d-isolation-backends.info || true
        else
          cargo llvm-cov nextest \
            --no-report \
            -p g5d --test isolation_backends --all-features \
            --no-fail-fast --test-threads=1
          cargo llvm-cov report -p g5d --lcov --output-path lcov-g5d-isolation-backends.info || true
        fi
        sccache --show-stats || true
    env:
      - CARGO_HOME=/opt/g5-cargo-home
      - SQLX_OFFLINE=true
      - DATABASE_URL=postgres://g5:g5_test@postgres:5432/g5_test
      - RUST_LOG=info
      - CARGO_INCREMENTAL=${_G5_CI_CARGO_INCREMENTAL}
      - RUSTC_WRAPPER=${_G5_CI_RUSTC_WRAPPER}
      - G5_CI_SKIP_BAKED_ARTIFACT_CLEAN=${_G5_CI_RUST_TARGET_PRIME}
      - G5_CI_NEXTEST_ARCHIVE=${_G5_CI_NEXTEST_ARCHIVE}
      - G5_CI_RUST_XFS_ORCHESTRATOR=${_G5_CI_RUST_XFS_ORCHESTRATOR}
    waitFor: ['setup-kvm-cloud-hypervisor', 'rust-nextest-archive']

  # ---------------------------------------------------------------------------
  # 7c. Isolation unit tests (in-crate isolation tests)
  # ---------------------------------------------------------------------------
  - id: isolation-unit
    name: ${_RUST_LANE_IMAGE}
    dir: .
    entrypoint: bash
    args:
