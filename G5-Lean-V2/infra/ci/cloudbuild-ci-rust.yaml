        [ -e /dev/kvm ] && chmod 666 /dev/kvm 2>/dev/null || true

        if [[ "$${G5_CI_NEXTEST_ARCHIVE}" =~ ^(1|true|TRUE|yes|YES)$ ]]; then
          ARCHIVE_TARGET_DIR=/workspace/nextest-archive-target
          LANE_TARGET_DIR=/workspace/nextest-coverage/isolation-unit/target
          rm -rf "$${LANE_TARGET_DIR}"
          mkdir -p "$${LANE_TARGET_DIR}/llvm-cov-target/target" /workspace/nextest-extract/isolation-unit
          ln -s "$${ARCHIVE_TARGET_DIR}/llvm-cov-target/debug" "$${LANE_TARGET_DIR}/llvm-cov-target/target/debug"
          export CARGO_TARGET_DIR="$${LANE_TARGET_DIR}"
          export LLVM_PROFILE_FILE="$${LANE_TARGET_DIR}/llvm-cov-target/isolation-unit-%p-%14m.profraw"
          cargo nextest run \
