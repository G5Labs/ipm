        }

        # Require the exact host seeded for this lane to be ready and live.
        # Allow 600s of image preparation plus 60s for registration.
        for i in $(seq 1 330); do
          host_count=$$(docker exec postgres psql -U g5 -d "${_E2E_DB_NAME}" -tAc \
            "SELECT COUNT(*) FROM worker_hosts WHERE org_id = '$$ORG_ID' AND host_id = '$$HOST_ID' AND status = 'ready' AND last_heartbeat IS NOT NULL;" | tr -d '[:space:]')
          if [[ "$${host_count:-0}" -eq 1 ]]; then
            echo "rust-e2e lane workspace host ready: $$HOST_ID"
            exit 0
          fi
          echo "rust-e2e lane host ready rows so far: $${host_count:-0}/1"
          state=$$(docker inspect --format '{{.State.Status}}' g5d-host-re-1 2>/dev/null || echo missing)
          if [[ "$$state" == "exited" || "$$state" == "dead" || "$$state" == "missing" ]]; then
            echo "rust-e2e lane host container is $$state before registration completed"
            dump_re_worker_debug
            exit 1
          fi
          sleep 2
        done
        echo "Timed out waiting for the rust-e2e lane host to register"
        dump_re_worker_debug
        exit 1
    waitFor: ['start-rust-e2e-worker']

  # ---------------------------------------------------------------------------
  # E2E-8d. Dedicated provider-agent API replica + edge (deployment
  # g5.quality.delivery.ci.provider-agent-overlap)
  #
  # chat-restart-continuity.spec.ts `docker restart`s E2E_API_CONTAINER, so a
  # provider-agent lane that shares g5-api with the broad shards can only run
  # after them. Mirror of start-rust-e2e-api / start-client (same image, DB,
  # storage volume) with only the container identities and the
  # self-referential URLs changed, so the lane's restarts hit g5-api-pa while
  # the broad shards keep the ORIGINAL g5-api/g5-test-client untouched.
  # DB budget: same 30/10/40 pools as the main API inside the
  # _PG_MAX_CONNECTIONS=400 sidecar budget (main 80 + re 124 + pa 80).
  # ---------------------------------------------------------------------------
  - id: start-pa-api
    name: gcr.io/cloud-builders/docker
