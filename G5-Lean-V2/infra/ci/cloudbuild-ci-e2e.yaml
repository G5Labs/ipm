          -e G5_TENANT_DATABASE_URL=postgres://g5_runtime_tenant:g5_tenant_test@postgres:5432/${_E2E_DB_NAME} \
          -e G5_DATABASE_MAX_CONNECTIONS=30 \
          -e G5_AUTHZ_DATABASE_MAX_CONNECTIONS=10 \
          -e G5_TENANT_DATABASE_MAX_CONNECTIONS=40 \
          -e G5_REQUIRE_RUNTIME_DB_SPLIT=true \
          -e G5_HOST=0.0.0.0 \
          -e G5_PORT=7500 \
          -e G5_RATE_LIMIT_ENABLED=false \
          -e RUST_LOG=g5_api=info \
          -e RUST_BACKTRACE=1 \
          -e G5_E2E_AUTH=true \
          -e G5_SCM_ENCRYPTION_KEY \
          -e G5_COOKIE_SECURE=true \
          -e G5_STORAGE_PROVIDER=filestore \
          -e G5_STORAGE_MOUNT_POINT=/mnt/g5-repos \
          -e G5_STORAGE_TENANT_PREFIX=repos \
          -e G5_STORAGE_WORKTREE_DIR=/tmp/g5-api-pa-storage-worktrees \
          -e G5_ATTACHMENT_STORE_DIR=/tmp/g5-api-pa-attachments \
          -e G5_REPOS_BASE_DIR=/data/repos \
          -e 'G5_EXTERNAL_URL=https://app-pa.g5-e2e.test' \
          -e 'G5_PREVIEW_HOST_SUFFIX=preview-pa.g5-e2e.test' \
          -e 'G5_GIT_EXTERNAL_URL=http://g5-api-pa:7500' \
          -e G5_GITHUB_CLIENT_ID=local-oauth-client-id \
          -e G5_GITHUB_CLIENT_SECRET=local-oauth-client-secret \
          -e 'G5_GITHUB_AUTHORIZE_URL=http://oauth-stub:9876/login/oauth/authorize' \
          -e 'G5_GITHUB_TOKEN_URL=http://oauth-stub:9876/login/oauth/access_token' \
          -e 'G5_GITHUB_USERINFO_URL=http://oauth-stub:9876/user' \
          -e 'G5_SCM_GITHUB_API_BASE_URL=http://oauth-stub:9876' \
          -e G5_EMAIL_TRANSPORT=resend \
          -e G5_EMAIL_FROM_DOMAIN=mail.g5-e2e.test \
          -e G5_EMAIL_RESEND_API_KEY=re_stub_key \
          -e 'G5_EMAIL_RESEND_API_URL=http://oauth-stub:9876' \
          -e G5_EMAIL_VOLUME_LIMITS=off \
          -e G5_JWT_SECRET \
          -e G5_JWT_PUBLIC_KEY \
          -e G5_JWT_PRIVATE_KEY \
          ${_AR_REGION}-docker.pkg.dev/$PROJECT_ID/${_CI_REPOSITORY}/api:$SHORT_SHA
        for attempt in $$(seq 1 90); do
          if docker exec g5-api-pa curl -sf http://localhost:7500/healthz >/dev/null 2>&1; then
            if ! docker logs --tail=80 g5-api-pa 2>&1 | grep -F '[g5-api] storage initialized (Filestore { mount_point: "/mnt/g5-repos", tenant_prefix: "repos", worktree_dir: "/tmp/g5-api-pa-storage-worktrees" })' >/dev/null; then
              echo "g5-api-pa did not boot with the filestore-style storage configuration" >&2
              docker logs --tail=120 g5-api-pa 2>&1 || true
              exit 1
            fi
            if ! docker exec g5-api-pa curl -sf http://localhost:7500/api/v1/instance/health \
              | grep -E '"database"[[:space:]]*:[[:space:]]*"healthy"' >/dev/null; then
              echo "g5-api-pa database health check did not pass" >&2
              docker logs --tail=120 g5-api-pa 2>&1 || true
              exit 1
            fi
            echo "g5-api-pa healthy (storage + database verified)"
            exit 0
          fi
          state=$$(docker inspect --format '{{.State.Status}}' g5-api-pa 2>/dev/null || echo missing)
          if [[ "$$state" == "exited" || "$$state" == "dead" || "$$state" == "missing" ]]; then
            echo "g5-api-pa is $$state before becoming healthy" >&2
            docker logs --tail=120 g5-api-pa 2>&1 || true
            exit 1
          fi
          sleep 2
        done
        echo "g5-api-pa failed to become healthy" >&2
        docker logs --tail=120 g5-api-pa 2>&1 || true
        exit 1
    volumes:
      - name: stack-secrets
        path: /g5-ci-secrets
    waitFor: ['generate-stack-secrets', 'build-api-image', 'start-oauth-stub', 'db-bootstrap-runtime-users-e2e']

  - id: start-pa-client
    name: gcr.io/cloud-builders/docker
    dir: .
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        if [[ "${_G5_CI_PROVIDER_AGENT_ISOLATED}" != "true" || "${_E2E_WORKER}" != "workspace-vm" ]]; then
          echo "provider-agent isolation disabled (flag or substrate); skipping lane edge"
          exit 0
        fi
        docker run -d \
          --name=g5-test-client-pa \
          --network=cloudbuild \
          --network-alias=app-pa.g5-e2e.test \
          -e G5_API_URL=http://g5-api-pa:7500 \
          -e G5_EDGE_TLS_APEX=app-pa.g5-e2e.test \
          -e G5_EDGE_PREVIEW_SUFFIX=preview-pa.g5-e2e.test \
          ${_AR_REGION}-docker.pkg.dev/$PROJECT_ID/${_CI_REPOSITORY}/edge:$SHORT_SHA
        for attempt in $$(seq 1 30); do
          health=$$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}running{{end}}' g5-test-client-pa 2>/dev/null || echo "not-found")
          state=$$(docker inspect --format '{{.State.Status}}' g5-test-client-pa 2>/dev/null || echo "not-found")
          if [[ "$$health" == "healthy" || ("$$health" == "running" && "$$state" == "running") ]]; then
            echo "g5-test-client-pa is ready"
            exit 0
          fi
          if [[ "$$state" == "exited" || "$$state" == "dead" ]]; then
            echo "g5-test-client-pa is $$state" >&2
            docker logs --tail=30 g5-test-client-pa 2>&1 || true
            exit 1
          fi
          sleep 2
        done
        echo "g5-test-client-pa timed out becoming healthy" >&2
        docker logs --tail=30 g5-test-client-pa 2>&1 || true
        exit 1
    waitFor: ['build-edge-image', 'start-pa-api']

  # ---------------------------------------------------------------------------
  # E2E-8e. Dedicated provider-agent browser-lane host (cicd D32)
  #
  # Mirror of g5d-host-1 with FIVE slots: the former 3-microVM + preview
  # parity (cicd D30's slot-parity rule for the relocated provider-agent
  # workload) plus the room the lane's two-worker fan-out needs (running
  # seed 1 + 2 workers + lifecycle overlap; deployment
  # g5.quality.delivery.ci.provider-agent-parallel). Like the
  # -vl/-re hosts it registers through its lane's API replica (g5-api-pa), so
  # neither the fixtures-step cold-restart of g5-api nor the lane's own
  # chat-restart-continuity restarts of g5-api-pa can cross lanes.
  # ---------------------------------------------------------------------------
  - id: start-pa-worker
    name: ${_CI_IMAGE}
    dir: .
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        if [[ "${_G5_CI_PROVIDER_AGENT_ISOLATED}" != "true" || "${_E2E_WORKER}" != "workspace-vm" ]]; then
          echo "provider-agent isolation disabled (flag or substrate); skipping dedicated host"
          exit 0
        fi
        KVM_AVAIL=$$(cat /workspace/kvm_available 2>/dev/null || echo "0")
        if [ "$$KVM_AVAIL" != "1" ]; then
          echo "FATAL: dedicated provider-agent host requires /dev/kvm (nested-virt pool)" >&2
          exit 1
        fi
        ORG_ID=$$(cat /workspace/pa-org-id)
        HOST_ID=$$(cat /workspace/pa-host-id)
        HOST_JWT=$$(cat /workspace/pa-host-jwt)
        HOST_DISK_MIB=$$(cat /workspace/pa-host-disk-mib)
        HOST_DISK_GIB=$$(cat /workspace/pa-host-disk-gib)
        docker run -d \
          --name="g5d-host-pa-1" \
          --network=cloudbuild \
          --device /dev/kvm \
          --privileged \
          --cgroupns=host \
          -v /sys/fs/cgroup:/sys/fs/cgroup:ro \
          --ulimit nofile=1048576:1048576 \
          -u 0 \
          -v /workspace/scripts/ci-host-xfs-entrypoint.sh:/usr/local/bin/ci-host-xfs-entrypoint.sh:ro \
          --entrypoint bash \
          -e G5D_API_URL=http://g5-api-pa:7500 \
          -e G5D_ORG_ID="$$ORG_ID" \
          -e G5_HOST_JWT="$$HOST_JWT" \
          -e G5D_HOST_ID="$$HOST_ID" \
          -e G5D_ISOLATION_MODE=microvm \
          -e G5D_GIT_HTTP_ALLOW_HOSTS=g5-api-pa:7500 \
          -e G5D_HOST_RUNTIME_BIN_DIR=/opt/g5-runtime/bin \
          -e G5D_HOST_BASE_IMAGE=mirror.gcr.io/library/buildpack-deps:resolute \
          -e G5D_ROOTFS_STATE_DIR=/var/lib/g5d/rootfs \
          -e G5D_OCI_CACHE_DIR=/var/g5d-data/oci-layers \
          -e G5D_HOST_XFS_SIZE_GB="$$HOST_DISK_GIB" \
          -e G5D_HOST_MAX_MICROVMS=5 \
          -e G5D_HOST_CPUS_PER_VM=2 \
          -e G5D_HOST_MEM_MIB_PER_VM=4096 \
          -e G5D_SCRATCH_DISK_MIB="$$HOST_DISK_MIB" \
          -e G5D_NESTED_VIRTUALIZATION=on \
          -e G5_CLAUDE_CODE_FAKE=1 \
          -e G5_CODEX_FAKE=1 \
          -e G5_FAKE_STRICT_RESUME=1 \
          -e G5_FAKE_BUDGET_RESUME_E2E=1 \
          -e RUST_LOG=g5d=debug \
          -v g5-e2e-host-runtime:/opt/g5-runtime:ro \
          g5d-worker:ci \
          /usr/local/bin/ci-host-xfs-entrypoint.sh \
          host
    waitFor: ['seed-pa-org', 'start-workers', 'start-pa-api']

  - id: wait-pa-workers
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        if [[ "${_G5_CI_PROVIDER_AGENT_ISOLATED}" != "true" || "${_E2E_WORKER}" != "workspace-vm" ]]; then
          echo "provider-agent isolation disabled (flag or substrate); skipping dedicated-host wait"
          exit 0
        fi
        ORG_ID=$$(cat /workspace/pa-org-id)
        HOST_ID=$$(cat /workspace/pa-host-id)

        dump_pa_worker_debug() {
          echo "--- provider-agent workspace host row ---"
          docker exec postgres psql -U g5 -d "${_E2E_DB_NAME}" -x -c \
            "SELECT host_id, status, org_id, last_heartbeat, slots_total FROM worker_hosts WHERE org_id = '$$ORG_ID' ORDER BY created_at, host_id;" \
            || true
          echo "--- g5d-host-pa-1 logs ---"
          docker logs --tail=120 g5d-host-pa-1 2>&1 || true
        }

        # Require the exact host seeded for this lane to be ready and live.
        # Allow 600s of image preparation plus 60s for registration.
        for i in $(seq 1 330); do
          host_count=$$(docker exec postgres psql -U g5 -d "${_E2E_DB_NAME}" -tAc \
            "SELECT COUNT(*) FROM worker_hosts WHERE org_id = '$$ORG_ID' AND host_id = '$$HOST_ID' AND status = 'ready' AND last_heartbeat IS NOT NULL;" | tr -d '[:space:]')
          if [[ "$${host_count:-0}" -eq 1 ]]; then
            echo "provider-agent lane workspace host ready: $$HOST_ID"
            exit 0
          fi
          echo "provider-agent lane host ready rows so far: $${host_count:-0}/1"
          state=$$(docker inspect --format '{{.State.Status}}' g5d-host-pa-1 2>/dev/null || echo missing)
          if [[ "$$state" == "exited" || "$$state" == "dead" || "$$state" == "missing" ]]; then
            echo "provider-agent lane host container is $$state before registration completed"
            dump_pa_worker_debug
            exit 1
          fi
          sleep 2
        done
        echo "Timed out waiting for the provider-agent lane host to register"
        dump_pa_worker_debug
        exit 1
    waitFor: ['start-pa-worker']

  # ---------------------------------------------------------------------------
  # E2E-9. Seed worker and shared API/Rust fixture workspaces using shared scripts
  # ---------------------------------------------------------------------------
  - id: seed-e2e-fixtures
    name: ${_CI_IMAGE}
    dir: .
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        rm -f /workspace/e2e-fixtures-ready /workspace/e2e-fixtures-failed
        # Preserve the failure as a final-gate result without aborting the DAG.
        # Dependent lanes record failed/skipped results, allowing teardown and
        # failed-build artifact export to run before assert-ci-status fails.
        trap 'echo failed > /workspace/e2e-fixtures-failed; exit 0' ERR
        # These fixtures exist for the Rust E2E lane; when that lane is
        # isolated (cicd D31) they are seeded into the dedicated org through
        # the lane API replica so rust-e2e never touches the browser org.
        LANE_API_CONTAINER=g5-api
        if [[ "${_G5_CI_RUST_E2E_ISOLATED}" == "true" && "${_E2E_WORKER}" == "workspace-vm" ]]; then
          LANE_API_CONTAINER=g5-api-re
          export G5D_ORG_ID="$$(cat /workspace/rust-e2e-org-id)"
          export G5D_REPO_ID="$$(cat /workspace/rust-e2e-repo-id)"
        else
          export G5D_ORG_ID="$$(cat /workspace/e2e-org-id)"
          export G5D_REPO_ID="$$(cat /workspace/e2e-repo-id)"
        fi
        # Workspace VMs materialize their roots from the API. Seed only the
        # durable repository/workspace fixture; no host-container filesystem
        # path participates in execution.
        REPOS_VOLUME="g5-e2e-repos" \
        PG_CONTAINER="postgres" \
        DB_NAME="${_E2E_DB_NAME}" \
        API_CONTAINER="$$LANE_API_CONTAINER" \
        G5D_ORG_ID="$$G5D_ORG_ID" \
        G5_E2E_TEST_ORG_ID="$$G5D_ORG_ID" \
        G5_E2E_TEST_EMAIL="e2e-test@g5.dev" \
        ./scripts/seed-test-workspace.sh "http://$$LANE_API_CONTAINER:7500"
        rm -f /workspace/e2e-fixtures-failed
        touch /workspace/e2e-fixtures-ready
    waitFor: ['wait-workers', 'wait-rust-e2e-workers']

  # ---------------------------------------------------------------------------
  # E2E-10. Rust E2E tests (g5-e2e crate against live stack)
  # Includes deterministic chat-agent model routing regressions such as
  # `chat_agent_model_routing` in the broad non-live-LLM lane.
  # ---------------------------------------------------------------------------
  - id: rust-e2e
    # Continue to artifact export; assert-ci-status still requires this to pass.
    allowFailure: true
    # Runs from the e2e-rust-prime lane image (cicd D24): g5d and the g5-e2e
    # test binaries are already compiled into the baked CARGO_TARGET_DIR.
    name: g5-e2e-rust-lane
    dir: .
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        set +x
        source /g5-ci-secrets/env
        trap 'rc=$$?; trap - EXIT; sh /workspace/scripts/ci-stage-status.sh report "$$rc" /workspace/step-results-rust-e2e.txt RUST_E2E; exit $$?' EXIT
        echo "=== Rust E2E compile/preflight ==="
        export G5_E2E_RUNTIME_BIN_DIR=/workspace/.ci-release-artifacts/worker
        export PATH="$$G5_E2E_RUNTIME_BIN_DIR:$$PATH"

        # Fingerprint-hit safety net (cicd D24): the prime image already
        # contains these artifacts, so both cargo calls are no-ops in seconds.
        # If compile-env parity with e2e-rust-prime ever drifts, they recompile
        # here — correct, just slow. The clean script is skipped when primed
        # (G5_CI_SKIP_BAKED_ARTIFACT_CLEAN) because it would cargo-clean the
        # very workspace packages the prime compiled. Do not enable g5-e2e
        # live-llm/full-pipeline features in Docker CI. Cloud Hypervisor is default-on
        # in backend/g5d/Cargo.toml.
        bash ./scripts/clean-baked-rust-workspace-artifacts.sh
        cargo build -j"$${CARGO_BUILD_JOBS}" -p g5d
        cargo test -j44 -p g5-e2e --no-run

        echo "Waiting for shared Rust E2E fixtures..."
        for i in $$(seq 1 180); do
          if [[ -f /workspace/e2e-fixtures-ready ]]; then
            echo "Shared Rust E2E fixtures are ready"
            break
          fi
          if [[ -f /workspace/e2e-fixtures-failed ]]; then
            echo "Shared Rust E2E fixture seed failed"
            echo "RUST_E2E=failed" > /workspace/step-results-rust-e2e.txt
            exit 0
          fi
          sleep 1
        done
        if [[ ! -f /workspace/e2e-fixtures-ready ]]; then
          echo "Timed out waiting for shared Rust E2E fixtures"
          echo "RUST_E2E=failed" > /workspace/step-results-rust-e2e.txt
          exit 0
        fi

        echo "=== Rust E2E tests ==="

        # Lane selection (cicd D31): isolated → dedicated org + host + API
        # replica so this suite never touches the browser org or the main API
        # process the browser chain cold-restarts; rollback → shared org/stack.
        API_CONTAINER=g5-api
        if [[ "${_G5_CI_RUST_E2E_ISOLATED}" == "true" && "${_E2E_WORKER}" == "workspace-vm" ]]; then
          API_CONTAINER=g5-api-re
          export G5D_ORG_ID="$$(cat /workspace/rust-e2e-org-id 2>/dev/null || true)"
          export G5_E2E_API_URL=http://g5-api-re:7500
          export G5_E2E_LIVE_HOST_CONTAINER=g5d-host-re-1
        else
          export G5D_ORG_ID="$$(cat /workspace/e2e-org-id 2>/dev/null || true)"
          export G5_E2E_LIVE_HOST_CONTAINER=g5d-host-1
        fi
        echo "  G5D_ORG_ID=$$G5D_ORG_ID (api: $$API_CONTAINER)"

        # The API readiness and fixture gates above make the chat-attachment
        # worker contract mandatory here. Its pre-auth health probe must fail
        # instead of silently skipping if this promised substrate disappears.

        if [[ "${_G5_CI_RUST_E2E_ISOLATED}" == "true" ]]; then
          WORKER_CONTAINERS=(g5d-host-re-1)
        else
          WORKER_CONTAINERS=(g5d-host-1)
        fi
        # Fail closed when the workspace host path is unavailable.
        export G5_E2E_REQUIRE_LIVE_PROVIDED_AGENT=1
        # Every lane host runs with G5D_NESTED_VIRTUALIZATION=on (start-workers);
        # host_boot_timings checks the ready summary agrees on a real boot
        # (g5.architecture.microvm_backend.nested).
        export G5_E2E_NESTED_VIRTUALIZATION=on
        export G5_E2E_REQUIRE_LIVE_APPROVAL_REVIEW=1
        export G5_E2E_ALLOW_FAKE_APPROVAL_REVIEW=1
        dump_rust_e2e_logs() {
          echo "=== Rust E2E failures — dumping g5-api + worker logs ==="
          # D33 can park a stranded task until lease reaping after the original
          # API failure, so retain enough history to include the initiating
          # request and its server-side error rather than only the later park.
          docker logs --since=15m "$$API_CONTAINER" 2>&1 || true
          # PostgreSQL's deadlock DETAIL identifies both conflicting queries;
          # the API's sanitized retryable response cannot carry that evidence.
          docker logs --since=15m postgres 2>&1 || true
          echo "=== PostgreSQL activity and blockers at Rust E2E failure ==="
          docker exec postgres psql -U g5 -d "${_E2E_DB_NAME}" -P pager=off -c \
            "SELECT pid, state, wait_event_type, wait_event, xact_start, query_start, pg_blocking_pids(pid) AS blocking_pids, left(query, 500) AS query FROM pg_stat_activity WHERE datname = current_database() AND pid <> pg_backend_pid() ORDER BY query_start NULLS LAST" \
            2>&1 || true
          for wc in "$${WORKER_CONTAINERS[@]}"; do
            docker logs --since=15m "$$wc" 2>&1 || true
          done
          docker ps -a --filter "name=g5d-" --format 'table {{.Names}}\t{{.Status}}\t{{.Image}}' || true
        }

        FAILED=0

        E2E_STACK_THREADS="$${G5_E2E_STACK_THREADS:-auto75}"
        if ! [[ "$$E2E_STACK_THREADS" =~ ^[1-9][0-9]*$$|^auto$$|^AUTO$$|^auto75$$|^AUTO75$$|^75%$$ ]]; then
          echo "ERROR: G5_E2E_STACK_THREADS must be a positive integer or auto75." >&2
          exit 1
        fi
        echo "rust-e2e broad lane test threads: $$E2E_STACK_THREADS"

        if ! G5_E2E_NO_COMPILE="${_G5_CI_E2E_RUST_PRIME}" G5_E2E_CARGO_JOBS=44 G5_E2E_STACK_THREADS="$$E2E_STACK_THREADS" \
          bash ./scripts/with-dev-mirror-fixture.sh \
            ${_AR_REGION}-docker.pkg.dev/$PROJECT_ID/${_CI_REPOSITORY}/api:$SHORT_SHA "$BUILD_ID" -- \
            ./scripts/run-rust-e2e-lanes.sh; then
          dump_rust_e2e_logs
          FAILED=1
        fi

        if [[ "$$FAILED" -eq 0 ]]; then
          echo "RUST_E2E=passed" > /workspace/step-results-rust-e2e.txt
        else
          echo "RUST_E2E=failed" > /workspace/step-results-rust-e2e.txt
        fi
        sccache --show-stats || true
    env:
      - CARGO_HOME=/opt/g5-cargo-home
      - DATABASE_URL=postgres://g5:g5_test@postgres:5432/${_E2E_DB_NAME}
      - G5_E2E_DATABASE_URL=postgres://g5:g5_test@postgres:5432/${_E2E_DB_NAME}
      - CARGO_BUILD_JOBS=44
      - CARGO_INCREMENTAL=${_G5_CI_CARGO_INCREMENTAL}
      - RUSTC_WRAPPER=${_G5_CI_RUSTC_WRAPPER}
      - G5_CI_SKIP_BAKED_ARTIFACT_CLEAN=${_G5_CI_E2E_RUST_PRIME}
      - G5_E2E_API_URL=http://g5-api:7500
      - G5_E2E_AUTH_MODE=oauth
      - G5_E2E_OAUTH_STUB_URL=http://oauth-stub:9876
      - G5_E2E_STACK_THREADS=${_G5_E2E_STACK_THREADS}
      - G5_NODE_PATH=/workspace/g5-e2e-tools/node
      # Issue #2475: g5-api-re can finish a healthy request in 45–50s under
      # shared-VM load; the client default is 45s. CI-only, hard-capped at 180s.
      - G5_E2E_HTTP_TIMEOUT_SECS=90
    volumes:
      - name: stack-secrets
        path: /g5-ci-secrets
    waitFor: ['generate-stack-secrets', 'wait-workers', 'wait-rust-e2e-workers', 'e2e-rust-prime', 'stage-rust-e2e-node']

  # Exhaust the catalog on the actual staged pins, without paid model requests.
  # This is required (no allowFailure) even when the UI/backend catalog is fresh.
  - id: native-provider-catalog
    timeout: 900s
    name: g5-e2e-rust-lane
    dir: .
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        export PATH="/workspace/g5d-host/runtime/bin:$${CARGO_HOME}/bin:$$PATH"
        export G5_NATIVE_PROVIDER_TEST_BIN_DIR=/workspace/g5d-host/runtime/bin
        cargo test -p g5d --no-default-features --features test-helpers \
          --test dispatch_modules provider_catalog::pinned_native_catalog_and_production_launches_match \
          -- --ignored --exact
    env:
      - CARGO_HOME=/opt/g5-cargo-home
      - CARGO_BUILD_JOBS=44
      - CARGO_INCREMENTAL=${_G5_CI_CARGO_INCREMENTAL}
      - RUSTC_WRAPPER=${_G5_CI_RUSTC_WRAPPER}
    waitFor: ['start-workers', 'e2e-rust-prime']

  # Run the confined native clients from the same staged closure used by the
  # real VMs. The model endpoint is scripted and loopback-only; no model secret.
  - id: formal-review-native-clients
    timeout: 900s
    name: g5-e2e-rust-lane
    dir: .
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        export PATH="$${CARGO_HOME}/bin:$${PATH}"
        export G5_NATIVE_PROVIDER_TEST_BIN_DIR=/workspace/g5d-host/runtime/bin
        test -x "$${G5_NATIVE_PROVIDER_TEST_BIN_DIR}/claude"
        test -x "$${G5_NATIVE_PROVIDER_TEST_BIN_DIR}/codex"
        test -x "$${G5_NATIVE_PROVIDER_TEST_BIN_DIR}/node"
        test -d "$${G5_NATIVE_PROVIDER_TEST_BIN_DIR}/_npm"
        cargo test -p g5d --no-default-features --features test-helpers \
          --test dispatch_modules formal_review::formal_review_real_native_clients_enforce_tools_and_report_transport \
          -- --ignored --exact
        cargo test -p g5d --no-default-features --features test-helpers \
          --test dispatch_modules formal_review::formal_review_real_codex_cancellation_and_missing_report_settle_no_verdict \
          -- --ignored --exact
    env:
      - CARGO_HOME=/opt/g5-cargo-home
      - CARGO_BUILD_JOBS=44
      - CARGO_INCREMENTAL=${_G5_CI_CARGO_INCREMENTAL}
      - RUSTC_WRAPPER=${_G5_CI_RUSTC_WRAPPER}
    waitFor: ['start-workers', 'e2e-rust-prime']

  # ---------------------------------------------------------------------------
  # E2E-10b. Exact value-loop API + Rust execution profiles and receipts
  # ---------------------------------------------------------------------------
  - id: value-loop-rust-api-profiles
    # Continue to artifact export; assert-ci-status still requires this to pass.
    allowFailure: true
    name: g5-e2e-rust-lane
    dir: .
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        set +x
        source /g5-ci-secrets/env
        trap 'rc=$$?; trap - EXIT; sh /workspace/scripts/ci-stage-status.sh report "$$rc" /workspace/step-results-value-loop-rust-api.txt VALUE_LOOP_RUST_API; exit $$?' EXIT
        export G5_E2E_RUNTIME_BIN_DIR=/workspace/.ci-release-artifacts/worker
        export PATH="$$G5_E2E_RUNTIME_BIN_DIR:$$PATH"
        ARTIFACT_ROOT=/workspace/value-loop-matrix-artifacts
        RESULTS="$$ARTIFACT_ROOT/selector-results.jsonl"
        LOGS="$$ARTIFACT_ROOT/logs"
        CATALOG=tests/e2e/value_loop_matrix.tsv
        RECEIPT_TOOL=scripts/value_loop_receipt.py
        if [[ -e "$$RESULTS" ]]; then
          echo "value-loop selector result file already exists: $$RESULTS" >&2
          echo "VALUE_LOOP_RUST_API=failed" > /workspace/step-results-value-loop-rust-api.txt
          exit 0
        fi
        mkdir -p "$$LOGS"
        # Fail-closed combo guard (cicd D31): with the rust-e2e lane isolated
        # the browser chain overlaps this step, so a rollback value-loop lane
        # (shared org + main API) would collide with the browser org and the
        # g5-api cold restart. Full rollback means BOTH substitutions 'false'.
        if [[ "${_G5_CI_RUST_E2E_ISOLATED}" == "true" && "${_G5_CI_VALUE_LOOP_ISOLATED}" != "true" && "${_E2E_WORKER}" == "workspace-vm" ]]; then
          echo "unsupported substitution combo: _G5_CI_RUST_E2E_ISOLATED='true' requires _G5_CI_VALUE_LOOP_ISOLATED='true'" >&2
          exit 1
        fi
        trap 'echo "VALUE_LOOP_RUST_API=failed" > /workspace/step-results-value-loop-rust-api.txt; exit 0' ERR
        if [[ "${_G5_CI_VALUE_LOOP_ISOLATED}" == "true" && "${_E2E_WORKER}" == "workspace-vm" ]]; then
          # Isolated lane (cicd D30/D35): dedicated org + host, started after
          # rust-e2e so g5-api-re is not dual-loaded. The pause allowlist and
          # host target are lane-scoped so this process can never pause or
          # probe the main lane's containers.
          export G5D_ORG_ID="$$(cat /workspace/value-loop-org-id)"
          export G5_E2E_LIVE_HOST_CONTAINER=g5d-host-vl-1
          if [[ "${_G5_CI_RUST_E2E_ISOLATED}" == "true" ]]; then
            # cicd D31: the browser chain cold-restarts the main g5-api, so
            # this lane's live traffic moves to the stateless replica.
            export G5_E2E_API_URL=http://g5-api-re:7500
          fi
          echo "value-loop isolation active: org $$G5D_ORG_ID, host g5d-host-vl-1, api $${G5_E2E_API_URL}"
        else
          # Rollback lane: behave exactly like the pre-D30 serialized graph.
          # waitFor cannot branch on substitutions, so serialize behind
          # rust-e2e's completion marker in-step and use the shared org/host.
          echo "value-loop isolation disabled; waiting for the rust-e2e completion marker"
          for i in $$(seq 1 360); do
            if [[ -f /workspace/step-results-rust-e2e.txt ]]; then
              break
            fi
            if [[ "$$i" -eq 360 ]]; then
              echo "timed out waiting for the rust-e2e completion marker" >&2
              false
            fi
            sleep 10
          done
          export G5D_ORG_ID="$$(cat /workspace/e2e-org-id 2>/dev/null || true)"
        fi
        # F8/M11 deliberately restart only the API serving this serialized value-
        # loop lane. Their selectors wait for API smoke before restarting the
        # replica; in rollback, browser fixtures wait for this lane's marker
        # before starting against the main API.
        case "$$G5_E2E_API_URL" in
          http://g5-api-re:7500) export G5_E2E_API_RESTART_CONTAINER=g5-api-re ;;
          http://g5-api:7500) export G5_E2E_API_RESTART_CONTAINER=g5-api ;;
          *) echo "unexpected value-loop API for recovery: $$G5_E2E_API_URL" >&2; exit 1 ;;
        esac
        python3 -m unittest scripts.tests.test_value_loop_receipt scripts.tests.test_record_playwright_shard_results scripts.tests.test_plan_playwright_shards scripts.test_rust_e2e_lanes scripts.test_dev_mirror_fixture
        CATALOG_DIGEST="$$(python3 "$$RECEIPT_TOOL" digest --catalog "$$CATALOG")"
        python3 "$$RECEIPT_TOOL" plan --catalog "$$CATALOG" > "$$ARTIFACT_ROOT/execution-plan.tsv"
        # Fail before the lanes run when a producer names a profile or selector
        # the catalog does not carry. That mismatch otherwise surfaces only at
        # finalization, after the whole lane has been paid for.
        python3 "$$RECEIPT_TOOL" producers --catalog "$$CATALOG" --pipeline infra/ci/cloudbuild-ci-e2e.yaml

        OVERALL=passed
        while IFS=$$'\t' read -r profile lane selector loop_ids source; do
          case "$$profile" in
            api-integration)
              # Every tests/*.rs file is a module of the one `integration`
              # target (#585); the file stem prefixes the test name.
              test_module="$${source##*/}"
              test_module="$${test_module%.rs}"
              command=(cargo nextest run -p g5-api --test integration --all-features -j1 --no-fail-fast --no-tests fail -E "test(/^$${test_module}::.*$${selector}/)")
              ;;
            rust-e2e-broad)
              command=(cargo nextest run -p g5-e2e -j1 --no-fail-fast --no-tests fail -E "test($$selector)")
              ;;
            playwright-workspace-vm)
              continue
              ;;
            *)
              echo "unknown value-loop profile $$profile" >&2
              exit 1
              ;;
          esac

          if [[ "$$selector" == test_failed_live_flush_then_api_restart_forks_one_complete_child || "$$selector" == test_oversized_stop_kills_the_vm_and_start_restores_the_last_receipt ]]; then
            # API smoke also reads the replica, but starts independently.
            # Only F8/M11 restart it; gate those selectors without delaying the
            # preceding value-loop scenarios.
            for i in $$(seq 1 600); do
              if [[ -f /workspace/step-results-api-smoke.txt ]]; then
                break
              fi
              if [[ "$$i" -eq 600 ]]; then
                echo "timed out waiting for API smoke before recovery API restart" >&2
                false
              fi
              sleep 1
            done
          fi

          slug="$$(printf '%s-%s' "$$profile" "$$selector" | tr -cs 'A-Za-z0-9._-' '-')"
          evidence_ref="logs/$$slug.log"
          evidence_path="$$ARTIFACT_ROOT/$$evidence_ref"
          {
            echo "candidate_sha=${COMMIT_SHA}"
            echo "catalog_digest=$$CATALOG_DIGEST"
            echo "profile=$$profile"
            echo "lane=$$lane"
            echo "selector=$$selector"
            echo "loop_ids=$$loop_ids"
            echo "source=$$source"
          } | tee "$$evidence_path"

          if ! ./scripts/run-value-loop-selector.sh \
            "$$RESULTS" \
            "$$RECEIPT_TOOL" \
            "${COMMIT_SHA}" \
            "$$CATALOG_DIGEST" \
            "$$lane" \
            "$$profile" \
            "$$selector" \
            "$$evidence_path" \
            "$$evidence_ref" \
            -- "$${command[@]}"; then
            OVERALL=failed
          fi
        done < "$$ARTIFACT_ROOT/execution-plan.tsv"
        trap - ERR
        echo "VALUE_LOOP_RUST_API=$$OVERALL" > /workspace/step-results-value-loop-rust-api.txt
    env:
      - CARGO_HOME=/opt/g5-cargo-home
      - CARGO_INCREMENTAL=${_G5_CI_CARGO_INCREMENTAL}
      - RUSTC_WRAPPER=${_G5_CI_RUSTC_WRAPPER}
      - DATABASE_URL=postgres://g5:g5_test@postgres:5432/${_E2E_DB_NAME}
      - TEST_DATABASE_URL=postgres://g5:g5_test@postgres:5432/${_E2E_DB_NAME}
      - G5_E2E_DATABASE_URL=postgres://g5:g5_test@postgres:5432/${_E2E_DB_NAME}
      - G5_E2E_API_URL=http://g5-api:7500
      - G5_E2E_AUTH_MODE=oauth
      - G5_E2E_OAUTH_STUB_URL=http://oauth-stub:9876
      - G5_NODE_PATH=/workspace/g5-e2e-tools/node
    # Dedicated org/host stay (cicd D30). waitFor rust-e2e drops the
    # g5-api-re dual-load window without flipping isolation off (cicd D35).
    # stage-rust-e2e-node supplies G5_NODE_PATH; setup-kvm-cloud-hypervisor gates
    # the live-microvm selectors. The isolation-off rollback still
    # re-serializes in-step by polling rust-e2e's completion marker.
    volumes:
      - name: stack-secrets
        path: /g5-ci-secrets
    waitFor: ['generate-stack-secrets', 'rust-e2e', 'e2e-rust-prime', 'stage-rust-e2e-node', 'wait-value-loop-workers', 'setup-kvm-cloud-hypervisor']

  # ---------------------------------------------------------------------------
  # E2E-11. API smoke tests (Zod schema validation against live API)
  # ---------------------------------------------------------------------------
  - id: api-smoke
    # Continue to artifact export; assert-ci-status still requires this to pass.
    allowFailure: true
    name: node:${_NODE_VERSION}-alpine
    dir: frontend
    entrypoint: sh
    args:
      - -c
      - |
        set -eu
        trap 'rc=$$?; trap - EXIT; sh /workspace/scripts/ci-stage-status.sh report "$$rc" /workspace/step-results-api-smoke.txt API_SMOKE; exit $$?' EXIT
        if [ -f /workspace/e2e-fixtures-failed ]; then
          echo "Skipping API smoke because shared E2E fixture seeding failed"
          echo "API_SMOKE=failed" > /workspace/step-results-api-smoke.txt
          exit 0
        fi
        # cicd D31: the fixtures this suite reads are seeded through the
        # rust-e2e lane API replica when that lane is isolated.
        if [ "${_G5_CI_RUST_E2E_ISOLATED}" = "true" ] && [ "${_E2E_WORKER}" = "workspace-vm" ]; then
          E2E_API_URL=http://g5-api-re:7500
          export E2E_API_URL
        fi
        WORKDIR=/workspace/api-smoke-client
        rm -rf "$$WORKDIR"
        mkdir -p "$$WORKDIR"
        tar -C /workspace/frontend \
          --exclude='./node_modules' \
          --exclude='./coverage' \
          --exclude='./dist' \
          --exclude='./playwright-report' \
          --exclude='./test-results' \
          -cf - . | tar -C "$$WORKDIR" -xf -
        cd "$$WORKDIR"

        if npm ci --ignore-scripts && \
          npx vitest run -c vitest.config.smoke.ts --reporter=verbose; then
          echo "API_SMOKE=passed" > /workspace/step-results-api-smoke.txt
        else
          echo "WARN: API smoke tests had failures"
          echo "API_SMOKE=failed" > /workspace/step-results-api-smoke.txt
        fi
    env:
      - E2E_API_URL=http://g5-api:7500
    volumes:
      - name: npm-cache
        path: /root/.npm
    waitFor: ['seed-e2e-fixtures']

  # ---------------------------------------------------------------------------
  # E2E-12a. Browser-owned seeded workspace
  # ---------------------------------------------------------------------------
  - id: seed-playwright-workspace
    name: ${_CI_IMAGE}
    dir: .
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        rm -f /workspace/playwright-fixtures-failed
        if [[ -f /workspace/e2e-fixtures-failed ]]; then
          echo "Skipping browser workspace seed because shared E2E fixture seeding failed"
          touch /workspace/playwright-fixtures-failed
          exit 0
        fi
        trap 'touch /workspace/playwright-fixtures-failed; exit 0' ERR
        # cicd D31: with the rust-e2e lane isolated in its own org, rust-e2e
        # org-wide cleanup and live-worker polling can no longer race these
        # browser fixtures, so the chain starts as soon as the main-org stack
        # and workers are up. In rollback mode rust-e2e shares this org, so
        # re-serialize in-step behind its EXIT-trap-guaranteed completion
        # marker (waitFor cannot branch on substitutions).
        if [[ "${_G5_CI_RUST_E2E_ISOLATED}" != "true" || "${_E2E_WORKER}" != "workspace-vm" ]]; then
          echo "rust-e2e isolation disabled; waiting for the rust-e2e completion marker"
          for i in $$(seq 1 360); do
            if [[ -f /workspace/step-results-rust-e2e.txt ]]; then
              break
            fi
            if [[ "$$i" -eq 360 ]]; then
              echo "timed out waiting for the rust-e2e completion marker" >&2
              false
            fi
            sleep 10
          done
        fi
        export G5D_ORG_ID="$$(cat /workspace/e2e-org-id)"
        REPOS_VOLUME="g5-e2e-repos" \
        PG_CONTAINER="postgres" \
        DB_NAME="${_E2E_DB_NAME}" \
        API_CONTAINER="g5-api" \
        G5D_ORG_ID="$$G5D_ORG_ID" \
        G5_E2E_TEST_ORG_ID="$$G5D_ORG_ID" \
        G5_E2E_TEST_EMAIL="e2e-test@g5.dev" \
        G5_E2E_TEST_WORKSPACE_NAME="${_PLAYWRIGHT_E2E_WORKSPACE}" \
        G5_E2E_TEST_REPO_SLUG_PREFIX="${_PLAYWRIGHT_E2E_REPO_PREFIX}" \
        G5_E2E_TEST_ENV_FILE="/workspace/playwright-fixture.env" \
        ./scripts/seed-test-workspace.sh "http://g5-api:7500"
    # Browser fixtures create repos/workspaces in the main seeded org, which
    # the isolated rust-e2e lane never touches (cicd D31). seed-rust-e2e-org
    # (transitively covering seed-value-loop-org) serializes this step's
    # test-token mint behind the shared-user seed chain: /api/v1/auth/test-token
    # upserts e2e-test@g5.dev, which would otherwise race the lane org seeders'
    # user upserts (CodeRabbit PR review).
    waitFor: ['wait-workers', 'seed-rust-e2e-org']

  # ---------------------------------------------------------------------------
  # E2E-10a-pa. Seed the provider-agent lane's clone-source workspace (cicd D32)
  #
  # The provider-agent specs clone the seeded TEST_WORKSPACE via
  # createWorkspaceClone, so the dedicated g5labs-pa org needs its own
  # seed-test-workspace.sh run. Failure is
  # deferred through /workspace/pa-workspace-failed so teardown and artifact
  # export still run; the provider-agent step records the failed result.
  # ---------------------------------------------------------------------------
  - id: seed-pa-workspace
    name: ${_CI_IMAGE}
    dir: .
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        rm -f /workspace/pa-workspace-failed
        if [[ "${_G5_CI_PROVIDER_AGENT_ISOLATED}" != "true" || "${_E2E_WORKER}" != "workspace-vm" ]]; then
          echo "provider-agent isolation disabled (flag or substrate); skipping dedicated workspace seed"
          exit 0
        fi
        if [[ -f /workspace/e2e-fixtures-failed ]]; then
          echo "Skipping provider-agent workspace seed because shared E2E fixture seeding failed"
          touch /workspace/pa-workspace-failed
          exit 0
        fi
        trap 'touch /workspace/pa-workspace-failed; exit 0' ERR
        export G5D_ORG_ID="$$(cat /workspace/pa-org-id)"
        REPOS_VOLUME="g5-e2e-repos" \
        PG_CONTAINER="postgres" \
        DB_NAME="${_E2E_DB_NAME}" \
        API_CONTAINER="g5-api-pa" \
        G5D_ORG_ID="$$G5D_ORG_ID" \
        G5_E2E_TEST_ORG_ID="$$G5D_ORG_ID" \
        G5_E2E_TEST_EMAIL="e2e-test@g5.dev" \
        G5_E2E_TEST_WORKSPACE_NAME="${_PLAYWRIGHT_E2E_WORKSPACE}" \
        G5_E2E_TEST_REPO_SLUG_PREFIX="${_PLAYWRIGHT_E2E_REPO_PREFIX}" \
        G5_E2E_TEST_ID_SCOPE="e2e-playwright-pa" \
        G5_E2E_TEST_ENV_FILE="/workspace/pa-fixture.env" \
        ./scripts/seed-test-workspace.sh "http://g5-api-pa:7500"
    # Both fixture seeders inspect the same base-image tag namespace. Keep
    # these short preparations sequential; the isolated provider tests still
    # overlap the broad browser lanes after their fixtures are ready.
    waitFor: ['wait-pa-workers', 'seed-playwright-workspace']

  # ---------------------------------------------------------------------------
  # E2E-12b. Browser-only Playwright fixtures
  # ---------------------------------------------------------------------------
  - id: seed-playwright-fixtures
    # Runs from the e2e-rust-prime lane image (cicd D24): the cargo build and
    # cargo test below hit the primed fingerprints instead of recompiling
    # g5d + g5-e2e from the baked baseline (215s measured before the prime).
    name: g5-e2e-rust-lane
    dir: .
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        if [[ -f /workspace/playwright-fixtures-failed ]]; then
          echo "Skipping browser-only fixtures because browser workspace seeding failed"
          exit 0
        fi
        trap 'touch /workspace/playwright-fixtures-failed; exit 0' ERR
        # Rollback mode shares the main org/host with the value-loop lane. Its
        # exact-candidate selectors must finish before the browser chain starts
        # mutating the same workspace authority. The isolated workspace-VM
        # graph has separate orgs/hosts and needs no marker wait.
        if [[ "${_G5_CI_VALUE_LOOP_ISOLATED}" != "true" || "${_E2E_WORKER}" != "workspace-vm" ]]; then
          echo "value-loop isolation disabled; waiting for the value-loop completion marker"
          for i in $$(seq 1 360); do
            if [[ -f /workspace/step-results-value-loop-rust-api.txt ]]; then
              break
            fi
            if [[ "$$i" -eq 360 ]]; then
              echo "timed out waiting for the value-loop completion marker" >&2
              false
            fi
            sleep 10
          done
        fi
        # P2.4/P4.9b retired the draft-scope fixture and worker pause/restart
        # window. The checked workspace seed now performs the required explicit
        # owner Resume and waits for the real workspace host's ready event.
        echo "No browser-only post-seed fixtures remain"
        trap - EXIT
    # Compile-env parity with e2e-rust-prime (cicd D24). P1.4 retired this
    # step's cargo calls with the persistent selector loop; the shared cache
    # settings stay so a future call here is a fingerprint no-op.
    env:
      - CARGO_HOME=/opt/g5-cargo-home
      - CARGO_INCREMENTAL=${_G5_CI_CARGO_INCREMENTAL}
      - RUSTC_WRAPPER=${_G5_CI_RUSTC_WRAPPER}
    # Browser fixtures are phase-scoped data. Serialize this API-restarting
    # cold-start proof after the browser workspace seed so the restart cannot
    # interrupt that seed's HTTP requests in the shared stack.
    # The seed's frontend helper consumes frontend/node_modules through a
    # pinned Node container when the Rust builder has no node binary. Wait for
    # the final serialized frontend install/test step so that tree is immutable.
    # The seed-rust-e2e-org edge graph-guarantees the g5-api restart below can
    # never race the org seeds that go through the main API (it transitively
    # covers seed-value-loop-org); the old value-loop-rust-api-profiles edge is
    # replaced by the in-step rollback marker poll above. e2e-rust-prime commits the local
    # g5-e2e-rust-lane image this step RUNS FROM — previously covered
    # transitively through the retired rust-e2e edge; without it Cloud Build
    # tries to pull the image and fails (canary ef1f7ea6).
    waitFor: ['seed-playwright-workspace', 'frontend-test', 'seed-rust-e2e-org', 'e2e-rust-prime']

  # ---------------------------------------------------------------------------
  # E2E-12c. Playwright browser E2E (full OAuth flow) — SHARDED 3x
  # ---------------------------------------------------------------------------
  # Split the dominant browser tail into three parallel Cloud Build steps. The
  # planner starts from the original --shard=k/3 inventories, places whole
  # files from the committed measured durations by replaying Playwright's
  # dispatch onto each shard's workers, then verifies the planned ID partition
  # (ontology g5.quality.delivery.ci.browser-shards). Each shard uses a
  # distinct WORKDIR and artifact/result filenames; the final gate reads every
  # status file and verifies the executed inventories.
  # Speed-up experiment: the shard wall (28 min at two shards x two workers)
  # is bound by host VM slots; one-vCPU guests allow fourteen slots, so a third
  # two-worker shard (1 + 2*3*2 = 13 < 14) should cut the wall to ~19-20 min.
  - id: plan-playwright-shards
    name: ${_PLAYWRIGHT_RUNNER_IMAGE}
    dir: frontend
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        WORKDIR=/workspace/playwright-plan-client
        rm -rf "$$WORKDIR"
        mkdir -p "$$WORKDIR" /workspace/playwright-shard-plan
        tar -C /workspace/frontend \
          --exclude='./node_modules' \
          --exclude='./coverage' \
          --exclude='./dist' \
          --exclude='./playwright-report' \
          --exclude='./test-results' \
          -cf - . | tar -C "$$WORKDIR" -xf -
        cd "$$WORKDIR"
        ln -s /opt/g5-playwright-client/node_modules node_modules
        EXCLUSIONS='Claude Code routing from UI actions|Chat restart and reload continuity|M9/M12 transfer fences live chat|Native request owner flow'
        for shard in 1 2 3; do
          ./node_modules/.bin/playwright test --list --project=chromium \
            --shard=$$shard/3 --grep-invert "$$EXCLUSIONS" --reporter=json \
            > /workspace/playwright-shard-plan/original-$$shard.json
        done
        python3 /workspace/scripts/plan_playwright_shards.py plan \
          --original /workspace/playwright-shard-plan/original-1.json \
          --original /workspace/playwright-shard-plan/original-2.json \
          --original /workspace/playwright-shard-plan/original-3.json \
          --shards 3 \
          --durations /workspace/infra/ci/playwright-file-durations.json \
          --workers "$${PLAYWRIGHT_WORKERS}" \
          --output-dir /workspace/playwright-shard-plan
        for shard in 1 2 3; do
          ./node_modules/.bin/playwright test --list --project=chromium \
            --test-list=/workspace/playwright-shard-plan/shard-$$shard.test-list \
            --grep-invert "$$EXCLUSIONS" --reporter=json \
            > /workspace/playwright-shard-plan/planned-$$shard.json
        done
        python3 /workspace/scripts/plan_playwright_shards.py verify \
          --plan /workspace/playwright-shard-plan/plan.json \
          --report /workspace/playwright-shard-plan/planned-1.json \
          --report /workspace/playwright-shard-plan/planned-2.json \
          --report /workspace/playwright-shard-plan/planned-3.json
    env:
      - E2E_BASE_URL=https://app.g5-e2e.test
      - E2E_PREVIEW_HOST_RESOLVER=MAP *.preview.g5-e2e.test g5-test-client
      - E2E_DISPOSABLE_STACK_HOST=app.g5-e2e.test
      - E2E_API_URL=http://g5-api:7500
      - E2E_API_CONTAINER=g5-api
      - E2E_REPOS_BASE_DIR=/mnt/g5-repos/repos
      - DOCKER_API_VERSION=1.41
      - E2E_DATABASE_URL=postgres://g5:g5_test@postgres:5432/${_E2E_DB_NAME}
      - E2E_OAUTH_STUB_URL=http://oauth-stub:9876
      - E2E_USE_OAUTH=true
      # Node-side mirror of the API gate: the alignment-shell spec runs only
      # while this is "true" (workbench g5.workbench.gate).
      - G5_GUIDED_JOURNEY_ENABLED=true
      - VITE_E2E_ORG=g5labs
      - VITE_E2E_WORKSPACE=${_PLAYWRIGHT_E2E_WORKSPACE}
      - VITE_E2E_DEMO_WORKSPACE=${_PLAYWRIGHT_E2E_WORKSPACE}
      - VITE_E2E_CROSS_ENV_WORKSPACE=${_PLAYWRIGHT_E2E_WORKSPACE}
      - VITE_E2E_CODE_REPO_NAME=${_PLAYWRIGHT_E2E_REPO_PREFIX}-code-repo
      - VITE_E2E_DOCS_REPO_NAME=${_PLAYWRIGHT_E2E_REPO_PREFIX}-docs-repo
      - G5_E2E_COMPLIANCE_ORG=g5labs
      - G5_E2E_COMPLIANCE_WORKSPACE=${_PLAYWRIGHT_E2E_WORKSPACE}
      - G5_PLAYWRIGHT_HEARTBEAT_MS=30000
      - PLAYWRIGHT_WORKERS=${_PLAYWRIGHT_WORKERS}
      - PLAYWRIGHT_BROWSERS_PATH=/ms-playwright
      - CI=true
    # A few seconds of test discovery fit in the fixture window after the
    # release compile, without adding load to its peak on this worker pool.
    waitFor: ['build-playwright-runner-image', 'rust-release-artifacts']

  - id: playwright-e2e-shard-1
    # Continue to artifact export; assert-ci-status still requires this to pass.
    allowFailure: true
    name: ${_PLAYWRIGHT_RUNNER_IMAGE}
    dir: frontend
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        # Keep testing the downloaded g5d; resolve its fake providers from
        # this candidate's release artifacts, which are not in the runner image.
        export G5_E2E_RUNTIME_BIN_DIR=/workspace/.ci-release-artifacts/worker
        export PATH="$$G5_E2E_RUNTIME_BIN_DIR:$$PATH"
        trap 'rc=$$?; trap - EXIT; sh /workspace/scripts/ci-stage-status.sh report "$$rc" /workspace/step-results-playwright-e2e-shard-1.txt PLAYWRIGHT_E2E_SHARD_1; exit $$?' EXIT
        if [[ -f /workspace/playwright-fixtures-failed ]]; then
          echo "Skipping Playwright shard 1 because fixture seeding failed"
          echo "PLAYWRIGHT_E2E_SHARD_1=failed" > /workspace/step-results-playwright-e2e-shard-1.txt
          exit 0
        fi
        WORKDIR=/workspace/playwright-client-shard-1
        rm -rf "$$WORKDIR"
        mkdir -p "$$WORKDIR"
        tar -C /workspace/frontend \
          --exclude='./node_modules' \
          --exclude='./coverage' \
          --exclude='./dist' \
          --exclude='./playwright-report' \
          --exclude='./test-results' \
          -cf - . | tar -C "$$WORKDIR" -xf -
        cd "$$WORKDIR"
        ln -s /opt/g5-playwright-client/node_modules node_modules

        # Enumerate every Chromium test in the value-loop files without the
        # broad lane's grep exclusions. Receipt finalization compares this
        # inventory with every executed shard report and the focused transfer
        # report, so a missing or skipped browser test cannot qualify.
        ./node_modules/.bin/playwright test --list --project=chromium --no-deps \
          --reporter=json > /workspace/playwright-value-loop-inventory.json

        # Reporter is driven by playwright.config.ts (html + github on CI).
        # Do NOT pass --reporter on the CLI here: it overrides the config and
        # suppresses both the HTML report and the inline ::error:: annotations
