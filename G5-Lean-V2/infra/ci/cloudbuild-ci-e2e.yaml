  # ---------------------------------------------------------------------------
  # E2E-12e. Workspace-agent Playwright E2E (one browser worker)
  # ---------------------------------------------------------------------------
  - id: provider-agent-playwright-e2e
    # Continue to artifact export; assert-ci-status still requires this to pass.
    allowFailure: true
    name: ${_PLAYWRIGHT_RUNNER_IMAGE}
    dir: frontend
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        export G5_E2E_RUNTIME_BIN_DIR=/workspace/.ci-release-artifacts/worker
        export PATH="$$G5_E2E_RUNTIME_BIN_DIR:$$PATH"
        trap 'rc=$$?; trap - EXIT; sh /workspace/scripts/ci-stage-status.sh report "$$rc" /workspace/step-results-provider-agent-e2e.txt PROVIDER_AGENT_E2E; exit $$?' EXIT
        if [[ -f /workspace/playwright-fixtures-failed ]]; then
          echo "Skipping provider-agent Playwright because fixture seeding failed"
          echo "PROVIDER_AGENT_E2E=failed" > /workspace/step-results-provider-agent-e2e.txt
          exit 0
        fi
        if [[ "${_G5_CI_RUST_E2E_ISOLATED}" != "true" || "${_E2E_WORKER}" != "workspace-vm" ]]; then
          if ! bash /workspace/scripts/ci-wait-markers.sh 3600 /workspace/step-results-rust-e2e.txt /workspace/step-results-value-loop-rust-api.txt; then
            echo "PROVIDER_AGENT_E2E=failed" > /workspace/step-results-provider-agent-e2e.txt
            exit 0
          fi
        fi
        if [[ "${_G5_CI_PROVIDER_AGENT_ISOLATED}" == "true" && "${_E2E_WORKER}" == "workspace-vm" ]]; then
          if [[ -f /workspace/pa-workspace-failed ]]; then
            echo "Skipping provider-agent Playwright because the dedicated workspace seed failed"
            echo "PROVIDER_AGENT_E2E=failed" > /workspace/step-results-provider-agent-e2e.txt
            exit 0
          fi
          export VITE_E2E_ORG=g5labs-pa
          export VITE_E2E_SELECTED_ORG=g5labs-pa
          export E2E_BASE_URL=https://app-pa.g5-e2e.test
          export E2E_PREVIEW_HOST_RESOLVER='MAP *.preview-pa.g5-e2e.test g5-test-client-pa'
          export E2E_DISPOSABLE_STACK_HOST=app-pa.g5-e2e.test
          export E2E_API_URL=http://g5-api-pa:7500
          export E2E_API_CONTAINER=g5-api-pa
        else
          # D32 rollback: shared stack — re-serialize behind every shard.
          if ! bash /workspace/scripts/ci-wait-markers.sh 3600 /workspace/step-results-playwright-e2e-shard-1.txt /workspace/step-results-playwright-e2e-shard-2.txt /workspace/step-results-playwright-e2e-shard-3.txt; then
            echo "PROVIDER_AGENT_E2E=failed" > /workspace/step-results-provider-agent-e2e.txt
            exit 0
          fi
        fi
        WORKDIR=/workspace/provider-agent-playwright-client
        rm -rf "$$WORKDIR"
        mkdir -p "$$WORKDIR"
        tar -C /workspace/frontend \
          --exclude='./node_modules' \
          --exclude='./coverage' \
          --exclude='./dist' \
          --exclude='./playwright-report' \
          --exclude='./test-results' \
          -cf - . | tar -C "$$WORKDIR" -xf -
        cd "$$WORKDIR"
        ln -s /opt/g5-playwright-client/node_modules node_modules

        STATUS=passed
        AUTH_READY=1
        if ! ./node_modules/.bin/playwright test --project=setup e2e/auth.setup.ts; then
          echo "ERROR: Provider-agent Playwright auth setup failed"
          STATUS=failed
          AUTH_READY=0
        fi
        if [ "$$AUTH_READY" -eq 1 ] && [ ! -s e2e/.auth/user.json ]; then
          echo "ERROR: Provider-agent Playwright auth setup did not write e2e/.auth/user.json"
          STATUS=failed
          AUTH_READY=0
        fi
        if [ "$$AUTH_READY" -eq 1 ] && ! ./node_modules/.bin/playwright test \
          --project=chromium \
          --no-deps \
          --workers=1 \
          e2e/flows/chat.spec.ts \
          e2e/flows/chat-large-response.spec.ts \
          e2e/flows/codex-settings.spec.ts; then
          echo "ERROR: Provider-agent Playwright E2E tests had failures; exporting artifacts before final CI gate fails the build"
          STATUS=failed
        fi

        VALUE_LOOP_ARTIFACT_ROOT=/workspace/value-loop-matrix-artifacts
        # lane's selector-results.jsonl at finalize.
        VALUE_LOOP_RESULTS="$$VALUE_LOOP_ARTIFACT_ROOT/selector-results-playwright.jsonl"
        mkdir -p "$$VALUE_LOOP_ARTIFACT_ROOT/logs"
        cp /workspace/playwright-shard-plan/plan.json "$$VALUE_LOOP_ARTIFACT_ROOT/playwright-shard-plan.json"
        VALUE_LOOP_CATALOG_DIGEST="$$(python3 /workspace/scripts/value_loop_receipt.py digest --catalog /workspace/tests/e2e/value_loop_matrix.tsv)"
        while IFS='|' read -r VALUE_LOOP_SELECTOR VALUE_LOOP_SOURCE; do
          VALUE_LOOP_SLUG="$$(basename "$$VALUE_LOOP_SELECTOR" .spec.ts)"
          VALUE_LOOP_EVIDENCE_REF="logs/playwright-$$VALUE_LOOP_SLUG.log"
          VALUE_LOOP_EVIDENCE="$$VALUE_LOOP_ARTIFACT_ROOT/$$VALUE_LOOP_EVIDENCE_REF"
          VALUE_LOOP_STARTED_AT="$$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          VALUE_LOOP_TERMINAL_STATUS=not_run
          {
            echo "candidate_sha=${COMMIT_SHA}"
            echo "catalog_digest=$$VALUE_LOOP_CATALOG_DIGEST"
            echo "profile=playwright-workspace-vm"
            echo "selector=$$VALUE_LOOP_SELECTOR"
            echo "source=$$VALUE_LOOP_SOURCE"
          } | tee "$$VALUE_LOOP_EVIDENCE"
          if [ "$$AUTH_READY" -eq 1 ]; then
            set +e
            # Parallel-safe selectors fan out over G5_PA_PLAYWRIGHT_WORKERS;
            # the API-restart test runs alone (scripts/ci-run-playwright-selector.sh).
            bash /workspace/scripts/ci-run-playwright-selector.sh "$$VALUE_LOOP_SELECTOR" \
              2>&1 | tee -a "$$VALUE_LOOP_EVIDENCE"
            VALUE_LOOP_PLAYWRIGHT_STATUS=$${PIPESTATUS[0]}
            set -e
            if [ "$$VALUE_LOOP_PLAYWRIGHT_STATUS" -eq 0 ]; then
              VALUE_LOOP_TERMINAL_STATUS=passed
            else
              VALUE_LOOP_TERMINAL_STATUS=failed
              STATUS=failed
            fi
          else
            echo "value-loop browser selector not run because auth setup failed" | tee -a "$$VALUE_LOOP_EVIDENCE"
          fi
          VALUE_LOOP_ENDED_AT="$$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          python3 /workspace/scripts/value_loop_receipt.py record \
            --results "$$VALUE_LOOP_RESULTS" \
            --candidate-sha "${COMMIT_SHA}" \
            --catalog-digest "$$VALUE_LOOP_CATALOG_DIGEST" \
            --lane playwright \
            --profile playwright-workspace-vm \
            --selector "$$VALUE_LOOP_SELECTOR" \
            --started-at "$$VALUE_LOOP_STARTED_AT" \
            --ended-at "$$VALUE_LOOP_ENDED_AT" \
            --status "$$VALUE_LOOP_TERMINAL_STATUS" \
            --evidence-artifact "$$VALUE_LOOP_EVIDENCE_REF"
        done <<'PLAYWRIGHT_VALUE_LOOPS'
        e2e/flows/chat-restart-continuity.spec.ts|frontend/e2e/flows/chat-restart-continuity.spec.ts
        e2e/flows/native-requests.spec.ts|frontend/e2e/flows/native-requests.spec.ts
        PLAYWRIGHT_VALUE_LOOPS

        # The transfer case must remain on the provider-only org/host. Its
        # other two Preview tests ran in the broad shards; the receipt helper
        # requires all three distinct tests to pass before recording the file.
        if [ "$$AUTH_READY" -eq 1 ]; then
          if ! ./node_modules/.bin/playwright test \
            --project=chromium --no-deps --workers=1 \
            e2e/flows/workspace-preview.spec.ts \
            --grep 'M9/M12 transfer fences live chat'; then
            STATUS=failed
          fi
        else
          STATUS=failed
        fi
        # Receipt tail reads the shard reports: wait for the shard markers
        # here, not in waitFor (which would re-serialize the whole lane).
        if ! bash /workspace/scripts/ci-wait-markers.sh 3600 /workspace/step-results-playwright-e2e-shard-1.txt /workspace/step-results-playwright-e2e-shard-2.txt /workspace/step-results-playwright-e2e-shard-3.txt; then
          STATUS=failed
        fi
        if ! python3 /workspace/scripts/plan_playwright_shards.py verify \
          --plan /workspace/playwright-shard-plan/plan.json \
          --report /workspace/playwright-report-shard-1.json \
          --report /workspace/playwright-report-shard-2.json \
          --report /workspace/playwright-report-shard-3.json; then
          STATUS=failed
        fi
        cp /workspace/playwright-value-loop-inventory.json "$$VALUE_LOOP_ARTIFACT_ROOT/playwright-value-loop-inventory.json"
        if ! python3 /workspace/scripts/record_playwright_shard_results.py \
          --catalog /workspace/tests/e2e/value_loop_matrix.tsv \
          --selectors /workspace/tests/e2e/playwright_shard_value_loops.tsv \
          --inventory /workspace/playwright-value-loop-inventory.json \
          --shard-report /workspace/playwright-report-shard-1.json \
          --shard-report /workspace/playwright-report-shard-2.json \
          --shard-report /workspace/playwright-report-shard-3.json \
          --provider-report test-results/report.json \
          --candidate-sha "${COMMIT_SHA}" \
          --results "$$VALUE_LOOP_RESULTS" \
          --artifact-root "$$VALUE_LOOP_ARTIFACT_ROOT"; then
          STATUS=failed
        fi

        # Record a retry-passed (flaky) run so stop-e2e-stack captures the
        # container logs for it too (#1824). Without this the lane reports
        # `passed`, teardown skips the dump, and the server-side window that
        # explains the flake is discarded.
        node /workspace/scripts/report-flaky-tests.js "provider-agent" \
          "/workspace/step-flaky-provider-agent-playwright-e2e.txt" || true
        if [ -d playwright-report ]; then
          tar -czf /workspace/provider-agent-playwright-report.tar.gz playwright-report || true
        fi
        if [ -d test-results ]; then
          tar -czf /workspace/provider-agent-playwright-test-results.tar.gz test-results || true
        fi

        echo "PROVIDER_AGENT_E2E=$$STATUS" > /workspace/step-results-provider-agent-e2e.txt
    env:
      - E2E_BASE_URL=https://app.g5-e2e.test
      - E2E_PREVIEW_HOST_RESOLVER=MAP *.preview.g5-e2e.test g5-test-client
      - E2E_DISPOSABLE_STACK_HOST=app.g5-e2e.test
      - E2E_API_URL=http://g5-api:7500
      - E2E_API_CONTAINER=g5-api
      - E2E_REPOS_BASE_DIR=/mnt/g5-repos/repos
      - DOCKER_API_VERSION=1.41
      - E2E_DATABASE_URL=postgres://g5:g5_test@postgres:5432/${_E2E_DB_NAME}
      - E2E_OAUTH_STUB_URL=http://oauth-stub:9876
      - E2E_USE_OAUTH=true
      # Node-side mirror of the API gate: the alignment-shell spec runs only
      # while this is "true" (workbench g5.workbench.gate).
      - G5_GUIDED_JOURNEY_ENABLED=true
      - VITE_E2E_ORG=g5labs
      - VITE_E2E_WORKSPACE=${_PLAYWRIGHT_E2E_WORKSPACE}
      - VITE_E2E_DEMO_WORKSPACE=${_PLAYWRIGHT_E2E_WORKSPACE}
      - VITE_E2E_CROSS_ENV_WORKSPACE=${_PLAYWRIGHT_E2E_WORKSPACE}
      - VITE_E2E_CODE_REPO_NAME=${_PLAYWRIGHT_E2E_REPO_PREFIX}-code-repo
      - VITE_E2E_DOCS_REPO_NAME=${_PLAYWRIGHT_E2E_REPO_PREFIX}-docs-repo
      - G5_E2E_COMPLIANCE_ORG=g5labs
      - G5_E2E_COMPLIANCE_WORKSPACE=${_PLAYWRIGHT_E2E_WORKSPACE}
      - G5_E2E_CLAUDE_CODE_V1_ENABLED=true
      - G5_E2E_CODEX_V1_ENABLED=true
      - G5_E2E_CODEX_ROUTING_ENABLED=true
      - G5_E2E_CODEX_FAKE=true
      - G5_E2E_CODEX_SETTINGS=true
      - LLM_ENABLED=1
      - PLAYWRIGHT_WORKERS=1
      - G5_PA_PLAYWRIGHT_WORKERS=${_PA_PLAYWRIGHT_WORKERS}
      - PLAYWRIGHT_BROWSERS_PATH=/ms-playwright
      - CI=true
    # cicd D31: with the Rust lanes isolated on their own orgs/hosts, their
    # pause windows can no longer touch g5d-host-1, so the Rust-lane edges are
    # retired; the rollback marker polls above re-create them in-step when
    # isolation is disabled.
    # cicd D32 + deployment g5.quality.delivery.ci.provider-agent-overlap: the
    # lane runs CONCURRENTLY with the broad shards on its own org (g5labs-pa),
    # host (g5d-host-pa-1), API replica (g5-api-pa) and edge
    # (g5-test-client-pa). E2E_API_CONTAINER is what chat-restart-continuity
    # `docker restart`s; exporting the replica in-script is what keeps those
    # restarts off the broad shards' g5-api. auth.setup.ts reads
    # VITE_E2E_SELECTED_ORG, the specs read VITE_E2E_ORG via TEST_ORG. The
    # shard edges that used to serialize the lane (issue #1983's feared
    # peak-memory window, disproven by the resource-sampler summary) are
    # replaced by the in-step marker poll before the receipt tail, after the
    # lane's last own spec. The rollback branch re-serializes in-step when
    # isolation is off. seed-pa-workspace and start-pa-client are the lane's
    # own readiness gates (previously reached transitively via the shards).
    # The inline script is near Cloud Build's 10,000-character arg cap (the
    # trigger rejects the whole config above it), hence the marker helper and
    # the terse in-script comments; scripts/test_cloudbuild_waitfor_order.py
    # guards the cap with a margin.
    waitFor: ['seed-playwright-fixtures', 'seed-pa-workspace', 'start-pa-client', 'plan-playwright-shards', 'wait-pa-workers']

  # ---------------------------------------------------------------------------

  # ---------------------------------------------------------------------------
  # E2E-12g. Validate the exact-candidate value-loop acceptance receipt
  # ---------------------------------------------------------------------------
  - id: finalize-value-loop-receipt
    # Continue to artifact export; assert-ci-status still requires this to pass.
    allowFailure: true
    name: g5-e2e-rust-lane
    dir: .
    entrypoint: bash
    args:
      - -c
      - |
        set -u
        trap 'rc=$$?; trap - EXIT; sh /workspace/scripts/ci-stage-status.sh report "$$rc" /workspace/step-results-value-loop-matrix.txt VALUE_LOOP_MATRIX; exit $$?' EXIT
        ARTIFACT_ROOT=/workspace/value-loop-matrix-artifacts
        # Merge the per-lane receipt files (cicd D31): the value-loop lane is
        # the sole writer of selector-results.jsonl and the browser chain is
        # the sole writer of selector-results-playwright.jsonl, so a plain
        # concatenation is race-free once both lanes are terminal (waitFor).
        MERGED="$$ARTIFACT_ROOT/selector-results-merged.jsonl"
        mkdir -p "$$ARTIFACT_ROOT"
        rm -f "$$MERGED"
        touch "$$MERGED"
        for part in "$$ARTIFACT_ROOT/selector-results.jsonl" "$$ARTIFACT_ROOT/selector-results-playwright.jsonl"; do
          if [[ -f "$$part" ]]; then
            cat "$$part" >> "$$MERGED"
          fi
        done
        set +e
        python3 scripts/value_loop_receipt.py finalize \
          --catalog tests/e2e/value_loop_matrix.tsv \
          --results "$$MERGED" \
          --candidate-sha "${COMMIT_SHA}" \
          --output "$$ARTIFACT_ROOT/value-loop-receipt.json" \
          --fill-missing
        STATUS=$$?
        set -e
        if [[ "$$STATUS" -eq 0 ]]; then
          echo "VALUE_LOOP_MATRIX=passed" > /workspace/step-results-value-loop-matrix.txt
          echo "Value-loop receipt validated: all retained catalog selectors at ${COMMIT_SHA}"
        else
          echo "VALUE_LOOP_MATRIX=failed" > /workspace/step-results-value-loop-matrix.txt
          echo "Value-loop receipt validation failed at ${COMMIT_SHA}" >&2
        fi
        exit 0
    waitFor: ['provider-agent-playwright-e2e', 'seed-playwright-fixtures', 'value-loop-rust-api-profiles']

  # ---------------------------------------------------------------------------
  # E2E-13. Tear down E2E stack
  # ---------------------------------------------------------------------------
  - id: stop-e2e-stack
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -c
      - |
        echo "=== Tearing down E2E stack ==="
        if ls /workspace/step-flaky-*.txt >/dev/null 2>&1 \
          || grep -hq '=failed$' /workspace/step-results-playwright-e2e-shard-*.txt 2>/dev/null \
          || grep -q '^PROVIDER_AGENT_E2E=failed$' /workspace/step-results-provider-agent-e2e.txt 2>/dev/null \
          || grep -q '^RUST_E2E=failed$' /workspace/step-results-rust-e2e.txt 2>/dev/null \
          || grep -q '^API_SMOKE=failed$' /workspace/step-results-api-smoke.txt 2>/dev/null \
          || grep -q '^VALUE_LOOP_MATRIX=failed$' /workspace/step-results-value-loop-matrix.txt 2>/dev/null \
          || grep -q '^VALUE_LOOP_RUST_API=failed$' /workspace/step-results-value-loop-rust-api.txt 2>/dev/null; then
          if ls /workspace/step-flaky-*.txt >/dev/null 2>&1; then
            echo "=== Playwright E2E reported flaky (retry-passed) runs — dumping E2E container state ==="
            for marker in /workspace/step-flaky-*.txt; do
              echo "--- $${marker} ---"
              cat "$${marker}" 2>/dev/null || true
            done
          else
            echo "=== Playwright E2E failed — dumping E2E container state ==="
          fi
          docker ps -a \
            --filter name=g5-test-client \
            --filter name=g5-api \
            --filter name=oauth-stub \
            --format 'table {{.Names}}\t{{.Status}}\t{{.Image}}' \
            2>&1 || true

          # Capture the FULL container logs to files for GCS upload
          # (export-e2e-artifacts), not just a fixed tail to stdout. The window
          # that explains a flake can be minutes older than the teardown — e.g. a
          # job-progress task driven to `failed` by assignment-validation
          # (`mark_assignment_validation_failed`) or the lease reaper rolls off a
          # `--tail=200` dump entirely. Still echo a tail inline for quick
          # log-view triage without downloading the artifact.
          mkdir -p /workspace/e2e-logs
          for container in \
            postgres g5-test-client g5-api g5-api-re g5-api-pa g5-test-client-pa oauth-stub \
            g5d-host-1 g5d-host-vl-1 g5d-host-re-1 g5d-host-pa-1; do
            echo "--- docker logs (tail 200; full log in e2e-logs/$${container}.log): $${container} ---"
            docker logs "$${container}" > "/workspace/e2e-logs/$${container}.log" 2>&1 || true
            tail -n 200 "/workspace/e2e-logs/$${container}.log" 2>&1 || true
          done
          # Include bounded flush phase history inline: a failed browser test
          # can predate the fixed container tails, and GCS log access is not
          # guaranteed to the developer diagnosing the red build.
          for container in g5d-host-1 g5d-host-vl-1 g5d-host-re-1 g5d-host-pa-1; do
            echo "--- workspace flush phases: $${container} ---"
            grep -E 'workspace flush (capture|repo|refs)' \
              "/workspace/e2e-logs/$${container}.log" | tail -n 160 || true
            echo "--- workspace flush Git failures: $${container} ---"
            grep -F 'workspace flush git command failed' \
              "/workspace/e2e-logs/$${container}.log" \
              | sed -E 's#https?://[^[:space:]]+#<redacted-url>#g' \
              | tail -n 80 || true
          done
          for container in g5-api g5-api-re g5-api-pa; do
            echo "--- workspace transfer stop phases: $${container} ---"
            grep -F 'workspace transfer stop phase' \
              "/workspace/e2e-logs/$${container}.log" | tail -n 120 || true
          done
        fi
        # Backstop for an interrupted Rust runner; ownership checks prevent
        # removing a developer's container or another build's fixture.
        if ! bash /workspace/scripts/with-dev-mirror-fixture.sh --cleanup "$BUILD_ID"; then
          echo "RUST_E2E=failed" > /workspace/step-results-rust-e2e.txt
        fi
        docker rm -f \
          g5-test-client g5-api g5-api-re g5-api-pa g5-test-client-pa oauth-stub \
          g5d-host-1 g5d-host-vl-1 g5d-host-re-1 g5d-host-pa-1 \
          2>/dev/null || true
        docker volume rm -f g5-e2e-host-runtime 2>/dev/null || true
        # Release the background resource sampler (cicd D31) once the stack —
        # the window the RAM-envelope evidence must cover — is gone.
        touch /workspace/resource-sampler-stop
    waitFor: ['rust-e2e', 'api-smoke', 'playwright-e2e-shard-1', 'playwright-e2e-shard-2', 'playwright-e2e-shard-3', 'provider-agent-playwright-e2e', 'finalize-value-loop-receipt']

  # ---------------------------------------------------------------------------
  # E2E-13b. Export E2E artifacts to GCS on SUCCESS *and* FAILURE
  #
  # The top-level `artifacts:` block only uploads on a SUCCESSFUL build, so when
  # the `assert-ci-status` gate fails the build (the normal outcome of a flaky
  # e2e), the Playwright traces/report and the container logs are never uploaded
  # and the failure is undiagnosable. This step runs BEFORE the gate, exits 0
  # regardless of upload outcome, and uploads the artifacts the shard steps and
  # stop-e2e-stack already wrote to /workspace — so a red build is
  # diagnosable from GCS. (Green builds still also get them via `artifacts:`;
  # a double upload is a harmless overwrite.)
  # ---------------------------------------------------------------------------
  - id: export-e2e-artifacts
    name: gcr.io/cloud-builders/gcloud
    entrypoint: bash
    args:
      - -c
      - |
        # No `set -e`: an upload hiccup must never fail the build here; the
        # CI verdict belongs solely to assert-ci-status.
        set -uo pipefail
        DEST="gs://${PROJECT_ID}-build-artifacts/ci/$BUILD_ID/"
        echo "=== Exporting E2E artifacts to $${DEST} (runs on success AND failure, before the CI gate) ==="
        # Package the full container logs captured by stop-e2e-stack (present
        # only when a Playwright shard failed — see its `=failed$` guard).
        if [ -d /workspace/e2e-logs ]; then
          tar -czf /workspace/e2e-logs.tar.gz -C /workspace e2e-logs || true
        fi
        shopt -s nullglob
        uploaded=0
        for f in \
          /workspace/playwright-report-shard-*.tar.gz \
          /workspace/playwright-test-results-shard-*.tar.gz \
          /workspace/playwright-durations-shard-*.json \
          /workspace/provider-agent-playwright-report.tar.gz \
          /workspace/provider-agent-playwright-test-results.tar.gz \
          /workspace/e2e-logs.tar.gz; do
          echo "Uploading $${f}"
          if gcloud storage cp "$${f}" "$${DEST}"; then
            uploaded=$$((uploaded + 1))
          else
            echo "WARN: upload failed for $${f}"
          fi
        done
        if [ -d /workspace/value-loop-matrix-artifacts ]; then
          echo "Uploading exact-candidate value-loop receipt and selector evidence"
          if gcloud storage cp --recursive \
            /workspace/value-loop-matrix-artifacts \
            "$${DEST}value-loop-matrix-artifacts"; then
            uploaded=$$((uploaded + 1))
          else
            echo "WARN: value-loop receipt upload failed"
          fi
        fi
        # Resource-sampler evidence (cicd D31): the sampler exits within one
        # 10s tick of the teardown stop marker; wait briefly for its summary
        # so the upload is complete, then upload regardless.
        for i in $$(seq 1 12); do
          if [ -f /workspace/resource-samples/summary.txt ]; then
            break
          fi
          sleep 5
        done
        if [ -d /workspace/resource-samples ]; then
          echo "Uploading resource-sampler RAM/CPU envelope evidence"
          if gcloud storage cp --recursive \
            /workspace/resource-samples \
            "$${DEST}resource-samples"; then
            uploaded=$$((uploaded + 1))
          else
            echo "WARN: resource-sampler upload failed"
          fi
        fi
        echo "=== E2E artifact export complete ($${uploaded} object(s) uploaded) ==="
    waitFor: ['stop-e2e-stack']

  # ---------------------------------------------------------------------------
  # 10. Stop Postgres sidecar (deferred — runs after E2E stack is torn down)
  # ---------------------------------------------------------------------------
  - id: stop-postgres
    name: gcr.io/cloud-builders/docker
    args: ['rm', '-f', 'postgres']
    waitFor: ['stop-e2e-stack']

  # ---------------------------------------------------------------------------
  # 12. Fail the build if any deferred test stage failed
  # ---------------------------------------------------------------------------
  - id: assert-ci-status
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail

        sh scripts/ci-stage-status.sh assert /workspace infra/ci/e2e-stage-results.tsv
    waitFor: ['stop-e2e-stack', 'stop-postgres', 'frontend-test', 'frontend-audit', 'build-api-image', 'build-edge-image', 'export-e2e-artifacts']


timeout: 14400s   # 240 minutes — playwright-e2e can run ~120m on 1 worker; leaves headroom for retries and slower tail tests

artifacts:
  objects:
    location: 'gs://${PROJECT_ID}-build-artifacts/ci/$BUILD_ID/'
    paths:
      - 'playwright-report-shard-1.tar.gz'
      - 'playwright-report-shard-2.tar.gz'
      - 'playwright-report-shard-3.tar.gz'
      - 'playwright-test-results-shard-1.tar.gz'
      - 'playwright-test-results-shard-2.tar.gz'
      - 'playwright-test-results-shard-3.tar.gz'
      - 'provider-agent-playwright-report.tar.gz'
      - 'provider-agent-playwright-test-results.tar.gz'
      - 'value-loop-matrix-artifacts/**'
      - 'resource-samples/**'
