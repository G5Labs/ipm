# =============================================================================
# Cloud Build — CI E2E Pipeline (g5-ci-e2e)
# =============================================================================
# One of the TWO parallel PR quality-gate pipelines (see also
# infra/ci/cloudbuild-ci-rust.yaml). Runs on every PR via GitHub trigger.
# This file owns the live E2E stack (runtime images, Postgres/OAuth
# stub, workers), the frontend gates whose node_modules the browser fixtures
# consume, Rust E2E, API smoke, and the Playwright lanes; the sibling file
# owns the compile/static/unit/integration/isolation lanes. Partition
# contract: .semlift/specs/software_architecture/integration-stack/cicd.semlift.md D23.
# Steps duplicated in both files (CI image, Postgres/migrator spine, Rust
# cache spine, setup-kvm-cloud-hypervisor, rust-release-artifacts) must stay
# byte-identical except for the documented lane-specific deltas
# (cancel-stale-pr-builds expected-trigger env line — the body delegates to
# scripts/cancel-stale-ci-builds.sh — and
# this file's rust-release-artifacts XFS fallback, which fails closed —
# build-rust-xfs-orchestrator-image lives only in the Rust file; cicd D23).
#
# NOTE: rust-e2e here waits on
# [wait-workers, wait-rust-e2e-workers, e2e-rust-prime, stage-rust-e2e-node].
# The former rust-xfs-orchestrator edge (#973) serialized two CPU-heavy lanes
# on ONE shared VM; the lanes now run in separate builds on separate VMs. The
# Node staging edge supplies the runtime for the real Claude/Codex adapter E2E.
# The Rust and value-loop lanes use their own orgs and hosts and can overlap
# the browser chain (cicd D30 + D31 + D32):
#   - rust-e2e: dedicated org g5labs-re + host g5d-host-re-1 + stateless API
#     replica g5-api-re (D31 — the browser chain cold-restarts g5-api, so the
#     Rust lanes must not depend on the main API process);
#   - value-loop receipt lane: dedicated org g5labs-vl + host g5d-host-vl-1
#     (D30), its runtime also pointed at g5-api-re;
#   - provider-agent browser lane: dedicated org g5labs-pa + host
#     g5d-host-pa-1 + stateless API replica g5-api-pa + edge g5-test-client-pa
#     (D32 as amended by deployment g5.quality.delivery.ci.provider-agent-overlap:
#     chat-restart-continuity `docker restart`s the lane's API container, so
#     the lane can only overlap the broad shards once it stops sharing their
#     g5-api); its already env-parameterized specs (TEST_ORG/VITE_E2E_ORG +
#     VITE_E2E_SELECTED_ORG + E2E_BASE_URL/E2E_API_URL/E2E_API_CONTAINER) run
#     CONCURRENTLY with the broad shards and only the receipt tail waits for
#     the shard reports;
#   - the broad browser chain: the ORIGINAL org/stack (g5labs, g5-api,
#     g5-test-client, g5d-host-1) byte-identical so no spec changes.
# Receipt collision control is per-lane results files merged at finalize
# (value-loop owns selector-results.jsonl; the browser chain owns
# selector-results-playwright.jsonl), replacing the old fixtures→value-loop
# graph edge. Rollback: _G5_CI_RUST_E2E_ISOLATED='false' re-serializes the
# browser chain in-step behind the Rust-lane completion markers (waitFor
# cannot branch on substitutions). A background resource-sampler step records
# the RAM/CPU envelope of the overlap; its artifact is the canary acceptance
# evidence for dropping the rollback substitution (cicd D31).
#
# Runs on the Terraform-managed private Cloud Build WorkerPool, which is
# currently provisioned as c3-highcpu-22 in us-central1 (dev.tfvars ci_worker_machine_type). This is a
# capacity-routing choice only; keep the same gates and assertions.
#
# Phase graph:
#   [cancel-stale-pr-builds]  (best-effort, independent)
#   [self-hosted-release-assets-contract]  (hermetic packaging gate)
#   [migration-version-uniqueness + migration-checksums] → [db-migrate]
#   [postgres] → [wait-pg] → [db-migrate] → [runtime roles] → [db-migrate-e2e]
#   [verify-rust-target-cache] → [cargo-fetch] → [rust-target-prime]
#        └→ [rust-release-artifacts] → [build-api-image ← api-runtime-shell]
#                                    → [build-worker-image ← worker-runtime-shell]
#                                    → [e2e-rust-prime] (lean g5d + g5-e2e compile,
#                                         committed as g5-e2e-rust-lane; cicd D24)
#   [stage-rust-e2e-node]  (independent root; pinned Node runtime)
#   [frontend-install] → [frontend-lint] | [frontend-build] | [frontend-test] | [frontend-audit]
#        (one npm ci; the four consumers run in parallel on the shared tree)
#   [frontend-build] → [build-edge-image] ; [frontend-audit] → [assert-ci-status]
#   [build-playwright-runner-image] → [plan-playwright-shards]
#   [build-oauth-stub] → [start-oauth-stub]
#   [resource-sampler] (independent background monitor; stops on teardown marker)
#   [start-g5-api ← api image + oauth + e2e DB] → [start-client] → [wait-e2e-stack]
#     → [seed-ci-org] → [start-workers ← worker image + kvm] → [wait-workers]
#        ├→ [seed-e2e-fixtures ← wait-rust-e2e-workers] ⇢ ready marker
#        │      ⇢ [rust-e2e execution]
#        ├→ [rust-e2e ← wait-rust-e2e-workers + e2e-rust-prime + staged Node]
#        │      (primed lane image; dedicated org g5labs-re via g5-api-re,
#        │       CONCURRENT with the browser chain; cicd D31)
#        └→ [seed-playwright-workspace] → [seed-playwright-fixtures
#               ← frontend-test + seed-rust-e2e-org]
#             → [playwright-e2e shards 1..3 ← plan-playwright-shards]
#           [provider-agent-playwright-e2e ← seed-playwright-fixtures +
#                seed-pa-workspace + start-pa-client + plan-playwright-shards]
#                (dedicated org g5labs-pa/host g5d-host-pa-1/API g5-api-pa/
#                edge g5-test-client-pa, CONCURRENT with the broad shards; its
#                receipt tail polls the shard markers in-step; cicd D32 +
#                deployment g5.quality.delivery.ci.provider-agent-overlap)
#           [api-smoke] runs independently after the shared fixture seed
#   [seed-rust-e2e-org] → [seed-pa-org]
#        → [start-pa-worker ← start-workers + start-pa-api] → [wait-pa-workers]
#        → [seed-pa-workspace]
#   [start-pa-api ← api image + oauth + e2e DB] → [start-pa-client ← edge image]
#        (dedicated provider-agent org/host/API replica/edge; cicd D32)
#   [seed-ci-org] → [seed-value-loop-org] → [start-value-loop-worker ←
#        start-workers (staged runtime volume) + start-rust-e2e-api]
#     → [wait-value-loop-workers]
#     → [value-loop-rust-api-profiles ← rust-e2e + e2e-rust-prime + staged Node + kvm]
#        (dedicated org/host, AFTER rust-e2e so g5-api-re is not dual-loaded; cicd D30/D35)
#   [seed-value-loop-org] → [seed-rust-e2e-org] ; [start-rust-e2e-api ← api
#        image + oauth + e2e DB] → [start-rust-e2e-worker ←
#        seed-rust-e2e-org + start-workers] → [wait-rust-e2e-workers]
#        (dedicated rust-e2e org/host/API replica; cicd D31)
#
# Compile-time: All Rust compile steps use SQLX_OFFLINE=true (offline cache)
# for sqlx::query!() macro validation — no live DB needed at compile time.
# Runtime: Test steps that execute against the DB also set DATABASE_URL for
# runtime connections (SQLX_OFFLINE takes precedence at compile time).
#
# Trigger (created by Terraform cloudbuild module):
#   - Event: Pull Request (branch ^.*$; PR-only — no push-to-main trigger)
#   - Config: infra/ci/cloudbuild-ci-e2e.yaml
#   - Pool:   supplied by the environment-specific trigger as _POOL
#   - Machine: c3-highcpu-22 (defined by the WorkerPool)
#
# The substitutions block is kept identical in both CI files so shared steps
# stay byte-identical; keys used only by the sibling file are inert defaults.
# =============================================================================

options:
  logging: CLOUD_LOGGING_ONLY
  dynamic_substitutions: true
  # Event-derived keys (_PR_NUMBER, _HEAD_BRANCH, _HEAD_REPO_URL) are used but
  # deliberately NOT declared below — a config-declared default MASKS the
  # trigger event's value (#1328; cicd D18). ALLOW_LOOSE keeps manual
  # `gcloud builds submit` runs working by rendering absent keys empty
  # (triggered builds already default to ALLOW_LOOSE).
  substitution_option: 'ALLOW_LOOSE'
  pool:
    name: ${_POOL}

substitutions:
  _POOL: projects/${PROJECT_ID}/locations/us-central1/workerPools/g5-ci-pool
  _AR_REGION: us-central1
  _CI_REPOSITORY: g5-ci
  _CI_IMAGE: g5-ci-builder
  _NODE_VERSION: '22'
  _PG_IMAGE: 'pgvector/pgvector:pg17'
  _PG_MAX_CONNECTIONS: '400'
  _G5_CI_INTEGRATION_JOBS: ''
  _G5_CI_INTEGRATION_TEMPLATE_DB: g5_test_template
  _G5_CI_G5D_INTEGRATION_JOBS: ''
  _G5_CI_CARGO_INCREMENTAL: '0'
  _G5_CI_RUSTC_WRAPPER: ''
  # CI-speed experiment (b484d078): GCS-backed sccache for the release compile.
  _G5_CI_SCCACHE_GCS_BUCKET: '${PROJECT_ID}-build-artifacts'
  _G5_CI_SCCACHE_GCS_PREFIX: 'sccache-experiment/release'
  _G5_CI_RUST_TARGET_PRIME: 'false'
  _G5_CI_NEXTEST_ARCHIVE: 'false'
  _G5_CI_RUST_XFS_ORCHESTRATOR: 'true'
  # Coverage instrumentation is memory-heavy; keep the XFS prime at half of
  # the c3-highcpu-22 worker's vCPU count instead of oversubscribing Cargo.
  _G5_CI_RUST_XFS_BUILD_JOBS: '11'
  # Release optimization/linking is memory-heavy, but a single Cargo job also
  # starves rustc's codegen jobserver: with a 99.5% sccache hit rate the
  # release step still took 5m34s (build bb7bcffa) because the ~120
  # non-cacheable bin/link units ran one at a time. The step already waits
  # behind the frontend and runtime-image peaks (cicd D24 / #1983), so four
  # jobs run with nothing else heavy on the worker; the resource-sampler
  # summary records the actual envelope. This changes scheduling, not the
  # checked artifact surface.
  _G5_CI_RELEASE_BUILD_JOBS: '4'
  _G5_CI_RUST_XFS_SIZE_GB: '120'
  # E2E lean Rust prime (cicd D24): compile g5d + g5-e2e once into a committed
  # lane image off the critical path. Inert in the Rust file.
  _G5_CI_E2E_RUST_PRIME: 'true'
  # Value-loop lane isolation (cicd D30): dedicated org + single-slot host so
  # the receipt lane runs concurrently with rust-e2e. 'false' re-serializes the
  # lane behind rust-e2e's completion marker against the shared org/host.
  # Inert in the Rust file.
  _G5_CI_VALUE_LOOP_ISOLATED: 'true'
  # Rust-e2e lane isolation (cicd D31): dedicated org + host + stateless API
  # replica so the BROWSER chain runs concurrently with both Rust lanes.
  # 'false' no-ops the dedicated steps and re-serializes the browser chain
  # in-step behind the Rust-lane completion markers. Retain until the PR
  # canary runs prove the RAM envelope via the resource-sampler artifact.
  # Inert in the Rust file.
  _G5_CI_RUST_E2E_ISOLATED: 'true'
  # Provider-agent browser-lane isolation (cicd D32 + deployment
  # g5.quality.delivery.ci.provider-agent-overlap): dedicated org + host +
  # API replica + edge so the ~17-min one-worker provider-agent lane overlaps
  # the broad Playwright shards instead of serializing behind them. 'false'
  # no-ops the dedicated steps and re-serializes provider-agent behind the
  # broad shards' completion markers in-step on the shared stack.
  # The overlap was first held back over a feared peak-memory window; the
  # resource-sampler summary of the serialized layout (build a0fe78d3) showed
  # 34 GB of the 44 GB pool still free at the worst sample, so the sampler
  # now records the overlapped envelope instead. Inert in the Rust file.
  _G5_CI_PROVIDER_AGENT_ISOLATED: 'true'
  _RUST_LANE_IMAGE: g5-ci-rust-target-prime
  _RUST_TARGET_CACHE_IMAGE: ''
  _RUST_XFS_ORCHESTRATOR_IMAGE: g5-rust-xfs-orchestrator
  # Codex CLI pin: single-sourced from scripts/codex-cli-version (#1342 D-13);
  # the staging scripts default from that file, so no substitution is needed.
  _G5_E2E_STACK_THREADS: ''
  # The seeded browser workspace remains running while every shard worker owns
  # a clone. Experiment (g5.quality.delivery.ci.browser-shards): three shards
  # of two workers on a fourteen-slot g5d-host-1 of one-vCPU guests.
  # Hypothesis: the shard wall (28 min at two shards x two workers) is bound by
  # VM slots, and slots by cpus_per_vm x slots <= 22 vCPUs; one-vCPU guests
  # admit the seed + six source/fork pairs (1 + 2*3*2 = 13 < 14), so three
  # shards should finish in ~19-20 min; the capacity contract checks that sum.
  _PLAYWRIGHT_WORKERS: '2'
  # Provider-agent lane fan-out (deployment
  # g5.quality.delivery.ci.provider-agent-parallel): workers for the
  # parallel-safe part of chat-restart-continuity and native-requests, whose
  # tests each clone and boot their own VM; the one API-restart test still
  # runs alone (scripts/ci-run-playwright-selector.sh). g5d-host-pa-1 carries
  # 5 slots (running seed 1 + workers + lifecycle overlap);
  # test_cloudbuild_waitfor_order.py pins seed + workers < slots. '1' restores
  # the serial lane.
  _PA_PLAYWRIGHT_WORKERS: '2'
  _PLAYWRIGHT_RUNNER_IMAGE: g5-playwright-runner
  _PLAYWRIGHT_BASE_IMAGE: 'mcr.microsoft.com/playwright:v1.58.2-noble'
  _PLAYWRIGHT_E2E_WORKSPACE: e2e-playwright
  _PLAYWRIGHT_E2E_REPO_PREFIX: e2e-playwright
  _E2E_DB_NAME: g5_e2e
  _G5_DOCKER_CACHE_DISABLE: 'false'
  # NEVER declare _PR_NUMBER, _HEAD_BRANCH, or _HEAD_REPO_URL here: a config
  # declaration MASKS the trigger event's derived value (a `_PR_NUMBER: ''`
  # default added 2026-05-27 silently killed stale-build cancellation and the
  # PR result comment until #1328). Guard-tested; see cicd D18.
  # E2E runtime substrate: one `g5d host` container with /dev/kvm booting real
  # workspace VMs. The lane requires the
  # nested-virt pool and fails closed when /dev/kvm is absent. This branch runs
  # the microvm lane with the IN-VM bootstrap path (microVM-with-identity): the
  # in-VM worker keeps the BORROWED host identity and drives its own task
  # lifecycle against g5-api.
  _E2E_WORKER: 'workspace-vm'


# =============================================================================
# Steps
# =============================================================================
steps:
  # Rebases can introduce same-numbered SQLx migrations under different
  # filenames without a Git path conflict. Fail with both paths before
  # db-migrate reaches SQLx, instead of an opaque _sqlx_migrations_pkey error
  # (cicd D34; orchestration_scripts D23).
  - id: migration-version-uniqueness
    name: gcr.io/cloud-builders/gcloud
    dir: .
    entrypoint: bash
    args: ['./scripts/check-migration-version-uniqueness.sh']
    waitFor: ['-']

  # Applied migration bytes are immutable, including comment-only edits.
  - id: migration-checksums
    name: gcr.io/cloud-builders/gcloud
    dir: .
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        python3 -m unittest discover -s scripts -p test_migration_checksums.py
        python3 -m unittest discover -s scripts -p test_migration_runner_ci.py
        python3 scripts/check-migration-checksums.py
    waitFor: ['-']

  # ---------------------------------------------------------------------------
  # 0. Best-effort stale PR build cancellation
  # ---------------------------------------------------------------------------
  # Cloud Build does not provide GitHub Actions-style cancel-in-progress groups
  # for PR triggers. Fire-and-forget: request cancellation for older
  # in-progress builds of this trigger on the same change stream (PR number
  # when the event carries one, else head repo + branch — live PR events have
  # been observed with an EMPTY _PR_NUMBER, #1328), without blocking the
  # current build on those builds reaching a terminal state. The body is the
  # shared scripts/cancel-stale-ci-builds.sh (cicd D18); only the
  # G5_CI_EXPECTED_TRIGGER line differs between the two CI files.
  # ---------------------------------------------------------------------------
  - id: cancel-stale-pr-builds
    name: gcr.io/cloud-builders/gcloud
    entrypoint: bash
    args:
      - -c
      - |
        G5_CI_EXPECTED_TRIGGER="g5-ci-e2e" \
        G5_CI_TRIGGER_NAME="$TRIGGER_NAME" \
        G5_CI_BUILD_ID="$BUILD_ID" \
        G5_CI_COMMIT_SHA="$COMMIT_SHA" \
        G5_CI_PR_NUMBER="${_PR_NUMBER}" \
        G5_CI_HEAD_BRANCH="${_HEAD_BRANCH}" \
        G5_CI_HEAD_REPO_URL="${_HEAD_REPO_URL}" \
        G5_CI_REGION="${_AR_REGION}" \
        G5_CI_PROJECT="$PROJECT_ID" \
        bash scripts/cancel-stale-ci-builds.sh
    waitFor: ['-']

  # ---------------------------------------------------------------------------
  # 0.1. Public self-hosted release-assets packaging contract
  # ---------------------------------------------------------------------------
  # Keep this cheap, hermetic gate ahead of release tagging. It catches bundle
  # source omissions (including worker-runtime support files) before the manual
  # publication workflow is asked to package an immutable release tag.
  # ---------------------------------------------------------------------------
  - id: self-hosted-release-assets-contract
    name: python:3.12-bookworm
    dir: .
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail

        ASSETS_DIR=$$(mktemp -d)
        cleanup() {
          rm -rf "$${ASSETS_DIR}"
        }
        trap cleanup EXIT

        G5_RELEASE_TAG=v9.9.9 \
          bash scripts/package-self-hosted-release-assets.sh "$${ASSETS_DIR}"
        (
          cd "$${ASSETS_DIR}"
          sha256sum -c SHA256SUMS
        )
        tar -tzf "$${ASSETS_DIR}/g5-self-hosted-bundle.tar.gz" | \
          grep -Fx './infra/packer/g5-worker/scripts/lib/download-with-retry.sh'
    waitFor: ['-']

  # ---------------------------------------------------------------------------
  # 0a. Pull or build CI builder image
  # ---------------------------------------------------------------------------
  # The image is tagged with a hash of the CI Dockerfile, toolchain scripts,
  # Rust manifests/build scripts, and SQLx offline cache. If the image already
  # exists in Artifact Registry, we pull it (~30s). If not, we build and push it
  # once on the configured Cloud Build pool.
  # ---------------------------------------------------------------------------
  - id: build-ci-image
    name: gcr.io/cloud-builders/docker
    dir: .
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail

        # Content-hash tag: changes when the CI toolchain or warmed Rust
        # dependency graph changes.
        HASH=$$(
          {
            # Key the exact platform sources used by the cached CI image.
            printf '%s\n' \
              infra/docker/Dockerfile.ci-builder \
              infra/docker/Dockerfile.base \
              infra/docker/Dockerfile.base-rust \
              infra/docker/Dockerfile.base-rust-warm \
              scripts/build-cloud-hypervisor-runtime.sh \
              scripts/install-cloud-hypervisor-platform.sh \
              infra/guest/versions.env \
              infra/guest/kernel.config \
              infra/guest/init.c \
              infra/packer/g5-worker/scripts/58-install-passt.sh \
              infra/packer/g5-worker/scripts/lib/download-with-retry.sh \
              .cargo/config.toml \
              Cargo.toml \
              Cargo.lock
            find backend tests/e2e \
              -maxdepth 2 \
              \( -name Cargo.toml -o -name build.rs \) \
              -type f | sort
            # .sqlx is deliberately NOT a key input (deployment
            # g5.quality.delivery.ci.image-key): the baked copy only feeds the
            # image's warm-up compile, every CI step reads the checkout's
            # .sqlx, and a changed query recompiles only the crates it touches,
            # exactly like a source edit. Keying on it cost a 20-30 min rebuild
            # per lane for 6 of the 31 key-touching commits in 14 days.
          } | while read -r file; do
            sha256sum "$${file}"
          done | sha256sum | cut -c1-12
        )
        AR_IMAGE="${_AR_REGION}-docker.pkg.dev/$PROJECT_ID/${_CI_REPOSITORY}/${_CI_IMAGE}"
        TAGGED="$${AR_IMAGE}:$${HASH}"
        LATEST="$${AR_IMAGE}:latest"
        printf '%s\n' "$${HASH}" > /workspace/g5-ci-image-hash
        printf '%s\n' "$${AR_IMAGE}" > /workspace/g5-ci-image-repository

        # Try pulling the cached image
        if docker pull "$${TAGGED}" 2>/dev/null; then
          echo "CI image cache hit: $${TAGGED}"
          docker tag "$${TAGGED}" "${_CI_IMAGE}"
        else
          CACHE_FROM_ARGS=()
          if docker pull "$${LATEST}" 2>/dev/null; then
            echo "CI image exact cache miss; using latest layer cache seed: $${LATEST}"
            CACHE_FROM_ARGS+=(--cache-from "$${LATEST}")
          fi

          echo "CI image cache miss — building..."
          # Dockerfile.ci-builder is FROM g5/base-rust-warm:26.04 (docker_images
          # D20); build the common base + Rust + warm tiers locally first so the
          # leaf build resolves its base ARG default (D5: dev base tags are
          # local-only). Only on a cache miss — a hit never runs docker build.
          # base and base-rust come from the content-keyed CI mirror when
          # published (deployment g5.quality.delivery.ci.base-image-mirror);
          # the workspace-warmed tier is rebuilt locally and never mirrored.
          G5_BASE_IMAGE_REGISTRY="${_AR_REGION}-docker.pkg.dev/$PROJECT_ID/${_CI_REPOSITORY}" \
          G5_BASE_IMAGE_MIRROR_TIERS="base base-rust" \
            bash scripts/ensure-base-images.sh base base-rust base-rust-warm
          docker build \
            "$${CACHE_FROM_ARGS[@]}" \
            -t "${_CI_IMAGE}" \
            -f infra/docker/Dockerfile.ci-builder \
            .

          # Push both :hash and :latest for future runs
          docker tag "${_CI_IMAGE}" "$${TAGGED}"
          docker tag "${_CI_IMAGE}" "$${LATEST}"
          docker push "$${TAGGED}"
          docker push "$${LATEST}"
          echo "Pushed CI image: $${TAGGED}"
        fi
    waitFor: ['-']

  # ---------------------------------------------------------------------------
  # 0a.1. Pull or build Playwright browser runner image
  # ---------------------------------------------------------------------------
  # The runner bakes browser system dependencies, Playwright browsers, and the
  # client package-lock's node_modules so the hot browser E2E lane does not run
  # npm ci or npx playwright install on every PR.
  # ---------------------------------------------------------------------------
  - id: build-playwright-runner-image
    name: gcr.io/cloud-builders/docker
    dir: .
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail

        BASE_IMAGE="${_PLAYWRIGHT_BASE_IMAGE}"
        RUNNER_IMAGE="${_PLAYWRIGHT_RUNNER_IMAGE}"

        HASH=$$(
          {
            printf '%s\n' "$${BASE_IMAGE}" | sha256sum
            printf '%s\n' \
              infra/docker/Dockerfile.playwright-runner \
              frontend/package.json \
              frontend/package-lock.json | while read -r file; do
                sha256sum "$${file}"
              done
          } | sha256sum | cut -c1-12
        )

        AR_IMAGE="${_AR_REGION}-docker.pkg.dev/$PROJECT_ID/${_CI_REPOSITORY}/$${RUNNER_IMAGE}"
        TAGGED="$${AR_IMAGE}:$${HASH}"
        LATEST="$${AR_IMAGE}:latest"

        if docker pull "$${TAGGED}" 2>/dev/null; then
          echo "Playwright runner image cache hit: $${TAGGED}"
          docker tag "$${TAGGED}" "$${RUNNER_IMAGE}"
        else
          echo "Playwright runner image cache miss — building..."
          docker build \
            --build-arg PLAYWRIGHT_BASE_IMAGE="$${BASE_IMAGE}" \
            -t "$${RUNNER_IMAGE}" \
            -f infra/docker/Dockerfile.playwright-runner \
            .

          docker tag "$${RUNNER_IMAGE}" "$${TAGGED}"
          docker tag "$${RUNNER_IMAGE}" "$${LATEST}"
          docker push "$${TAGGED}"
          docker push "$${LATEST}"
          echo "Pushed Playwright runner image: $${TAGGED}"
        fi
    waitFor: ['-']

  # ---------------------------------------------------------------------------
  # 0c. Background resource sampler (cicd D31)
  # ---------------------------------------------------------------------------
  # Measures the RAM/CPU envelope of the three-lane overlap on the shared
  # c3-highcpu-22 VM. waitFor ['-'] so it observes the whole build; terminates
  # on the /workspace/resource-sampler-stop marker touched by stop-e2e-stack
  # (hard 150-min cap) and ALWAYS exits 0 — the sampler is evidence, never a
  # gate. Step containers share the host kernel, so /proc/meminfo and
  # /proc/loadavg report the whole VM while docker stats reports per-container
  # usage. The CSV + summary are uploaded by export-e2e-artifacts and are the
  # canary acceptance evidence for dropping _G5_CI_RUST_E2E_ISOLATED's
  # rollback substitution: min MemAvailable comfortably positive, no swap
  # growth, no oom-kill markers, no OOMKilled container state.
  # ---------------------------------------------------------------------------
  - id: resource-sampler
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -c
      - |
        set -uo pipefail
        OUT_DIR=/workspace/resource-samples
        mkdir -p "$$OUT_DIR"
        CSV="$$OUT_DIR/samples.csv"
        STATS="$$OUT_DIR/container-stats.csv"
        SUMMARY="$$OUT_DIR/summary.txt"
        # Docker lifecycle event stream: pause/unpause/oom/kill/die with
        # timestamps. This is the only artifact that can attribute a transient
        # cross-lane pause collision (canary bfa035a6 hit "already paused"
        # with no host showing a >=4s heartbeat gap — a momentary foreign
        # pause that per-container logs cannot capture).
        docker events \
          --filter type=container \
          --filter event=pause --filter event=unpause \
          --filter event=oom --filter event=kill --filter event=die \
          --format '{{.Time}} {{.Action}} {{.Actor.Attributes.name}}' \
          > "$$OUT_DIR/docker-events.log" 2>&1 &
        EVENTS_PID=$$!
        echo "ts,mem_total_kib,mem_available_kib,swap_total_kib,swap_free_kib,load1" > "$$CSV"
        echo "ts,container,mem_usage,cpu_pct" > "$$STATS"
        MIN_AVAIL_KIB=-1
        MIN_SWAP_FREE_KIB=-1
        MAX_LOAD1="0.00"
        START=$$(date +%s)
        while true; do
          NOW=$$(date -u +%Y-%m-%dT%H:%M:%SZ)
          MEM_AVAIL=$$(awk '/^MemAvailable:/{print $$2}' /proc/meminfo)
          SWAP_FREE=$$(awk '/^SwapFree:/{print $$2}' /proc/meminfo)
          LOAD1=$$(awk '{print $$1}' /proc/loadavg)
          awk -v now="$$NOW" '/^MemTotal:/{t=$$2} /^MemAvailable:/{a=$$2} /^SwapTotal:/{st=$$2} /^SwapFree:/{sf=$$2} END{print now","t","a","st","sf}' /proc/meminfo | sed "s/$$/,$$LOAD1/" >> "$$CSV"
          if [[ "$$MIN_AVAIL_KIB" -lt 0 || "$$MEM_AVAIL" -lt "$$MIN_AVAIL_KIB" ]]; then
            MIN_AVAIL_KIB="$$MEM_AVAIL"
          fi
          if [[ "$$MIN_SWAP_FREE_KIB" -lt 0 || "$$SWAP_FREE" -lt "$$MIN_SWAP_FREE_KIB" ]]; then
            MIN_SWAP_FREE_KIB="$$SWAP_FREE"
          fi
          if awk -v a="$$LOAD1" -v b="$$MAX_LOAD1" 'BEGIN{exit !(a>b)}'; then
            MAX_LOAD1="$$LOAD1"
          fi
          docker stats --no-stream --format "$$NOW,{{.Name}},{{.MemUsage}},{{.CPUPerc}}" >> "$$STATS" 2>/dev/null || true
          if [[ -f /workspace/resource-sampler-stop ]]; then
            echo "resource-sampler: stop marker observed"
            break
          fi
          if (( $$(date +%s) - START > 9000 )); then
            echo "resource-sampler: hard 150-min cap reached"
            break
          fi
          sleep 10
        done
        {
          echo "resource-sampler summary ($$(date -u +%Y-%m-%dT%H:%M:%SZ))"
          echo "mem_total_kib=$$(awk '/^MemTotal:/{print $$2}' /proc/meminfo)"
          echo "min_mem_available_kib=$$MIN_AVAIL_KIB"
          echo "min_mem_available_mib=$$(( MIN_AVAIL_KIB / 1024 ))"
          echo "min_swap_free_kib=$$MIN_SWAP_FREE_KIB"
          # SwapTotal disambiguates "no swap configured" (SwapFree=0 forever)
          # from "swap fully consumed" — the acceptance rule reads this.
          echo "swap_total_kib=$$(awk '/^SwapTotal:/{print $$2}' /proc/meminfo)"
          echo "max_load1=$$MAX_LOAD1"
          echo "--- containers reporting OOMKilled=true ---"
          docker ps -aq | xargs -r docker inspect --format '{{.Name}} OOMKilled={{.State.OOMKilled}}' 2>/dev/null | grep 'OOMKilled=true' || echo "(none)"
          echo "--- kernel oom markers (best effort) ---"
          # Distinguish "readable, no markers" (acceptance-provable) from
          # "unreadable" (markers NOT proven absent) — pipefail would otherwise
          # collapse both states into one fallback string.
          if DMESG_OUT="$$(dmesg 2>/dev/null)"; then
            printf '%s\n' "$$DMESG_OUT" | grep -i -E 'out of memory|oom-kill|oom_kill' | tail -20 || echo "(dmesg readable; no oom markers)"
          else
            echo "(dmesg unreadable — oom markers NOT proven absent)"
          fi
        } | tee "$$SUMMARY"
        kill "$$EVENTS_PID" 2>/dev/null || true
        exit 0
    waitFor: ['-']

  # ---------------------------------------------------------------------------
  # 0b. Start Postgres in the background (container-based sidecar)
  # ---------------------------------------------------------------------------
  - id: start-postgres
    name: gcr.io/cloud-builders/docker
    args:
      - run
      - -d
      - --name=postgres
      - --network=cloudbuild
      # Docker's 64 MB /dev/shm default fails Postgres parallel queries under
      # load (SQLSTATE 53100); tmpfs only consumes what is used.
      - --shm-size=1g
      - -e=POSTGRES_DB=g5_test
      - -e=POSTGRES_USER=g5
      - -e=POSTGRES_PASSWORD=g5_test
      - -p=5432:5432
      - ${_PG_IMAGE}
      - -c
      - max_connections=${_PG_MAX_CONNECTIONS}
      - -c
      - fsync=off
      - -c
      - synchronous_commit=off
      - -c
      - full_page_writes=off
    waitFor: ['-']

  - id: wait-postgres
    name: ${_PG_IMAGE}
    entrypoint: bash
    args:
      - -c
      - |
        for i in $(seq 1 30); do
          pg_isready -h postgres -p 5432 -U g5 -d g5_test 2>/dev/null && exit 0
          sleep 2
        done
        echo "Postgres failed to start" && exit 1
    waitFor: ['start-postgres']

  # ---------------------------------------------------------------------------
  # 0c. Provision a NON-SUPERUSER migrator that mirrors the Cloud SQL admin role
  # ---------------------------------------------------------------------------
  # CD runs migrations as the Cloud SQL admin (`G5_ADMIN_DATABASE_URL`), which has
  # CREATEROLE / CREATEDB but is NEITHER a PostgreSQL superuser NOR BYPASSRLS
  # (verified on the QA instance, 2026-09-22). A superuser can `SET ROLE` to any
  # role, reassign ownership implicitly and read every row of a FORCE ROW LEVEL
  # SECURITY table, so running CI migrations as the stock-image superuser `g5`
  # silently masks two classes of migration bug: one that needs an explicit
  # role membership to `ALTER ... OWNER TO` / `SET ROLE` (fails CD with
  # `must be able to SET ROLE "<role>"`), and one whose UPDATE/INSERT/DELETE
  # targets a FORCE RLS tenant table and therefore sees zero rows without an
  # org context (migration 008 on QA: "constraint ... is violated by some row").
  #
  # To catch both classes before CD, the primary `db-migrate` step below runs as
  # `g5_migrator`, provisioned by scripts/ci-provision-migrator.sh (as superuser)
  # to match the Cloud SQL admin: NOSUPERUSER CREATEDB CREATEROLE NOBYPASSRLS,
  # extensions and the BYPASSRLS `authz_lookup_definer` role pre-created, and
  # membership in authz_ctx_writer / authz_writer (the out-of-band grant CD's
  # bootstrap-runtime-db-users init container makes before the baseline runs).
  # A fresh CI database still cannot prove a data migration against existing
  # rows; required Rust integration tests exercise historical populated
  # upgrades through g5-db-migrate, including guard refusal and repeat no-op.
  # The provisioning SQL lives in a
  # script file, not inline YAML, so its PL/pgSQL dollar-quoting is not mangled
  # by Cloud Build `$$` -> `$` substitution.
  - id: db-provision-ci-migrator
    name: ${_PG_IMAGE}
    dir: .
    entrypoint: bash
    args:
      - ./scripts/ci-provision-migrator.sh
    env:
      - PGHOST=postgres
      - PGPORT=5432
      - PGUSER=g5
      - PGPASSWORD=g5_test
      - PGDATABASE=g5_test
    waitFor: ['wait-postgres']

  # ---------------------------------------------------------------------------
  # 1. Verify Docker-baked Rust target cache
  # ---------------------------------------------------------------------------
  # The CI builder image bakes a dependency-heavy Cargo target baseline under
  # /opt/g5-rust-target-cache/target. Cloud Build's source checkout mount does
  # not hide that path, and each build step gets its own Docker overlay upper
  # layer, so parallel Rust lanes write copy-on-write target state without
  # sharing Cargo artifact-directory locks.
  - id: verify-rust-target-cache
    name: ${_CI_IMAGE}
    dir: .
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        : "$${CARGO_TARGET_DIR:?CARGO_TARGET_DIR must be baked into the CI image}"
        test -d "$${CARGO_TARGET_DIR}"
        echo "Docker-baked Rust target cache: $${CARGO_TARGET_DIR}"
        du -sh "$${CARGO_TARGET_DIR}"
    waitFor: ['build-ci-image']

  # ---------------------------------------------------------------------------
  # 1b. Cargo fetch (validate baked Cargo cache before Rust gates)
  # ---------------------------------------------------------------------------
  # Keep CARGO_HOME on the same baked image path used by Dockerfile.ci-builder's
  # warmup. Cloud Build mounts /workspace over the image layer, so a Cargo home
  # under /workspace would hide prewarmed registry sources and change sccache's
  # path-sensitive Rust cache keys.
  - id: cargo-fetch
    name: ${_CI_IMAGE}
    dir: .
    args: ['cargo', 'fetch']
    env:
      - CARGO_HOME=/opt/g5-cargo-home
    waitFor: ['verify-rust-target-cache']

  # Build the current checkout's production migration entry point. Offline
  # SQLx compilation needs no migrated DB, so this cannot depend on db-migrate.
  # Publish only the executable; each CI step retains its own Cargo COW layer.
  - id: build-db-migration-runner
    name: ${_CI_IMAGE}
    dir: .
    entrypoint: bash
    args: ['./scripts/build-ci-migration-runner.sh']
    env:
      - CARGO_HOME=/opt/g5-cargo-home
      - SQLX_OFFLINE=true
      - CARGO_INCREMENTAL=${_G5_CI_CARGO_INCREMENTAL}
      - RUSTC_WRAPPER=${_G5_CI_RUSTC_WRAPPER}
    waitFor: ['cargo-fetch']

  # ---------------------------------------------------------------------------
  # 1c. Compile current Rust checkout into a per-build Docker COW target layer
  # ---------------------------------------------------------------------------
  # The base CI image only contains dependency-heavy/dummy-source target state.
  # This step compiles the real checkout once into /opt/g5-rust-target-cache and
  # commits that container as a local image. Rust lanes then start from that
  # image, each with an independent Docker overlay upper layer, so they reuse
  # the current-build artifacts without sharing Cargo target-directory locks.
  - id: rust-target-prime
    name: gcr.io/cloud-builders/docker
    dir: .
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail

        RUST_LANE_IMAGE="${_RUST_LANE_IMAGE}"
        TARGET_PRIME="${_G5_CI_RUST_TARGET_PRIME}"

        if [[ ! "$${TARGET_PRIME}" =~ ^(1|true|TRUE|yes|YES)$ ]]; then
          echo "Rust target-prime disabled; tagging ${_CI_IMAGE} as $${RUST_LANE_IMAGE}"
          docker tag "${_CI_IMAGE}" "$${RUST_LANE_IMAGE}"
          exit 0
        fi

        CONTAINER="g5-rust-target-prime-$BUILD_ID"
        docker rm -f "$${CONTAINER}" >/dev/null 2>&1 || true
        cleanup_prime_container() {
          docker rm -f "$${CONTAINER}" >/dev/null 2>&1 || true
        }
        trap cleanup_prime_container EXIT

        docker run \
          --name "$${CONTAINER}" \
          -v /workspace:/workspace \
          -w /workspace \
          -e CARGO_HOME=/opt/g5-cargo-home \
          -e CARGO_BUILD_JOBS=44 \
          -e CARGO_INCREMENTAL=${_G5_CI_CARGO_INCREMENTAL} \
          -e RUSTC_WRAPPER=${_G5_CI_RUSTC_WRAPPER} \
          -e SQLX_OFFLINE=true \
          -e DATABASE_URL=postgres://g5:g5_test@postgres:5432/g5_test \
          -e TEST_DATABASE_URL=postgres://g5:g5_test@postgres:5432/g5_test \
          "${_CI_IMAGE}" \
          bash -lc '
            set -euo pipefail
            export PATH="$${CARGO_HOME}/bin:$${PATH}"

            echo "=== Rust target-prime: cleaning dummy workspace artifacts ==="
            bash ./scripts/clean-baked-rust-workspace-artifacts.sh

            run_prime() {
              echo
              echo "=== Rust target-prime: $* ==="
              "$@"
            }

            run_prime cargo clippy --workspace --all-targets -- -D warnings
            (
              echo
              echo "=== Rust target-prime: cargo llvm-cov show-env --sh ==="
              eval "$$(cargo llvm-cov show-env --sh)"
              run_prime cargo nextest run \
                -p g5-contracts -p g5-auth -p g5-storage -p g5-semantic -p g5-scm -p g5-internal-api \
                -p g5-api-foundation -p g5-api-data -p g5-api-core -p g5-api-routes -p g5-api \
                -p g5d-foundation -p g5d-isolation -p g5d-agent -p g5d-host -p g5d-dispatch -p g5d \
                --lib --bins --all-features --no-run
              run_prime cargo nextest run \
                -p g5-api --test "*" --all-features --no-run
              run_prime cargo nextest run \
                -p g5d-dispatch -p g5d --test "*" --all-features --no-run
              run_prime cargo nextest run \
                -p g5d-isolation --lib --all-features -E "test(isolation)" --no-run
            )
            cargo test --workspace --exclude g5-e2e --doc -j1 || true
            run_prime cargo build -j"$${CARGO_BUILD_JOBS}" -p g5d
            run_prime cargo test -j"$${CARGO_BUILD_JOBS}" -p g5-e2e --no-run

            echo
            echo "=== Rust target-prime target size ==="
            du -sh "$${CARGO_TARGET_DIR}"
          '

        docker commit "$${CONTAINER}" "$${RUST_LANE_IMAGE}"
        echo "Committed Rust lane image: $${RUST_LANE_IMAGE}"
    waitFor: ['cargo-fetch']

  # Exercise the same greenfield ordering as Helm: the restricted runtime and
  # grant roles must be bootstrapped before the baseline migration can SET ROLE
  # while assigning SECURITY DEFINER ownership.
  - id: db-bootstrap-runtime-users
    name: ${_PG_IMAGE}
    dir: .
    entrypoint: bash
    args:
      - ./scripts/bootstrap-runtime-db-users.sh
    env:
      - PGHOST=postgres
      - PGPORT=5432
      - PGUSER=g5_migrator
      - PGPASSWORD=g5_test
      - PGDATABASE=g5_test
      - G5_RUNTIME_SYSTEM_DB_PASSWORD=g5_system_test
      - G5_RUNTIME_TENANT_DB_PASSWORD=g5_tenant_test
      - G5_AUTHZ_WRITER_DB_PASSWORD=g5_authz_test
    waitFor: ['db-provision-ci-migrator']

  # ---------------------------------------------------------------------------
  # 3b. Migrate ephemeral Postgres (needed by runtime tests + sqlx-check)
  # ---------------------------------------------------------------------------
  - id: db-migrate
    name: ${_CI_IMAGE}
    dir: .
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        # Match Helm's runner AND its non-superuser, non-BYPASSRLS role.
        # Raw SQLx bypasses row-visibility checks and cluster-role coordination.
        /workspace/.ci-migration-artifacts/g5-db-migrate
    env:
      - DATABASE_URL=postgres://g5_migrator:g5_test@postgres:5432/g5_test
      - G5_MIGRATION_SOURCE=/workspace/backend/g5-api/src/db/migrations
    waitFor: ['migration-version-uniqueness', 'migration-checksums', 'wait-postgres', 'build-db-migration-runner', 'db-bootstrap-runtime-users']

  - id: db-migrate-e2e
    name: ${_CI_IMAGE}
    dir: .
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail

        E2E_DB="${_E2E_DB_NAME}"
        if ! docker exec postgres psql -U g5 -d postgres -tAc "SELECT 1 FROM pg_database WHERE datname = '$${E2E_DB}'" | grep -q 1; then
          docker exec postgres createdb -U g5 "$${E2E_DB}"
        fi

        DATABASE_URL="postgres://g5:g5_test@postgres:5432/$${E2E_DB}" \
          /workspace/.ci-migration-artifacts/g5-db-migrate
    env:
      - G5_MIGRATION_SOURCE=/workspace/backend/g5-api/src/db/migrations
    waitFor: ['db-migrate']

  - id: db-bootstrap-runtime-users-e2e
    name: ${_PG_IMAGE}
    dir: .
    entrypoint: bash
    args:
      - ./scripts/bootstrap-runtime-db-users.sh
    env:
      - PGHOST=postgres
      - PGPORT=5432
      - PGUSER=g5
      - PGPASSWORD=g5_test
      - PGDATABASE=${_E2E_DB_NAME}
      - G5_RUNTIME_SYSTEM_DB_PASSWORD=g5_system_test
      - G5_RUNTIME_TENANT_DB_PASSWORD=g5_tenant_test
      - G5_AUTHZ_WRITER_DB_PASSWORD=g5_authz_test
    waitFor: ['db-migrate-e2e', 'db-bootstrap-runtime-users']

  # ===========================================================================
  # Phase: MicroVM / Isolation Tests
  # ===========================================================================
  # Private pool runs on N2 instances with nested virtualization.
  # /dev/kvm should be available. If not (e.g., running on default pool or
  # E2 for cost), the strict guest gate fails; process mode is never an automatic fallback.
  # ===========================================================================

  # ---------------------------------------------------------------------------
  # 7a. Verify KVM and the pinned Cloud Hypervisor platform
  # ---------------------------------------------------------------------------
  - id: setup-kvm-cloud-hypervisor
    name: ${_CI_IMAGE}
    dir: .
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail

        # --- KVM probe ---
        # The workspace-VM lane boots the VM inside a Docker child container via
        # `docker run --device=/dev/kvm` (the guaranteed KVM surface — see
        # smoke-cloud-hypervisor / start-workers). On some pool hosts the build-step
        # container does not expose /dev/kvm even though a --device child does, so
        # fall back to a Docker-child probe before declaring KVM unavailable.
        KVM_OK=0
        if [ -e /dev/kvm ]; then
          chmod 666 /dev/kvm 2>/dev/null || true
          echo "KVM: /dev/kvm present in the build step (nested virt enabled)"
          KVM_OK=1
        elif docker run --rm --device=/dev/kvm --entrypoint /bin/sh "${_CI_IMAGE}" -c 'test -e /dev/kvm' >/dev/null 2>&1; then
          echo "KVM: /dev/kvm reachable via a Docker child (--device=/dev/kvm)"
          KVM_OK=1
        else
          echo "KVM: /dev/kvm NOT available (neither build step nor Docker child) — strict guest gate will fail"
        fi
        echo "$$KVM_OK" > /workspace/kvm_available

        /opt/g5-host/bin/cloud-hypervisor --version
        test -s /opt/g5-host/boot/vmlinux
        test -s /opt/g5-host/boot/initramfs.cpio
    env:
      - CARGO_HOME=/opt/g5-cargo-home
    # NOTE (lane delta, cicd D23): no external VMM library volume
    # here — this build has no second consumer step, and Cloud Build rejects a
    # config whose named volume is used by fewer than two steps.
    waitFor: ['cargo-fetch']

  # ---------------------------------------------------------------------------
  # 7e. Stage the pinned Node runtime required by real provider-adapter E2E
  # ---------------------------------------------------------------------------
  # The Rust builder intentionally has no ambient Node installation. The
  # canonical-citation provider scenario starts a dedicated workspace VM whose
  # `codex` npm launcher runs on Node, so give that lane an explicit runtime
  # without broadening the shared Rust image or relying on an unpinned host.
  - id: stage-rust-e2e-node
    name: node:${_NODE_VERSION}-bookworm
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        NODE_BIN="$$(command -v node)"
        mkdir -p /workspace/g5-e2e-tools
        cp "$$NODE_BIN" /workspace/g5-e2e-tools/node
        chmod 0755 /workspace/g5-e2e-tools/node
        /workspace/g5-e2e-tools/node --version
    waitFor: ['-']

  # ---------------------------------------------------------------------------
  # 8. Frontend — one install, then lint / build / test / audit in parallel
  # ---------------------------------------------------------------------------
  # Speed-up experiment: the former lint → build → test chain reinstalled
  # node_modules three times (7.8 min on the critical path). One `npm ci` into
  # the shared /workspace/frontend tree now feeds four sibling steps.
  - id: frontend-install
    name: node:${_NODE_VERSION}-bookworm
    dir: frontend
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        # #621: clean install — `rm -rf` sidesteps the npm `ENOTEMPTY` rmdir bug
        # on a re-wiped tree; `set -e` fails the step loudly on a broken install
        # instead of falling through to a silent `npx` fallback. The consumers
        # below share this tree and must not reinstall it.
        rm -rf node_modules
        npm ci --prefer-offline
    volumes:
      - name: npm-cache
        path: /root/.npm
    waitFor: ['-']

  - id: frontend-lint
    name: node:${_NODE_VERSION}-bookworm
    dir: frontend
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        npm run lint
    waitFor: ['frontend-install']

  - id: frontend-build
    name: node:${_NODE_VERSION}-bookworm
    dir: frontend
    env:
      - VITE_G5_CI_WORKFLOW=true
      - VITE_G5_ENABLE_CLOUD_WORKSPACE_WORKFLOWS=true
      - VITE_G5_ENABLE_INTENT_LOG_VIEWER=true
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        npx tsc -b
        npm run build
    waitFor: ['frontend-install']

  - id: frontend-test
    name: node:${_NODE_VERSION}-bookworm
    dir: frontend
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        # No --coverage: nothing consumed the text-summary and v8
        # instrumentation only cost CPU on the critical path.
        npx vitest run --reporter=default
        # Released only after vitest passed: a cold worker-base rebuild
        # (prepare-worker-base-image) waits for this marker before its
        # kernel compile may compete with the test workers.
        touch /workspace/frontend-test-done
    waitFor: ['frontend-install']

  - id: frontend-audit
    name: node:${_NODE_VERSION}-bookworm
    dir: frontend
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        # Client-side counterpart of `cargo deny check`: package-lock.json against
        # the GitHub Advisory Database, failing on high/critical findings in
        # shipped (non-dev) dependencies. Same gate as Justfile ci-docker Phase 0b.
        # Own step so a slow registry call never delays the stack; it still
        # gates the build through assert-ci-status.
        npm audit --omit=dev --audit-level=high
    volumes:
      - name: npm-cache
        path: /root/.npm
    waitFor: ['frontend-install']

  # ---------------------------------------------------------------------------
  # 9. Build container images (validate Docker builds; only pushed in deploy)
  # ---------------------------------------------------------------------------
  - id: build-api-runtime-shell
    name: gcr.io/cloud-builders/docker
    dir: .
    env:
      - DOCKER_BUILDKIT=1
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        # Dockerfile.g5-api-prebuilt is FROM g5/base:26.04 (RUNTIME_BASE_IMAGE;
        # docker_images D18). The dev base tag is local-only (D5), and a
        # locally-built base is NOT visible to a Buildx docker-container
        # builder — the same constraint the worker-base fallback below hits —
        # so build the base locally and force the plain Docker builder
        # (G5_DOCKER_CACHE_DISABLE=true) so it resolves the RUNTIME_BASE_IMAGE.
        # The tier is pulled from the content-keyed CI mirror when a previous
        # build published it (deployment g5.quality.delivery.ci.base-image-mirror);
        # a cold Dockerfile.base build (git from source, ~11 min on the
        # throttled pool egress) only happens once per recipe change.
        G5_BASE_IMAGE_REGISTRY="${_AR_REGION}-docker.pkg.dev/$PROJECT_ID/${_CI_REPOSITORY}" \
          bash scripts/ensure-base-images.sh base
        G5_DOCKER_CACHE_REF="${_AR_REGION}-docker.pkg.dev/$PROJECT_ID/${_CI_REPOSITORY}/cache-api-image:latest" \
        G5_DOCKER_CACHE_DISABLE=true \
        G5_DOCKER_BUILDX_BUILDER="g5-ci-cache-api-$SHORT_SHA" \
        ./scripts/docker-build-with-registry-cache.sh \
          --build-arg=RUNTIME_BASE_IMAGE=g5/base:26.04 \
          --tag=g5-api-runtime-shell:ci \
          --target=runtime-base \
          --file=infra/docker/Dockerfile.g5-api-prebuilt \
          .
    waitFor: ['-']

  - id: pull-worker-base-image
    name: gcr.io/cloud-builders/docker
    dir: .
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        # Content-keyed worker base (deployment
        # g5.quality.delivery.ci.base-image-mirror): the key covers the
        # recipe, the platform build scripts it COPYs and the RESOLVED image id
        # of the g5/base tier it layers on (Dockerfile.base installs unpinned
        # apt packages, so the parent can change without a source change;
        # CodeRabbit, #353), so a recipe or parent change misses and
        # republishes while an unchanged pair pulls the ~14-min toolchain
        # image in seconds. The deploy pipeline's worker-base:<version>/latest
        # tags live in another repository and are not consulted: nothing
        # guaranteed they matched this candidate's recipe, and in practice
        # they were never present here, so every PR cold-built the fallback.
        G5_BASE_IMAGE_REGISTRY="${_AR_REGION}-docker.pkg.dev/$PROJECT_ID/${_CI_REPOSITORY}" \
          bash scripts/ensure-base-images.sh base
        PARENT_IMAGE_ID="$$(docker image inspect -f '{{.Id}}' g5/base:26.04)"
        HASH=$$(
          { printf 'parent-image-id\0%s\0' "$${PARENT_IMAGE_ID}"
            for f in infra/docker/Dockerfile.g5d-base scripts/build-cloud-hypervisor-runtime.sh scripts/install-cloud-hypervisor-platform.sh infra/guest/versions.env infra/guest/kernel.config infra/guest/init.c infra/packer/g5-worker/scripts/58-install-passt.sh infra/packer/g5-worker/scripts/lib/download-with-retry.sh; do
              printf '%s\0' "$$f"; cat "$$f"; printf '\0'
            done; } | sha256sum | cut -c1-32
        )
        AR_BASE="${_AR_REGION}-docker.pkg.dev/$PROJECT_ID/${_CI_REPOSITORY}/worker-base:$${HASH}"
        printf '%s\n' "$${AR_BASE}" > /workspace/worker-base-image-ref

        if docker pull "$${AR_BASE}"; then
          docker tag "$${AR_BASE}" g5/g5d-base:latest
          echo "pulled" > /workspace/worker-base-image-status
        else
          echo "WARN: worker base image not published for this recipe ($${AR_BASE}); fallback build will run and publish it"
          echo "missing" > /workspace/worker-base-image-status
        fi
    # Independent root: the pull needs only the mirror and the registry, not
    # the CI image, so the ~2.3-min worker-base pull overlaps build-ci-image
    # instead of queueing behind it (warm run 95d0c684: 3.2 → 5.6 min).
    waitFor: ['-']

  - id: prepare-worker-base-image
    name: gcr.io/cloud-builders/docker
    dir: .
    env:
      - DOCKER_BUILDKIT=1
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        AR_BASE="$$(cat /workspace/worker-base-image-ref)"

        if docker image inspect g5/g5d-base:latest >/dev/null 2>&1; then
          echo "Worker base image already prepared from early pull"
          echo "pulled" > /workspace/worker-base-image-status
          exit 0
        fi

        # Prefer the published toolchain image and tag it with the local name
        # expected by Dockerfile.g5d. Cold-building Dockerfile.g5d-base on every
        # PR makes CI depend on long Rust/toolchain downloads instead of the
        # already-delivered worker base image.
        if docker pull "$${AR_BASE}"; then
          docker tag "$${AR_BASE}" g5/g5d-base:latest
          echo "pulled" > /workspace/worker-base-image-status
        else
          echo "WARN: worker base image not published for this recipe; building local fallback"
          # The fallback compiles the guest kernel with every worker CPU, and a
          # vitest run sharing the machine then misses its 60-second worker
          # RPC deadline, failing frontend-test and cancelling this build
          # before it can publish (PR #1012 builds cd45c056 and 5d54cd65). So a
          # cold rebuild waits for frontend-test to finish, up to 30 minutes,
          # before competing for the CPU (deployment
          # g5.quality.delivery.ci.release-overlap); a warm pull never waits.
          waited=0
          until [ -f /workspace/frontend-test-done ] || [ "$${waited}" -ge 1800 ]; do
            [ "$${waited}" -eq 0 ] && echo "Waiting for frontend-test before the cold worker-base build"
            sleep 10; waited=$$((waited + 10))
          done
          echo "Starting the cold worker-base build after waiting $${waited}s for frontend-test"
          # Dockerfile.g5d-base is FROM g5/base:26.04 (docker_images D18) and
          # that tier tag is local-only (D5), which a Buildx docker-container
          # builder cannot see — the pull step already ensured the tier (its
          # image id is part of the key); re-ensure defensively and force the
          # plain builder.
          G5_BASE_IMAGE_REGISTRY="${_AR_REGION}-docker.pkg.dev/$PROJECT_ID/${_CI_REPOSITORY}" \
            bash scripts/ensure-base-images.sh base
          G5_DOCKER_CACHE_REF="${_AR_REGION}-docker.pkg.dev/$PROJECT_ID/${_CI_REPOSITORY}/cache-worker-base-image:latest" \
          G5_DOCKER_CACHE_DISABLE=true \
          G5_DOCKER_BUILDX_BUILDER="g5-ci-cache-worker-base-$SHORT_SHA" \
          ./scripts/docker-build-with-registry-cache.sh \
            --build-arg=BASE_IMAGE=g5/base:26.04 \
            --tag=g5/g5d-base:latest \
            --file=infra/docker/Dockerfile.g5d-base \
            .
          # Publish under the content key so the next build with this recipe
          # pulls instead of rebuilding. Best-effort: a failed push costs the
          # next build one more fallback, never this build's correctness.
          if docker tag g5/g5d-base:latest "$${AR_BASE}" && docker push "$${AR_BASE}"; then
            echo "Published worker base image: $${AR_BASE}"
            echo "pushed" > /workspace/worker-base-image-status
          else
            echo "WARN: could not publish worker base image $${AR_BASE}; the next build will rebuild it" >&2
            echo "built" > /workspace/worker-base-image-status
          fi
        fi
    waitFor: ['pull-worker-base-image']

  - id: build-worker-runtime-shell
    name: gcr.io/cloud-builders/docker
    dir: .
    env:
      - DOCKER_BUILDKIT=1
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        AR_BASE="$$(cat /workspace/worker-base-image-ref)"
        base_status="$$(cat /workspace/worker-base-image-status 2>/dev/null || true)"
        cache_disable="${_G5_DOCKER_CACHE_DISABLE}"
        base_image="$${AR_BASE}"
        if [[ "$${base_status}" != "pulled" && "$${base_status}" != "pushed" ]]; then
          # A local fallback base image is not visible inside a Buildx
          # docker-container builder. Preserve correctness by using the plain
          # Docker builder when the registry base is neither pulled nor
          # freshly published.
          base_image="g5/g5d-base:latest"
          cache_disable="true"
        fi

        G5_DOCKER_CACHE_REF="${_AR_REGION}-docker.pkg.dev/$PROJECT_ID/${_CI_REPOSITORY}/cache-worker-image:latest" \
        G5_DOCKER_CACHE_DISABLE="$${cache_disable}" \
        G5_DOCKER_BUILDX_BUILDER="g5-ci-cache-worker-$SHORT_SHA" \
        ./scripts/docker-build-with-registry-cache.sh \
          --build-arg=BASE_IMAGE="$${base_image}" \
          --tag=g5d-worker-runtime-shell:ci \
          --target=runtime-base \
          --file=infra/docker/Dockerfile.g5d-prebuilt \
          .
    waitFor: ['prepare-worker-base-image']

  - id: build-edge-image
    name: gcr.io/cloud-builders/docker
    dir: .
    env:
      - DOCKER_BUILDKIT=1
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        # Dockerfile.edge-prebuilt is FROM g5/base:26.04 (docker_images
        # D18/D5). Ensure the base locally (pulled from the CI mirror when
        # published) and force the plain Docker builder so it is visible to
        # the build (see build-api-runtime-shell).
        G5_BASE_IMAGE_REGISTRY="${_AR_REGION}-docker.pkg.dev/$PROJECT_ID/${_CI_REPOSITORY}" \
          bash scripts/ensure-base-images.sh base
        G5_DOCKER_CACHE_REF="${_AR_REGION}-docker.pkg.dev/$PROJECT_ID/${_CI_REPOSITORY}/cache-edge-image:latest" \
        G5_DOCKER_CACHE_DISABLE=true \
        G5_DOCKER_BUILDX_BUILDER="g5-ci-cache-edge-$SHORT_SHA" \
        ./scripts/docker-build-with-registry-cache.sh \
          --build-arg=BASE_IMAGE=g5/base:26.04 \
          --tag=${_AR_REGION}-docker.pkg.dev/$PROJECT_ID/${_CI_REPOSITORY}/edge:$SHORT_SHA \
          --file=infra/docker/Dockerfile.edge-prebuilt \
          .
    waitFor: ['frontend-build']

  # ---------------------------------------------------------------------------
  # 9a. Release binaries for runtime image packaging
  # ---------------------------------------------------------------------------
  - id: rust-release-artifacts
    name: gcr.io/cloud-builders/docker
    dir: .
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail

        rm -rf .ci-release-artifacts/api .ci-release-artifacts/api.tmp

        # CI-speed experiment (b484d078): GCS-backed sccache on a FRESH target dir.
        # Plain docker run (no XFS namespaces); fresh CARGO_TARGET_DIR avoids the
        # baked-target hash collision; persists to GCS so unchanged crates hit on
        # warm builds. Safe fallback: if GCS is unreachable, compiles without caching.
        if [[ -n "${_G5_CI_SCCACHE_GCS_BUCKET}" ]]; then
          docker run --rm \
            --network=cloudbuild \
            -v /workspace:/workspace \
            -w /workspace \
            -e CARGO_HOME=/opt/g5-cargo-home \
            -e CARGO_TARGET_DIR=/workspace/sccache-release-target \
            -e CARGO_BUILD_JOBS=${_G5_CI_RELEASE_BUILD_JOBS} \
            -e CARGO_INCREMENTAL=0 \
            -e CARGO_BUILD_PIPELINING=false \
            -e RUSTC_WRAPPER=sccache \
            -e SCCACHE_GCS_BUCKET=${_G5_CI_SCCACHE_GCS_BUCKET} \
            -e SCCACHE_GCS_KEY_PREFIX=${_G5_CI_SCCACHE_GCS_PREFIX} \
            -e SCCACHE_GCS_RW_MODE=READ_WRITE \
            -e SCCACHE_DIR=/workspace/sccache-local \
            -e SCCACHE_IDLE_TIMEOUT=0 \
            -e SQLX_OFFLINE=true \
            -e DATABASE_URL=postgres://g5:g5_test@postgres:5432/g5_test \
            -e TEST_DATABASE_URL=postgres://g5:g5_test@postgres:5432/g5_test \
            -e G5_CI_RELEASE_ARTIFACTS_DIR=/workspace/.ci-release-artifacts/api \
            -e G5_CI_SKIP_BAKED_ARTIFACT_CLEAN=true \
            "${_RUST_LANE_IMAGE}" \
            bash -lc '
              set -euo pipefail
              export PATH="$${CARGO_HOME}/bin:$${PATH}"
              sccache --start-server || true
              echo "=== sccache stats (pre-build) ==="; sccache --show-stats || true
              bash ./scripts/build-release-artifacts.sh
              echo "=== sccache stats (post-build) ==="; sccache --show-stats || true
            '
          exit 0
        fi

        TARGET_CACHE_SKIP_CLEAN=false
        if [[ -n "${_RUST_TARGET_CACHE_IMAGE}" ]]; then
          TARGET_CACHE_SKIP_CLEAN=true
        fi

        if [[ "${_G5_CI_RUST_XFS_ORCHESTRATOR}" =~ ^(1|true|TRUE|yes|YES)$ ]]; then
          # Lane delta (cicd D23): the E2E pipeline no longer builds the XFS
          # orchestrator image — this branch is reachable only if the sccache
          # experiment is reverted by blanking _G5_CI_SCCACHE_GCS_BUCKET.
          echo "ERROR: the XFS release path needs the orchestrator image, which" >&2
          echo "the E2E lane no longer builds (see infra/ci/cloudbuild-ci-rust.yaml and" >&2
          echo "cicd.semlift.md D23). Restore _G5_CI_SCCACHE_GCS_BUCKET or set" >&2
          echo "_G5_CI_RUST_XFS_ORCHESTRATOR='false' for the plain release path." >&2
          exit 1
        else
          docker run --rm \
            --network=cloudbuild \
            -v /workspace:/workspace \
            -w /workspace \
            -e CARGO_HOME=/opt/g5-cargo-home \
            -e CARGO_TARGET_DIR=/opt/g5-rust-target-cache/target \
            -e CARGO_BUILD_JOBS=${_G5_CI_RELEASE_BUILD_JOBS} \
            -e CARGO_INCREMENTAL=${_G5_CI_CARGO_INCREMENTAL} \
            -e RUSTC_WRAPPER=${_G5_CI_RUSTC_WRAPPER} \
            -e SQLX_OFFLINE=true \
            -e DATABASE_URL=postgres://g5:g5_test@postgres:5432/g5_test \
            -e TEST_DATABASE_URL=postgres://g5:g5_test@postgres:5432/g5_test \
            -e G5_CI_RELEASE_ARTIFACTS_DIR=/workspace/.ci-release-artifacts/api \
            -e G5_CI_SKIP_BAKED_ARTIFACT_CLEAN="$${TARGET_CACHE_SKIP_CLEAN}" \
            "${_RUST_LANE_IMAGE}" \
            bash ./scripts/build-release-artifacts.sh
        fi
    # cicd D24 / issue #1983: keep the release compile behind the independent
    # frontend and runtime-image preparation peaks. Overlapping frontend-test
    # was canaried and gained nothing: CPU contention stretched the compile from
    # about 2 to 5 minutes (ontology g5.quality.delivery.ci.release-overlap).
    # The step body remains identical to the Rust lane; only this E2E-local
    # graph differs.
    waitFor: ['rust-target-prime', 'frontend-test', 'build-playwright-runner-image', 'build-api-runtime-shell', 'build-worker-runtime-shell', 'build-edge-image']

  # ---------------------------------------------------------------------------
  # 9b. E2E lean Rust prime — compile the E2E test toolchain once (cicd D24)
  # ---------------------------------------------------------------------------
  # rust-e2e and seed-playwright-fixtures used to recompile g5d + g5-e2e on the
  # post-stack critical path (184s + 215s measured 2026-07-16) because each
  # step's writes to the baked CARGO_TARGET_DIR land in a discarded Docker
  # overlay. This step runs the exact rust-e2e preflight once and commits the
  # container as the local lane image `g5-e2e-rust-lane` that both consumers
  # run from, so their in-step cargo invocations become fingerprint no-ops.
  # It waits on rust-release-artifacts so the two full-width compiles never
  # contend on the shared VM, and finishes inside the stack-boot window.
  # Rollback: _G5_CI_E2E_RUST_PRIME='false' tags the plain CI image instead
  # and the consumers compile in-step as before.
  - id: e2e-rust-prime
    name: gcr.io/cloud-builders/docker
    dir: .
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail

        if [[ ! "${_G5_CI_E2E_RUST_PRIME}" =~ ^(1|true|TRUE|yes|YES)$ ]]; then
          echo "E2E Rust prime disabled; tagging ${_CI_IMAGE} as g5-e2e-rust-lane"
          docker tag "${_CI_IMAGE}" g5-e2e-rust-lane
          exit 0
        fi

        CONTAINER="g5-e2e-rust-prime-$BUILD_ID"
        docker rm -f "$${CONTAINER}" >/dev/null 2>&1 || true
        cleanup_prime_container() {
          docker rm -f "$${CONTAINER}" >/dev/null 2>&1 || true
        }
        trap cleanup_prime_container EXIT

        # Compile-env parity with the rust-e2e consumer (cicd D24): same
        # CARGO_HOME, incremental setting, wrapper, and commands — env drift
        # makes the consumers silently recompile and erases the win.
        docker run \
          --name "$${CONTAINER}" \
          -v /workspace:/workspace \
          -w /workspace \
          -e CARGO_HOME=/opt/g5-cargo-home \
          -e CARGO_BUILD_JOBS=44 \
          -e CARGO_INCREMENTAL=${_G5_CI_CARGO_INCREMENTAL} \
          -e RUSTC_WRAPPER=${_G5_CI_RUSTC_WRAPPER} \
          "${_CI_IMAGE}" \
          bash -lc '
            set -euo pipefail
            export PATH="$${CARGO_HOME}/bin:$${PATH}"

            echo "=== E2E Rust prime: cleaning dummy workspace artifacts ==="
            bash ./scripts/clean-baked-rust-workspace-artifacts.sh

            echo "=== E2E Rust prime: cargo build -p g5d ==="
            cargo build -j"$${CARGO_BUILD_JOBS}" -p g5d

            echo "=== E2E Rust prime: cargo test -p g5-e2e --no-run ==="
            cargo test -j44 -p g5-e2e --no-run

            echo "=== E2E Rust prime target size ==="
            du -sh "$${CARGO_TARGET_DIR}"
          '

        docker commit "$${CONTAINER}" g5-e2e-rust-lane
        echo "Committed E2E Rust lane image: g5-e2e-rust-lane"
    waitFor: ['rust-release-artifacts']

  - id: build-api-image
    name: gcr.io/cloud-builders/docker
    dir: .
    env:
      - DOCKER_BUILDKIT=1
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        # Dockerfile.g5-api-prebuilt runtime stage derives from g5/base:26.04
        # (docker_images D18/D5). Build the base locally and force the plain
        # Docker builder so it is visible (see build-api-runtime-shell).
        bash scripts/ensure-base-images.sh base
        G5_DOCKER_CACHE_REF="${_AR_REGION}-docker.pkg.dev/$PROJECT_ID/${_CI_REPOSITORY}/cache-api-image:latest" \
        G5_DOCKER_CACHE_DISABLE=true \
        G5_DOCKER_BUILDX_BUILDER="g5-ci-cache-api-$SHORT_SHA" \
        ./scripts/docker-build-with-registry-cache.sh \
          --build-arg=RUNTIME_BASE_IMAGE=g5/base:26.04 \
          --tag=${_AR_REGION}-docker.pkg.dev/$PROJECT_ID/${_CI_REPOSITORY}/api:$SHORT_SHA \
          --file=infra/docker/Dockerfile.g5-api-prebuilt \
          .
    waitFor: ['build-api-runtime-shell', 'rust-release-artifacts']

  - id: build-worker-image
    name: gcr.io/cloud-builders/docker
    dir: .
    env:
      - DOCKER_BUILDKIT=1
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        AR_BASE="$$(cat /workspace/worker-base-image-ref)"
        base_status="$$(cat /workspace/worker-base-image-status 2>/dev/null || true)"
        cache_disable="${_G5_DOCKER_CACHE_DISABLE}"
        base_image="$${AR_BASE}"
        if [[ "$${base_status}" != "pulled" && "$${base_status}" != "pushed" ]]; then
          # A local fallback base image is not visible inside a Buildx
          # docker-container builder. Preserve correctness by using the plain
          # Docker builder when the registry base is neither pulled nor
          # freshly published.
          base_image="g5/g5d-base:latest"
          cache_disable="true"
        fi

        G5_DOCKER_CACHE_REF="${_AR_REGION}-docker.pkg.dev/$PROJECT_ID/${_CI_REPOSITORY}/cache-worker-image:latest" \
        G5_DOCKER_CACHE_DISABLE="$${cache_disable}" \
        G5_DOCKER_BUILDX_BUILDER="g5-ci-cache-worker-$SHORT_SHA" \
        ./scripts/docker-build-with-registry-cache.sh \
          --build-arg=BASE_IMAGE="$${base_image}" \
          --tag=g5d-worker:ci \
          --file=infra/docker/Dockerfile.g5d-prebuilt \
          .
    waitFor: ['build-worker-runtime-shell', 'rust-release-artifacts']

  # ===========================================================================
  # Phase: Full-Stack E2E Tests (OAuth + API smoke + Playwright)
  # ===========================================================================
  # Mirrors `just ci-docker` Phases 4–7.  Starts the complete service stack
  # (OAuth stub, g5-api, edge/client) on the `cloudbuild` network,
  # seeds test data, then runs Rust E2E, API smoke, and Playwright tests.
  #
  # Dependencies:
  #   - build-api-image (g5-api Docker image)
  #   - build-edge-image (frontend/edge Docker image)
  #   - runtime DB/bootstrap and service health checks
  # ===========================================================================

  # ---------------------------------------------------------------------------
  # E2E-0. Build oauth-stub image (lightweight — no build step, < 5s)
  # ---------------------------------------------------------------------------
  - id: build-oauth-stub
    name: gcr.io/cloud-builders/docker
    dir: .
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        # infra/docker/oauth-stub/Dockerfile is FROM g5/base-node:26.04 (docker_images
        # D18); ensure the common base + Node tier locally first (pulled from
        # the CI mirror when published) so the leaf build resolves its
        # BASE_IMAGE ARG default (D5: dev base tags are local-only, plain
        # docker build sees them).
        G5_BASE_IMAGE_REGISTRY="${_AR_REGION}-docker.pkg.dev/$PROJECT_ID/${_CI_REPOSITORY}" \
          bash scripts/ensure-base-images.sh base-node
        docker build \
          --tag=g5-oauth-stub:ci \
          --file=infra/docker/oauth-stub/Dockerfile \
          infra/docker/oauth-stub
    waitFor: ['-']

  # ---------------------------------------------------------------------------
  # E2E-2. Start OAuth stub
  # ---------------------------------------------------------------------------
  - id: start-oauth-stub
    name: gcr.io/cloud-builders/docker
    args:
      - run
      - -d
      - --name=oauth-stub
      - --network=cloudbuild
      - -e=OAUTH_PORT=9876
      - -e=OAUTH_AUTO_APPROVE=true
      - -e=OAUTH_CLIENT_ID=local-oauth-client-id
      - -e=OAUTH_CLIENT_SECRET=local-oauth-client-secret
      - -e=OAUTH_USER_EMAIL=e2e-test@g5.dev
      - -e=OAUTH_USER_LOGIN=e2e-test-user
      - -e=OAUTH_USER_NAME=E2E Test User
      - g5-oauth-stub:ci
    waitFor: ['build-oauth-stub']

  # ---------------------------------------------------------------------------
  # E2E-3. Start g5-api server
  # ---------------------------------------------------------------------------
  # Secrets belong to this job, outside /workspace and all build/artifact inputs.
  - id: generate-stack-secrets
    name: gcr.io/cloud-builders/gcloud
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        umask 077
        python3 scripts/stack_secrets.py job /g5-ci-secrets/bundle.json > /g5-ci-secrets/env
    volumes:
      - name: stack-secrets
        path: /g5-ci-secrets
    waitFor: ['-']

  - id: start-g5-api
    name: gcr.io/cloud-builders/docker
    dir: .
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        set +x
        source /g5-ci-secrets/env
        docker run -d \
          --name=g5-api \
          --network=cloudbuild \
          -v g5-e2e-repos:/mnt/g5-repos/repos \
          -e G5_DATABASE_URL=postgres://g5_runtime_system:g5_system_test@postgres:5432/${_E2E_DB_NAME} \
          -e G5_AUTHZ_DATABASE_URL=postgres://authz_writer:g5_authz_test@postgres:5432/${_E2E_DB_NAME} \
          -e G5_TENANT_DATABASE_URL=postgres://g5_runtime_tenant:g5_tenant_test@postgres:5432/${_E2E_DB_NAME} \
          -e G5_DATABASE_MAX_CONNECTIONS=30 \
          -e G5_AUTHZ_DATABASE_MAX_CONNECTIONS=10 \
          -e G5_TENANT_DATABASE_MAX_CONNECTIONS=40 \
          -e G5_REQUIRE_RUNTIME_DB_SPLIT=true \
          -e G5_HOST=0.0.0.0 \
          -e G5_PORT=7500 \
          -e G5_RATE_LIMIT_ENABLED=false \
          -e RUST_LOG=g5_api=info \
          -e RUST_BACKTRACE=1 \
          -e G5_E2E_AUTH=true \
          -e G5_GUIDED_JOURNEY_ENABLED=true \
          -e G5_SCM_ENCRYPTION_KEY \
          -e G5_COOKIE_SECURE=true \
          -e G5_STORAGE_PROVIDER=filestore \
          -e G5_STORAGE_MOUNT_POINT=/mnt/g5-repos \
          -e G5_STORAGE_TENANT_PREFIX=repos \
          -e G5_STORAGE_WORKTREE_DIR=/tmp/g5-api-storage-worktrees \
          -e G5_ATTACHMENT_STORE_DIR=/tmp/g5-api-attachments \
          -e G5_REPOS_BASE_DIR=/data/repos \
          -e 'G5_EXTERNAL_URL=https://app.g5-e2e.test' \
          -e 'G5_PREVIEW_HOST_SUFFIX=preview.g5-e2e.test' \
          -e 'G5_GIT_EXTERNAL_URL=http://g5-api:7500' \
          -e G5_GITHUB_CLIENT_ID=local-oauth-client-id \
          -e G5_GITHUB_CLIENT_SECRET=local-oauth-client-secret \
          -e 'G5_GITHUB_AUTHORIZE_URL=http://oauth-stub:9876/login/oauth/authorize' \
          -e 'G5_GITHUB_TOKEN_URL=http://oauth-stub:9876/login/oauth/access_token' \
          -e 'G5_GITHUB_USERINFO_URL=http://oauth-stub:9876/user' \
          -e 'G5_SCM_GITHUB_API_BASE_URL=http://oauth-stub:9876' \
          -e G5_EMAIL_TRANSPORT=resend \
          -e G5_EMAIL_FROM_DOMAIN=mail.g5-e2e.test \
          -e G5_EMAIL_RESEND_API_KEY=re_stub_key \
          -e 'G5_EMAIL_RESEND_API_URL=http://oauth-stub:9876' \
          -e G5_EMAIL_VOLUME_LIMITS=off \
          -e G5_JWT_SECRET \
          -e G5_JWT_PUBLIC_KEY \
          -e G5_JWT_PRIVATE_KEY \
          ${_AR_REGION}-docker.pkg.dev/$PROJECT_ID/${_CI_REPOSITORY}/api:$SHORT_SHA
    volumes:
      - name: stack-secrets
        path: /g5-ci-secrets
    waitFor: ['generate-stack-secrets', 'build-api-image', 'start-oauth-stub', 'db-bootstrap-runtime-users-e2e']

  # ---------------------------------------------------------------------------
  # E2E-4. Start edge/client (SPA + reverse proxy)
  # ---------------------------------------------------------------------------
  # The edge serves HTTPS on its network alias (Caddy's internal CA; the
  # Playwright runner ignores certificate errors) so previews run on their
  # isolated https://<task>.preview.g5-e2e.test/ hosts as in production
  # (infra/docker/caddy-ci-tls.caddyfile). Chromium maps that wildcard to the
  # edge through E2E_PREVIEW_HOST_RESOLVER; Docker DNS cannot.
  - id: start-client
    name: gcr.io/cloud-builders/docker
    dir: .
    args:
      - run
      - -d
      - --name=g5-test-client
      - --network=cloudbuild
      - --network-alias=app.g5-e2e.test
      - -e=G5_API_URL=http://g5-api:7500
      - -e=G5_EDGE_TLS_APEX=app.g5-e2e.test
      - -e=G5_EDGE_PREVIEW_SUFFIX=preview.g5-e2e.test
      - ${_AR_REGION}-docker.pkg.dev/$PROJECT_ID/${_CI_REPOSITORY}/edge:$SHORT_SHA
    waitFor: ['build-edge-image', 'start-g5-api']

  # ---------------------------------------------------------------------------
  # E2E-5. Wait for full stack healthy
  # ---------------------------------------------------------------------------
  - id: wait-e2e-stack
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        echo "Waiting for E2E stack to be healthy..."

        wait_healthy() {
          local container="$$1" timeout="$$2" elapsed=0
          while true; do
            health=$$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}running{{end}}' "$$container" 2>/dev/null || echo "not-found")
            state=$$(docker inspect --format '{{.State.Status}}' "$$container" 2>/dev/null || echo "not-found")
            if [[ "$$health" == "healthy" || ("$$health" == "running" && "$$state" == "running") ]]; then
              echo "  ✓ $$container is ready"
              return 0
            fi
            if [[ "$$state" == "exited" || "$$state" == "dead" ]]; then
              echo "  ✗ $$container is $$state"
              docker logs --tail=30 "$$container" 2>&1 || true
              return 1
            fi
            if (( elapsed >= timeout )); then
              echo "  ✗ $$container timed out after $${timeout}s"
              docker logs --tail=30 "$$container" 2>&1 || true
              return 1
            fi
            sleep 2
            elapsed=$((elapsed + 2))
          done
        }

        # Wait for oauth-stub (has healthcheck)
        wait_healthy oauth-stub 30

        # Wait for g5-api (has healthcheck via curl /healthz)
        # Give it longer — it runs migrations on first boot
        wait_healthy g5-api 90
        if ! docker logs --tail=80 g5-api 2>&1 | grep -F '[g5-api] storage initialized (Filestore { mount_point: "/mnt/g5-repos", tenant_prefix: "repos", worktree_dir: "/tmp/g5-api-storage-worktrees" })' >/dev/null; then
          echo "  ✗ g5-api did not boot with the filestore-style storage configuration"
          docker logs --tail=120 g5-api 2>&1 || true
          exit 1
        fi
        if ! docker exec g5-api curl -sf http://localhost:7500/api/v1/instance/health \
          | grep -E '"database"[[:space:]]*:[[:space:]]*"healthy"' >/dev/null; then
          echo "  ✗ g5-api database health check did not pass"
          docker logs --tail=120 g5-api 2>&1 || true
          exit 1
        fi

        # Wait for frontend/edge (has healthcheck via wget /healthz)
        wait_healthy g5-test-client 60

        echo "E2E stack is healthy"
    waitFor: ['start-client']

  # ---------------------------------------------------------------------------
  # E2E-6. Seed CI org + bound workspace host using the shared script
  # ---------------------------------------------------------------------------
  - id: seed-ci-org
    name: ${_CI_IMAGE}
    dir: .
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        PROVISION_WORKER_HOST=1
        seed_stderr=/workspace/seed-ci-org.stderr.log
        if seed_env="$$(POSTGRES_CONTAINER=postgres DB_NAME=${_E2E_DB_NAME} G5_E2E_API_URL=http://g5-api:7500 G5_E2E_PROVISION_WORKER_HOST=$$PROVISION_WORKER_HOST G5_E2E_HOST_WORKSPACE_VM_LIMIT=14 G5_E2E_HOST_INSTANCE_TYPE=c3-standard-22 ./scripts/seed-ci-org.sh 2> >(tee "$$seed_stderr" >&2))"; then
          :
        else
          seed_status=$$?
          echo "seed-ci-org failed; bounded g5-api diagnostics follow"
          docker logs --tail=240 g5-api 2>&1 || true
          exit "$$seed_status"
        fi
        eval "$$seed_env"
        : "$${G5D_ORG_ID:?seed-ci-org.sh did not export G5D_ORG_ID}"
        : "$${G5D_REPO_ID:?seed-ci-org.sh did not export G5D_REPO_ID}"
        echo "$$G5D_ORG_ID" > /workspace/e2e-org-id
        echo "$$G5D_REPO_ID" > /workspace/e2e-repo-id
        : "$${G5D_HOST_ID:?seed-ci-org.sh did not export G5D_HOST_ID}"
        : "$${G5_HOST_JWT:?seed-ci-org.sh did not export G5_HOST_JWT}"
        echo "$$G5D_HOST_ID" > /workspace/e2e-host-id
        echo "$$G5_HOST_JWT" > /workspace/e2e-host-jwt
        echo "$$G5D_SCRATCH_DISK_MIB" > /workspace/e2e-host-disk-mib
        echo "$$G5D_HOST_XFS_SIZE_GB" > /workspace/e2e-host-disk-gib
        echo "Seeded CI org $$G5D_ORG_ID with a bound workspace host"
    waitFor: ['wait-e2e-stack']

  # ---------------------------------------------------------------------------
  # E2E-7. Start the JWT-bound workspace host
  # ---------------------------------------------------------------------------
  - id: start-workers
    name: ${_CI_IMAGE}
    dir: .
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        ORG_ID=$$(cat /workspace/e2e-org-id)
        HOST_ID=$$(cat /workspace/e2e-host-id)
        HOST_JWT=$$(cat /workspace/e2e-host-jwt)
        HOST_DISK_MIB=$$(cat /workspace/e2e-host-disk-mib)
        HOST_DISK_GIB=$$(cat /workspace/e2e-host-disk-gib)
          # -------------------------------------------------------------------
          # One `g5d host` container with /dev/kvm boots workspace VMs.
          # (g5/g5d/host D8/D16). Fail closed without KVM: this lane exists to
          # prove the microVM substrate, never to silently fall back.
          # -------------------------------------------------------------------
          KVM_AVAIL=$$(cat /workspace/kvm_available 2>/dev/null || echo "0")
          if [ "$$KVM_AVAIL" != "1" ]; then
            echo "FATAL: _E2E_WORKER=workspace-vm requires /dev/kvm (nested-virt pool)" >&2
            exit 1
          fi

          # Stage the Linux x64 guest runtime (g5d from the already-built
          # worker image; node/claude/codex mirrors the Packer scripts).
          RUNTIME_STAGING_IMAGE=g5/g5d-base:latest \
          RUNTIME_STAGING_PACKAGES_PREINSTALLED=1 \
          ./scripts/stage-local-worker-runtime.sh \
            --arch x64 \
            --out /workspace/g5d-host \
            --g5d-from-image g5d-worker:ci

          # Copy the staged runtime into a named volume (CI docker runs as
          # sibling containers — host-path -v is not available here).
          # Recreate it: a reused volume on the pool host could carry stale
          # artifacts from an earlier stage (CodeRabbit PR review).
          docker volume rm -f g5-e2e-host-runtime >/dev/null 2>&1 || true
          docker volume create g5-e2e-host-runtime >/dev/null
          STAGE_CID=$$(docker create -v g5-e2e-host-runtime:/runtime ubuntu:24.04 true)
          docker cp /workspace/g5d-host/runtime/. "$$STAGE_CID:/runtime/"
          docker rm "$$STAGE_CID" >/dev/null

          # Root in-container: host needs /dev/kvm plus host-side chown of
          # /work to the guest agent uid (g5/g5d/host D11) — same privilege
          # the bare-host systemd unit runs with. Deterministic CI: the fake
          # provider CLI still boots the real VM and drives the carrier; no
          # provider credential is present in this lane.
          # --privileged (loop device + mount) so the entrypoint wrapper can
          # provision an in-container XFS-reflink loopback at /var/g5d-data —
          # the workspace materializer is reflink-or-fail-loud (workspace D6)
          # and the container overlay FS has no reflink support. Mirrors the
          # XFS-reflink ROOT filesystem production worker hosts boot with
          # (infra/packer/g5-worker). The wrapper is bind-mounted from the
          # checked-out source tree (/workspace is the Cloud Build VM path the
          # sibling container shares) and execs `g5d host` after the mount.
          #
          # Guest base image (G5D_HOST_BASE_IMAGE): the in-VM worker lane runs
          # its own `git clone`/`fetch` of the workspace INSIDE the guest, so the
          # guest base image must ship git. Agent-run Rust/native package tests
          # also need the guest to provide a C linker and native build baseline
          # (`cc`, `ld`, `make`, `pkg-config`, and common dev headers). Bare
          # `ubuntu:24.04` has neither git nor the linker stack; the older
          # `buildpack-deps:noble-scm` has git but no `cc`, so Rust proc-macro
          # builds fail before any tests run. Use Google's public Docker Hub
          # cache for the official `buildpack-deps:resolute` (ubuntu 26.04 /
          # glibc 2.43 base, the microvm [D12] floor; the Packer-staged cloud
          # runtime itself remains 24.04-built until #2232, which is the safe
          # build-old/run-new direction) because it stays binary-compatible with the staged
          # /opt/g5/bin runtime while carrying both git and the native build
          # dependencies, without making three independent host caches consume
          # Docker Hub's shared anonymous pull allowance. g5d falls back once to
          # the canonical repository on mirror availability failures. Kept as
          # an OCI ref (NOT a pre-extracted dir) so
          # each workspace VM gets its own rootfs under G5D_ROOTFS_STATE_DIR - a
          # shared dir would race across the 3 concurrent microVMs.
          #
          # Match the production supervisor's descriptor budget for concurrent
          # dispatch, Git and image preparation.
          #
          # G5D_ROOTFS_STATE_DIR / G5D_OCI_CACHE_DIR point the workspace guest
          # rootfs and OCI layer cache at the XFS-reflink volume the entrypoint
          # provisions at /var/g5d-data. The defaults (/var/lib/g5d/rootfs,
          # /var/cache/g5d/oci-layers) live on the container overlay FS, which has
          # no reflink support for the per-digest rootfs template and per-VM COW
          # clones, so the overlay would fill mid-run.
          G5_WORKER_BASE_IMAGE=mirror.gcr.io/library/buildpack-deps:resolute
          ./scripts/verify-worker-base-image.sh "$$G5_WORKER_BASE_IMAGE"

          # The focused value-loop browser edge starts one real preview only
          # after both Sync jobs finish, then stops it before rebase/PR work.
          # This preserves the shared three-VM budget while proving the
          # selected code-repo profile through the ticketed UI route.
          docker run -d \
            --name="g5d-host-1" \
            --network=cloudbuild \
            --device /dev/kvm \
            --privileged \
            --cgroupns=host \
            -v /sys/fs/cgroup:/sys/fs/cgroup:ro \
            --ulimit nofile=1048576:1048576 \
            -u 0 \
            -v /workspace/scripts/ci-host-xfs-entrypoint.sh:/usr/local/bin/ci-host-xfs-entrypoint.sh:ro \
            --entrypoint bash \
            -e G5D_API_URL=http://g5-api:7500 \
            -e G5D_ORG_ID="$$ORG_ID" \
            -e G5_HOST_JWT="$$HOST_JWT" \
            -e G5D_HOST_ID="$$HOST_ID" \
            -e G5D_ISOLATION_MODE=microvm \
            -e G5D_GIT_HTTP_ALLOW_HOSTS=g5-api:7500 \
            -e G5D_HOST_RUNTIME_BIN_DIR=/opt/g5-runtime/bin \
            -e G5D_HOST_BASE_IMAGE="$$G5_WORKER_BASE_IMAGE" \
            -e G5D_ROOTFS_STATE_DIR=/var/lib/g5d/rootfs \
            -e G5D_OCI_CACHE_DIR=/var/g5d-data/oci-layers \
            -e G5D_HOST_XFS_SIZE_GB="$$HOST_DISK_GIB" \
            -e G5D_HOST_MAX_MICROVMS=14 \
            -e G5D_HOST_CPUS_PER_VM=1 \
            -e G5D_HOST_MEM_MIB_PER_VM=2560 \
            -e G5D_SCRATCH_DISK_MIB="$$HOST_DISK_MIB" \
            -e G5D_NESTED_VIRTUALIZATION=on \
            -e G5_CLAUDE_CODE_FAKE=1 \
            -e G5_CODEX_FAKE=1 \
            -e G5_FAKE_BUDGET_RESUME_E2E=1 \
            -e RUST_LOG=g5d=debug \
            -v g5-e2e-host-runtime:/opt/g5-runtime:ro \
            g5d-worker:ci \
            /usr/local/bin/ci-host-xfs-entrypoint.sh \
            host
    waitFor: ['seed-ci-org', 'build-worker-image', 'setup-kvm-cloud-hypervisor']

  # ---------------------------------------------------------------------------
  # E2E-8. Wait for the bound workspace host to become ready
  # ---------------------------------------------------------------------------
  - id: wait-workers
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        CONTAINERS="g5d-host-1"

        dump_worker_debug() {
          echo "--- workspace host rows ---"
          docker exec postgres psql -U g5 -d "${_E2E_DB_NAME}" -x -c \
            "SELECT host_id, status, org_id, last_heartbeat, slots_total FROM worker_hosts ORDER BY created_at, host_id;" \
            || true
          echo "--- worker containers ---"
          docker ps -a --filter "name=g5d-" --format 'table {{.Names}}\t{{.Status}}\t{{.Image}}' || true
          for cname in $$CONTAINERS; do
            echo "--- $${cname} logs ---"
            docker logs --tail=120 "$$cname" 2>&1 || true
          done
        }

        # Filter by the main seeded org (cicd D31): the dedicated value-loop
        # and rust-e2e lane hosts register concurrently, and a global count
        # would false-positive on them while the main host is still down.
        ORG_ID=$$(cat /workspace/e2e-org-id)
        # Allow 600s of image preparation plus 60s for registration.
        for i in $(seq 1 330); do
          HOST_ID=$$(cat /workspace/e2e-host-id)
          host_count=$$(docker exec postgres psql -U g5 -d "${_E2E_DB_NAME}" -tAc \
            "SELECT COUNT(*) FROM worker_hosts WHERE org_id = '$$ORG_ID' AND host_id = '$$HOST_ID' AND status = 'ready' AND last_heartbeat IS NOT NULL;" | tr -d '[:space:]')
          if [[ "$${host_count:-0}" -eq 1 ]]; then
            echo "Workspace host ready: $$HOST_ID"
            exit 0
          fi
          echo "Workspace host ready rows so far: $${host_count:-0}/1"
          for cname in $$CONTAINERS; do
            state=$$(docker inspect --format '{{.State.Status}}' "$$cname" 2>/dev/null || echo missing)
            if [[ "$$state" == "exited" || "$$state" == "dead" || "$$state" == "missing" ]]; then
              echo "Host container $${cname} is $$state before readiness completed"
              dump_worker_debug
              exit 1
            fi
          done
          sleep 2
        done
        echo "Timed out waiting for the workspace host to become ready"
        dump_worker_debug
        exit 1
    waitFor: ['start-workers']

  # ---------------------------------------------------------------------------
  # E2E-8c. Dedicated value-loop org + single-slot host (cicd D30)
  #
  # The value-loop receipt lane runs concurrently with rust-e2e, isolated by
  # organization: workspace-host routing is org-scoped (host JWTs carry the
  # provisioning org), so neither lane can dispatch onto the other lane's
  # workspace host. Isolation is effective only when
  # _G5_CI_VALUE_LOOP_ISOLATED='true' AND the substrate is workspace-vm; in
  # every other case these three steps are no-ops and
  # value-loop-rust-api-profiles serializes itself behind rust-e2e's completion
  # marker (behaviorally the pre-D30 graph — waitFor cannot branch on
  # substitutions).
  # ---------------------------------------------------------------------------
  - id: seed-value-loop-org
    name: ${_CI_IMAGE}
    dir: .
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        if [[ "${_G5_CI_VALUE_LOOP_ISOLATED}" != "true" || "${_E2E_WORKER}" != "workspace-vm" ]]; then
          echo "value-loop isolation disabled (flag or substrate); skipping dedicated org seed"
          exit 0
        fi
        # Same seeder as seed-ci-org with an org override; the DEFAULT user
        # emails are kept deliberately — the script upserts shared users by
        # fixed oauth identity, so an overridden email would rewrite the main
        # org's user rows (seed_scripts D30).
        seed_stderr=/workspace/seed-value-loop-org.stderr.log
        if seed_env="$$(POSTGRES_CONTAINER=postgres DB_NAME=${_E2E_DB_NAME} G5_E2E_API_URL=http://g5-api:7500 G5_E2E_PROVISION_WORKER_HOST=1 G5_E2E_HOST_WORKSPACE_VM_LIMIT=3 G5_E2E_TEST_ORG_NAME='G5 Labs Value Loop' G5_E2E_TEST_ORG_SLUG=g5labs-vl ./scripts/seed-ci-org.sh 2> >(tee "$$seed_stderr" >&2))"; then
          :
        else
          seed_status=$$?
          echo "seed-value-loop-org failed; bounded g5-api diagnostics follow"
          docker logs --tail=240 g5-api 2>&1 || true
          exit "$$seed_status"
        fi
        eval "$$seed_env"
        : "$${G5D_ORG_ID:?seed-ci-org.sh did not export G5D_ORG_ID}"
        : "$${G5D_HOST_ID:?seed-ci-org.sh did not export G5D_HOST_ID}"
        : "$${G5_HOST_JWT:?seed-ci-org.sh did not export G5_HOST_JWT}"
        echo "$$G5D_ORG_ID" > /workspace/value-loop-org-id
        echo "$$G5D_HOST_ID" > /workspace/value-loop-host-id
        echo "$$G5_HOST_JWT" > /workspace/value-loop-host-jwt
        echo "$$G5D_SCRATCH_DISK_MIB" > /workspace/value-loop-host-disk-mib
        echo "$$G5D_HOST_XFS_SIZE_GB" > /workspace/value-loop-host-disk-gib
    waitFor: ['seed-ci-org']

  # ---------------------------------------------------------------------------
  # E2E-8d. Dedicated rust-e2e org + host + stateless API replica (cicd D31)
  #
  # The browser chain runs concurrently with BOTH Rust lanes. rust-e2e is the
  # relocated lane (browser specs pin the g5labs org family; rust-e2e is fully
  # env-driven): dedicated org g5labs-re, dedicated host g5d-host-re-1, and a
  # second stateless API replica g5-api-re from the same image/DB — the
  # production multi-replica topology. The replica exists because
  # seed-playwright-fixtures cold-restarts g5-api as its persistence proof, so
  # no concurrent non-browser lane may depend on the main API process (the
  # value-loop lane's runtime moves to g5-api-re too). Isolation is effective
  # only when _G5_CI_RUST_E2E_ISOLATED='true' AND the substrate is
  # workspace-vm; otherwise these four steps are no-ops and the browser chain
  # re-serializes itself in-step behind the Rust-lane completion markers
  # (behaviorally the pre-D31 graph — waitFor cannot branch on substitutions).
  # ---------------------------------------------------------------------------
  - id: seed-rust-e2e-org
    name: ${_CI_IMAGE}
    dir: .
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        if [[ "${_G5_CI_RUST_E2E_ISOLATED}" != "true" || "${_E2E_WORKER}" != "workspace-vm" ]]; then
          echo "rust-e2e isolation disabled (flag or substrate); skipping dedicated org seed"
          exit 0
        fi
        # Same seeder as seed-ci-org with an org override; the DEFAULT user
        # emails are kept deliberately — the script upserts shared users by
        # fixed oauth identity (seed_scripts D30). Serialized after
        # seed-value-loop-org so the three seed runs never interleave those
        # shared-user upserts.
        seed_stderr=/workspace/seed-rust-e2e-org.stderr.log
        if seed_env="$$(POSTGRES_CONTAINER=postgres DB_NAME=${_E2E_DB_NAME} G5_E2E_API_URL=http://g5-api:7500 G5_E2E_PROVISION_WORKER_HOST=1 G5_E2E_HOST_WORKSPACE_VM_LIMIT=3 G5_E2E_TEST_ORG_NAME='G5 Labs Rust E2E' G5_E2E_TEST_ORG_SLUG=g5labs-re ./scripts/seed-ci-org.sh 2> >(tee "$$seed_stderr" >&2))"; then
          :
        else
          seed_status=$$?
          echo "seed-rust-e2e-org failed; bounded g5-api diagnostics follow"
          docker logs --tail=240 g5-api 2>&1 || true
          exit "$$seed_status"
        fi
        eval "$$seed_env"
        : "$${G5D_ORG_ID:?seed-ci-org.sh did not export G5D_ORG_ID}"
        : "$${G5D_REPO_ID:?seed-ci-org.sh did not export G5D_REPO_ID}"
        : "$${G5D_HOST_ID:?seed-ci-org.sh did not export G5D_HOST_ID}"
        : "$${G5_HOST_JWT:?seed-ci-org.sh did not export G5_HOST_JWT}"
        echo "$$G5D_ORG_ID" > /workspace/rust-e2e-org-id
        echo "$$G5D_REPO_ID" > /workspace/rust-e2e-repo-id
        echo "$$G5D_HOST_ID" > /workspace/rust-e2e-host-id
        echo "$$G5_HOST_JWT" > /workspace/rust-e2e-host-jwt
        echo "$$G5D_SCRATCH_DISK_MIB" > /workspace/rust-e2e-host-disk-mib
        echo "$$G5D_HOST_XFS_SIZE_GB" > /workspace/rust-e2e-host-disk-gib
    waitFor: ['seed-value-loop-org']

  - id: seed-pa-org
    name: ${_CI_IMAGE}
    dir: .
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        if [[ "${_G5_CI_PROVIDER_AGENT_ISOLATED}" != "true" || "${_E2E_WORKER}" != "workspace-vm" ]]; then
          echo "provider-agent isolation disabled (flag or substrate); skipping dedicated org seed"
          exit 0
        fi
        # cicd D32: fourth seed-ci-org.sh run — the provider-agent browser
        # lane's dedicated org. DEFAULT user emails are kept deliberately (the
        # script upserts shared users by fixed oauth identity, seed_scripts
        # D30); serialized after seed-rust-e2e-org so the four seed runs never
        # interleave those shared-user upserts.
        seed_stderr=/workspace/seed-pa-org.stderr.log
        if seed_env="$$(POSTGRES_CONTAINER=postgres DB_NAME=${_E2E_DB_NAME} G5_E2E_API_URL=http://g5-api:7500 G5_E2E_PROVISION_WORKER_HOST=1 G5_E2E_HOST_WORKSPACE_VM_LIMIT=5 G5_E2E_HOST_INSTANCE_TYPE=c3-standard-8 G5_E2E_TEST_ORG_NAME='G5 Labs Provider Agent' G5_E2E_TEST_ORG_SLUG=g5labs-pa ./scripts/seed-ci-org.sh 2> >(tee "$$seed_stderr" >&2))"; then
          :
        else
          seed_status=$$?
          echo "seed-pa-org failed; bounded g5-api diagnostics follow"
          docker logs --tail=240 g5-api 2>&1 || true
          exit "$$seed_status"
        fi
        eval "$$seed_env"
        : "$${G5D_ORG_ID:?seed-ci-org.sh did not export G5D_ORG_ID}"
        : "$${G5D_REPO_ID:?seed-ci-org.sh did not export G5D_REPO_ID}"
        : "$${G5D_HOST_ID:?seed-ci-org.sh did not export G5D_HOST_ID}"
        : "$${G5_HOST_JWT:?seed-ci-org.sh did not export G5_HOST_JWT}"
        echo "$$G5D_ORG_ID" > /workspace/pa-org-id
        echo "$$G5D_REPO_ID" > /workspace/pa-repo-id
        echo "$$G5D_HOST_ID" > /workspace/pa-host-id
        echo "$$G5_HOST_JWT" > /workspace/pa-host-jwt
        echo "$$G5D_SCRATCH_DISK_MIB" > /workspace/pa-host-disk-mib
        echo "$$G5D_HOST_XFS_SIZE_GB" > /workspace/pa-host-disk-gib
    waitFor: ['seed-rust-e2e-org']

  - id: start-rust-e2e-api
    name: gcr.io/cloud-builders/docker
    dir: .
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        set +x
        source /g5-ci-secrets/env
        if [[ "${_G5_CI_RUST_E2E_ISOLATED}" != "true" || "${_E2E_WORKER}" != "workspace-vm" ]]; then
          echo "rust-e2e isolation disabled (flag or substrate); skipping lane API replica"
          exit 0
        fi
        # Mirror of start-g5-api (same image, DB, storage volume) with
        # only the container identity and self-referential URLs changed. The
        # replica mints lane-local git URLs so guests on g5d-host-re-1 clone
        # through it. DB budget: +124 potential connections inside the
        # _PG_MAX_CONNECTIONS=400 sidecar budget (cicd D31/D35).
        # 16 rust-e2e threads + 3 host slots + background maintenance need more
        # than 30/10; authz 10 was below one connection per thread (#2475).
        docker run -d \
          --name=g5-api-re \
          --network=cloudbuild \
          -v g5-e2e-repos:/mnt/g5-repos/repos \
          -e G5_DATABASE_URL=postgres://g5_runtime_system:g5_system_test@postgres:5432/${_E2E_DB_NAME} \
          -e G5_AUTHZ_DATABASE_URL=postgres://authz_writer:g5_authz_test@postgres:5432/${_E2E_DB_NAME} \
          -e G5_TENANT_DATABASE_URL=postgres://g5_runtime_tenant:g5_tenant_test@postgres:5432/${_E2E_DB_NAME} \
          -e G5_DATABASE_MAX_CONNECTIONS=60 \
          -e G5_AUTHZ_DATABASE_MAX_CONNECTIONS=24 \
          -e G5_TENANT_DATABASE_MAX_CONNECTIONS=40 \
          -e G5_REQUIRE_RUNTIME_DB_SPLIT=true \
          -e G5_HOST=0.0.0.0 \
          -e G5_PORT=7500 \
          -e G5_RATE_LIMIT_ENABLED=false \
          -e RUST_LOG=g5_api=info \
          -e RUST_BACKTRACE=1 \
          -e G5_E2E_AUTH=true \
          -e G5_GUIDED_JOURNEY_ENABLED=true \
          -e G5_SCM_ENCRYPTION_KEY \
          -e G5_COOKIE_SECURE=true \
          -e G5_STORAGE_PROVIDER=filestore \
          -e G5_STORAGE_MOUNT_POINT=/mnt/g5-repos \
          -e G5_STORAGE_TENANT_PREFIX=repos \
          -e G5_STORAGE_WORKTREE_DIR=/tmp/g5-api-re-storage-worktrees \
          -e G5_ATTACHMENT_STORE_DIR=/tmp/g5-api-re-attachments \
          -e G5_REPOS_BASE_DIR=/data/repos \
          -e 'G5_EXTERNAL_URL=https://app.g5-e2e.test' \
          -e 'G5_PREVIEW_HOST_SUFFIX=preview-re.g5-e2e.test' \
          -e 'G5_GIT_EXTERNAL_URL=http://g5-api-re:7500' \
          -e G5_GITHUB_CLIENT_ID=local-oauth-client-id \
          -e G5_GITHUB_CLIENT_SECRET=local-oauth-client-secret \
          -e 'G5_GITHUB_AUTHORIZE_URL=http://oauth-stub:9876/login/oauth/authorize' \
          -e 'G5_GITHUB_TOKEN_URL=http://oauth-stub:9876/login/oauth/access_token' \
          -e 'G5_GITHUB_USERINFO_URL=http://oauth-stub:9876/user' \
          -e 'G5_SCM_GITHUB_API_BASE_URL=http://oauth-stub:9876' \
          -e G5_EMAIL_TRANSPORT=resend \
          -e G5_EMAIL_FROM_DOMAIN=mail.g5-e2e.test \
          -e G5_EMAIL_RESEND_API_KEY=re_stub_key \
          -e 'G5_EMAIL_RESEND_API_URL=http://oauth-stub:9876' \
          -e G5_EMAIL_VOLUME_LIMITS=off \
          -e G5_JWT_SECRET \
          -e G5_JWT_PUBLIC_KEY \
          -e G5_JWT_PRIVATE_KEY \
          ${_AR_REGION}-docker.pkg.dev/$PROJECT_ID/${_CI_REPOSITORY}/api:$SHORT_SHA
        for attempt in $$(seq 1 90); do
          if docker exec g5-api-re curl -sf http://localhost:7500/healthz >/dev/null 2>&1; then
            # Match wait-e2e-stack's depth for the main API: the lane serves
            # rust-e2e's storage and database-backed paths, so /healthz alone is
            # not readiness (CodeRabbit PR review).
            if ! docker logs --tail=80 g5-api-re 2>&1 | grep -F '[g5-api] storage initialized (Filestore { mount_point: "/mnt/g5-repos", tenant_prefix: "repos", worktree_dir: "/tmp/g5-api-re-storage-worktrees" })' >/dev/null; then
              echo "g5-api-re did not boot with the filestore-style storage configuration" >&2
              docker logs --tail=120 g5-api-re 2>&1 || true
              exit 1
            fi
            if ! docker exec g5-api-re curl -sf http://localhost:7500/api/v1/instance/health \
              | grep -E '"database"[[:space:]]*:[[:space:]]*"healthy"' >/dev/null; then
              echo "g5-api-re database health check did not pass" >&2
              docker logs --tail=120 g5-api-re 2>&1 || true
              exit 1
            fi
            echo "g5-api-re healthy (storage + database verified)"
            exit 0
          fi
          state=$$(docker inspect --format '{{.State.Status}}' g5-api-re 2>/dev/null || echo missing)
          if [[ "$$state" == "exited" || "$$state" == "dead" || "$$state" == "missing" ]]; then
            echo "g5-api-re is $$state before becoming healthy" >&2
            docker logs --tail=120 g5-api-re 2>&1 || true
            exit 1
          fi
          sleep 2
        done
        echo "g5-api-re failed to become healthy" >&2
        docker logs --tail=120 g5-api-re 2>&1 || true
        exit 1
    volumes:
      - name: stack-secrets
        path: /g5-ci-secrets
    waitFor: ['generate-stack-secrets', 'build-api-image', 'start-oauth-stub', 'db-bootstrap-runtime-users-e2e']

  - id: start-value-loop-worker
    name: ${_CI_IMAGE}
    dir: .
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        if [[ "${_G5_CI_VALUE_LOOP_ISOLATED}" != "true" || "${_E2E_WORKER}" != "workspace-vm" ]]; then
          echo "value-loop isolation disabled (flag or substrate); skipping dedicated host"
          exit 0
        fi
        KVM_AVAIL=$$(cat /workspace/kvm_available 2>/dev/null || echo "0")
        if [ "$$KVM_AVAIL" != "1" ]; then
          echo "FATAL: dedicated value-loop host requires /dev/kvm (nested-virt pool)" >&2
          exit 1
        fi
        ORG_ID=$$(cat /workspace/value-loop-org-id)
        HOST_ID=$$(cat /workspace/value-loop-host-id)
        HOST_JWT=$$(cat /workspace/value-loop-host-jwt)
        HOST_DISK_MIB=$$(cat /workspace/value-loop-host-disk-mib)
        HOST_DISK_GIB=$$(cat /workspace/value-loop-host-disk-gib)
        # When the rust-e2e lane is isolated (cicd D31), the value-loop host
        # registers through the g5-api-re replica: the browser chain
        # cold-restarts the main g5-api mid-overlap, so no concurrent
        # non-browser lane may depend on that process. In the D31-rollback
        # graph the browser chain is serialized behind the value-loop marker,
        # so the main API stays safe to use.
        LANE_API=g5-api
        if [[ "${_G5_CI_RUST_E2E_ISOLATED}" == "true" ]]; then
          LANE_API=g5-api-re
        fi
        # Mirror of g5d-host-1 (see start-workers for the rationale on
        # --privileged, --ulimit, the XFS entrypoint, attestation, aliases, and
        # the guest base image) INCLUDING its 3-slot capacity: -j1 bounds
        # concurrent selectors, not concurrent tasks — the task-siblings
        # selector requires two sibling tasks to hold authority simultaneously
        # and a single-slot host can never pass it (canary build 67e3012a).
        # The staged runtime volume from start-workers is reused read-only.
        docker run -d \
          --name="g5d-host-vl-1" \
          --network=cloudbuild \
          --device /dev/kvm \
          --privileged \
          --cgroupns=host \
          -v /sys/fs/cgroup:/sys/fs/cgroup:ro \
          --ulimit nofile=1048576:1048576 \
          -u 0 \
          -v /workspace/scripts/ci-host-xfs-entrypoint.sh:/usr/local/bin/ci-host-xfs-entrypoint.sh:ro \
          --entrypoint bash \
          -e G5D_API_URL=http://$$LANE_API:7500 \
          -e G5D_ORG_ID="$$ORG_ID" \
          -e G5_HOST_JWT="$$HOST_JWT" \
          -e G5D_HOST_ID="$$HOST_ID" \
          -e G5D_ISOLATION_MODE=microvm \
          -e G5D_GIT_HTTP_ALLOW_HOSTS=$$LANE_API:7500 \
          -e G5D_HOST_RUNTIME_BIN_DIR=/opt/g5-runtime/bin \
          -e G5D_HOST_BASE_IMAGE=mirror.gcr.io/library/buildpack-deps:resolute \
          -e G5D_ROOTFS_STATE_DIR=/var/lib/g5d/rootfs \
          -e G5D_OCI_CACHE_DIR=/var/g5d-data/oci-layers \
          -e G5D_HOST_XFS_SIZE_GB="$$HOST_DISK_GIB" \
          -e G5D_HOST_MAX_MICROVMS=3 \
          -e G5D_HOST_CPUS_PER_VM=2 \
          -e G5D_HOST_MEM_MIB_PER_VM=4096 \
          -e G5D_SCRATCH_DISK_MIB="$$HOST_DISK_MIB" \
          -e G5D_NESTED_VIRTUALIZATION=on \
          -e G5_CLAUDE_CODE_FAKE=1 \
          -e G5_CODEX_FAKE=1 \
          -e G5_FAKE_BUDGET_RESUME_E2E=1 \
          -e RUST_LOG=g5d=debug \
          -v g5-e2e-host-runtime:/opt/g5-runtime:ro \
          g5d-worker:ci \
          /usr/local/bin/ci-host-xfs-entrypoint.sh \
          host
    # start-rust-e2e-api: the lane API replica this host registers through
    # when rust-e2e isolation is active (cicd D31); a fast no-op otherwise.
    waitFor: ['seed-value-loop-org', 'start-workers', 'start-rust-e2e-api']

  - id: wait-value-loop-workers
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        if [[ "${_G5_CI_VALUE_LOOP_ISOLATED}" != "true" || "${_E2E_WORKER}" != "workspace-vm" ]]; then
          echo "value-loop isolation disabled (flag or substrate); skipping dedicated-host wait"
          exit 0
        fi
        ORG_ID=$$(cat /workspace/value-loop-org-id)
        HOST_ID=$$(cat /workspace/value-loop-host-id)

        dump_vl_worker_debug() {
          echo "--- value-loop workspace host row ---"
          docker exec postgres psql -U g5 -d "${_E2E_DB_NAME}" -x -c \
            "SELECT host_id, status, org_id, last_heartbeat, slots_total FROM worker_hosts WHERE org_id = '$$ORG_ID' ORDER BY created_at, host_id;" \
            || true
          echo "--- g5d-host-vl-1 logs ---"
          docker logs --tail=120 g5d-host-vl-1 2>&1 || true
        }

        # Require the exact host seeded for this lane to be ready and live.
        # Allow 600s of image preparation plus 60s for registration.
        for i in $(seq 1 330); do
          host_count=$$(docker exec postgres psql -U g5 -d "${_E2E_DB_NAME}" -tAc \
            "SELECT COUNT(*) FROM worker_hosts WHERE org_id = '$$ORG_ID' AND host_id = '$$HOST_ID' AND status = 'ready' AND last_heartbeat IS NOT NULL;" | tr -d '[:space:]')
          if [[ "$${host_count:-0}" -eq 1 ]]; then
            echo "Value-loop workspace host ready: $$HOST_ID"
            exit 0
          fi
          echo "Value-loop host ready rows so far: $${host_count:-0}/1"
          state=$$(docker inspect --format '{{.State.Status}}' g5d-host-vl-1 2>/dev/null || echo missing)
          if [[ "$$state" == "exited" || "$$state" == "dead" || "$$state" == "missing" ]]; then
            echo "Value-loop host container is $$state before registration completed"
            dump_vl_worker_debug
            exit 1
          fi
          sleep 2
        done
        echo "Timed out waiting for the value-loop host to register"
        dump_vl_worker_debug
        exit 1
    waitFor: ['start-value-loop-worker']

