# Merge-cutoff Slack notification, ported from G5.
# Ontology: g5.quality.delivery.cutoff-summary.
#
# Run on a Cloud Scheduler cadence through the manual `g5-deploy-cutoff-notify`
# trigger at the release train's merge-cutoff
# instant (default Wednesday 00:00 America/Los_Angeles — the end of Tuesday
# PT). The single step executes the checked-in notifier, which posts the
# "Deployment cutoff now" message with the table of PRs the train is
# predicted to ship at its next firing. The script is fail-soft by design
# (NOTIFY-DEPLOY-CUTOFF-FAILED + exit 0): a Slack/GitHub/Secret Manager
# outage must not red this build. Set _DRY_RUN=true on a manual trigger run
# to render the payload without posting.
steps:
  - id: deploy-cutoff-notify
    name: gcr.io/cloud-builders/gcloud
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        # The gcloud builder image ships Python 3.10 whose zoneinfo has NO
        # IANA database; install OS tzdata so the cutoff/deploy-time math can
        # resolve the configured time zones.
        # DEBIAN_FRONTEND=noninteractive is LOAD-BEARING: tzdata's configure
        # step otherwise prompts for a timezone on stdin and hangs the build.
        if ! DEBIAN_FRONTEND=noninteractive timeout 120 apt-get update -qq >/dev/null ||
           ! DEBIAN_FRONTEND=noninteractive timeout 120 apt-get install -y -qq tzdata >/dev/null; then
          echo "NOTIFY-DEPLOY-CUTOFF-FAILED: timezone dependency setup failed" >&2
          exit 0
        fi
        cd scripts
        # Flush logs as the notifier progresses.
        python3 -u notify_deploy_cutoff.py \
          --project "$PROJECT_ID" \
          --region "${_REGION}" \
          --cutoff-day "${_CUTOFF_DAY}" \
          --cutoff-tz "${_CUTOFF_TZ}" \
          --deploy-day "${_DEPLOY_DAY}" \
          --deploy-time "${_DEPLOY_TIME}" \
          --deploy-tz "${_DEPLOY_TZ}" \
          --tf-trigger "${_TF_TRIGGER}" \
          --tf-origin-trigger "${_TF_ORIGIN_TRIGGER}" \
          --app-trigger "${_APP_TRIGGER}" \
          --app-origin-trigger "${_APP_ORIGIN_TRIGGER}" \
          --deployed-trigger "${_DEPLOYED_TRIGGER}" \
          --github-owner "${_GITHUB_OWNER}" \
          --github-repo "${_GITHUB_REPO}" \
          --github-connection "${_GITHUB_CONNECTION}" \
          --github-connection-repository "${_GITHUB_CONNECTION_REPOSITORY}" \
          --webhook-secret "${_SLACK_WEBHOOK_SECRET}" \
          --webhook-version "${_SLACK_WEBHOOK_VERSION}" \
          --dry-run "${_DRY_RUN}"

substitutions:
  _REGION: 'us-central1'
  _CUTOFF_DAY: 'tuesday'
  _CUTOFF_TZ: 'America/Los_Angeles'
  # The Terraform trigger supplies these from release-train.tf schedule locals;
  # defaults here support manual execution.
  _DEPLOY_DAY: 'thursday'
  _DEPLOY_TIME: '23:00'
  _DEPLOY_TZ: 'America/New_York'
  _TF_TRIGGER: 'g5-terraform-apply-staging'
  _TF_ORIGIN_TRIGGER: 'g5-terraform-apply-qa'
  _APP_TRIGGER: 'g5-promote-staging'
  # Production success history supplies the PR baseline; staging is the queue.
  _DEPLOYED_TRIGGER: 'g5-promote-prod'
  _APP_ORIGIN_TRIGGER: 'g5-deploy-qa'
  _GITHUB_OWNER: 'G5Labs'
  _GITHUB_REPO: 'G5-Lean'
  _GITHUB_CONNECTION: 'G5labs-G5-QA'
  _GITHUB_CONNECTION_REPOSITORY: 'G5Labs-G5-Lean'
  _SLACK_WEBHOOK_SECRET: 'g5-cloudbuild-slack-webhook'
  _SLACK_WEBHOOK_VERSION: '1'
  _DRY_RUN: 'false'

options:
  logging: CLOUD_LOGGING_ONLY
  dynamic_substitutions: true

# One paginated list read plus a GitHub compare; generous headroom over the
# bounded retries.
timeout: 1800s
