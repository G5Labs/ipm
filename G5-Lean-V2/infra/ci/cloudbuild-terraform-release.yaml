# =============================================================================
# Cloud Build — Terraform Bundle Promotion Pipeline
# =============================================================================
# Direct port of G5 generation/cloudbuild-terraform.yaml at 8458df8190f5.
# The QA producer builds once; staging/prod pull the same OCI digest.
# Lean keeps its independent platform/addons roots and native per-root state.
# Staging approval and successful staging -> prod chaining are trigger-owned.
#
# Modes:
#   - plan/source : run plan directly from the checked-out repo
#   - apply/build : build OCI bundle from the current commit, apply it here,
#                   then promote the same bundle digest forward
#   - apply/use   : pull a promoted OCI bundle digest and apply it here
# =============================================================================

options:
  machineType: E2_MEDIUM
  logging: CLOUD_LOGGING_ONLY
  dynamic_substitutions: true
  # Targets have separate buckets; all roots retain their default workspace.
  env:
    - 'TF_WORKSPACE=default'
  # ALLOW_LOOSE keeps manual `gcloud builds submit` runs and push-triggered
  # apply runs of this config from failing on absent event-derived
  # substitution keys. Never declare an event-derived key (e.g. _PR_NUMBER)
  # in substitutions — a config-declared default MASKS the trigger event's
  # value — and never write the bash-default spelling ${_VAR:-}, which Cloud
  # Build leaves unsubstituted (#1328).
  substitution_option: 'ALLOW_LOOSE'

substitutions:
  _TF_ACTION: plan           # plan | apply
  _TF_WORKSPACE: staging     # staging | prod
  _TF_VERSION: '1.9.8'
  # Separate, newer binary for `terraform test` only: 1.9.8's test teardown
  # rejects lifecycle prevent_destroy (hashicorp/terraform#34960), which the
  # cloudsql module now carries (terraform_cloudsql [D9]). Module tests share
  # no state with the composition, so the test-framework version is
  # independent of the plan/apply binary above.
  _TF_TEST_VERSION: '1.15.3'
  _TF_BUNDLE_MODE: source    # source | build | use
  _TF_BUNDLE_REF: ''
  _AR_PROJECT: ''
  _AR_REPOSITORY: g5
  _STATE_BUCKET: ''         # Target project's existing -lean-tfstate bucket
  _INFRA_DIR: infra
  _NEXT_TRIGGER: ''
  _NEXT_TRIGGER_PROJECT: ''
  _REGION: us-central1
  _TF_DISABLE_PROMOTION: 'false'
  _TF_CONFIG_JSON: '{}'

steps:
  - id: install-terraform
    name: ubuntu
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        apt-get update -qq && apt-get install -y -qq curl unzip > /dev/null 2>&1
        mkdir -p /workspace/bin
        curl -fsSL "https://releases.hashicorp.com/terraform/${_TF_VERSION}/terraform_${_TF_VERSION}_linux_amd64.zip" \
          -o /tmp/terraform.zip
        unzip -q /tmp/terraform.zip -d /workspace/bin
        chmod +x /workspace/bin/terraform
        /workspace/bin/terraform version
        # Test-only binary (see _TF_TEST_VERSION comment).
        mkdir -p /workspace/tftest-bin
        curl -fsSL "https://releases.hashicorp.com/terraform/${_TF_TEST_VERSION}/terraform_${_TF_TEST_VERSION}_linux_amd64.zip" \
          -o /tmp/terraform-test.zip
        unzip -q /tmp/terraform-test.zip -d /workspace/tftest-bin
        chmod +x /workspace/tftest-bin/terraform
        /workspace/tftest-bin/terraform version
    waitFor: ['-']

  - id: validate-inputs
    name: gcr.io/cloud-builders/gcloud
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail

        case "${_TF_ACTION}" in
          plan|apply) ;;
          *)
            echo "Unsupported _TF_ACTION=${_TF_ACTION}; expected plan or apply"
            exit 1
            ;;
        esac

        case "${_TF_WORKSPACE}" in
          staging|prod) ;;
          *) echo "_TF_WORKSPACE must be staging or prod" >&2; exit 1 ;;
        esac

        case "${_TF_BUNDLE_MODE}" in
          source|build|use) ;;
          *)
            echo "Unsupported _TF_BUNDLE_MODE=${_TF_BUNDLE_MODE}; expected source, build, or use"
            exit 1
            ;;
        esac

        TF_BUNDLE_MODE="${_TF_BUNDLE_MODE}"
        TF_AR_PROJECT="${_AR_PROJECT}"
        TF_PLAN_REFRESH="true"

        # Cross-project staging/prod promotions bootstrap additional IAM for the
        # centralized QA control-plane runner. Skip refresh there so Terraform
        # can grant itself repo IAM visibility on the first run.
        if [[ "${_TF_WORKSPACE}" != "qa" ]]; then
          TF_PLAN_REFRESH="false"
        fi

        if [[ "${_TF_ACTION}" == "apply" ]]; then
          if [[ -z "${COMMIT_SHA}" ]]; then
            echo "COMMIT_SHA must be set so the promoted Terraform bundle stays immutable"
            exit 1
          fi

          # G5 compatibility: older triggers predate bundle promotion fields and were
          # wired through. Coerce those stale apply/source runs into apply/build
          # and recover the shared artifact project from the state bucket.
          if [[ "$$TF_BUNDLE_MODE" == "source" ]]; then
            echo "WARN: apply/source is deprecated; coercing to apply/build for backward compatibility"
            TF_BUNDLE_MODE="build"
          fi

          if [[ -z "$$TF_AR_PROJECT" ]]; then
            if [[ "${_STATE_BUCKET}" =~ ^(.+)-terraform-state$ ]]; then
              TF_AR_PROJECT="${BASH_REMATCH[1]}"
              echo "WARN: _AR_PROJECT was empty; inferred $$TF_AR_PROJECT from _STATE_BUCKET"
            fi
          fi

          case "$$TF_BUNDLE_MODE" in
            build)
              if [[ -z "$$TF_AR_PROJECT" ]]; then
                echo "_AR_PROJECT is required in apply/build mode"
                exit 1
              fi
              ;;
            use)
              if [[ -n "${_TF_BUNDLE_REF}" && "${_TF_BUNDLE_REF}" != *@sha256:* ]]; then
                echo "_TF_BUNDLE_REF must be an immutable digest when provided in apply/use mode"
                exit 1
              fi
              if [[ -z "$$TF_AR_PROJECT" ]]; then
                echo "_AR_PROJECT is required in apply/use mode"
                exit 1
              fi
              ;;
            source)
              echo "Apply mode must use bundle mode 'build' or 'use'"
              exit 1
              ;;
          esac
        fi

        cat > /workspace/tf.env <<EOF
        export TF_ACTION=${_TF_ACTION}
        export TF_STATE_BUCKET=${_STATE_BUCKET}
        export TF_BUNDLE_MODE=$$TF_BUNDLE_MODE
        export TF_BUNDLE_REF=${_TF_BUNDLE_REF}
        export TF_BUNDLE_IMAGE=${_REGION}-docker.pkg.dev/$$TF_AR_PROJECT/${_AR_REPOSITORY}/terraform-bundle:${COMMIT_SHA}
        export TF_PLAN_REFRESH=$$TF_PLAN_REFRESH
        export TF_NEXT_TRIGGER=${_NEXT_TRIGGER}
        export TF_NEXT_TRIGGER_PROJECT=${_NEXT_TRIGGER_PROJECT}
        export TF_REGION=${_REGION}
        EOF

        echo "Action:      ${_TF_ACTION}"
        echo "Workspace:   ${_TF_WORKSPACE}"
        echo "Bundle mode: $$TF_BUNDLE_MODE"
        if [[ -n "$$TF_AR_PROJECT" ]]; then
          echo "Bundle proj: $$TF_AR_PROJECT"
        fi
    waitFor: ['install-terraform']

  - id: build-bundle
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        source /workspace/tf.env

        if [[ "$${TF_ACTION}" != "apply" || "$${TF_BUNDLE_MODE}" != "build" ]]; then
          echo "Skipping bundle build"
          exit 0
        fi

        echo "Building Terraform bundle image $${TF_BUNDLE_IMAGE}"
        bash scripts/ensure-base-images.sh base
        docker build \
          --tag="$${TF_BUNDLE_IMAGE}" \
          --file=infra/docker/Dockerfile.terraform-bundle \
          .
    waitFor: ['validate-inputs']

  - id: push-bundle
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        source /workspace/tf.env

        if [[ "$${TF_ACTION}" != "apply" || "$${TF_BUNDLE_MODE}" != "build" ]]; then
          echo "Skipping bundle push"
          exit 0
        fi

        docker push "$${TF_BUNDLE_IMAGE}"
    waitFor: ['build-bundle']

  - id: resolve-bundle-ref
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        source /workspace/tf.env

        BUNDLE_REF=""
        if [[ "$${TF_ACTION}" == "apply" ]]; then
          if [[ "$${TF_BUNDLE_MODE}" == "build" ]]; then
            BUNDLE_REF="$$(docker inspect --format='{{range .RepoDigests}}{{println .}}{{end}}' "$${TF_BUNDLE_IMAGE}" | head -n 1 | tr -d '\r')"
          elif [[ -n "$${TF_BUNDLE_REF}" ]]; then
            BUNDLE_REF="$${TF_BUNDLE_REF}"
          else
            echo "Resolving Terraform bundle digest from $${TF_BUNDLE_IMAGE}"
            docker pull "$${TF_BUNDLE_IMAGE}" >/dev/null
            BUNDLE_REF="$$(docker inspect --format='{{range .RepoDigests}}{{println .}}{{end}}' "$${TF_BUNDLE_IMAGE}" | head -n 1 | tr -d '\r')"
          fi

          if [[ "$${BUNDLE_REF}" != *@sha256:* ]]; then
            echo "Expected immutable Terraform bundle ref, got: $${BUNDLE_REF:-<empty>}"
            exit 1
          fi
        fi

        cat > /workspace/tf-promotion.env <<EOF
        export TF_BUNDLE_REF=$${BUNDLE_REF}
        EOF

        if [[ -n "$${BUNDLE_REF}" ]]; then
          echo "Terraform bundle: $${BUNDLE_REF}"
        fi
    waitFor: ['push-bundle']

  - id: materialize-bundle
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        source /workspace/tf.env
        source /workspace/tf-promotion.env

        rm -rf /workspace/tf-bundle
        mkdir -p /workspace/tf-bundle/infra

        if [[ "$${TF_ACTION}" == "plan" ]]; then
          cp -R "${_INFRA_DIR}/." /workspace/tf-bundle/infra
          cp -R scripts /workspace/tf-bundle/scripts
          # Existing module contracts also check API secret configuration.
          mkdir -p /workspace/tf-bundle/backend/g5-api-foundation/src
          cp backend/g5-api-foundation/src/config.rs /workspace/tf-bundle/backend/g5-api-foundation/src/config.rs
        else
          BUNDLE_SOURCE="$${TF_BUNDLE_REF}"
          if [[ "$${TF_BUNDLE_MODE}" == "use" ]]; then
            docker pull "$${BUNDLE_SOURCE}"
          fi

          CONTAINER_ID="$$(docker create "$${BUNDLE_SOURCE}")"
          trap 'docker rm -f "$${CONTAINER_ID}" >/dev/null 2>&1 || true' EXIT
          docker cp "$${CONTAINER_ID}:/bundle/." /workspace/tf-bundle
          docker rm -f "$${CONTAINER_ID}" >/dev/null 2>&1 || true
          trap - EXIT
        fi

        echo "Materialized Terraform sources:"
        find /workspace/tf-bundle/infra -maxdepth 2 -type f | sort | head -n 20
    waitFor: ['resolve-bundle-ref']

  - id: tf-init-platform
    name: gcr.io/cloud-builders/gcloud
    dir: tf-bundle/infra/${_TF_WORKSPACE}/platform
    entrypoint: bash
    env:
      - 'TF_RELEASE_CONFIG_JSON=${_TF_CONFIG_JSON}'
    args:
      - -c
      - |
        set -euo pipefail
        export PATH="/workspace/bin:$$PATH"
        # Preserve the existing default workspace and root-specific state prefix.
        python3 -c 'import json, os; from pathlib import Path; Path("release.auto.tfvars.json").write_text(json.dumps(json.loads(os.environ["TF_RELEASE_CONFIG_JSON"])))'
        terraform init \
          -backend-config="bucket=${_STATE_BUCKET}" \
          -backend-config="prefix=platform" \
          -input=false \
          -no-color
    waitFor: ['materialize-bundle']

  - id: tf-validate-platform
    name: gcr.io/cloud-builders/gcloud
    dir: tf-bundle/infra/${_TF_WORKSPACE}/platform
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        export PATH="/workspace/bin:$$PATH"
        terraform validate -no-color
    waitFor: ['tf-init-platform']

  - id: tf-test-static
    name: python:3.12-slim
    dir: tf-bundle/infra/terraform
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        FAIL=0
        FOUND=0
        while IFS= read -r d; do
          # Match unittest discover's default pattern (test*.py, not test_*.py)
          # so a suite named e.g. tests.py cannot be silently skipped.
          if ! ls "$$d"/test*.py >/dev/null 2>&1; then
            continue
          fi
          FOUND=1
          echo ""
          echo "================================================================"
          echo "=== python unittest in $$d"
          echo "================================================================"
          (cd "$$d" && python3 -m unittest discover -v) || FAIL=1
        done < <(find modules -type d -name tests | sort)

        if [ "$$FOUND" -eq 0 ]; then
          echo "No module python test directories found; nothing to test."
        fi
        if [ "$$FAIL" -ne 0 ]; then
          echo ""
          echo "FAIL: at least one static module contract test failed."
          exit 1
        fi
    waitFor: ['materialize-bundle']

  - id: tf-test-modules
    name: gcr.io/cloud-builders/gcloud
    dir: tf-bundle/infra/terraform
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        # Test-only terraform (_TF_TEST_VERSION): 1.9.8's test teardown rejects
        # lifecycle prevent_destroy (hashicorp/terraform#34960).
        export PATH="/workspace/tftest-bin:/workspace/bin:$$PATH"

        # Discover every module that has at least one .tftest.hcl file.
        # Portable: no `mapfile` (works on bash 3.2 too).
        # Cloud Build scans the whole step body (including comments) for
        # substitution keys, so every shell-variable reference is written
        # with a doubled dollar to escape into a literal dollar.
        TEST_MODULES=()
        while IFS= read -r d; do
          TEST_MODULES+=("$$d")
        done < <(find modules -type f -name "*.tftest.hcl" -print0 \
          | xargs -0 -n1 dirname \
          | sed 's|/tests$$||' \
          | sort -u)

        if [ $${#TEST_MODULES[@]} -eq 0 ]; then
          echo "No modules with .tftest.hcl files found; nothing to test."
          exit 0
        fi

        echo "=== Modules with terraform tests ==="
        printf '  %s\n' "$${TEST_MODULES[@]}"
        echo ""

        FAIL=0
        for m in "$${TEST_MODULES[@]}"; do
          echo ""
          echo "================================================================"
          echo "=== terraform test in $$m"
          echo "================================================================"
          (
            cd "$$m"
            terraform init -backend=false -input=false -no-color
            terraform test -no-color
          ) || FAIL=1
        done

        if [ "$$FAIL" -ne 0 ]; then
          echo ""
          echo "FAIL: at least one module terraform test failed."
          exit 1
        fi
    waitFor: ['tf-validate-platform']

  - id: tf-plan-platform
    name: gcr.io/cloud-builders/gcloud
    dir: tf-bundle/infra/${_TF_WORKSPACE}/platform
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        export PATH="/workspace/bin:$$PATH"
        source /workspace/tf.env

        echo "=== Planning ${_TF_WORKSPACE} ==="
        echo "Refresh: $${TF_PLAN_REFRESH}"
        set +e
        terraform plan \
          -out="/workspace/tfplan-${_TF_WORKSPACE}-platform" \
          -input=false \
          -no-color \
          -lock-timeout=10m \
          -refresh="$${TF_PLAN_REFRESH}" \
          -detailed-exitcode 2>&1 | tee /workspace/plan-output-${_TF_WORKSPACE}-platform.txt
        PLAN_EXIT=$${PIPESTATUS[0]}
        set -e

        echo ""
        echo "=== Plan Summary ==="
        grep -E "^(Plan:|No changes|Error)" /workspace/plan-output-${_TF_WORKSPACE}-platform.txt || true

        case "$$PLAN_EXIT" in
          0)
            echo "Terraform plan completed with no changes."
            ;;
          2)
            echo "Terraform plan completed with pending changes."
            ;;
          1)
            echo "Terraform plan failed." >&2
            exit 1
            ;;
          *)
            echo "Terraform plan exited with unexpected code $$PLAN_EXIT." >&2
            exit "$$PLAN_EXIT"
            ;;
        esac
    waitFor: ['tf-validate-platform']

  - id: tf-apply-platform
    name: gcr.io/cloud-builders/gcloud
    dir: tf-bundle/infra/${_TF_WORKSPACE}/platform
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        export PATH="/workspace/bin:$$PATH"

        if [[ "${_TF_ACTION}" != "apply" ]]; then
          echo "Plan-only mode — skipping apply"
          exit 0
        fi


        echo "=== Applying ${_TF_WORKSPACE} ==="
        terraform apply \
          -input=false \
          -no-color \
          -lock-timeout=10m \
          -auto-approve \
          "/workspace/tfplan-${_TF_WORKSPACE}-platform"

        echo ""
        echo "=== Outputs ==="
        terraform output -no-color || true
    # As in G5, module/static failures must block mutation.
    waitFor: ['tf-plan-platform', 'tf-test-modules', 'tf-test-static']

  - id: tf-init-addons
    name: gcr.io/cloud-builders/gcloud
    dir: tf-bundle/infra/${_TF_WORKSPACE}/addons
    entrypoint: bash
    env:
      - 'TF_RELEASE_CONFIG_JSON=${_TF_CONFIG_JSON}'
    args:
      - -c
      - |
        set -euo pipefail
        export PATH="/workspace/bin:$$PATH"
        # Preserve the existing default workspace and root-specific state prefix.
        python3 -c 'import json, os; from pathlib import Path; Path("release.auto.tfvars.json").write_text(json.dumps(json.loads(os.environ["TF_RELEASE_CONFIG_JSON"])))'
        terraform init \
          -backend-config="bucket=${_STATE_BUCKET}" \
          -backend-config="prefix=addons" \
          -input=false \
          -no-color
    waitFor: ['tf-apply-platform']

  - id: tf-validate-addons
    name: gcr.io/cloud-builders/gcloud
    dir: tf-bundle/infra/${_TF_WORKSPACE}/addons
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        export PATH="/workspace/bin:$$PATH"
        terraform validate -no-color
    waitFor: ['tf-init-addons']

  - id: tf-plan-addons
    name: gcr.io/cloud-builders/gcloud
    dir: tf-bundle/infra/${_TF_WORKSPACE}/addons
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        export PATH="/workspace/bin:$$PATH"
        source /workspace/tf.env

        echo "=== Planning ${_TF_WORKSPACE} ==="
        echo "Refresh: $${TF_PLAN_REFRESH}"
        set +e
        terraform plan \
          -out="/workspace/tfplan-${_TF_WORKSPACE}-addons" \
          -input=false \
          -no-color \
          -lock-timeout=10m \
          -refresh="$${TF_PLAN_REFRESH}" \
          -detailed-exitcode 2>&1 | tee /workspace/plan-output-${_TF_WORKSPACE}-addons.txt
        PLAN_EXIT=$${PIPESTATUS[0]}
        set -e

        echo ""
        echo "=== Plan Summary ==="
        grep -E "^(Plan:|No changes|Error)" /workspace/plan-output-${_TF_WORKSPACE}-addons.txt || true

        case "$$PLAN_EXIT" in
          0)
            echo "Terraform plan completed with no changes."
            ;;
          2)
            echo "Terraform plan completed with pending changes."
            ;;
          1)
            echo "Terraform plan failed." >&2
            exit 1
            ;;
          *)
            echo "Terraform plan exited with unexpected code $$PLAN_EXIT." >&2
            exit "$$PLAN_EXIT"
            ;;
        esac
    waitFor: ['tf-validate-addons']

  - id: tf-apply-addons
    name: gcr.io/cloud-builders/gcloud
    dir: tf-bundle/infra/${_TF_WORKSPACE}/addons
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        export PATH="/workspace/bin:$$PATH"

        if [[ "${_TF_ACTION}" != "apply" ]]; then
          echo "Plan-only mode — skipping apply"
          exit 0
        fi


        echo "=== Applying ${_TF_WORKSPACE} ==="
        terraform apply \
          -input=false \
          -no-color \
          -lock-timeout=10m \
          -auto-approve \
          "/workspace/tfplan-${_TF_WORKSPACE}-addons"

        echo ""
        echo "=== Outputs ==="
        terraform output -no-color || true
    # As in G5, module/static failures must block mutation.
    waitFor: ['tf-plan-addons', 'tf-test-modules', 'tf-test-static']

  - id: trigger-next
    name: gcr.io/cloud-builders/gcloud
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail

        if [[ "${_TF_ACTION}" != "apply" ]]; then
          echo "Plan-only mode — skipping downstream trigger"
          exit 0
        fi

        if [[ "${_TF_DISABLE_PROMOTION}" == "true" ]]; then
          echo "_TF_DISABLE_PROMOTION=true — skipping downstream trigger"
          exit 0
        fi

        source /workspace/tf.env
        source /workspace/tf-promotion.env

        if [[ -z "$${TF_NEXT_TRIGGER}" || -z "$${TF_NEXT_TRIGGER_PROJECT}" ]]; then
          echo "No downstream promotion trigger configured"
          exit 0
        fi

        if [[ "$${TF_BUNDLE_REF}" != *@sha256:* ]]; then
          echo "Refusing to promote non-digest Terraform bundle ref: $${TF_BUNDLE_REF:-<empty>}"
          exit 1
        fi

        echo "Triggering downstream promotion: $${TF_NEXT_TRIGGER} in $${TF_NEXT_TRIGGER_PROJECT}"
        gcloud builds triggers run "$${TF_NEXT_TRIGGER}" \
          --project="$${TF_NEXT_TRIGGER_PROJECT}" \
          --region="$${TF_REGION}" \
          --sha="${COMMIT_SHA}" \
          --substitutions="_TF_ACTION=apply,_TF_BUNDLE_MODE=use,_TF_BUNDLE_REF=$${TF_BUNDLE_REF},_AR_PROJECT=${_AR_PROJECT},_AR_REPOSITORY=${_AR_REPOSITORY},SHORT_SHA=${SHORT_SHA}"
    waitFor: ['tf-apply-addons']

# Bumped from 2400s (40 min) to 4 h to ride out transient GCE zonal
# capacity exhaustion during worker-pool create/update — GKE keeps
# retrying instance creation internally, but Cloud Build was killing
# the build long before capacity returned. 4 h matches the GKE node-pool
# resource's update timeout (see infra/modules/gke/main.tf).
timeout: 14400s
