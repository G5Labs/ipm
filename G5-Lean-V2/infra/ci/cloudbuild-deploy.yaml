  - id: build-g5d-g5dev
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    dir: .
    args:
      - -c
      - |
        set -euo pipefail
        source /workspace/delivery.env
        if [[ "${_PROMOTION_MODE}" != "build" ]]; then
          echo "Skipping g5d-g5dev build in deploy mode"
          exit 0
        fi

        # BuildKit registry cache (mode=max) so the chef-primed dependency
        # layer persists across ephemeral workers: a commit that only edits
        # existing source files cache-hits the cook layer and this build
        # completes in seconds; manifest/lockfile/.cargo-config/toolchain/
        # target-topology (chef recipe scope) or Dockerfile changes re-run it.
        bash scripts/ensure-base-images.sh base
        # A docker-container Buildx builder cannot see the local g5/base tag;
        # publish the tier to AR and pass that ref so the mode=max registry
        # cache stays enabled — same pattern as build-worker-base above and
        # cloudbuild-release (docker_images [D18]/[D5]).
        docker tag g5/base:26.04 "$${AR}/base:deploy-$${IMAGE_VERSION}"
        docker push "$${AR}/base:deploy-$${IMAGE_VERSION}"
        G5_DOCKER_CACHE_REF="$${AR}/cache-g5d-g5dev-image:latest" \
        G5_DOCKER_BUILDX_BUILDER="g5-delivery-cache-g5d-g5dev-$${IMAGE_VERSION:0:12}" \
        ./scripts/docker-build-with-registry-cache.sh \
          --tag="$${AR}/g5d-g5dev:$${IMAGE_VERSION}" \
          --tag="$${AR}/g5d-g5dev:latest" \
          --build-arg=BASE_IMAGE="$${AR}/base:deploy-$${IMAGE_VERSION}" \
          --file=infra/docker/Dockerfile.g5d-g5dev \
          .
    # Serialized behind the heavy builds (2026-07-17 incident, builds
    # 6d358d6…/dff939d0…): the I31 warm-cache prime stage compiles the whole
    # Rust dependency tree inside this docker build, and running it
    # concurrently with build-api/build-g5d on the then-shared E2_HIGHCPU_8 worker
    # OOM-killed sccache ("server shut down unexpectedly") and starved
    # build-worker-base's docker import (unexpected EOF, disk pressure).
    # The barrier is EVERY other image push: push-api covers build-api +
    # verify steps; push-g5d-tungsten covers build-g5d → push-worker-base →
    # build-worker-base; push-edge / push-g5d-pairsoft-preview /
    # push-g5d-pnc-bankworkflow / push-g5d-pnc-cash-receipt cover the remaining
    # builds that otherwise start at validate-inputs and could overlap a cold
    # chef cook — so this
    # step genuinely runs its compile alone. The E2_HIGHCPU_32 worker adds
    # headroom; if resource pressure recurs, the next levers are disk sizing
    # or capping CARGO_BUILD_JOBS in the prime stage.
    waitFor: ['push-api', 'push-g5d-tungsten', 'push-edge', 'push-g5d-pairsoft-preview', 'push-g5d-pnc-bankworkflow', 'push-g5d-pnc-cash-receipt']

