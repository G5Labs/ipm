# =============================================================================
# Cloud Build — Ordered Artifact Delivery Pipeline
# =============================================================================
# G5 Lean flow: build once into the QA-owned Artifact Registry and deploy the
# exact image refs through QA, approval-gated staging and automatic production.
# Promotion is disabled by default; delivery roots explicitly activate the chain.
#
# The pipeline runs in two modes:
#   - build  : build + push images, then deploy those immutable refs
#   - deploy : deploy already-built immutable refs
# =============================================================================

options:
  machineType: E2_HIGHCPU_32
  # The fleet sccache producer (warm-guest-sccache) compiles the runner's
  # package sets on this machine after eight image builds have written their
  # layers to the same disk, and its target tree alone is over ten gigabytes.
  # Exhaustion of the default 100 GB is the suspected cause of its failures
  # (the step now prints the disk figures). Disk above 100 GB is billed per
  # build minute, a small fraction of the machine's own rate.
  diskSizeGb: 250
  logging: CLOUD_LOGGING_ONLY
  dynamic_substitutions: true
  env:
    - DOCKER_BUILDKIT=1

substitutions:
  _AR_REGION: us-central1
  _ARTIFACT_PROJECT: g5-qa-1ccc
  _AR_PROJECT: ${PROJECT_ID}
  _AR_REPOSITORY: g5
  _TARGET_PROJECT: ${PROJECT_ID}
  _GKE_CLUSTER: g5-lean-qa
  _GKE_ZONE: us-central1
  _HELM_RELEASE: g5
  _HELM_NAMESPACE: g5
  _ENVIRONMENT: qa
  # Release-only settings are supplied by the trusted trigger from the same
  # Terraform settings. QA continues to use its checked-in values unchanged.
  _EXTERNAL_ACCESS_ENABLED: "false"
  _APP_HOSTNAME: ""
  _PREVIEW_HOSTNAME: ""
  _INGRESS_STATIC_IP_NAME: ""
  _CERTIFICATE_MAP_NAME: ""
  # Explicit target bindings are supplied by trusted delivery roots. Never infer
  # a production project from its name or accept arbitrary cross-project targets.
  _STAGING_PROJECT: g5lean-staging-1ccc
  _PROD_PROJECT: g5lean-prod-1ccc
  _STAGING_CLUSTER: g5-lean-staging
  _PROD_CLUSTER: g5-lean-prod
  _NEXT_TRIGGER: ""
  _RELEASE_BUCKET: ""
  _RELEASE_MANIFEST: ""
  _SOURCE_BUILD_ID: ""
  _RELEASE_CHECKS_REQUIRED: "false"
  _RELEASE_CHECK_BASE_URL: ""
  _RELEASE_CHECK_SECRET: ""
  # Explicit, disposable QA database reset. Ordinary deployments also recover
  # forward; this option changes only the coordinated reset workflow.
  _QA_DATABASE_RESET: "false"
  _QA_RESET_RUN_ID: ""
  _PROMOTION_MODE: build
  _FILESTORE_INSTANCE: ""
  _FILESTORE_ZONE: ""
  _FILESTORE_PV_NAME: g5-repos-pv
  _FILESTORE_PVC_NAME: g5-repos-pvc
  _FILESTORE_STORAGE: 1Ti
  _API_IMAGE_REF: ""
  _G5D_IMAGE_REF: ""
  _G5D_TUNGSTEN_IMAGE_REF: ""
  _G5D_PAIRSOFT_PREVIEW_IMAGE_REF: ""
  _G5D_PNC_BANKWORKFLOW_IMAGE_REF: ""
  _G5D_PNC_CASH_RECEIPT_IMAGE_REF: ""
  # Worker-image gate (scripts/await_worker_image.py). When set to the
  # worker-image trigger name, a build-mode deploy whose push also fired that
  # trigger waits for the bake and pins the promoted commit's own image.
  # Empty keeps the plain resolver (ancestor pin allowed).
  _WORKER_IMAGE_TRIGGER: ""
  _WORKER_IMAGE_WAIT_MINS: "90"
  _G5D_G5DEV_IMAGE_REF: ""
  # Companion size must match a host's published disk capacity to be reused.
  # Other capacities use the same host-side formatter before admission.
  _WORKLOAD_TEMPLATE_SIZE_MIB: "81920"
  _EDGE_IMAGE_REF: ""
  _WORKER_IMAGE_REF: ""
  # G5 Lean worker images are built and stored in the QA project.
  _WORKER_IMAGE_PROJECT: ${PROJECT_ID}
  _WORKER_IMAGE_FAMILY: g5-worker
  # Cloud Build has project/worker-pool concurrency, but no first-class
  # GitHub Actions-style deploy concurrency group. The deploy queue gate waits
  # for older in-flight builds targeting the same environment/project before
  # this build is allowed to touch Helm, migrations or smoke tests.
  _DEPLOY_QUEUE_POLL_SECONDS: "30"
  _DEPLOY_QUEUE_TIMEOUT_SECONDS: "5400"
  # GCS-backed sccache for the two Rust image compiles (cloudbuild_pipelines
  # [D33], docker_images D17). DEFAULT OFF: enabling requires a dedicated
  # deploy-cache identity/bucket that PR CI cannot write (cache-poisoning
  # boundary — a PR-controlled build sharing this service account could
  # otherwise seed objects that deploy links into production). When empty,
  # the build steps also omit --network=host and the token shim, so no
  # credentials are exposed to Dockerfile RUN steps. Enable per-trigger only
  # after the [D33] enablement preconditions are met. (--network=host, not
  # =cloudbuild: these are DOCKER_BUILDKIT builds and BuildKit rejects the
  # cloudbuild network mode. Host-net metadata serves the WORKER's untrusted
  # identity, not the build SA, so auth comes from a cloudbuild-network token
  # shim via SCCACHE_GCS_CREDENTIALS_URL — see [D33].)
  _SCCACHE_GCS_BUCKET: ""
  # Fleet sccache producer for workspace guests (ontology
  # g5.runtime.cache.fleet): after the g5dev image is pushed, compile the
  # test runner's package sets INSIDE that image, with the repository at the
  # guest's own path and the guest's own launchers, writing to
  # gs://<_SCCACHE_GCS_BUCKET>/<_GUEST_SCCACHE_PREFIX>/orgs/<_GUEST_SCCACHE_ORG_ID>.
  # Off unless the org id is set; only main merges run this pipeline, so a
  # PR branch can never write the fleet tier. Best-effort: a failure here
  # never fails the deploy.
  _GUEST_SCCACHE_ORG_ID: ""
  _GUEST_SCCACHE_PREFIX: "guest-sccache"
  # Artifact Registry repository the CI base-image mirror lives in; the
  # publish-base-tiers step pushes the tiers a workspace guest's dev-up pulls
  # through its host's cache door (ontology g5.runtime.cache.fleet) into a
  # repository only the deploy identity writes, never PR CI's g5-ci cache.
  _TIER_REPOSITORY: "g5-tiers"
  _GITHUB_OWNER: G5Labs
  _GITHUB_REPO: G5-Lean
  _GITHUB_CONNECTION: g5-lean-github
  _GITHUB_CONNECTION_REPOSITORY: G5Labs-G5-Lean

steps:
  - id: validate-inputs
    name: gcr.io/cloud-builders/gcloud
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail

        if [[ -z "${_AR_PROJECT}" ]]; then
          echo "_AR_PROJECT is required"
          exit 1
        fi

        if [[ -z "${_TARGET_PROJECT}" ]]; then
          echo "_TARGET_PROJECT is required"
          exit 1
        fi

        # Pure layout validation also runs before the live trigger-policy gate.
        python3 -c 'import sys; sys.path.insert(0, "scripts"); from release_artifacts import validate_layout; validate_layout(*sys.argv[1:])' \
          "$PROJECT_ID" "${_ARTIFACT_PROJECT}" "${_AR_PROJECT}" "${_WORKER_IMAGE_PROJECT}" "${_RELEASE_BUCKET}"
        case "${_ENVIRONMENT}" in
          qa)
            [[ "${_TARGET_PROJECT}" == "$PROJECT_ID" && "${_GKE_CLUSTER}" == "g5-lean-qa" ]] || exit 1
            [[ -z "${_NEXT_TRIGGER}" || "${_NEXT_TRIGGER}" == "g5-promote-staging" ]] || exit 1
            ;;
          staging|prod)
            [[ "${_PROMOTION_MODE}" == "deploy" && "${_QA_DATABASE_RESET}" == "false" ]] || exit 1
            if [[ "${_ENVIRONMENT}" == "staging" ]]; then
              [[ -n "${_STAGING_PROJECT}" && "${_TARGET_PROJECT}" == "${_STAGING_PROJECT}" && "${_GKE_CLUSTER}" == "${_STAGING_CLUSTER}" ]] || exit 1
              [[ -z "${_NEXT_TRIGGER}" || "${_NEXT_TRIGGER}" == "g5-promote-prod" ]] || exit 1
              if [[ -n "${_NEXT_TRIGGER}" ]]; then
                [[ "${_RELEASE_CHECKS_REQUIRED}" == "true" ]] || exit 1
              fi
            else
              [[ -n "${_PROD_PROJECT}" && "${_TARGET_PROJECT}" == "${_PROD_PROJECT}" && "${_GKE_CLUSTER}" == "${_PROD_CLUSTER}" && -z "${_NEXT_TRIGGER}" ]] || exit 1
            fi
            [[ "${_TARGET_PROJECT}" != "$PROJECT_ID" && "${_STAGING_PROJECT}" != "${_PROD_PROJECT}" ]] || exit 1
            [[ -n "${_RELEASE_MANIFEST}" && -n "${_SOURCE_BUILD_ID}" && -n "${_RELEASE_BUCKET}" ]] || exit 1
            ;;
          *) echo "Unsupported deployment environment"; exit 1 ;;
        esac
        if [[ -n "${_NEXT_TRIGGER}" && -z "${_RELEASE_BUCKET}" ]]; then
          echo "Promotion requires a dedicated trusted release bucket"
          exit 1
        fi
        case "${_RELEASE_CHECKS_REQUIRED}" in
          true)
            [[ -n "${_RELEASE_CHECK_BASE_URL}" && -n "${_RELEASE_CHECK_SECRET}" ]] || exit 1
            ;;
          false) ;;
          *) echo "_RELEASE_CHECKS_REQUIRED must be true or false"; exit 1 ;;
        esac

        case "${_QA_DATABASE_RESET}" in
          false) ;;
          true)
            if [[ "${_ENVIRONMENT}" != "qa" || "$PROJECT_ID" != "g5-qa-1ccc" || "${_GKE_CLUSTER}" != "g5-lean-qa" || "${_HELM_NAMESPACE}" != "g5" || -z "${_QA_RESET_RUN_ID}" ]]; then
              echo "QA reset requires the isolated QA project/cluster/namespace and a run ID"
              exit 1
            fi
            ;;
          *) echo "_QA_DATABASE_RESET must be true or false"; exit 1 ;;
        esac

        case "${_PROMOTION_MODE}" in
          build|deploy) ;;
          *)
            echo "Unsupported _PROMOTION_MODE=${_PROMOTION_MODE}; expected build or deploy"
            exit 1
            ;;
        esac

        # Cloud Build substitutes ${COMMIT_SHA} before bash runs this script.
        # Do not use bash default-value expansion here; that bypasses substitution.
        if [[ -z "${COMMIT_SHA}" ]]; then
          echo "COMMIT_SHA must be set so the artifact tag stays immutable"
          exit 1
        fi

        if [[ "${_PROMOTION_MODE}" == "deploy" ]]; then
          for required_ref in "${_API_IMAGE_REF}" "${_G5D_IMAGE_REF}" "${_EDGE_IMAGE_REF}" "${_WORKER_IMAGE_REF}"; do
            if [[ -z "$${required_ref}" ]]; then
              echo "Deploy mode requires _API_IMAGE_REF, _G5D_IMAGE_REF, _EDGE_IMAGE_REF, and _WORKER_IMAGE_REF"
              exit 1
            fi
          done
        fi

        cat > /workspace/delivery.env <<EOF
        export AR=${_AR_REGION}-docker.pkg.dev/${_AR_PROJECT}/${_AR_REPOSITORY}
        export IMAGE_VERSION=${COMMIT_SHA}
        export TARGET_PROJECT=${_TARGET_PROJECT}
        EOF

        echo "Mode:       ${_PROMOTION_MODE}"
        echo "Registry:   ${_AR_REGION}-docker.pkg.dev/${_AR_PROJECT}/${_AR_REPOSITORY}"
        echo "Image tag:  ${COMMIT_SHA}"
        echo "Target env: ${_ENVIRONMENT} (${_TARGET_PROJECT})"

  - id: validate-release-policy
    name: gcr.io/cloud-builders/gcloud
    entrypoint: python3
    env:
      - '_EXTERNAL_ACCESS_ENABLED=${_EXTERNAL_ACCESS_ENABLED}'
      - '_APP_HOSTNAME=${_APP_HOSTNAME}'
      - '_PREVIEW_HOSTNAME=${_PREVIEW_HOSTNAME}'
      - '_INGRESS_STATIC_IP_NAME=${_INGRESS_STATIC_IP_NAME}'
      - '_CERTIFICATE_MAP_NAME=${_CERTIFICATE_MAP_NAME}'
      - 'PROJECT_ID=${PROJECT_ID}'
      - 'BUILD_ID=${BUILD_ID}'
      - 'COMMIT_SHA=${COMMIT_SHA}'
      - '_ENVIRONMENT=${_ENVIRONMENT}'
      - '_ARTIFACT_PROJECT=${_ARTIFACT_PROJECT}'
      - '_AR_PROJECT=${_AR_PROJECT}'
      - '_AR_REGION=${_AR_REGION}'
      - '_AR_REPOSITORY=${_AR_REPOSITORY}'
      - '_WORKER_IMAGE_PROJECT=${_WORKER_IMAGE_PROJECT}'
      - '_RELEASE_BUCKET=${_RELEASE_BUCKET}'
      - '_TARGET_PROJECT=${_TARGET_PROJECT}'
      - '_GKE_CLUSTER=${_GKE_CLUSTER}'
      - '_GKE_ZONE=${_GKE_ZONE}'
      - '_HELM_NAMESPACE=${_HELM_NAMESPACE}'
      - '_HELM_RELEASE=${_HELM_RELEASE}'
      - '_PROMOTION_MODE=${_PROMOTION_MODE}'
      - '_NEXT_TRIGGER=${_NEXT_TRIGGER}'
      - '_RELEASE_CHECKS_REQUIRED=${_RELEASE_CHECKS_REQUIRED}'
      - '_RELEASE_CHECK_BASE_URL=${_RELEASE_CHECK_BASE_URL}'
      - '_RELEASE_CHECK_SECRET=${_RELEASE_CHECK_SECRET}'
    # Bind runtime inputs to the live trusted trigger before any compilation or
    # artifact publication. A caller cannot redirect writes by substitutions.
    args: ['scripts/app_release.py', 'policy']
    waitFor: ['validate-inputs']

  - id: publish-base-tiers
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    dir: .
    args:
      - -c
      - |
        set -euo pipefail
        source /workspace/delivery.env
        if [[ "${_PROMOTION_MODE}" != "build" ]]; then
          echo "Skipping base-tier publication in deploy mode"
          exit 0
        fi
        # Publish every tier a workspace guest's dev-up needs to the
        # trusted tier repository (ontology g5.runtime.cache.fleet,
        # amendments 4 and 13 and the 2026-10-12 publish-window amendment of
        # the cross-VM cache design). This step runs FIRST and ALONE: a merge
        # that changes a tier recipe (a lockfile bump changes the warm
        # tier's key) left every preview on that commit cooking the tiers
        # inside its VM until this step ran at the end of the pipeline,
        # about 75 minutes after the merge; now the tiers are published
        # minutes after the deploy starts, and every image build waits for
        # this step so the warm tier's workspace dependency cook never runs
        # beside them (the 2026-07-17 resource incident the g5dev barrier
        # below guards against). The step is the trusted producer: it pulls a tier
        # whose key the repository already holds (the repository is written
        # by this deploy identity alone, so what it holds is this step's own
        # earlier output; the first run on this ordering cooked all four
        # tiers for 19 minutes, 2026-10-12, and a deploy whose recipes did
        # not change must not pay that again), builds and pushes the rest,
        # and never reads PR CI's `g5-ci` cache, which any pull request can
        # write. Each push also moves the warm tier's
        # `g5-base-rust-warm-newest:<parent key>` name, which a guest takes
        # while its exact key is not published yet (ontology
        # g5.runtime.cache.tier-fallback). All four tiers are requested
        # explicitly: a tier already current locally returns before touching
        # its parents, so an implicit parent would not be published.
        # Best-effort by allowFailure: the deploy never depends on the
        # repository.
        G5_BASE_IMAGE_REGISTRY="${_AR_REGION}-docker.pkg.dev/${_AR_PROJECT}/${_TIER_REPOSITORY}" \
        G5_BASE_IMAGE_MIRROR_TIERS="base base-rust base-rust-warm base-node" \
          bash scripts/ensure-base-images.sh base base-rust base-rust-warm base-node
    waitFor: ['validate-release-policy']
    allowFailure: true

  - id: build-worker-base
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    dir: .
    args:
      - -c
      - |
        set -euo pipefail
        source /workspace/delivery.env
        if [[ "${_PROMOTION_MODE}" != "build" ]]; then
          echo "Skipping worker-base build in deploy mode"
          exit 0
        fi

        bash scripts/ensure-base-images.sh base

        # The registry-cache script's docker-container Buildx builder cannot
        # see the locally-built g5/base:26.04 tag (it would resolve the name
        # against Docker Hub — a squattable path). Publish the just-built tier
        # to Artifact Registry and pass the AR ref instead, the same pattern
        # cloudbuild-release uses, so the persistent mode=max registry cache
        # stays enabled (docker_images [D18]/[D5]).
        docker tag g5/base:26.04 "$${AR}/base:deploy-$${IMAGE_VERSION}"
        docker push "$${AR}/base:deploy-$${IMAGE_VERSION}"

        G5_DOCKER_CACHE_REF="$${AR}/cache-worker-base-image:latest" \
        G5_DOCKER_BUILDX_BUILDER="g5-delivery-cache-worker-base-$${IMAGE_VERSION:0:12}" \
        ./scripts/docker-build-with-registry-cache.sh \
          --tag="$${AR}/worker-base:$${IMAGE_VERSION}" \
          --tag="$${AR}/worker-base:latest" \
          --build-arg=BASE_IMAGE="$${AR}/base:deploy-$${IMAGE_VERSION}" \
          --file=infra/docker/Dockerfile.g5d-base \
          .
    waitFor: ['publish-base-tiers']

  - id: push-worker-base
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        source /workspace/delivery.env
        if [[ "${_PROMOTION_MODE}" != "build" ]]; then
          echo "Skipping worker-base push in deploy mode"
          exit 0
        fi

        docker push --all-tags "$${AR}/worker-base"
    waitFor: ['build-worker-base']

  - id: build-api
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    dir: .
    args:
      - -c
      - |
        set -euo pipefail
        source /workspace/delivery.env
        if [[ "${_PROMOTION_MODE}" != "build" ]]; then
          echo "Skipping api build in deploy mode"
          exit 0
        fi

        # sccache wiring is CONDITIONAL ([D33]): only a non-empty
        # _SCCACHE_GCS_BUCKET adds --network=host, the bucket build-arg, and
        # the token-shim credentials URL — the off state exposes no
        # credentials to Dockerfile RUNs. --network=host (not =cloudbuild):
        # this is a DOCKER_BUILDKIT build and BuildKit rejects the cloudbuild
        # network mode ("network mode cloudbuild not supported by buildkit",
        # build 3accb320). The former --cache-from flag was inert (no image
        # here is pushed with inline-cache metadata) and is removed; the
        # compile cache is sccache, not BuildKit layers.
        SCCACHE_ARGS=()
        if [[ -n "${_SCCACHE_GCS_BUCKET}" ]]; then
          # Token shim ([D33]): host-net's metadata server serves the WORKER
          # VM's untrusted identity, not the build SA (proven: canary build
          # aefb0909 — ADC_IDENTITY=cloudbuild-untrusted@gcb-prod-*, GCS 403).
          # The build-SA metadata proxy lives only on the `cloudbuild` docker
          # network, so a sidecar there mints the real g5-cloudbuild token and
          # serves it to the host-net RUN steps in the exact shape sccache's
          # SCCACHE_GCS_CREDENTIALS_URL client expects: a PLAIN GET (sccache
          # sends no Metadata-Flavor header) answered with TaskCluster JSON
          # {"accessToken": ...}. Proven end-to-end: canaries 7fb715bc (relay
          # identity+RW) and b6fca31c (plain-GET shim, GCS write 200).
          docker rm -f sccache-tokshim >/dev/null 2>&1 || true
          # The shim MUST consume the HTTP request before responding: sccache's
          # reqwest client aborts on an early-close responder ("error sending
          # request", dry-run build 374741a8 — a plain `nc -l` responder works
          # for curl but NOT for sccache). socat + a read-then-respond handler
          # fixes it; proven with the REAL sccache v0.17 binary end-to-end in
          # dry-run 5c96c2ac: strict --start-server OK, cache write + hit
          # through GCS as g5-cloudbuild.
          docker run -d --name sccache-tokshim --network=cloudbuild alpine:3.19 sh -c '
            apk add --no-cache socat >/dev/null 2>&1
            cat > /shim.sh <<"SHIMEOF"
        #!/bin/sh
        while read -r line; do
          line=$$(printf %s "$$line" | tr -d "\r")
          [ -z "$$line" ] && break
        done
        T=$$(wget -q -T 5 -t 1 --header="Metadata-Flavor: Google" -O- "http://169.254.169.254/computeMetadata/v1/instance/service-accounts/default/token" || true)
        AT=$$(printf "%s" "$$T" | sed -n "s/.*\"access_token\":\"\([^\"]*\)\".*/\1/p")
        if [ -z "$$AT" ]; then
          B="no token"
          printf "HTTP/1.1 503 Service Unavailable\r\nContent-Type: text/plain\r\nContent-Length: %s\r\nConnection: close\r\n\r\n%s" "$${#B}" "$$B"
          exit 0
        fi
        B="{\"accessToken\":\"$$AT\"}"
        printf "HTTP/1.1 200 OK\r\nContent-Type: application/json\r\nContent-Length: %s\r\nConnection: close\r\n\r\n%s" "$${#B}" "$$B"
        SHIMEOF
            chmod +x /shim.sh
            exec socat TCP-LISTEN:1338,fork,reuseaddr SYSTEM:/shim.sh' >/dev/null || true
          # EXIT trap: with set -e a failed docker build would otherwise skip
          # cleanup and leave the shim minting build-SA tokens until worker
          # teardown (review finding). The trap also covers the success path.
          trap 'docker rm -f sccache-tokshim >/dev/null 2>&1 || true' EXIT
          sleep 3
          SHIM_IP="$$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' sccache-tokshim 2>/dev/null || true)"
          SCCACHE_ARGS+=(--network=host --build-arg="SCCACHE_GCS_BUCKET=${_SCCACHE_GCS_BUCKET}")
          if [[ -n "$${SHIM_IP}" ]]; then
            SCCACHE_ARGS+=(--build-arg="SCCACHE_GCS_CREDENTIALS_URL=http://$${SHIM_IP}:1338/token")
          else
            echo "WARN: sccache token shim unavailable; compiles will run uncached (fail-soft)"
          fi
        fi
        bash scripts/ensure-base-images.sh base-rust
        docker build \
          "$${SCCACHE_ARGS[@]}" \
          --tag="$${AR}/api:$${IMAGE_VERSION}" \
          --tag="$${AR}/api:latest" \
          --build-arg=BUILDER_BASE_IMAGE=g5/base-rust:26.04 \
          --build-arg=RUNTIME_BASE_IMAGE=g5/base:26.04 \
          --file=infra/docker/Dockerfile.g5-api \
          .
    waitFor: ['publish-base-tiers']

  - id: build-g5d
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    dir: .
    args:
      - -c
      - |
        set -euo pipefail
        source /workspace/delivery.env
        if [[ "${_PROMOTION_MODE}" != "build" ]]; then
          echo "Skipping g5d build in deploy mode"
          exit 0
        fi

        # Same conditional sccache wiring as build-api ([D33]: --network=host
        # for BuildKit compatibility + the cloudbuild-network token shim for
        # the build-SA identity); serialized after it, so an enabled compile
        # reads the entries build-api wrote.
        SCCACHE_ARGS=()
        if [[ -n "${_SCCACHE_GCS_BUCKET}" ]]; then
          # Token shim ([D33]): host-net's metadata server serves the WORKER
          # VM's untrusted identity, not the build SA (proven: canary build
          # aefb0909 — ADC_IDENTITY=cloudbuild-untrusted@gcb-prod-*, GCS 403).
          # The build-SA metadata proxy lives only on the `cloudbuild` docker
          # network, so a sidecar there mints the real g5-cloudbuild token and
          # serves it to the host-net RUN steps in the exact shape sccache's
          # SCCACHE_GCS_CREDENTIALS_URL client expects: a PLAIN GET (sccache
          # sends no Metadata-Flavor header) answered with TaskCluster JSON
          # {"accessToken": ...}. Proven end-to-end: canaries 7fb715bc (relay
          # identity+RW) and b6fca31c (plain-GET shim, GCS write 200).
          docker rm -f sccache-tokshim >/dev/null 2>&1 || true
          # The shim MUST consume the HTTP request before responding: sccache's
          # reqwest client aborts on an early-close responder ("error sending
          # request", dry-run build 374741a8 — a plain `nc -l` responder works
          # for curl but NOT for sccache). socat + a read-then-respond handler
          # fixes it; proven with the REAL sccache v0.17 binary end-to-end in
          # dry-run 5c96c2ac: strict --start-server OK, cache write + hit
          # through GCS as g5-cloudbuild.
          docker run -d --name sccache-tokshim --network=cloudbuild alpine:3.19 sh -c '
            apk add --no-cache socat >/dev/null 2>&1
            cat > /shim.sh <<"SHIMEOF"
        #!/bin/sh
        while read -r line; do
          line=$$(printf %s "$$line" | tr -d "\r")
          [ -z "$$line" ] && break
        done
        T=$$(wget -q -T 5 -t 1 --header="Metadata-Flavor: Google" -O- "http://169.254.169.254/computeMetadata/v1/instance/service-accounts/default/token" || true)
        AT=$$(printf "%s" "$$T" | sed -n "s/.*\"access_token\":\"\([^\"]*\)\".*/\1/p")
        if [ -z "$$AT" ]; then
          B="no token"
          printf "HTTP/1.1 503 Service Unavailable\r\nContent-Type: text/plain\r\nContent-Length: %s\r\nConnection: close\r\n\r\n%s" "$${#B}" "$$B"
          exit 0
        fi
        B="{\"accessToken\":\"$$AT\"}"
        printf "HTTP/1.1 200 OK\r\nContent-Type: application/json\r\nContent-Length: %s\r\nConnection: close\r\n\r\n%s" "$${#B}" "$$B"
        SHIMEOF
            chmod +x /shim.sh
            exec socat TCP-LISTEN:1338,fork,reuseaddr SYSTEM:/shim.sh' >/dev/null || true
          # EXIT trap: with set -e a failed docker build would otherwise skip
          # cleanup and leave the shim minting build-SA tokens until worker
          # teardown (review finding). The trap also covers the success path.
          trap 'docker rm -f sccache-tokshim >/dev/null 2>&1 || true' EXIT
          sleep 3
          SHIM_IP="$$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' sccache-tokshim 2>/dev/null || true)"
          SCCACHE_ARGS+=(--network=host --build-arg="SCCACHE_GCS_BUCKET=${_SCCACHE_GCS_BUCKET}")
          if [[ -n "$${SHIM_IP}" ]]; then
            SCCACHE_ARGS+=(--build-arg="SCCACHE_GCS_CREDENTIALS_URL=http://$${SHIM_IP}:1338/token")
          else
            echo "WARN: sccache token shim unavailable; compiles will run uncached (fail-soft)"
          fi
        fi
        # Dockerfile.g5d builds on the shared tiers (docker_images D18); the dev
        # tier tags are local-only (D5), so build them here before the leaf.
        bash scripts/ensure-base-images.sh base-rust
        docker build \
          "$${SCCACHE_ARGS[@]}" \
          --build-arg="BASE_IMAGE=$${AR}/worker-base:$${IMAGE_VERSION}" \
          --tag="$${AR}/g5d:$${IMAGE_VERSION}" \
          --tag="$${AR}/g5d:latest" \
          --build-arg=BUILDER_BASE_IMAGE=g5/base-rust:26.04 \
          --file=infra/docker/Dockerfile.g5d \
          .
    # Both this image and build-api perform full release-mode Rust compiles.
    # Keep them serialized: on the then-shared E2_HIGHCPU_8 worker, concurrent runs
    # repeatedly exhausted memory (INTERNAL_ERROR; rustc SIGKILL in build
    # 68d39793). push-worker-base remains required for this image's base layer.
    waitFor: ['push-worker-base', 'build-api']

