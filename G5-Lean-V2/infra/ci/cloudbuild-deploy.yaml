        if [[ "${_PROMOTION_MODE}" != "build" ]]; then
          echo "Skipping g5d-g5dev push in deploy mode"
          exit 0
        fi

        docker push --all-tags "$${AR}/g5d-g5dev"
    waitFor: ['build-g5d-g5dev']

  - id: publish-workload-templates
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        source /workspace/delivery.env
        if [[ "${_PROMOTION_MODE}" != "build" ]]; then
          echo "Deploy-only: reuse OCI-digest-bound workload companions"
          echo "reused" > /workspace/workload-templates.ok
          exit 0
        fi
        # Serialize the large templates; no customer repository is required.
        # Runs beside the deploy sequence (resolve-image-refs waits on the
        # pushes, not on this step): a host that meets the new base digest
        # before its companion is published treats the miss as a cache miss
        # and formats the template locally (g5.scope.deployment.workload_templates).
        #
        # This step never fails: a failing step cancels the build's other
        # running steps, which would abort a Helm upgrade in flight. A
        # publication failure stops the loop, is logged, and leaves the
        # success marker unwritten; confirm-workload-templates turns the
        # missing marker into a red build only after the deploy phase has
        # ended, so the failure still reaches the delivery alerts.
        publish_rc=0
        for environment in g5d-g5dev g5d-tungsten g5d-pairsoft-preview g5d-pnc-bankworkflow g5d-pnc-cash-receipt; do
          tagged="$${AR}/$${environment}:$${IMAGE_VERSION}"
          docker pull "$$tagged" || { publish_rc=$$?; break; }
          pinned="$$(docker inspect --format='{{index .RepoDigests 0}}' "$$tagged")" || { publish_rc=$$?; break; }
          bash scripts/publish-workload-template.sh "$$pinned" "$${AR}/g5d:$${IMAGE_VERSION}" "${_WORKLOAD_TEMPLATE_SIZE_MIB}" || { publish_rc=$$?; break; }
        done
        if [[ "$${publish_rc}" -eq 0 ]]; then
          echo "published" > /workspace/workload-templates.ok
        else
          echo "WARN: workload template publication failed for $${environment} (exit $${publish_rc}); confirm-workload-templates will fail this build once the deploy phase has ended"
        fi
        exit 0
    waitFor: ['push-g5d-g5dev']

  - id: warm-guest-sccache
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    dir: .
    args:
      - -c
      - |
        set -euo pipefail
        source /workspace/delivery.env
        if [[ "${_PROMOTION_MODE}" != "build" || -z "${_SCCACHE_GCS_BUCKET}" || -z "${_GUEST_SCCACHE_ORG_ID}" ]]; then
          echo "Skipping guest sccache warm (deploy mode, no bucket or no org)"
          exit 0
        fi
        # Fleet sccache producer (ontology g5.runtime.cache.fleet): the
        # objects must be keyed exactly as a guest's cargo keys them, so the
        # compile runs INSIDE the g5dev image just pushed, as uid 1000, with
        # the checkout at the guest's path (/work/code), through the image's
        # own launchers (CARGO_HOME, CARGO_INCREMENTAL, rustflags, profile),
        # and with the runner's own compile phase. sccache writes to the
        # organization's prefix through the same build-SA token shim the api
        # build uses; the guest's door reads that prefix read-only.
        docker rm -f guest-sccache-tokshim >/dev/null 2>&1 || true
        docker run -d --name guest-sccache-tokshim --network=cloudbuild alpine:3.19 sh -c '
          apk add --no-cache socat >/dev/null 2>&1
          cat > /shim.sh <<"SHIMEOF"
        #!/bin/sh
        while read -r line; do
          line=$$(printf %s "$$line" | tr -d "\r")
          [ -z "$$line" ] && break
        done
        T=$$(wget -q -T 5 -t 1 --header="Metadata-Flavor: Google" -O- "http://169.254.169.254/computeMetadata/v1/instance/service-accounts/default/token" || true)
        AT=$$(printf "%s" "$$T" | sed -n "s/.*\"access_token\":\"\([^\"]*\)\".*/\1/p")
        if [ -z "$$AT" ]; then
          B="no token"
          printf "HTTP/1.1 503 Service Unavailable\r\nContent-Type: text/plain\r\nContent-Length: %s\r\nConnection: close\r\n\r\n%s" "$${#B}" "$$B"
          exit 0
        fi
        B="{\"accessToken\":\"$$AT\"}"
        printf "HTTP/1.1 200 OK\r\nContent-Type: application/json\r\nContent-Length: %s\r\nConnection: close\r\n\r\n%s" "$${#B}" "$$B"
        SHIMEOF
          chmod +x /shim.sh
          exec socat TCP-LISTEN:1338,fork,reuseaddr SYSTEM:/shim.sh' >/dev/null
        trap 'docker rm -f guest-sccache-tokshim guest-sccache-warm >/dev/null 2>&1 || true' EXIT
        sleep 3
        SHIM_IP="$$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' guest-sccache-tokshim)"
        [[ -n "$${SHIM_IP}" ]] || { echo "token shim unavailable; skipping guest sccache warm"; exit 0; }
        # The checkout is copied into the container's own volume so the
        # compile writes its target dir there, not into /workspace.
        # A failure here is best-effort for the deploy but must never be
        # silent: the build disk and image usage are printed before the
        # compile, and the runner's log tails, the disk and the sccache
        # stats after a failure (the runner itself only names its log files).
        df -h /workspace | sed 's/^/build disk: /'
        docker system df 2>/dev/null | sed 's/^/docker: /'
        docker rm -f guest-sccache-warm >/dev/null 2>&1 || true
        docker create --name guest-sccache-warm --network=host --user 1000:1000 \
          -e HOME=/home/agent \
          -e SCCACHE_GCS_BUCKET="${_SCCACHE_GCS_BUCKET}" \
          -e SCCACHE_GCS_KEY_PREFIX="${_GUEST_SCCACHE_PREFIX}/orgs/${_GUEST_SCCACHE_ORG_ID}" \
          -e SCCACHE_GCS_RW_MODE=READ_WRITE \
          -e SCCACHE_GCS_CREDENTIALS_URL="http://$${SHIM_IP}:1338/token" \
          -e SCCACHE_IGNORE_SERVER_IO_ERROR=1 \
          -w /work \
          "$${AR}/g5d-g5dev:$${IMAGE_VERSION}" \
          bash -uo pipefail -c '
            mkdir -p /work/code && cp -a --no-preserve=ownership /workspace-src/. /work/code/ && rm -rf /work/code/target && cd /work/code || exit 1
            df -h / /tmp | sed "s/^/guest disk: /"
            ./scripts/test-parallel.sh compile; rc=$$?
            if [ "$$rc" -ne 0 ]; then
              for f in /tmp/g5-test-*.log; do echo "== $$f (last 80 lines)"; tail -n 80 "$$f"; done
              df -h / /tmp | sed "s/^/guest disk after failure: /"
            fi
            timeout -k 5s 15s sccache --show-stats || true
            exit "$$rc"'
        docker cp /workspace/. guest-sccache-warm:/workspace-src
        docker start -a guest-sccache-warm
    waitFor: ['publish-workload-templates']
    allowFailure: true

  - id: resolve-image-refs
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        source /workspace/delivery.env

        resolve_ref() {
          local image="$1"
          docker inspect --format='{{range .RepoDigests}}{{println .}}{{end}}' "$${image}" | head -n 1 | tr -d '\r'
        }

        if [[ "${_PROMOTION_MODE}" == "build" ]]; then
          API_IMAGE_REF="$$(resolve_ref "$${AR}/api:$${IMAGE_VERSION}")"
          G5D_IMAGE_REF="$$(resolve_ref "$${AR}/g5d:$${IMAGE_VERSION}")"
          G5D_TUNGSTEN_IMAGE_REF="$$(resolve_ref "$${AR}/g5d-tungsten:$${IMAGE_VERSION}")"
          G5D_PAIRSOFT_PREVIEW_IMAGE_REF="$$(resolve_ref "$${AR}/g5d-pairsoft-preview:$${IMAGE_VERSION}")"
          G5D_PNC_BANKWORKFLOW_IMAGE_REF="$$(resolve_ref "$${AR}/g5d-pnc-bankworkflow:$${IMAGE_VERSION}")"
          G5D_PNC_CASH_RECEIPT_IMAGE_REF="$$(resolve_ref "$${AR}/g5d-pnc-cash-receipt:$${IMAGE_VERSION}")"
          G5D_G5DEV_IMAGE_REF="$$(resolve_ref "$${AR}/g5d-g5dev:$${IMAGE_VERSION}")"
          EDGE_IMAGE_REF="$$(resolve_ref "$${AR}/edge:$${IMAGE_VERSION}")"
        else
          API_IMAGE_REF="${_API_IMAGE_REF}"
          G5D_IMAGE_REF="${_G5D_IMAGE_REF}"
          G5D_TUNGSTEN_IMAGE_REF="${_G5D_TUNGSTEN_IMAGE_REF}"
          G5D_PAIRSOFT_PREVIEW_IMAGE_REF="${_G5D_PAIRSOFT_PREVIEW_IMAGE_REF}"
          G5D_PNC_BANKWORKFLOW_IMAGE_REF="${_G5D_PNC_BANKWORKFLOW_IMAGE_REF}"
          G5D_PNC_CASH_RECEIPT_IMAGE_REF="${_G5D_PNC_CASH_RECEIPT_IMAGE_REF}"
          G5D_G5DEV_IMAGE_REF="${_G5D_G5DEV_IMAGE_REF}"
          EDGE_IMAGE_REF="${_EDGE_IMAGE_REF}"
        fi

        # These refs are written to a shell handoff file. Validate the whole
        # value before that file can be sourced, including optional runtimes.
        immutable_ref_pattern='^[a-zA-Z0-9._:/-]+@sha256:[[:xdigit:]]{64}$$'
        for optional_ref in "$${G5D_TUNGSTEN_IMAGE_REF}" "$${G5D_PAIRSOFT_PREVIEW_IMAGE_REF}" \
                            "$${G5D_PNC_BANKWORKFLOW_IMAGE_REF}" "$${G5D_PNC_CASH_RECEIPT_IMAGE_REF}" "$${G5D_G5DEV_IMAGE_REF}"; do
          if [[ -n "$${optional_ref}" && ! "$${optional_ref}" =~ $${immutable_ref_pattern} ]]; then
            echo "Expected a complete immutable runtime image reference"
            exit 1
          fi
        done
        for image_ref in "$${API_IMAGE_REF}" "$${G5D_IMAGE_REF}" "$${EDGE_IMAGE_REF}"; do
          if [[ ! "$${image_ref}" =~ $${immutable_ref_pattern} ]]; then
            echo "Expected immutable image ref, got: $${image_ref}"
            exit 1
          fi
        done
        # The g5d-tungsten image is the Tungsten microVM base (worker-host
        # tfvars pin its digest); deploy-mode promotions may leave it empty
        # when no new digest is being carried forward.
        if [[ -n "$${G5D_TUNGSTEN_IMAGE_REF}" && "$${G5D_TUNGSTEN_IMAGE_REF}" != *@sha256:* ]]; then
          echo "Expected immutable g5d-tungsten image ref, got: $${G5D_TUNGSTEN_IMAGE_REF}"
          exit 1
        fi
        # The PairSoft preview image is a customer preview microVM base. It is
        # carried through promotion when present, but deploy-only runs may omit
        # it when no PairSoft preview runtime digest is being promoted.
        if [[ -n "$${G5D_PAIRSOFT_PREVIEW_IMAGE_REF}" && "$${G5D_PAIRSOFT_PREVIEW_IMAGE_REF}" != *@sha256:* ]]; then
          echo "Expected immutable g5d-pairsoft-preview image ref, got: $${G5D_PAIRSOFT_PREVIEW_IMAGE_REF}"
          exit 1
        fi
        # The PNC BankWorkflow image is a customer microVM base. It is carried
        # through promotion when present, but deploy-only runs may omit it when
        # no PNC runtime digest is being promoted.
        if [[ -n "$${G5D_PNC_BANKWORKFLOW_IMAGE_REF}" && "$${G5D_PNC_BANKWORKFLOW_IMAGE_REF}" != *@sha256:* ]]; then
          echo "Expected immutable g5d-pnc-bankworkflow image ref, got: $${G5D_PNC_BANKWORKFLOW_IMAGE_REF}"
          exit 1
        fi
        # The PNC Cash Receipt image is a customer preview microVM base. It is
        # optional in deploy-only runs but immutable whenever it is carried.
        pnc_digest_pattern='^[^@[:space:]]+@sha256:[[:xdigit:]]{64}$$'
        if [[ -n "$${G5D_PNC_CASH_RECEIPT_IMAGE_REF}" && ! "$${G5D_PNC_CASH_RECEIPT_IMAGE_REF}" =~ $${pnc_digest_pattern} ]]; then
          echo "Expected immutable g5d-pnc-cash-receipt image ref, got: $${G5D_PNC_CASH_RECEIPT_IMAGE_REF}"
          exit 1
        fi
        # The g5dev image is the G5-on-G5 self-development microVM base. It is
        # carried through promotion when present, but deploy-only runs may omit
        # it when no g5dev runtime digest is being promoted.
        if [[ -n "$${G5D_G5DEV_IMAGE_REF}" && "$${G5D_G5DEV_IMAGE_REF}" != *@sha256:* ]]; then
          echo "Expected immutable g5d-g5dev image ref, got: $${G5D_G5DEV_IMAGE_REF}"
          exit 1
        fi

        cat > /workspace/image-refs.env <<EOF
        export AR=$${AR}
        export IMAGE_VERSION=$${IMAGE_VERSION}
        export API_IMAGE_REF=$${API_IMAGE_REF}
        export G5D_IMAGE_REF=$${G5D_IMAGE_REF}
        export G5D_TUNGSTEN_IMAGE_REF=$${G5D_TUNGSTEN_IMAGE_REF}
        export G5D_PAIRSOFT_PREVIEW_IMAGE_REF=$${G5D_PAIRSOFT_PREVIEW_IMAGE_REF}
        export G5D_PNC_BANKWORKFLOW_IMAGE_REF=$${G5D_PNC_BANKWORKFLOW_IMAGE_REF}
        export G5D_PNC_CASH_RECEIPT_IMAGE_REF=$${G5D_PNC_CASH_RECEIPT_IMAGE_REF}
        export G5D_G5DEV_IMAGE_REF=$${G5D_G5DEV_IMAGE_REF}
        export EDGE_IMAGE_REF=$${EDGE_IMAGE_REF}
        EOF
    # Waits on the image PUSHES only (ontology g5.quality.delivery.qa-deploy-order):
    # publish-workload-templates / warm-guest-sccache run beside the deploy
    # sequence that starts here, not in front of it. Serializing them ahead
    # of Helm put 47-82 min before check-main-freshness and starved QA of
    # merges (4/21 deploys on 2026-10-20, issue #684).
    waitFor: ['push-api', 'push-g5d', 'push-g5d-tungsten', 'push-g5d-pairsoft-preview', 'push-g5d-pnc-bankworkflow', 'push-g5d-pnc-cash-receipt', 'push-g5d-g5dev', 'push-worker-base', 'push-edge']

  - id: report-artifacts
    name: gcr.io/cloud-builders/gcloud
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        source /workspace/image-refs.env
        echo "API image:  $${API_IMAGE_REF}"
        echo "G5D image:  $${G5D_IMAGE_REF}"
        echo "PairSoft preview image: $${G5D_PAIRSOFT_PREVIEW_IMAGE_REF:-<not set>}"
        echo "PNC BankWorkflow image: $${G5D_PNC_BANKWORKFLOW_IMAGE_REF:-<not set>}"
        echo "PNC Cash Receipt image: $${G5D_PNC_CASH_RECEIPT_IMAGE_REF:-<not set>}"
        echo "G5 selfdev image: $${G5D_G5DEV_IMAGE_REF:-<not set>}"
        echo "Edge image: $${EDGE_IMAGE_REF}"
    waitFor: ['resolve-image-refs']

  - id: wait-deploy-turn
    name: gcr.io/cloud-builders/gcloud
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        source /workspace/image-refs.env

        current_build="${BUILD_ID}"
        current_create="$$(gcloud builds describe "$${current_build}" \
          --region="${_AR_REGION}" \
          --project="$PROJECT_ID" \
          --format='value(createTime)' 2>/dev/null || true)"

        if [[ -z "$${current_create}" ]]; then
          echo "Could not resolve createTime for current build $${current_build}"
          exit 1
        fi

        poll_seconds="${_DEPLOY_QUEUE_POLL_SECONDS}"
        timeout_seconds="${_DEPLOY_QUEUE_TIMEOUT_SECONDS}"
        if ! [[ "$${poll_seconds}" =~ ^[0-9]+$ && "$${poll_seconds}" -gt 0 ]]; then
          echo "_DEPLOY_QUEUE_POLL_SECONDS must be a positive integer, got '$${poll_seconds}'"
          exit 1
        fi
        if ! [[ "$${timeout_seconds}" =~ ^[0-9]+$ && "$${timeout_seconds}" -gt 0 ]]; then
          echo "_DEPLOY_QUEUE_TIMEOUT_SECONDS must be a positive integer, got '$${timeout_seconds}'"
          exit 1
        fi

        echo "Waiting for deploy turn: env=${_ENVIRONMENT}, target_project=${_TARGET_PROJECT}, build=$${current_build}, created=$${current_create}"

        deploy_complete_step=smoke-test
        if [[ "${_ENVIRONMENT}" != "qa" ]]; then
          deploy_complete_step=promote-release
        fi

        start_seconds=$${SECONDS}
        while true; do
          # Per-step status is reported for in-flight builds, so an older
          # QA build blocks only through smoke-test; target releases retain
          # their turn through acceptance and promotion. QA companion work
          # does not hold the queue (g5.quality.delivery.qa-deploy-order). The
          # predicate lives in the unit-tested scripts/deploy_queue_blockers.py.
          gcloud builds list \
            --ongoing \
            --limit=100 \
            --region="${_AR_REGION}" \
            --project="$PROJECT_ID" \
            --format='json(id,createTime,status,approval,substitutions,steps[].id,steps[].status)' \
            > /workspace/ongoing-deploy-builds.json

          python3 ./scripts/deploy_queue_blockers.py \
            --builds-json /workspace/ongoing-deploy-builds.json \
            --current-build-id "$${current_build}" \
            --current-create-time "$${current_create}" \
            --environment "${_ENVIRONMENT}" \
            --target-project "${_TARGET_PROJECT}" \
            --deploy-complete-step "$${deploy_complete_step}" \
            > /workspace/deploy-blockers.txt

          if [[ ! -s /workspace/deploy-blockers.txt ]]; then
            waited=$((SECONDS - start_seconds))
            echo "Deploy queue clear after $${waited}s for ${_ENVIRONMENT}/${_TARGET_PROJECT}"
            cat > /workspace/deploy-queue.env <<EOF
        export DEPLOY_QUEUE_WAIT_SECONDS=$${waited}
        export DEPLOY_QUEUE_BUILD_CREATE_TIME=$${current_create}
        EOF
            exit 0
          fi

          waited=$((SECONDS - start_seconds))
          if [[ "$${waited}" -ge "$${timeout_seconds}" ]]; then
            echo "Timed out after $${waited}s waiting for older deploy builds:"
            cat /workspace/deploy-blockers.txt
            exit 1
          fi

          echo "Older deploy build(s) still own the ${_ENVIRONMENT}/${_TARGET_PROJECT} queue (createTime, id, commit, trigger, $${deploy_complete_step} status):"
          cat /workspace/deploy-blockers.txt
          sleep "$${poll_seconds}"
        done
    waitFor: ['report-artifacts']

  - id: verify-release-provenance
    name: gcr.io/cloud-builders/gcloud
    entrypoint: bash
    env:
      - '_EXTERNAL_ACCESS_ENABLED=${_EXTERNAL_ACCESS_ENABLED}'
      - '_APP_HOSTNAME=${_APP_HOSTNAME}'
      - '_PREVIEW_HOSTNAME=${_PREVIEW_HOSTNAME}'
      - '_INGRESS_STATIC_IP_NAME=${_INGRESS_STATIC_IP_NAME}'
      - '_CERTIFICATE_MAP_NAME=${_CERTIFICATE_MAP_NAME}'
    args:
      - -c
      - |
        set -euo pipefail
        export PROJECT_ID="${PROJECT_ID}"
        export BUILD_ID="${BUILD_ID}"
        export COMMIT_SHA="${COMMIT_SHA}"
        export _ARTIFACT_PROJECT="${_ARTIFACT_PROJECT}"
        export _AR_PROJECT="${_AR_PROJECT}"
        export _WORKER_IMAGE_PROJECT="${_WORKER_IMAGE_PROJECT}"
        export _AR_REGION="${_AR_REGION}"
        export _AR_REPOSITORY="${_AR_REPOSITORY}"
        export _ENVIRONMENT="${_ENVIRONMENT}"
        export _TARGET_PROJECT="${_TARGET_PROJECT}"
        export _GKE_CLUSTER="${_GKE_CLUSTER}"
        export _GKE_ZONE="${_GKE_ZONE}"
        export _HELM_NAMESPACE="${_HELM_NAMESPACE}"
        export _RELEASE_BUCKET="${_RELEASE_BUCKET}"
        export _RELEASE_MANIFEST="${_RELEASE_MANIFEST}"
        export _SOURCE_BUILD_ID="${_SOURCE_BUILD_ID}"
        export _WORKER_IMAGE_REF="${_WORKER_IMAGE_REF}"
        export _NEXT_TRIGGER="${_NEXT_TRIGGER}"
        export _RELEASE_CHECKS_REQUIRED="${_RELEASE_CHECKS_REQUIRED}"
        export _RELEASE_CHECK_BASE_URL="${_RELEASE_CHECK_BASE_URL}"
        export _RELEASE_CHECK_SECRET="${_RELEASE_CHECK_SECRET}"
        python3 ./scripts/app_release.py preflight
    waitFor: ['wait-deploy-turn']

  - id: check-main-freshness
    name: gcr.io/cloud-builders/kubectl
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        # Freshness/anti-rollback logic lives in the checked-in script
        # (scripts/check-main-freshness.sh): the former inline
        # script exceeded Cloud Build's 10,000-char per-arg limit and made
        # every `gcloud builds triggers run` promotion fail with
        # "build step 24 arg 1 too long" (build 267ee0ea, 2026-07-17).
        # Cloud Build substitutions are handed over as env here.
        export COMMIT_SHA="${COMMIT_SHA}" BUILD_ID="${BUILD_ID}" PROJECT_ID="$PROJECT_ID"
        export _PROMOTION_MODE="${_PROMOTION_MODE}" _TARGET_PROJECT="${_TARGET_PROJECT}"
        export _GKE_CLUSTER="${_GKE_CLUSTER}" _GKE_ZONE="${_GKE_ZONE}"
        export _HELM_NAMESPACE="${_HELM_NAMESPACE}" _AR_REGION="${_AR_REGION}"
        export _ENVIRONMENT="${_ENVIRONMENT}" _AR_REPOSITORY="${_AR_REPOSITORY}"
        export _ARTIFACT_PROJECT="${_ARTIFACT_PROJECT}" _AR_PROJECT="${_AR_PROJECT}"
        export _WORKER_IMAGE_PROJECT="${_WORKER_IMAGE_PROJECT}" _RELEASE_BUCKET="${_RELEASE_BUCKET}"
        export _GITHUB_OWNER="${_GITHUB_OWNER}" _GITHUB_REPO="${_GITHUB_REPO}"
        export _GITHUB_CONNECTION="${_GITHUB_CONNECTION}" _GITHUB_CONNECTION_REPOSITORY="${_GITHUB_CONNECTION_REPOSITORY}"
        exec bash ./scripts/check-main-freshness.sh
    waitFor: ['verify-release-provenance']

  # Read automatic scan results beside deployment; scanner failures/findings
  # must neither interrupt Helm nor become a release/promotion prerequisite.
  - id: report-image-cves
    name: gcr.io/cloud-builders/gcloud
    entrypoint: bash
    allowFailure: true
    timeout: 180s
    args:
      - -c
      - |
        set -euo pipefail
        if [[ "${_ENVIRONMENT}" != "prod" ]]; then
          echo "Skipping CVE report outside production"
          exit 0
        fi
        source /workspace/deploy-control.env
        if [[ "$${SKIP_DEPLOY}" == "true" ]]; then
          echo "Skipping CVE report for superseded/already-deployed release"
          exit 0
        fi
        source /workspace/image-refs.env
        python3 ./scripts/report_image_cves.py
    waitFor: ['check-main-freshness']

  # Pin the worker boot image to the promoted commit (cloudbuild_pipelines
  # [D30], helm [D27]; issues #1860/#1883): resolve the g5-worker image whose
  # g5_git_short_sha matches COMMIT_SHA — else the newest local-history
  # ancestor (proofs outrank heuristics), else the conservative
  # created-at-or-before-the-commit fallback — and hand it to helm-deploy for
  # --set-string api.env.G5_WORKER_IMAGE. Runs AFTER check-main-freshness and
  # honors SKIP_DEPLOY so a stale/already-deployed promotion keeps its green
  # clean-skip contract; on non-skip runs, no eligible image fails the deploy
  # here, before any environment mutation (fail-closed); the values files
  # carry only the DEPLOY-INJECTED sentinel.
  - id: resolve-worker-image
    name: gcr.io/cloud-builders/gcloud
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        source /workspace/deploy-control.env
        if [[ "$${SKIP_DEPLOY}" == "true" ]]; then
          echo "Skipping worker-image resolution for stale artifact $${ARTIFACT_COMMIT} (clean skip)"
          exit 0
        fi
        if [[ "${_PROMOTION_MODE}" == "deploy" ]]; then
          WORKER_IMAGE_REF="$$(python3 ./scripts/resolve_worker_image.py \
            --build-project "$PROJECT_ID" \
            --project "${_WORKER_IMAGE_PROJECT}" \
            --family "${_WORKER_IMAGE_FAMILY}" \
            --provided-ref "${_WORKER_IMAGE_REF}")"
        elif [[ -n "${_WORKER_IMAGE_TRIGGER}" ]]; then
          # Worker-image gate (scripts/await_worker_image.py): pin the newest
          # READY image whose commit is the promoted commit or an ancestor
          # and whose diff to the promoted commit touches none of the
          # worker-image trigger's own includedFiles (local history, else
          # the GitHub compare API through the connection's read token).
          # When worker inputs changed since that image, wait for the
          # trigger's bake of any commit in that range and pin its image.
          # If rechecks find no bake, start one at this commit and await it.
          # A failed start/bake fails this deploy, as does a disabled trigger
          # for any pin other than the promoted commit's own image.
          WORKER_IMAGE_REF="$$(python3 ./scripts/await_worker_image.py \
            --project "${_WORKER_IMAGE_PROJECT}" \
            --family "${_WORKER_IMAGE_FAMILY}" \
            --commit "${COMMIT_SHA}" \
            --repo-dir . \
            --build-project "$PROJECT_ID" \
            --region "${_AR_REGION}" \
            --trigger "${_WORKER_IMAGE_TRIGGER}" \
            --wait-mins "${_WORKER_IMAGE_WAIT_MINS}" \
            --github-owner "${_GITHUB_OWNER}" \
            --github-repo "${_GITHUB_REPO}" \
            --github-connection "${_GITHUB_CONNECTION}" \
            --github-connection-repository "${_GITHUB_CONNECTION_REPOSITORY}")"
        else
          WORKER_IMAGE_REF="$$(python3 ./scripts/resolve_worker_image.py \
            --build-project "$PROJECT_ID" \
            --project "${_WORKER_IMAGE_PROJECT}" \
            --family "${_WORKER_IMAGE_FAMILY}" \
            --commit "${COMMIT_SHA}" \
            --repo-dir .)"
        fi
        echo "WORKER_IMAGE_REF=$${WORKER_IMAGE_REF}" > /workspace/worker-image.env
        echo "Pinned worker boot image: $${WORKER_IMAGE_REF}"
    waitFor: ['check-main-freshness']

  - id: gke-auth
    name: gcr.io/cloud-builders/gcloud
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        source /workspace/deploy-control.env
        if [[ "$${SKIP_DEPLOY}" == "true" ]]; then
          echo "Skipping gke-auth for stale artifact $${ARTIFACT_COMMIT}; deploy freshness head is $${DEPLOY_FRESHNESS_HEAD}"
          exit 0
        fi

        if [[ -z "${_GKE_CLUSTER}" || -z "${_GKE_ZONE}" ]]; then
          # With the worker-only deploy path retired, an empty control-plane
          # cluster can only be a trigger/substitution regression — fail
          # loudly instead of letting the whole deploy no-op to green.
          echo "_GKE_CLUSTER and _GKE_ZONE are required"
          exit 1
        fi
        gcloud container clusters get-credentials "${_GKE_CLUSTER}" \
          --location="${_GKE_ZONE}" \
          --project="${_TARGET_PROJECT}"
    waitFor: ['check-main-freshness']

  - id: helm-deploy
    name: gcr.io/cloud-builders/gcloud
    entrypoint: bash
    env:
      - '_EXTERNAL_ACCESS_ENABLED=${_EXTERNAL_ACCESS_ENABLED}'
      - '_APP_HOSTNAME=${_APP_HOSTNAME}'
      - '_PREVIEW_HOSTNAME=${_PREVIEW_HOSTNAME}'
      - '_INGRESS_STATIC_IP_NAME=${_INGRESS_STATIC_IP_NAME}'
      - '_CERTIFICATE_MAP_NAME=${_CERTIFICATE_MAP_NAME}'
    args:
      - -c
      - |
        set -euo pipefail
        source /workspace/deploy-control.env
        if [[ "$${SKIP_DEPLOY}" == "true" ]]; then
          echo "Skipping helm deploy for stale artifact $${ARTIFACT_COMMIT}; deploy freshness head is $${DEPLOY_FRESHNESS_HEAD}"
          exit 0
        fi

        source /workspace/delivery.env
        source /workspace/image-refs.env

        # Deploy-pinned worker boot image (cloudbuild_pipelines [D30], helm
        # [D27]): resolve-worker-image wrote the concrete ref; the values
        # files only carry the DEPLOY-INJECTED sentinel, which the chart
        # refuses to render, so this injection is mandatory — fail loudly
        # here rather than at helm template time.
        source /workspace/worker-image.env
        if [[ -z "$${WORKER_IMAGE_REF:-}" ]]; then
          echo "WORKER_IMAGE_REF missing from /workspace/worker-image.env (resolve-worker-image regression)"
          exit 1
        fi

        # Version-pinned, checksum-verified helm install (cloudbuild_pipelines
        # [D31]): the old `get-helm-3 | bash` executed a mutable script from
        # helm's main branch with the build SA and floated to upstream's
        # newest release (helm v4 now exists on that path). Bumping the
        # version means updating BOTH constants below from
        # https://get.helm.sh/helm-<ver>-linux-amd64.tar.gz.sha256sum.
        HELM_VERSION="v3.21.4"
        HELM_SHA256="61f88ab166748cb19604d7884cb100ae9ccb13804ddeb98e08af167eacbb6a14"
        curl -fsSL -o /tmp/helm.tar.gz "https://get.helm.sh/helm-$${HELM_VERSION}-linux-amd64.tar.gz"
        echo "$${HELM_SHA256}  /tmp/helm.tar.gz" | sha256sum -c - || {
          echo "FATAL: helm $${HELM_VERSION} tarball checksum mismatch"; exit 1; }
        tar -xzf /tmp/helm.tar.gz -C /tmp linux-amd64/helm
        install -m 0755 /tmp/linux-amd64/helm /usr/local/bin/helm
        helm version --short

        HELM_ARGS=()
        # Pre-upgrade schema changes may already be committed when readiness
        # fails. Keep the candidate for forward recovery, never restore an old
        # image automatically against a contracted schema. --wait remains below.
        echo "QA delivery: automatic Helm rollback is disabled; recover forward"
        HELM_ARGS+=(--set-string api.env.G5_WORKER_IMAGE="$${WORKER_IMAGE_REF}")

        # Follow G5's existing ingress configuration. Terraform/DNS preparation
        # precedes bootstrap deployment; the operator attaches the certificate
        # map to the GKE HTTPS proxy before enabling normal promotion.
        # Never remove the controller's pre-shared-cert annotation.
        if [[ "${_ENVIRONMENT}" != "qa" && "$${_EXTERNAL_ACCESS_ENABLED}" == "true" ]]; then
          HELM_ARGS+=(--set ingress.enabled=true --set ingress.managedCertificate.enabled=true)
          HELM_ARGS+=(--set-string "ingress.host=$${_APP_HOSTNAME}")
          HELM_ARGS+=(--set-string "ingress.annotations.kubernetes\\.io/ingress\\.global-static-ip-name=$${_INGRESS_STATIC_IP_NAME}")
          HELM_ARGS+=(--set-string "ingress.annotations.networking\\.gke\\.io/managed-certificates=g5-${_ENVIRONMENT}-cert")
          HELM_ARGS+=(--set-string "ingress.managedCertificate.name=g5-${_ENVIRONMENT}-cert")
          HELM_ARGS+=(--set-string "ingress.managedCertificate.domains[0]=$${_APP_HOSTNAME}")
          HELM_ARGS+=(--set previewWildcard.enabled=true)
          HELM_ARGS+=(--set-string "previewWildcard.hostSuffix=$${_PREVIEW_HOSTNAME}")
          HELM_ARGS+=(--set-string "previewWildcard.certMapName=$${_CERTIFICATE_MAP_NAME}")
        fi
        # Filestore IP is only needed when deploying the control plane (the
        # API workload mounts it). Defensive: a worker-only deploy would
        # leave _GKE_CLUSTER (and _GKE_ZONE) empty, making the gcloud lookup
        # resolve to a bogus zone "-a" — skip it cleanly when there's no
        # control plane to deploy. (No current trigger hits this path.)
        if [[ -n "${_GKE_CLUSTER}" ]]; then
          FILESTORE_INSTANCE="${_FILESTORE_INSTANCE}"
          FILESTORE_ZONE="${_FILESTORE_ZONE}"
          if [[ -z "$${FILESTORE_INSTANCE}" ]]; then
            FILESTORE_INSTANCE="g5-${_ENVIRONMENT}-repos"
          fi
          if [[ -z "$${FILESTORE_ZONE}" ]]; then
            FILESTORE_ZONE="${_GKE_ZONE}-a"
          fi
          FILESTORE_IP="$(gcloud filestore instances describe "$${FILESTORE_INSTANCE}" \
            --zone="$${FILESTORE_ZONE}" \
            --project="$${TARGET_PROJECT}" \
            --format='value(networks[0].ipAddresses[0])' 2>/dev/null || true)"

          if [[ -n "$${FILESTORE_IP}" ]]; then
            HELM_ARGS+=(--set-string filestore.ip="$${FILESTORE_IP}")
            HELM_ARGS+=(--set-string filestore.shareName="g5_repos")
            HELM_ARGS+=(--set-string filestore.pvName="${_FILESTORE_PV_NAME}")
            HELM_ARGS+=(--set-string filestore.storage="${_FILESTORE_STORAGE}")
            HELM_ARGS+=(--set-string api.filestore.pvcName="${_FILESTORE_PVC_NAME}")
            echo "Using Filestore $${FILESTORE_INSTANCE} ($${FILESTORE_ZONE}) at $${FILESTORE_IP}"
          else
            echo "Filestore instance $${FILESTORE_INSTANCE} was not found in $${FILESTORE_ZONE}"
            exit 1
          fi
        else
          echo "Skipping Filestore lookup (no _GKE_CLUSTER — worker-only deploy)"
        fi

        # Promoted customer-image digests for org-default tracking (infra
        # ontology [D27], worker_hosts [D52]): comma-join the non-empty refs
        # already resolved into image-refs.env and hand them to g5-api as
        # G5_PROMOTED_BASE_IMAGES. Deploy-only promotion runs that carry no
        # new digest omit the var entirely — g5-api's seeding treats absence
        # as keep-everything, so this must stay optional, never required.
        PROMOTED_BASE_IMAGES=""
        for ref in "$${G5D_PAIRSOFT_PREVIEW_IMAGE_REF:-}" "$${G5D_PNC_BANKWORKFLOW_IMAGE_REF:-}" \
                   "$${G5D_PNC_CASH_RECEIPT_IMAGE_REF:-}" \
                   "$${G5D_TUNGSTEN_IMAGE_REF:-}" "$${G5D_G5DEV_IMAGE_REF:-}"; do
          if [[ -n "$${ref}" ]]; then
            PROMOTED_BASE_IMAGES="$${PROMOTED_BASE_IMAGES:+$${PROMOTED_BASE_IMAGES},}$${ref}"
          fi
        done
        if [[ -n "$${PROMOTED_BASE_IMAGES}" ]]; then
          # Helm's --set-string parser splits on unescaped commas, so escape
          # them (\,) — the rendered env var then carries the real commas the
          # g5-api parser expects.
          HELM_ARGS+=(--set-string api.env.G5_PROMOTED_BASE_IMAGES="$${PROMOTED_BASE_IMAGES//,/\\,}")
          echo "Promoted base images for org-default tracking: $${PROMOTED_BASE_IMAGES}"
        fi

        deploy_control_plane() {
          if [[ -z "${_GKE_CLUSTER}" ]]; then
            # The worker-only deploy path is retired; an empty control-plane
            # cluster is a trigger/substitution regression.
            echo "_GKE_CLUSTER is required"
            return 1
          fi

          gcloud container clusters get-credentials ${_GKE_CLUSTER} \
            --location=${_GKE_ZONE} --project="$${TARGET_PROJECT}"

          # values-control-plane.yaml is unconditional: the in-cluster worker
          # plane is retired (jobs run on bare g5-worker hosts), so every
          # control-plane release must assert topology.mode=control-plane and
          # worker.replicaCount=0 — without it, envs whose values-{env}.yaml
          # doesn't pin topology.mode would render the worker plane into the
          # platform cluster (legacy single-cluster topology).
          local values_args=(
            --values ./infra/helm/g5/values.yaml
            --values ./infra/helm/g5/values-${_ENVIRONMENT}.yaml
            --values ./infra/helm/g5/values-control-plane.yaml
          )

          # Only the quiesced manual migration may change storage identity.
          # Check before Helm can run SQL hooks or update either writer.
          python3 scripts/check_filestore_binding.py \
            --namespace "${_HELM_NAMESPACE}" \
            --pvc "${_FILESTORE_PVC_NAME}" \
            --pv "${_FILESTORE_PV_NAME}" \
            --server "$${FILESTORE_IP}" \
            --share "g5_repos"
          helm upgrade --install ${_HELM_RELEASE} ./infra/helm/g5 \
            --namespace ${_HELM_NAMESPACE} \
            --create-namespace \
            "$${values_args[@]}" \
            --set namespace=${_HELM_NAMESPACE} \
            --set global.projectId="$${TARGET_PROJECT}" \
            --set global.clusterName="${_GKE_CLUSTER}" \
            --set global.registry="$${AR}" \
            --set global.imageTag="$${IMAGE_VERSION}" \
            --set-string api.image.reference="$${API_IMAGE_REF}" \
            --set-string daemon.image.reference="$${API_IMAGE_REF}" \
            --set-string migration.image.reference="$${API_IMAGE_REF}" \
            --set-string worker.image.reference="$${G5D_IMAGE_REF}" \
            --set-string edge.image.reference="$${EDGE_IMAGE_REF}" \
            $${HELM_ARGS[@]+"$${HELM_ARGS[@]}"} \
            --timeout 10m \
            --wait
        }

        # The in-cluster worker deploy paths (standard Kata pool and Tungsten
        # privileged-DinD pool) were removed with their dedicated GKE
        # clusters: all workspaces run as Cloud Hypervisor VMs on bare g5-worker hosts.
        # Tungsten workspaces use the g5d-tungsten image (still built above) as
        # the workspace VM base image.

        deploy_control_plane
    # resolve-worker-image is an explicit dependency: helm-deploy sources
    # /workspace/worker-image.env, and without the edge Cloud Build may start
    # this step before that file exists (PR #1885 review).
    # Authentication and worker-image validation both follow the freshness
    # check; Helm must join both before it can change the cluster.
    waitFor: ['gke-auth', 'resolve-worker-image']

  - id: verify-deploy
    name: gcr.io/cloud-builders/kubectl
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        source /workspace/deploy-control.env
        if [[ "$${SKIP_DEPLOY}" == "true" ]]; then
          echo "Skipping deploy verification for stale artifact $${ARTIFACT_COMMIT}; deploy freshness head is $${DEPLOY_FRESHNESS_HEAD}"
          exit 0
        fi

        # ExternalSecret sync gate: a pre-existing Kubernetes Secret masks a
        # failing ExternalSecret, and Ready=True can be stale inside
        # refreshInterval. The checked-in, unit-tested script forces a
        # reconcile and requires every ExternalSecret in every namespace of
        # the current cluster (including legacy app namespaces) to complete
        # a fresh successful refresh, failing closed on probe/list errors.
        # Tests: scripts/test_verify_external_secrets.py

        if [[ -n "${_GKE_CLUSTER}" ]]; then
          gcloud container clusters get-credentials ${_GKE_CLUSTER} \
            --location=${_GKE_ZONE} --project=${_TARGET_PROJECT}

          echo "=== Control-Plane Deployment Status ==="
          kubectl rollout status deployment/g5-api -n ${_HELM_NAMESPACE} --timeout=300s
          kubectl rollout status deployment/g5-edge -n ${_HELM_NAMESPACE} --timeout=300s


          echo ""
          echo "=== Control-Plane Pod Status ==="
          kubectl get pods -n ${_HELM_NAMESPACE} -l app.kubernetes.io/instance=${_HELM_RELEASE}

          echo ""
          echo "=== Control-Plane Services ==="
          kubectl get svc -n ${_HELM_NAMESPACE} -l app.kubernetes.io/instance=${_HELM_RELEASE}

          python3 ./scripts/verify_external_secrets.py
        else
          echo "Skipping control-plane verify (no _GKE_CLUSTER)"
        fi

    waitFor: ['helm-deploy']

  - id: smoke-test
    # This step needs gcloud + kubectl; the curl happens inside the ephemeral pod.
    name: gcr.io/cloud-builders/kubectl
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        source /workspace/deploy-control.env
        if [[ "$${SKIP_DEPLOY}" == "true" ]]; then
          echo "Skipping smoke test for stale artifact $${ARTIFACT_COMMIT}; deploy freshness head is $${DEPLOY_FRESHNESS_HEAD}"
          exit 0
        fi

        # A worker-only deploy would leave _GKE_CLUSTER empty (no current
        # trigger does). The smoke test exercises the g5-api service on the
        # control plane and is meaningless without it, so skip the step.
        if [[ -z "${_GKE_CLUSTER}" ]]; then
          echo "Skipping smoke-test (no _GKE_CLUSTER — worker-only deploy)"
          exit 0
        fi

        gcloud container clusters get-credentials ${_GKE_CLUSTER} \
          --location=${_GKE_ZONE} --project=${_TARGET_PROJECT}

        # Dev can tolerate a missing smoke signal during bring-up, but staged
        # promotions should stop if we cannot prove the API is healthy.
        strict_smoke_test=0
        if [[ "${_ENVIRONMENT}" != "dev" ]]; then
          strict_smoke_test=1
        fi

        fail_smoke_test() {
          local message="$1"
          if [[ "$${strict_smoke_test}" == "1" ]]; then
            echo "ERROR: $${message}"
            exit 1
          fi
          echo "WARN: $${message}"
        }

        dump_smoke_debug() {
          local pod_name="$1"
          echo "=== Smoke Test Debug ==="
          kubectl get svc g5-api -n ${_HELM_NAMESPACE} -o wide || true
          kubectl get endpoints g5-api -n ${_HELM_NAMESPACE} || true
          kubectl describe pod "$${pod_name}" -n ${_HELM_NAMESPACE} || true
          kubectl logs "$${pod_name}" -n ${_HELM_NAMESPACE} || true
        }

        if kubectl get svc g5-api -n ${_HELM_NAMESPACE} >/dev/null 2>&1; then
          SMOKE_POD="smoke-test-${SHORT_SHA}"
          SMOKE_TARGET="http://g5-api.${_HELM_NAMESPACE}.svc.cluster.local:7500/healthz"
          cleanup_smoke_pod() {
            kubectl delete pod "$${SMOKE_POD}" -n ${_HELM_NAMESPACE} --ignore-not-found >/dev/null 2>&1 || true
          }
          trap cleanup_smoke_pod EXIT

          kubectl delete pod "$${SMOKE_POD}" -n ${_HELM_NAMESPACE} --ignore-not-found >/dev/null 2>&1 || true
          kubectl run "$${SMOKE_POD}" \
            -n ${_HELM_NAMESPACE} \
            --image=curlimages/curl:latest \
            --labels="g5.cloud/smoke-test=true" \
            --restart=Never \
            --command -- \
            sh -ceu "curl --fail --silent --show-error --connect-timeout 5 --max-time 20 '$${SMOKE_TARGET}'"

          phase=""
          for _ in $$(seq 1 30); do
            phase=$$(kubectl get pod "$${SMOKE_POD}" -n ${_HELM_NAMESPACE} -o jsonpath='{.status.phase}' 2>/dev/null || true)
            case "$${phase}" in
              Succeeded|Failed)
                break
                ;;
            esac
            sleep 2
          done

          if [[ "$${phase}" != "Succeeded" ]]; then
            dump_smoke_debug "$${SMOKE_POD}"
            fail_smoke_test "Smoke test pod did not succeed (phase=$${phase:-unknown})"
          fi
          kubectl logs "$${SMOKE_POD}" -n ${_HELM_NAMESPACE} || true
          trap - EXIT
          cleanup_smoke_pod
        else
          fail_smoke_test "Could not resolve g5-api service, skipping smoke test"
        fi
    waitFor: ['verify-deploy']

  - id: confirm-workload-templates
    name: gcr.io/cloud-builders/gcloud
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        if [[ -f /workspace/workload-templates.ok ]]; then
          echo "Workload templates: $$(cat /workspace/workload-templates.ok)"
          exit 0
        fi
        echo "ERROR: publish-workload-templates did not complete; see its step log. The deploy phase ran beside it and was not interrupted; hosts format missing companions locally until a later build publishes them."
        exit 1
    # Waits for the deploy phase to END (smoke-test) so this failure can never
    # cancel helm-deploy/verify-deploy/smoke-test; it reports only the
    # off-path publication (g5.quality.delivery.qa-companions-off-path).
    # publish-workload-templates always exits 0, so this step always runs.
    waitFor: ['publish-workload-templates', 'smoke-test']

  - id: required-release-checks
    name: gcr.io/cloud-builders/gcloud
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        export PROJECT_ID="${PROJECT_ID}"
        export BUILD_ID="${BUILD_ID}"
        export COMMIT_SHA="${COMMIT_SHA}"
        export _ARTIFACT_PROJECT="${_ARTIFACT_PROJECT}"
        export _AR_PROJECT="${_AR_PROJECT}"
        export _WORKER_IMAGE_PROJECT="${_WORKER_IMAGE_PROJECT}"
        export _AR_REGION="${_AR_REGION}"
        export _AR_REPOSITORY="${_AR_REPOSITORY}"
        export _ENVIRONMENT="${_ENVIRONMENT}"
        export _TARGET_PROJECT="${_TARGET_PROJECT}"
        export _GKE_CLUSTER="${_GKE_CLUSTER}"
        export _GKE_ZONE="${_GKE_ZONE}"
        export _HELM_NAMESPACE="${_HELM_NAMESPACE}"
        export _RELEASE_BUCKET="${_RELEASE_BUCKET}"
        export _RELEASE_MANIFEST="${_RELEASE_MANIFEST}"
        export _SOURCE_BUILD_ID="${_SOURCE_BUILD_ID}"
        export _WORKER_IMAGE_REF="${_WORKER_IMAGE_REF}"
        export _NEXT_TRIGGER="${_NEXT_TRIGGER}"
        export _RELEASE_CHECKS_REQUIRED="${_RELEASE_CHECKS_REQUIRED}"
        export _RELEASE_CHECK_BASE_URL="${_RELEASE_CHECK_BASE_URL}"
        export _RELEASE_CHECK_SECRET="${_RELEASE_CHECK_SECRET}"
        export _PREVIEW_HOSTNAME="${_PREVIEW_HOSTNAME}"
        if [[ "${_RELEASE_CHECKS_REQUIRED}" == "true" ]]; then
          apt-get update -qq
          apt-get install -y --no-install-recommends curl jq
        fi
        python3 ./scripts/run_release_checks.py
    waitFor: ['smoke-test']

  - id: promote-release
    name: gcr.io/cloud-builders/gcloud
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        export PROJECT_ID="${PROJECT_ID}"
        export BUILD_ID="${BUILD_ID}"
        export COMMIT_SHA="${COMMIT_SHA}"
        export _ARTIFACT_PROJECT="${_ARTIFACT_PROJECT}"
        export _AR_PROJECT="${_AR_PROJECT}"
        export _WORKER_IMAGE_PROJECT="${_WORKER_IMAGE_PROJECT}"
        export _AR_REGION="${_AR_REGION}"
        export _AR_REPOSITORY="${_AR_REPOSITORY}"
        export _ENVIRONMENT="${_ENVIRONMENT}"
        export _TARGET_PROJECT="${_TARGET_PROJECT}"
        export _GKE_CLUSTER="${_GKE_CLUSTER}"
        export _GKE_ZONE="${_GKE_ZONE}"
        export _HELM_NAMESPACE="${_HELM_NAMESPACE}"
        export _RELEASE_BUCKET="${_RELEASE_BUCKET}"
        export _RELEASE_MANIFEST="${_RELEASE_MANIFEST}"
        export _SOURCE_BUILD_ID="${_SOURCE_BUILD_ID}"
        export _WORKER_IMAGE_REF="${_WORKER_IMAGE_REF}"
        export _NEXT_TRIGGER="${_NEXT_TRIGGER}"
        export _RELEASE_CHECKS_REQUIRED="${_RELEASE_CHECKS_REQUIRED}"
        export _RELEASE_CHECK_BASE_URL="${_RELEASE_CHECK_BASE_URL}"
        export _RELEASE_CHECK_SECRET="${_RELEASE_CHECK_SECRET}"
        python3 ./scripts/app_release.py promote
    waitFor: ['required-release-checks', 'confirm-workload-templates', 'warm-guest-sccache']

# 180m overall cap: the deploy queue gate may wait up to 90m for an older
# same-environment build's deploy phase (through smoke-test) to finish, then
# the active deploy still needs the previous 90m headroom for image builds
# plus the control-plane Helm rollout, while publish-workload-templates and
# warm-guest-sccache run beside that sequence. This keeps Cloud Build from
# preempting a queued but healthy deploy.
timeout: 10800s
