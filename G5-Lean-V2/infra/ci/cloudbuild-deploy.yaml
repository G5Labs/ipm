  - id: verify-api-migrations
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    dir: .
    args:
      - -c
      - |
        set -euo pipefail
        source /workspace/delivery.env
        if [[ "${_PROMOTION_MODE}" != "build" ]]; then
          echo "Skipping api migration packaging verification in deploy mode"
          exit 0
        fi

        image="$${AR}/api:$${IMAGE_VERSION}"
        tmp_dir="$$(mktemp -d)"
        container=""
        cleanup() {
          if [[ -n "$${container}" ]]; then
            docker rm -f "$${container}" >/dev/null 2>&1 || true
          fi
          rm -rf "$${tmp_dir}"
        }
        trap cleanup EXIT

        find backend/g5-api/src/db/migrations -maxdepth 1 -type f -name '*.sql' -printf '%f\n' | sort > "$${tmp_dir}/repo-migrations.txt"
        if [[ ! -s "$${tmp_dir}/repo-migrations.txt" ]]; then
          echo "No repo migrations found under backend/g5-api/src/db/migrations"
          exit 1
        fi

        container="$$(docker create "$${image}")"
        mkdir -p "$${tmp_dir}/image-migrations"
        docker cp "$${container}:/app/migrations/." "$${tmp_dir}/image-migrations/"
        find "$${tmp_dir}/image-migrations" -maxdepth 1 -type f -name '*.sql' -printf '%f\n' | sort > "$${tmp_dir}/image-migrations.txt"

        if ! diff -u "$${tmp_dir}/repo-migrations.txt" "$${tmp_dir}/image-migrations.txt"; then
          echo "API image migration files do not match checked-out source"
          exit 1
        fi

        echo "Verified API image migration files:"
        tail -10 "$${tmp_dir}/image-migrations.txt"
    waitFor: ['build-api']

