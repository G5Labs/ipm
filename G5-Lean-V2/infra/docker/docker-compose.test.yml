# =============================================================================
# Docker Compose — Full E2E Test Stack
# =============================================================================
# Complete stack for E2E testing — all services containerized, deterministic,
# disposable. Postgres uses tmpfs for ephemeral fast storage.
# Usage:
#   just ci-docker-prepare
# Direct Compose startup must first load credentials: docs/local-stack-secrets.md.
# =============================================================================

name: g5-test

x-local-validation-labels: &local-validation-labels
  io.g5.validation.worktree: "${G5_LOCAL_VALIDATION_WORKTREE:-}"
  io.g5.validation.project: "${G5_CI_COMPOSE_PROJECT:-}"

x-g5d-local-build-args: &g5d-local-build-args
  G5D_BUILD_FEATURE_FLAGS: "${G5_CI_DOCKER_G5D_FEATURE_FLAGS:---no-default-features}"
  G5_CARGO_PROFILE: "${G5_CI_DOCKER_CARGO_PROFILE:-g5-dev}"

x-g5d-microvm-build-args: &g5d-microvm-build-args
  G5D_BUILD_FEATURE_FLAGS: "${G5_CI_DOCKER_MICROVM_G5D_FEATURE_FLAGS:-}"
  G5_CARGO_PROFILE: "${G5_CI_DOCKER_CARGO_PROFILE:-g5-dev}"

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL 17 with pgvector — ephemeral (tmpfs)
  # ---------------------------------------------------------------------------
  postgres:
    image: pgvector/pgvector:pg17@sha256:cf134a767f474095eeba57e0117be8e568e011a63f33fbf252f14c9b760f8e6f
    container_name: ${COMPOSE_PROJECT_NAME:-g5-test}-postgres
    # Postgres keeps its dynamic shared memory (parallel-query segments) in
    # /dev/shm; Docker's 64 MB default fails under load with SQLSTATE 53100
    # "could not resize shared memory segment". tmpfs only uses what it needs.
    shm_size: 1gb
    environment:
      POSTGRES_DB: g5_test
      POSTGRES_USER: g5
      POSTGRES_PASSWORD: g5_test
    ports:
      - "${G5_TEST_PORT_POSTGRES:-5433}:5432"
    # Publish on host so E2E tests can use direct SQL fixtures.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U g5 -d g5_test"]
      interval: 2s
      timeout: 5s
      retries: 10
    tmpfs: /var/lib/postgresql/data
    networks:
      - g5-test

  # ---------------------------------------------------------------------------
  # OAuth Stub — Local OAuth Identity Provider
  # ---------------------------------------------------------------------------
  # Lightweight OAuth 2.0 server mimicking GitHub's API surface.
  # Enables full OAuth pipeline testing without real providers.
  # Auto-approves authorization requests for deterministic E2E flows.
  # ---------------------------------------------------------------------------
  oauth-stub:
    build:
      labels: *local-validation-labels
      context: oauth-stub
      dockerfile: Dockerfile
    container_name: ${COMPOSE_PROJECT_NAME:-g5-test}-oauth-stub
    environment:
      OAUTH_PORT: "9876"
      OAUTH_AUTO_APPROVE: "true"
      OAUTH_CLIENT_ID: local-oauth-client-id
      OAUTH_CLIENT_SECRET: local-oauth-client-secret
      OAUTH_USER_EMAIL: "e2e-test@g5.dev"
      OAUTH_USER_LOGIN: "e2e-test-user"
      OAUTH_USER_NAME: "E2E Test User"
    # No host port mapping — the API and browser tests reach the stub over the
    # compose network at http://oauth-stub:9876, so publishing a host port only
    # creates avoidable conflicts with the local dev stack.
    healthcheck:
      test: ["CMD", "node", "-e", "const h=require('http');h.get('http://localhost:9876/healthz',r=>{process.exit(r.statusCode===200?0:1)}).on('error',()=>process.exit(1))"]
      interval: 2s
      timeout: 5s
      retries: 10
    networks:
      - g5-test

  # ---------------------------------------------------------------------------
  # g5-api — API Server (with test seed data)
  # ---------------------------------------------------------------------------
  # db-migrate — Run repair-aware SQL migrations before the API starts
  # ---------------------------------------------------------------------------
  db-migrate:
    image: ${G5_TEST_API_IMAGE:-g5/api:test}
    pull_policy: never
    container_name: ${COMPOSE_PROJECT_NAME:-g5-test}-migrate
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        attempt=1
        status=1
        while [ "$$attempt" -le 30 ]; do
          if G5_MIGRATION_SOURCE=/app/migrations g5-db-migrate; then
            exit 0
          else
            status=$$?
          fi
          echo "g5-db-migrate failed (attempt $${attempt}/30, exit $${status}); retrying in 2s"
          attempt=$$((attempt + 1))
          sleep 2
        done
        exit "$$status"
    healthcheck:
      disable: true
    environment:
      DATABASE_URL: postgres://g5:g5_test@postgres:5432/g5_test
    depends_on:
      postgres: { condition: service_healthy }
    networks:
      - g5-test

  db-bootstrap-runtime-users:
    image: pgvector/pgvector:pg17@sha256:cf134a767f474095eeba57e0117be8e568e011a63f33fbf252f14c9b760f8e6f
    container_name: ${COMPOSE_PROJECT_NAME:-g5-test}-db-bootstrap-runtime
    entrypoint: ["bash", "/scripts/bootstrap-runtime-db-users.sh"]
    healthcheck:
      disable: true
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: g5
      PGPASSWORD: g5_test
      PGDATABASE: g5_test
      G5_RUNTIME_SYSTEM_DB_PASSWORD: g5_system_test
      G5_RUNTIME_TENANT_DB_PASSWORD: g5_tenant_test
      G5_AUTHZ_WRITER_DB_PASSWORD: g5_authz_test
    depends_on:
      db-migrate: { condition: service_completed_successfully }
    volumes:
      - ../../scripts/bootstrap-runtime-db-users.sh:/scripts/bootstrap-runtime-db-users.sh:ro
    networks:
      - g5-test

  repos-bootstrap:
    image: alpine:3.22@sha256:14358309a308569c32bdc37e2e0e9694be33a9d99e68afb0f5ff33cc1f695dce
    container_name: ${COMPOSE_PROJECT_NAME:-g5-test}-repos-bootstrap
    entrypoint:
      - sh
      - -lc
      - |
        set -eu
        mkdir -p /mnt/g5-repos/repos /mnt/g5-attachments
        chown 10001:10001 /mnt/g5-repos/repos /mnt/g5-attachments
        chmod 0777 /mnt/g5-repos/repos
        chmod 0770 /mnt/g5-attachments
    healthcheck:
      disable: true
    volumes:
      - repos_data:/mnt/g5-repos/repos
      - attachments_data:/mnt/g5-attachments
    networks:
      - g5-test

  # ---------------------------------------------------------------------------
  # g5-api — API Server (with test seed data)
  # ---------------------------------------------------------------------------
  g5-api:
    image: ${G5_TEST_API_IMAGE:-g5/api:test}
    build:
      labels: *local-validation-labels
      context: ../..
      dockerfile: infra/docker/Dockerfile.g5-api
      args: *g5d-local-build-args
    container_name: ${COMPOSE_PROJECT_NAME:-g5-test}-api
    restart: on-failure
    environment:
      G5_DATABASE_URL: postgres://g5_runtime_system:g5_system_test@postgres:5432/g5_test
      G5_AUTHZ_DATABASE_URL: postgres://authz_writer:g5_authz_test@postgres:5432/g5_test
      G5_TENANT_DATABASE_URL: postgres://g5_runtime_tenant:g5_tenant_test@postgres:5432/g5_test
      G5_REQUIRE_RUNTIME_DB_SPLIT: "true"
      G5_JWT_SECRET: "${G5_JWT_SECRET:-}"
      G5_JWT_PUBLIC_KEY: "${G5_JWT_PUBLIC_KEY:-}"
      G5_JWT_PRIVATE_KEY: "${G5_JWT_PRIVATE_KEY:-}"
      G5_HOST: 0.0.0.0
      G5_PORT: "7500"
      G5_RATE_LIMIT_ENABLED: "false"
      RUST_LOG: g5_api=info
      G5_E2E_AUTH: "true"
      # Issue #1081 compatibility-removal posture. Default-off preserves the
      # broad E2E compatibility matrix; the dedicated gate-on lifecycle opts in.
      G5_REJECT_LEGACY_REPO_HINTS: "${G5_REJECT_LEGACY_REPO_HINTS:-false}"
      # SCM token manager key — used by ConfigService to encrypt Runtime
      # Config secrets. Without it the PUT /api/v1/orgs/:id/config endpoint
      # returns 500 ("SCM encryption key is not configured"), which breaks
      # the seed-ci-org Runtime Config bootstrap that loads
      # ANTHROPIC_AUTH_TOKEN for the agentic-job credential guard
      # (job_service [I9]/[D20]). Mirrors the dev compose default.
      G5_SCM_ENCRYPTION_KEY: ${G5_SCM_ENCRYPTION_KEY:-}
      # Exercise the shared filestore-style storage contract in test/CI.
      G5_STORAGE_PROVIDER: filestore
      G5_STORAGE_MOUNT_POINT: /mnt/g5-repos
      G5_STORAGE_TENANT_PREFIX: repos
      G5_STORAGE_WORKTREE_DIR: /tmp/g5-api-storage-worktrees
      # Attachment bytes on their own volume, as on hosted deployments.
      G5_ATTACHMENT_STORE_DIR: /mnt/g5-attachments
      G5_REPOS_BASE_DIR: /data/repos
      # The edge serves HTTPS on this alias so previews run on isolated
      # https://<task>.preview.g5-e2e.test/ hosts like production; the API
      # requires the HTTPS pair (middleware/mod.rs validate_preview_suffix_same_site).
      G5_EXTERNAL_URL: "https://app.g5-e2e.test"
      G5_PREVIEW_HOST_SUFFIX: "preview.g5-e2e.test"
      G5_GIT_EXTERNAL_URL: "http://g5-api:7500"
      # The deterministic CI lane starts the candidate g5d host container
      # itself after the API mints its bound host credential. Keep provider
      # bring-up disabled so POST /worker-hosts creates only the durable host
      # record, matching the Cloud Build lane.
      ENABLE_CLOUD_FEATURES: ${ENABLE_CLOUD_FEATURES:-false}
      # Guided journey section kill switch (ui g5.ui.guided-toggle):
      # advertised unless exactly "false"; the explicit default here is
      # documentation only.
      G5_GUIDED_JOURNEY_ENABLED: ${G5_GUIDED_JOURNEY_ENABLED:-true}
      # Provider Accounts kill switch (config_safe_defaults D6): unset/any value
      # keeps the Accounts surfaces on; exactly "false" hides them.
      G5_ENABLE_PROVIDER_ACCOUNTS: ${G5_ENABLE_PROVIDER_ACCOUNTS:-true}
      # -- Cookie security: the browser reaches the edge over HTTPS --
      G5_COOKIE_SECURE: "true"
      # -- Local OAuth provider (GitHub-compatible stub) --
      G5_GITHUB_CLIENT_ID: local-oauth-client-id
      G5_GITHUB_CLIENT_SECRET: local-oauth-client-secret
      # authorize_url must be browser-reachable; in CI the Playwright
      # browser runs inside the docker network, so use the service hostname.
      G5_GITHUB_AUTHORIZE_URL: "http://oauth-stub:9876/login/oauth/authorize"
      # token_url and userinfo_url are server-to-server (docker network)
      G5_GITHUB_TOKEN_URL: "http://oauth-stub:9876/login/oauth/access_token"
      G5_GITHUB_USERINFO_URL: "http://oauth-stub:9876/user"
      # Fine-grained PAT validation base URL (SCM connect) -> hermetic stub.
      G5_SCM_GITHUB_API_BASE_URL: "http://oauth-stub:9876"
      # Outbound email (invitations) -> the stub's Resend-compatible API;
      # Playwright reads delivered messages from /__e2e/emails.
      G5_EMAIL_TRANSPORT: resend
      G5_EMAIL_FROM_DOMAIN: mail.g5-e2e.test
      G5_EMAIL_RESEND_API_KEY: re_stub_key
      G5_EMAIL_RESEND_API_URL: "http://oauth-stub:9876"
      # Disposable review fixtures exceed the real-mail invitation quota.
      G5_EMAIL_VOLUME_LIMITS: "off"
    ports:
      - "${G5_TEST_PORT_API:-7501}:7500"
    depends_on:
      db-bootstrap-runtime-users: { condition: service_completed_successfully }
      repos-bootstrap: { condition: service_completed_successfully }
      oauth-stub: { condition: service_healthy }
    volumes:
      - repos_data:/mnt/g5-repos/repos
      - attachments_data:/mnt/g5-attachments
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7500/healthz"]
      interval: 3s
      timeout: 5s
      retries: 15
    networks:
      - g5-test

  # ---------------------------------------------------------------------------
  # g5d-host — workspace-VM host (real KVM substrate; no process fallback)
  # ---------------------------------------------------------------------------
  g5d-host:
    build:
      labels: *local-validation-labels
      context: ../..
      dockerfile: infra/docker/Dockerfile.g5d
      args: *g5d-local-build-args
    container_name: ${COMPOSE_PROJECT_NAME:-g5-test}-host-1
    privileged: true
    cgroup: private
    user: "0:0"
    devices:
      - /dev/kvm:/dev/kvm
    ulimits:
      nofile:
        soft: 1048576
        hard: 1048576
    entrypoint: ["bash"]
    command: ["/usr/local/bin/ci-host-xfs-entrypoint.sh", "host"]
    environment:
      G5D_API_URL: http://g5-api:7500
      G5D_ORG_ID: ${G5D_ORG_ID:-}
      G5D_HOST_ID: ${G5D_HOST_ID:-}
      G5_HOST_JWT: ${G5_HOST_JWT:-}
      G5D_ISOLATION_MODE: microvm
      G5D_WORKLOAD_ROOT: block
      G5D_HOST_MAX_MICROVMS: ${G5D_HOST_MAX_MICROVMS:-3}
      G5D_HOST_CPUS_PER_VM: 2
      G5D_HOST_MEM_MIB_PER_VM: 4096
      # Block mode shares this total budget across the image and workload.
      G5D_SCRATCH_DISK_MIB: ${G5D_SCRATCH_DISK_MIB:-10240}
      G5D_HOST_RUNTIME_BIN_DIR: /opt/g5-runtime/bin
      G5D_HOST_BASE_IMAGE: ${G5D_HOST_BASE_IMAGE:-mirror.gcr.io/library/buildpack-deps:resolute}
      G5D_GIT_HTTP_ALLOW_HOSTS: g5-api:7500
      G5D_ROOTFS_STATE_DIR: /var/lib/g5d/rootfs
      G5D_OCI_CACHE_DIR: /var/g5d-data/oci-layers
      G5D_HOST_XFS_SIZE_GB: ${G5D_HOST_XFS_SIZE_GB:-64}
      G5_CLAUDE_CODE_FAKE: ${G5_CLAUDE_CODE_FAKE:-1}
      G5_CODEX_FAKE: ${G5_CODEX_FAKE:-1}
      RUST_LOG: g5d=debug
    depends_on:
      g5-api: { condition: service_healthy }
    volumes:
      - host_runtime:/opt/g5-runtime:ro
      - ../../scripts/ci-host-xfs-entrypoint.sh:/usr/local/bin/ci-host-xfs-entrypoint.sh:ro
    networks:
      - g5-test

  # ---------------------------------------------------------------------------
  # client — Edge / Static Frontend
  # ---------------------------------------------------------------------------
  client:
    build:
      labels: *local-validation-labels
      context: ../..
      dockerfile: infra/docker/Dockerfile.edge
      args:
        VITE_G5_CI_WORKFLOW: "true"
        VITE_G5_ENABLE_CLOUD_WORKSPACE_WORKFLOWS: "true"
        VITE_G5_ENABLE_INTENT_LOG_VIEWER: "true"
    container_name: ${COMPOSE_PROJECT_NAME:-g5-test}-client
    ports:
      - "${G5_TEST_PORT_EDGE:-3001}:80"
    environment:
      G5_API_URL: http://g5-api:7500
      # Activates infra/docker/caddy-ci-tls.caddyfile: HTTPS for the apex
      # alias below and for *.preview.g5-e2e.test, routed to the API.
      G5_EDGE_TLS_APEX: app.g5-e2e.test
      G5_EDGE_PREVIEW_SUFFIX: preview.g5-e2e.test
    depends_on:
      g5-api: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:80/healthz"]
      interval: 3s
      timeout: 5s
      retries: 10
    networks:
      g5-test:
        aliases:
          - app.g5-e2e.test

  # ---------------------------------------------------------------------------
  # test-runner — Cargo test runner (g5d unit + integration tests)
  # ---------------------------------------------------------------------------
  # Usage:
  #   docker compose -f infra/docker/docker-compose.test.yml run --rm test-runner
  #   docker compose -f infra/docker/docker-compose.test.yml run --rm test-runner -p g5d isolation
  #   docker compose -f infra/docker/docker-compose.test.yml run --rm test-runner -p g5d -j 1
  # ---------------------------------------------------------------------------
  test-runner:
    build:
      labels: *local-validation-labels
      context: ../..
      dockerfile: infra/docker/Dockerfile.test-runner
    container_name: ${COMPOSE_PROJECT_NAME:-g5-test}-runner
    cgroup: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:ro
    environment:
      RUST_LOG: info
      RUST_BACKTRACE: 1
      # g5-api crate needs DATABASE_URL for sqlx compile-time query checks
      DATABASE_URL: postgres://g5:g5_test@postgres:5432/g5_test
      SQLX_OFFLINE: "true"
    deploy:
      resources:
        limits:
          memory: 4g
    depends_on:
      postgres: { condition: service_healthy }
    profiles:
      - test-runner
    networks:
      - g5-test

volumes:
  host_runtime:
    driver: local
  repos_data:
    driver: local
  attachments_data:
    driver: local

networks:
  g5-test:
    driver: bridge
