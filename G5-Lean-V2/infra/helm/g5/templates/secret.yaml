{{/*
Secret Management Validation

GKE deployments must source application secrets from External Secrets
Operator-backed Secret Manager sync. Static Kubernetes Secrets are not a
supported deployment path.
*/}}

{{- if and (eq (include "g5.controlPlaneEnabled" .) "true") (not .Values.api.secrets.externalSecretsEnabled) }}
{{- fail "api.secrets.externalSecretsEnabled=false is unsupported; provision g5-api-secrets via External Secrets Operator." }}
{{- end }}
