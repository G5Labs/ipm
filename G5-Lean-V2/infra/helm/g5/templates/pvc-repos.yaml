# =============================================================================
# PersistentVolumeClaim — Filestore NFS mount for shared repo storage
# =============================================================================
# This PVC binds to a PV created either by:
#   1. Terraform filestore module (when create_k8s_resources=true)
#   2. Manually via kubectl
#   3. This template (when pv.create=true)
#
# By default this template creates a PV pointing to the Filestore IP/path
# output from Terraform. Set filestore.ip and filestore.shareName.
# =============================================================================
{{- if and (eq (include "g5.controlPlaneEnabled" .) "true") .Values.api.filestore.enabled .Values.filestore.ip }}
apiVersion: v1
kind: PersistentVolume
metadata:
  name: {{ .Values.filestore.pvName | default "g5-repos-pv" }}
  labels:
    {{- include "g5.labels" . | nindent 4 }}
    app.kubernetes.io/component: storage
spec:
  capacity:
    storage: {{ .Values.filestore.storage | default "1Ti" }}
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  nfs:
    server: {{ required "filestore.ip must be set for NFS PV" .Values.filestore.ip }}
    path: /{{ .Values.filestore.shareName | default "g5_repos" }}

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Values.api.filestore.pvcName }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "g5.labels" . | nindent 4 }}
    app.kubernetes.io/component: storage
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: ""
  volumeName: {{ .Values.filestore.pvName | default "g5-repos-pv" }}
  resources:
    requests:
      storage: {{ .Values.filestore.storage | default "1Ti" }}
{{- end }}
