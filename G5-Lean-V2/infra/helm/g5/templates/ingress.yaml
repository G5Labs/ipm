# =============================================================================
# Ingress — GKE Ingress with managed certificate
# =============================================================================
{{- if and (eq (include "g5.controlPlaneEnabled" .) "true") .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: g5-ingress
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "g5.labels" . | nindent 4 }}
  annotations:
    networking.gke.io/v1beta1.FrontendConfig: g5-frontend-config
    {{- if .Values.ingress.className }}
    kubernetes.io/ingress.class: {{ .Values.ingress.className | quote }}
    {{- end }}
    {{- if .Values.previewWildcard.enabled }}
    # Per-preview wildcard origins (issue #935): the Certificate Manager map
    # (wildcard TLS — ManagedCertificate cannot cover wildcards). The GKE
    # Ingress controller does NOT act on this annotation (verified on GKE
    # 1.35, QA, 2026-09-24: with no other certificate source it deletes the
    # HTTPS frontend instead of attaching the map). It is kept as a record of
    # the intended map; the map is attached to the HTTPS target proxy out of
    # band with `gcloud compute target-https-proxies update
    # --certificate-map`, and GCE then serves the map and ignores the
    # controller-managed certificate list. The managed-certificates annotation
    # is therefore kept below on purpose: it is what keeps the HTTPS frontend
    # (and its pre-shared-cert annotation) alive. Never remove
    # ingress.gcp.kubernetes.io/pre-shared-cert by hand — that takes HTTPS down.
    # See infra/qa/README.md "Per-preview wildcard origins".
    networking.gke.io/certmap: {{ required "previewWildcard.certMapName is required when previewWildcard.enabled" .Values.previewWildcard.certMapName | quote }}
    {{- end }}
    {{- range $key, $value := .Values.ingress.annotations }}
    {{ $key }}: {{ $value | quote }}
    {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  {{- if .Values.ingress.tls }}
  tls:
    {{- range .Values.ingress.tls }}
    - hosts:
        {{- range .hosts }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ .secretName }}
    {{- end }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host | default $.Values.ingress.host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType }}
            backend:
              service:
                name: {{ .service }}
                port:
                  number: {{ .port }}
          {{- end }}
    {{- end }}
    {{- if .Values.previewWildcard.enabled }}
    # Per-preview wildcard origins (issue #935): every path on
    # *.<hostSuffix> goes to g5-api, which routes by Host header to the
    # preview reverse tunnel. Direct-to-API (not edge) so preview HMR
    # websockets inherit the API backend timeout/affinity.
    - host: {{ printf "*.%s" (required "previewWildcard.hostSuffix is required when previewWildcard.enabled" .Values.previewWildcard.hostSuffix) | quote }}
      http:
        paths:
          - path: /*
            pathType: ImplementationSpecific
            backend:
              service:
                name: g5-api
                port:
                  number: 7500
    {{- end }}
{{- end }}
