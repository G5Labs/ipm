{{/*
g5-daemon Deployment (same binary, G5_ROLE=daemon)
*/}}
{{- if and (eq (include "g5.controlPlaneEnabled" .) "true") .Values.daemon.enabled }}
{{- $daemonImage := include "g5.image" (dict "image" .Values.daemon.image "global" .Values.global "component" "api") | trim -}}
{{- $daemonStorageMountPoint := .Values.daemon.env.G5_STORAGE_MOUNT_POINT | default "/mnt/g5-repos" -}}
{{- $daemonStorageTenantPrefix := .Values.daemon.env.G5_STORAGE_TENANT_PREFIX | default "repos" -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: g5-daemon
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "g5.labels" . | nindent 4 }}
    app.kubernetes.io/component: daemon
spec:
  replicas: {{ .Values.daemon.replicaCount }}
  selector:
    matchLabels:
      app: g5-daemon
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: g5-daemon
        {{- include "g5.labels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ .Values.api.serviceAccount.name }}
      {{- with .Values.daemon.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.api.filestore.enabled }}
      initContainers:
        - name: init-repo-storage
          image: {{ $daemonImage | quote }}
          imagePullPolicy: {{ .Values.daemon.image.pullPolicy }}
          command:
            - sh
            - -lc
            - |
              set -eu
              base_dir="${G5_STORAGE_MOUNT_POINT%/}"
              if [ -n "${G5_STORAGE_TENANT_PREFIX:-}" ]; then
                base_dir="${base_dir}/${G5_STORAGE_TENANT_PREFIX}"
              fi
              mkdir -p "$base_dir"
              chown 10001:10001 "$base_dir"
              chmod 0775 "$base_dir"
          env:
            - name: G5_STORAGE_MOUNT_POINT
              value: {{ $daemonStorageMountPoint | quote }}
            - name: G5_STORAGE_TENANT_PREFIX
              value: {{ $daemonStorageTenantPrefix | quote }}
          securityContext:
            runAsUser: 0
            runAsGroup: 0
          volumeMounts:
            - name: repos
              mountPath: {{ .Values.api.filestore.mountPath }}
      {{- end }}
      containers:
        - name: daemon
          image: {{ $daemonImage | quote }}
          imagePullPolicy: {{ .Values.daemon.image.pullPolicy }}
          securityContext:
            runAsUser: 10001
            runAsGroup: 10001
            runAsNonRoot: true
            allowPrivilegeEscalation: false
          env:
            {{- range $key, $value := .Values.daemon.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
          envFrom:
            {{- include "g5.apiSecretEnvFrom" . | nindent 12 }}
          resources:
            {{- toYaml .Values.daemon.resources | nindent 12 }}
          {{- if .Values.api.filestore.enabled }}
          volumeMounts:
            {{- include "g5.repoStorageMount" (dict "mountPath" .Values.api.filestore.mountPath "prefix" $daemonStorageTenantPrefix) | nindent 12 }}
          {{- end }}
      {{- if .Values.api.filestore.enabled }}
      volumes:
        - name: repos
          persistentVolumeClaim:
            claimName: {{ .Values.api.filestore.pvcName }}
      {{- end }}
{{- end }}
