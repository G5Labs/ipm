# =============================================================================
# ManagedCertificate — Google-managed TLS certificate
# =============================================================================
# Provisions a free Google-managed TLS certificate for the Ingress host.
# This automates certificate issuance, renewal, and rotation — no manual
# cert management needed. Certificate is bound to the Ingress via the
# networking.gke.io/managed-certificates annotation.
#
# Requirements:
#   1. DNS must resolve the host to the Ingress static IP
#   2. The Ingress must be reachable on port 80 for ACME validation
#   3. Certificate provisioning takes 10-20 minutes after first deploy
# =============================================================================
{{- if and (eq (include "g5.controlPlaneEnabled" .) "true") .Values.ingress.enabled .Values.ingress.managedCertificate.enabled }}
apiVersion: networking.gke.io/v1
kind: ManagedCertificate
metadata:
  name: {{ .Values.ingress.managedCertificate.name }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "g5.labels" . | nindent 4 }}
spec:
  domains:
    {{- range .Values.ingress.managedCertificate.domains }}
    - {{ . | quote }}
    {{- end }}
{{- end }}
