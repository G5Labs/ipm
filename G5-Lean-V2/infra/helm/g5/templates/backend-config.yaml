# =============================================================================
# BackendConfig — GCE Ingress health check + security settings
# =============================================================================
# Tells the GCP HTTP(S) Load Balancer how to health-check the backend Service
# and configures security policies. Required for proper GCE Ingress operation.
# =============================================================================
{{- if and (eq (include "g5.controlPlaneEnabled" .) "true") .Values.ingress.enabled }}

# -----------------------------------------------------------------------------
# Edge BackendConfig — Caddy reverse proxy (serves frontend + proxies to API)
# -----------------------------------------------------------------------------
apiVersion: cloud.google.com/v1
kind: BackendConfig
metadata:
  name: g5-edge-backend-config
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "g5.labels" . | nindent 4 }}
spec:
  healthCheck:
    checkIntervalSec: 15
    timeoutSec: 5
    healthyThreshold: 1
    unhealthyThreshold: 3
    type: HTTP
    requestPath: /healthz
    port: 80

  connectionDraining:
    drainingTimeoutSec: 30

  sessionAffinity:
    affinityType: "GENERATED_COOKIE"
    affinityCookieTtlSec: 3600

  timeoutSec: 30

  logging:
    enable: true
    sampleRate: 0.5

---
# -----------------------------------------------------------------------------
# API BackendConfig — g5-api (Rust/Axum backend with WebSocket support)
# Separate config from edge because the API needs:
#   - Health check on port 7500 /healthz
#   - 1h timeout for long-running LLM operations and long-running worker/LLM WebSockets
#   - WebSocket support for streaming connections
# -----------------------------------------------------------------------------
apiVersion: cloud.google.com/v1
kind: BackendConfig
metadata:
  name: g5-api-backend-config
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "g5.labels" . | nindent 4 }}
spec:
  healthCheck:
    checkIntervalSec: 15
    timeoutSec: 5
    healthyThreshold: 1
    unhealthyThreshold: 3
    type: HTTP
    requestPath: /healthz
    port: 7500

  connectionDraining:
    drainingTimeoutSec: 60

  {{- if .Values.api.backendConfig.sessionAffinity.enabled }}
  sessionAffinity:
    affinityType: {{ .Values.api.backendConfig.sessionAffinity.affinityType | quote }}
    affinityCookieTtlSec: {{ .Values.api.backendConfig.sessionAffinity.affinityCookieTtlSec }}

  {{- end }}
  # 1h timeout for long-running LLM operations and long-running worker/LLM WebSockets
  timeoutSec: 3600

  logging:
    enable: true
    sampleRate: 0.5

---
# =============================================================================
# FrontendConfig — HTTPS redirect
# =============================================================================
# Ensures all HTTP traffic is redirected to HTTPS. This is critical for
# encryption in transit — without this, clients could connect over plaintext.
# =============================================================================
apiVersion: networking.gke.io/v1beta1
kind: FrontendConfig
metadata:
  name: g5-frontend-config
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "g5.labels" . | nindent 4 }}
spec:
  redirectToHttps:
    enabled: true
    responseCodeName: MOVED_PERMANENTLY_DEFAULT
  {{- if .Values.ingress.sslPolicy }}
  sslPolicy: {{ .Values.ingress.sslPolicy }}
  {{- end }}
{{- end }}
