# =============================================================================
# Services — ClusterIP services for internal traffic routing
# =============================================================================
{{- if eq (include "g5.controlPlaneEnabled" .) "true" }}
# g5-api Service
apiVersion: v1
kind: Service
metadata:
  name: g5-api
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "g5.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
  annotations:
    cloud.google.com/backend-config: '{"default": "g5-api-backend-config"}'
    cloud.google.com/neg: '{"ingress": true}'
spec:
  type: {{ .Values.api.service.type }}
  ports:
    - port: {{ .Values.api.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app: g5-api

---
# edge Service
apiVersion: v1
kind: Service
metadata:
  name: g5-edge
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "g5.labels" . | nindent 4 }}
    app.kubernetes.io/component: edge
  annotations:
    cloud.google.com/backend-config: '{"default": "g5-edge-backend-config"}'
    cloud.google.com/neg: '{"ingress": true}'
spec:
  type: {{ .Values.edge.service.type }}
  ports:
    - port: {{ .Values.edge.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app: g5-edge
{{- end }}
