# =============================================================================
# ConfigMap — Non-sensitive configuration shared across components
# =============================================================================
{{- if eq (include "g5.controlPlaneEnabled" .) "true" }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: g5-config
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "g5.labels" . | nindent 4 }}
data:
  G5_HOST: "0.0.0.0"
  G5_PORT: "7500"
  G5_STORAGE_PROVIDER: {{ .Values.api.env.G5_STORAGE_PROVIDER | default "filestore" | quote }}
  G5_STORAGE_MOUNT_POINT: {{ .Values.api.env.G5_STORAGE_MOUNT_POINT | default "/mnt/g5-repos" | quote }}
  G5_STORAGE_TENANT_PREFIX: {{ .Values.api.env.G5_STORAGE_TENANT_PREFIX | default "repos" | quote }}
  G5_RATE_LIMIT_ENABLED: {{ .Values.api.env.G5_RATE_LIMIT_ENABLED | default "true" | quote }}
  RUST_LOG: {{ .Values.api.env.RUST_LOG | default "g5_api=info,g5_audit=info" | quote }}
{{- end }}
