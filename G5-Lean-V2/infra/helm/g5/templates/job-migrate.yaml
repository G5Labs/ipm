# =============================================================================
# Database Migration Job — Helm pre-upgrade hook
# =============================================================================
{{- if and (eq (include "g5.controlPlaneEnabled" .) "true") .Values.migration.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: g5-db-migrate
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "g5.labels" . | nindent 4 }}
    app.kubernetes.io/component: migration
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  activeDeadlineSeconds: {{ .Values.migration.activeDeadlineSeconds }}
  template:
    metadata:
      labels:
        app: g5-db-migrate
    spec:
      restartPolicy: Never
      serviceAccountName: {{ .Values.migration.serviceAccount.name }}
      {{- with .Values.api.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      # Bootstrap restricted runtime DB users before migrations and app start.
      # The migration/admin user (`g5`) remains separate from the runtime
      # system/tenant/authz logins so prod/staging/dev match CI runtime auth.
      initContainers:
        - name: bootstrap-runtime-db-users
          image: postgres:17-alpine@sha256:266d3c257594e195b309ae9d1805e54c788f1d7b375f56bf6c367aac6c917e7b
          command:
            - sh
            - -c
            - |
              psql "$DATABASE_URL" \
                -v ON_ERROR_STOP=1 \
                -v runtime_system_password="$RUNTIME_SYSTEM_DB_PASSWORD" \
                -v runtime_tenant_password="$RUNTIME_TENANT_DB_PASSWORD" \
                -v authz_writer_password="$AUTHZ_WRITER_DB_PASSWORD" \
                <<'SQL'
              SELECT pg_advisory_lock(640517824501);
              -- psql prints SELECT results by default. Suppress the password-bearing
              -- set_config rows while retaining SQL errors on stderr.
              \o /dev/null
              SELECT set_config('g5.runtime_system_user', 'g5_runtime_system', false);
              SELECT set_config('g5.runtime_system_password', :'runtime_system_password', false);
              SELECT set_config('g5.runtime_tenant_user', 'g5_runtime_tenant', false);
              SELECT set_config('g5.runtime_tenant_password', :'runtime_tenant_password', false);
              SELECT set_config('g5.authz_writer_password', :'authz_writer_password', false);
              \o

              DO $bootstrap$
              DECLARE
                  runtime_system_user text := current_setting('g5.runtime_system_user');
                  runtime_system_password text := current_setting('g5.runtime_system_password');
                  runtime_tenant_user text := current_setting('g5.runtime_tenant_user');
                  runtime_tenant_password text := current_setting('g5.runtime_tenant_password');
                  authz_writer_password text := current_setting('g5.authz_writer_password');
                  bypass_role text;
              BEGIN
                  -- A greenfield database has not run the baseline migration yet.
                  -- Establish its NOLOGIN grant roles before granting the migration
                  -- user the memberships required by owner-reassignment statements.
                  IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'g5_app') THEN
                      CREATE ROLE g5_app NOLOGIN;
                  END IF;
                  IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'g5_tenant') THEN
                      CREATE ROLE g5_tenant NOLOGIN;
                  END IF;
                  IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'authz_writer') THEN
                      CREATE ROLE authz_writer NOLOGIN;
                  END IF;
                  IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'authz_ctx_writer') THEN
                      CREATE ROLE authz_ctx_writer NOLOGIN;
                  END IF;

                  IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = runtime_system_user) THEN
                      EXECUTE format(
                          'CREATE ROLE %I LOGIN PASSWORD %L INHERIT',
                          runtime_system_user,
                          runtime_system_password
                      );
                  ELSE
                      EXECUTE format(
                          'ALTER ROLE %I WITH LOGIN PASSWORD %L INHERIT',
                          runtime_system_user,
                          runtime_system_password
                      );
                  END IF;

                  IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = runtime_tenant_user) THEN
                      EXECUTE format(
                          'CREATE ROLE %I LOGIN PASSWORD %L INHERIT',
                          runtime_tenant_user,
                          runtime_tenant_password
                      );
                  ELSE
                      EXECUTE format(
                          'ALTER ROLE %I WITH LOGIN PASSWORD %L INHERIT',
                          runtime_tenant_user,
                          runtime_tenant_password
                      );
                  END IF;

                  -- The migration/admin role can manage non-superuser role
                  -- attributes, but it cannot toggle SUPERUSER itself.
                  EXECUTE format('ALTER ROLE %I NOCREATEDB NOCREATEROLE', runtime_system_user);
                  EXECUTE format('ALTER ROLE %I NOCREATEDB NOCREATEROLE', runtime_tenant_user);

                  EXECUTE 'ALTER ROLE authz_writer WITH LOGIN PASSWORD '
                      || quote_literal(authz_writer_password)
                      || ' INHERIT';
                  EXECUTE 'ALTER ROLE authz_writer NOCREATEDB NOCREATEROLE';

                  EXECUTE 'ALTER ROLE authz_ctx_writer NOLOGIN NOCREATEDB NOCREATEROLE';
                  -- The runtime and authz roles must not bypass row-level security.
                  -- Clearing BYPASSRLS requires BYPASSRLS on PostgreSQL 16+ (Cloud SQL
                  -- executes it for cloudsqlsuperuser members; plain PostgreSQL and the
                  -- NOBYPASSRLS CI migrator do not have it), so only alter a role that
                  -- actually carries the attribute: a fresh CREATE ROLE never does, and a
                  -- role that carries it and cannot be altered fails loudly here.
                  FOR bypass_role IN
                      SELECT rolname FROM pg_roles
                      WHERE rolbypassrls
                        AND rolname IN (runtime_system_user, runtime_tenant_user,
                                        'authz_writer', 'authz_ctx_writer')
                  LOOP
                      EXECUTE format('ALTER ROLE %I NOBYPASSRLS', bypass_role);
                  END LOOP;
                  EXECUTE 'ALTER ROLE g5_app NOLOGIN';
                  EXECUTE 'ALTER ROLE g5_tenant NOLOGIN';

                  -- Cloud SQL API-created users inherit cloudsqlsuperuser. Strip
                  -- that membership before these identities become runtime roles.
                  IF EXISTS (
                      SELECT 1
                      FROM pg_auth_members memberships
                      JOIN pg_roles granted_role ON granted_role.oid = memberships.roleid
                      JOIN pg_roles member_role ON member_role.oid = memberships.member
                      WHERE granted_role.rolname = 'cloudsqlsuperuser'
                        AND member_role.rolname = 'authz_writer'
                  ) THEN
                      EXECUTE 'REVOKE cloudsqlsuperuser FROM authz_writer';
                  END IF;
                  IF EXISTS (
                      SELECT 1
                      FROM pg_auth_members memberships
                      JOIN pg_roles granted_role ON granted_role.oid = memberships.roleid
                      JOIN pg_roles member_role ON member_role.oid = memberships.member
                      WHERE granted_role.rolname = 'cloudsqlsuperuser'
                        AND member_role.rolname = 'authz_ctx_writer'
                  ) THEN
                      EXECUTE 'REVOKE cloudsqlsuperuser FROM authz_ctx_writer';
                  END IF;

                  EXECUTE 'GRANT authz_ctx_writer TO current_user';
                  EXECUTE 'GRANT authz_writer TO current_user';

                  EXECUTE format('REVOKE g5_tenant FROM %I', runtime_system_user);
                  EXECUTE format('GRANT g5_app TO %I', runtime_system_user);

                  EXECUTE format('REVOKE g5_app FROM %I', runtime_tenant_user);
                  EXECUTE format('GRANT g5_tenant TO %I', runtime_tenant_user);
              END
              $bootstrap$;

              SELECT pg_advisory_unlock(640517824501);
              SQL
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.migration.secrets.secretName }}
                  key: G5_ADMIN_DATABASE_URL
            - name: AUTHZ_WRITER_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.migration.secrets.secretName }}
                  key: G5_AUTHZ_WRITER_DB_PASSWORD
            - name: RUNTIME_SYSTEM_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.migration.secrets.secretName }}
                  key: G5_RUNTIME_SYSTEM_DB_PASSWORD
            - name: RUNTIME_TENANT_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.migration.secrets.secretName }}
                  key: G5_RUNTIME_TENANT_DB_PASSWORD
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
      containers:
        - name: migrate
          image: {{ include "g5.image" (dict "image" .Values.migration.image "global" .Values.global "component" "api") | trim | quote }}
          command: {{ .Values.migration.command | toJson }}
          env:
            {{- range $key, $value := .Values.migration.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            # sqlx-cli reads DATABASE_URL
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.migration.secrets.secretName }}
                  key: G5_ADMIN_DATABASE_URL
          envFrom:
            - secretRef:
                name: {{ .Values.migration.secrets.secretName }}
          resources:
            {{- toYaml .Values.migration.resources | nindent 12 }}
{{- end }}
