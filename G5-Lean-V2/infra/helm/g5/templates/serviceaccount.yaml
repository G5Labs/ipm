# =============================================================================
# ServiceAccount — Workload Identity bindings for GKE
# =============================================================================

# API ServiceAccount — bound to GCP SA via Workload Identity
{{- if eq (include "g5.controlPlaneEnabled" .) "true" }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.api.serviceAccount.name }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "g5.labels" . | nindent 4 }}
  annotations:
    iam.gke.io/gcp-service-account: {{ (.Values.api.serviceAccount.gcpServiceAccountEmail | default "") | default (printf "%s-api@%s.iam.gserviceaccount.com" (.Values.global.clusterName | default .Values.global.projectId) .Values.global.projectId) }}
    {{- with .Values.api.serviceAccount.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}

---
# Migration ServiceAccount — hook-scoped identity for the DB migration job
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.migration.serviceAccount.name }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "g5.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation
{{- end }}
