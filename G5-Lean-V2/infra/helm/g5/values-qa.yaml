# =============================================================================
# G5 Helm Values — G5 Lean QA Environment
# =============================================================================
# Usage: helm install g5 ./infra/helm/g5 -f values-qa.yaml
# =============================================================================

# A5b — flip the in-cluster Kata worker plane to zero in dev. The bare GCE
# Cloud Hypervisor worker (module "worker_host", enable_worker_host_instance=true) is
# now the sole dev worker; all dev jobs land on it via homogeneous (no
# isolation-aware) scheduling. (The in-cluster worker plane has since been
# retired everywhere — infra ontology D17.)
topology:
  mode: control-plane

global:
  projectId: "g5-qa-1ccc"
  region: us-central1

namespace: g5

api:
  replicaCount: 1
  resources:
    requests:
      cpu: "14"
      memory: 4Gi
    limits:
      cpu: "16"
      memory: 20Gi
  env:
    G5_WORKER_SERVICE_ACCOUNT: "g5-lean-qa-host@g5-qa-1ccc.iam.gserviceaccount.com"
    G5_HOST: "0.0.0.0"
    G5_PORT: "7500"
    G5_ROLE: api
    # Deploy-injected sentinel (helm ontology D27, cloudbuild_pipelines D30):
    # dev is pinned like staging/prod — one code path — so the deploy
    # pipeline injects the concrete g5-worker image for the promoted commit
    # via --set-string, and the chart refuses to render this sentinel.
    # Historically dev left G5_WORKER_IMAGE unset (in-code family default);
    # that behavior remains only for installs that omit the key entirely.
    G5_WORKER_IMAGE: "DEPLOY-INJECTED"
    G5_TOKIO_WORKER_THREADS: "16"
    G5_DATABASE_MAX_CONNECTIONS: "54"
    G5_AUTHZ_DATABASE_MAX_CONNECTIONS: "18"
    G5_TENANT_DATABASE_MAX_CONNECTIONS: "72"
    RUST_LOG: "g5_api=debug,tower_http=debug,g5_audit=info"
    G5_RATE_LIMIT_ENABLED: "false"
    ENABLE_CLOUD_FEATURES: "true"
    # UI v3 rollout gate (layout_and_navigation [D5], helm [D24]): ON in dev
    # only, while the governance/approvals-flow UI lands incrementally.
    # Staging/prod stay "false"; missing would also mean off (fail-closed).
    # Alignment workbench gate (workbench g5.workbench.gate): on since Phase 3;
    # the alignment layout stays opt-in per user (Settings → Workspace
    # panels). Missing would mean off (fail-closed).
    # New QA orgs track the promoted default workspace image. The deploy
    # injects G5_PROMOTED_BASE_IMAGES with this track's immutable digest.
    G5_NEW_ORG_DEFAULT_IMAGE_TRACK: "g5d-g5dev"
    # Image-aware worker-host rotation (cloud_provider ontology [D55]): an
    # idle host rotates only when a newer promoted image is available; the
    # cliff force [D54] re-mints the 24h host_jwt otherwise. Dev-only 5-minute
    # idle window so a deploy rolls the idle dev fleet within minutes.
    G5_HOST_ROTATION_ENABLED: "true"
    G5_HOST_ROTATION_MIN_IDLE_SECS: "300"
    # Stale-host detector + bounded zone-stockout retry (PR #2051; cloud_provider
    # ontology [D65]/[D66], helm [D28]): reaps never-registered/silent-ready rows
    # and cloud-orphan VMs, and retries zone_capacity_exhausted bring-ups —
    # same-region first, then the in-code NA fallback basket (us-east1,us-west1;
    # G5_WORKER_FALLBACK_REGIONS deliberately unset — an EMPTY value would
    # disable cross-region retry). Enabled in all envs at once 2026-08-21 (chat
    # intent 83f13949) after a manual sweep cleared ten multi-day stockout
    # fossils across dev+prod.
    G5_STALE_HOST_DETECTOR_ENABLED: "true"
    G5_PROVISION_RETRY_ENABLED: "true"
    G5_SELF_HOSTED_REGISTRY_LOCATION: "us-central1"
    G5_SELF_HOSTED_REGISTRY_PROJECT: "g5-qa-1ccc"
    G5_SELF_HOSTED_REGISTRY_REPOSITORY: "g5"
    G5_SELF_HOSTED_REGISTRY_PULLER_SERVICE_ACCOUNT: "g5-registry-puller@g5-qa-1ccc.iam.gserviceaccount.com"
    G5_SELF_HOSTED_REGISTRY_TOKEN_LIFETIME_SECS: "3600"
    # Hosted dev must use the shared Filestore repo mount like staging/prod.
    G5_STORAGE_PROVIDER: filestore
    G5_STORAGE_MOUNT_POINT: /mnt/g5-repos
    # Open tcp:22 from the GCP IAP range (35.235.240.0/20) to g5-worker-tagged
    # instances on every per-org VPC the API provisions (gcp.rs ensure_firewalls,
    # ENV_ALLOW_SSH). Dev-only diagnostic access — staging/prod stay closed
    # until we have a real shipping debug story. Live-discovered necessity on
    # 2026-06-04 chasing the missing-base_image bug (chat intent C3).
    G5_WORKER_ALLOW_SSH: "1"
    # 80 GiB private ephemeral ext4 capacity per VM: environment, source, build
    # outputs and Docker data. Host admission reserves full-slot headroom.
    # Host cache door (ontology g5.runtime.cache.door / .fleet), QA first:
    # API-provisioned hosts write G5D_CACHE_DOOR_PORT and the sccache fleet
    # settings into host.env and publish /var/g5d-data/runtime/cache-profile.env
    # for their guests. Guests then pull dev-up base tiers through
    # g5-host:7111 from the deploy-written g5-tiers repository and read sccache objects through the
    # door (host store, image prime, this org's fleet prefix). Rollback =
    # remove these keys and restart the API; only hosts provisioned afterwards
    # change (the profile and port are bring-up outputs).
    # The passt policy exposes the admitted door through the g5-host alias.
    G5_WORKER_CACHE_DOOR_PORT: "7111"
    G5_WORKER_CACHE_REGISTRY_PREFIX: "us-central1-docker.pkg.dev/g5-qa-1ccc/g5-tiers"
    G5_WORKER_SCCACHE_BUCKET: "g5-qa-1ccc-deploy-artifacts"
    G5_WORKER_SCCACHE_PREFIX: "guest-sccache"
    # Nested virtualization (ontology g5.architecture.microvm_backend.nested),
    # QA first: API-provisioned hosts write G5D_NESTED_VIRTUALIZATION=on into
    # host.env, boot every workspace VM with `nested=on` and expose /dev/kvm in
    # the guest. Rollback = remove this key and restart the API; only hosts
    # provisioned afterwards change. Staging and production leave it unset.
    G5_WORKER_NESTED_VIRTUALIZATION: "1"
  # ESO manages g5-api-secrets — skip static placeholder secret
  secrets:
    externalSecretsEnabled: true
  filestore:
    enabled: true
  pdb:
    # With one intentional API replica, replicaCount keeps one desired pod; the
    # PDB must allow voluntary eviction during node drains.
    minAvailable: 0

daemon:
  enabled: true
  replicaCount: 1


edge:
  replicaCount: 1
  env:
    G5_API_URL: "http://g5-api:7500"
    G5_MAINTENANCE_MODE: "true"

ingress:
  enabled: true
  className: gce
  annotations:
    kubernetes.io/ingress.global-static-ip-name: g5-lean-qa-ip
    networking.gke.io/managed-certificates: g5-lean-qa-cert
  hosts:
    - host: qa.g5labs.ai
      paths:
        # API routes must include the wildcard so REST subpaths stay on the
        # g5-api backend and receive API BackendConfig affinity.
        - path: /api
          pathType: ImplementationSpecific
          service: g5-api
          port: 7500
        - path: /api/*
          pathType: ImplementationSpecific
          service: g5-api
          port: 7500
        - path: /v1
          pathType: ImplementationSpecific
          service: g5-api
          port: 7500
        # Git smart HTTP uses concrete repo subpaths such as
        # /git/<repo-id>/git-upload-pack; route those directly to g5-api so
        # large pack streams inherit the API backend timeout (3600s), not edge's 30s.
        - path: /git/*
          pathType: ImplementationSpecific
          service: g5-api
          port: 7500
        - path: /ws
          pathType: ImplementationSpecific
          service: g5-api
          port: 7500
        - path: /healthz
          pathType: ImplementationSpecific
          service: g5-api
          port: 7500
        - path: /auth
          pathType: ImplementationSpecific
          service: g5-api
          port: 7500
        # Long-lived WebSockets: keep explicit direct-to-API routes so they use
        # the API backend timeout/affinity even if path ordering changes.
        - path: /api/v1/ws
          pathType: ImplementationSpecific
          service: g5-api
          port: 7500
        - path: /*
          pathType: ImplementationSpecific
          service: g5-edge
          port: 80
  managedCertificate:
    enabled: true
    name: g5-lean-qa-cert
    domains:
      - qa.g5labs.ai

# Per-preview wildcard origins (issue #935): previews serve at
# https://<job-id>.preview.qa.g5labs.ai/ instead of the legacy
# /api/v1/preview/<job>/ path, which SPAs with root-relative assets and
# navigation escape (landing on QA's own /coming-soon.html). Terraform
# (infra/qa/platform preview_subdomain_bases) provisions the
# g5-lean-qa-ip-cert-map Certificate Manager map and the delegated child DNS
# records; parent NS delegation is reviewed separately in infra/qa/README.md.
# `enabled: true` requires
# the certificate to report ACTIVE first; the map is then attached to the
# HTTPS target proxy with gcloud, since the GKE Ingress controller ignores
# the certmap annotation (see "Per-preview wildcard origins" in
# infra/qa/README.md). Requires api.replicaCount <= 1.
previewWildcard:
  enabled: true
  hostSuffix: "preview.qa.g5labs.ai"
  certMapName: "g5-lean-qa-ip-cert-map"

filestore:
  ip: ""     # Populated from: terraform output filestore_ip
  shareName: g5_repos

# Database migration hook (runs repair-aware g5-db-migrate before each deploy)
migration:
  enabled: true
