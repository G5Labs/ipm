# Production uses the exact artifacts accepted in staging. Environment values
# intentionally match staging's runtime behavior. Routing remains disabled
# until delegated DNS and certificates have passed two-person DNS review.
topology:
  mode: control-plane

api:
  replicaCount: 1
  resources:
    requests:
      cpu: "14"
      memory: 4Gi
    limits:
      cpu: "16"
      memory: 20Gi
  env:
    G5_WORKER_SERVICE_ACCOUNT: "g5-lean-prod-host@g5lean-prod-1ccc.iam.gserviceaccount.com"
    G5_WORKER_IMAGE: DEPLOY-INJECTED
    G5_E2E_AUTH: "false"
    G5_TOKIO_WORKER_THREADS: "16"
    G5_DATABASE_MAX_CONNECTIONS: "54"
    G5_AUTHZ_DATABASE_MAX_CONNECTIONS: "18"
    G5_TENANT_DATABASE_MAX_CONNECTIONS: "72"
    RUST_LOG: "g5_api=info,tower_http=info,g5_audit=info"
    G5_LOG_FORMAT: json
    G5_RATE_LIMIT_ENABLED: "true"
    G5_RATE_LIMIT_RPM: "20000"
    ENABLE_CLOUD_FEATURES: "true"
    G5_NEW_ORG_DEFAULT_IMAGE_TRACK: g5d-g5dev
    G5_HOST_ROTATION_ENABLED: "true"
    G5_STALE_HOST_DETECTOR_ENABLED: "true"
    G5_PROVISION_RETRY_ENABLED: "true"
    G5_WORKER_ALLOW_SSH: "0"
  # Effective login admission is owned by the addons ExternalSecret input.
  secrets:
    externalSecretsEnabled: true
  filestore:
    enabled: true
  pdb:
    minAvailable: 0

daemon:
  enabled: true
  replicaCount: 1

edge:
  replicaCount: 2
  env:
    G5_API_URL: "http://g5-api:7500"
    G5_MAINTENANCE_MODE: "true"

ingress:
  enabled: false
  managedCertificate:
    enabled: false

previewWildcard:
  enabled: false
  hostSuffix: ""
  certMapName: ""

migration:
  enabled: true
