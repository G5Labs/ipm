<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="G5 Labs is launching soon. Programming is Dead: Engineering Thrives!" />
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" type="image/svg+xml" href="/g5-logo.svg" />
  <title>G5 Labs | Launching Soon</title>
  <style>
    :root {
      color-scheme: dark;
      --bg-0: #000000;
      --bg-1: #080808;
      --bg-2: #131313;
      --text: #f5f5f5;
      --muted: #b8b8b8;
      --quiet: #9a9a9a;
      --brand: #ff8a00;
      --brand-strong: #ff9f1f;
      --brand-muted: #ffb86c;
      --accent: #ffe2bc;
      --accent-strong: #ffd09a;
      --divider: rgba(255, 148, 40, 0.35);
      --button-text: #1a1208;
      --button-shadow: rgba(0, 0, 0, 0.45);
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      min-height: 100%;
    }

    body {
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding-top: max(1.25rem, env(safe-area-inset-top));
      padding-right: max(1rem, env(safe-area-inset-right));
      padding-bottom: max(1.25rem, env(safe-area-inset-bottom));
      padding-left: max(1rem, env(safe-area-inset-left));
      overflow-x: hidden;
      font-family: "Sora", "Avenir Next", "Segoe UI", "Helvetica Neue", sans-serif;
      color: var(--text);
      background:
        radial-gradient(980px 520px at 18% 10%, rgba(255, 138, 0, 0.2), transparent 58%),
        radial-gradient(760px 380px at 86% 16%, rgba(255, 174, 92, 0.14), transparent 62%),
        linear-gradient(165deg, var(--bg-0), var(--bg-1) 45%, var(--bg-2));
    }

    main {
      width: min(680px, 100%);
      position: relative;
      z-index: 1;
    }

    .top-login {
      position: fixed;
      top: max(1rem, env(safe-area-inset-top));
      right: max(1rem, env(safe-area-inset-right));
      z-index: 2;
    }

    .top-login-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 96px;
      padding: 0.52rem 0.92rem;
      border-radius: 999px;
      border: 1px solid rgba(255, 149, 40, 0.68);
      background: rgba(255, 138, 0, 0.08);
      color: var(--brand-muted);
      text-decoration: none;
      font-size: 0.86rem;
      font-weight: 600;
      letter-spacing: 0.01em;
      transition: background-color 160ms ease, border-color 160ms ease;
    }

    .top-login-link:hover {
      background: rgba(255, 138, 0, 0.16);
      border-color: rgba(255, 171, 86, 0.9);
    }

    .top-login-link:focus-visible {
      outline: 2px solid #ffb86c;
      outline-offset: 3px;
    }

    .copyright {
      position: fixed;
      right: max(1rem, env(safe-area-inset-right));
      bottom: max(0.8rem, env(safe-area-inset-bottom));
      z-index: 2;
      color: rgba(255, 226, 188, 0.42);
      font-size: 0.72rem;
      letter-spacing: 0.02em;
      pointer-events: none;
      user-select: none;
    }

    .panel {
      padding: clamp(1.3rem, 3.7vw, 2.5rem);
      text-align: center;
    }

    .mark {
      width: clamp(104px, 18vw, 156px);
      height: clamp(104px, 18vw, 156px);
      margin: 0 auto clamp(1.0rem, 2.2vw, 1.5rem);
      display: grid;
      place-items: center;
      filter: drop-shadow(0 10px 26px rgba(255, 138, 0, 0.22));
    }

    .mark img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .tagline {
      font-size: clamp(1.02rem, 3.45vw, 1.42rem);
      line-height: 1.35;
      font-weight: 600;
      letter-spacing: -0.015em;
      max-width: 30ch;
      margin: 0 auto 0.82rem;
    }

    .tagline-muted {
      color: #a8a8a8;
    }

    .tagline-strong {
      color: var(--accent);
    }

    @media (min-width: 760px) {
      .tagline {
        max-width: none;
        white-space: nowrap;
      }
    }

    .divider {
      width: min(96px, 24vw);
      height: 1px;
      margin: clamp(1.2rem, 3.4vw, 1.9rem) auto;
      background: linear-gradient(90deg, transparent, var(--divider), transparent);
    }

    .actions {
      margin-top: 0.95rem;
      display: flex;
      justify-content: center;
    }

    .waitlist-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 132px;
      padding: 0.72rem 1.1rem;
      border-radius: 999px;
      border: 1px solid rgba(255, 189, 116, 0.86);
      background: linear-gradient(145deg, var(--brand-strong), var(--brand));
      color: var(--button-text);
      font-size: 0.94rem;
      font-weight: 600;
      letter-spacing: 0.01em;
      text-decoration: none;
      box-shadow:
        0 10px 24px var(--button-shadow),
        0 0 0 1px rgba(255, 168, 72, 0.35) inset;
      transition: transform 160ms ease, background-color 160ms ease;
    }

    .waitlist-button:hover {
      background: linear-gradient(145deg, #ffad39, #ff950c);
      transform: translateY(-1px);
    }

    .waitlist-button:focus-visible {
      outline: 2px solid #ffb86c;
      outline-offset: 3px;
    }

    @media (max-width: 560px) {
      .top-login-link {
        min-width: 84px;
        padding: 0.48rem 0.74rem;
        font-size: 0.8rem;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      * {
        scroll-behavior: auto;
      }
    }
  </style>
</head>
<body>
  <div class="top-login">
    <a class="top-login-link" href="/login">Login</a>
  </div>
  <div class="copyright">&copy; 2026 g5labs.ai</div>
  <main aria-label="Coming Soon">
    <section class="panel">
      <div class="mark" aria-hidden="true">
        <img src="/g5-logo.svg" alt="" />
      </div>
      <h1 class="visually-hidden">G5</h1>
      <p class="tagline">
        <span class="tagline-muted">Programming is Dead:</span>
        <span class="tagline-strong">Engineering Thrives!</span>
      </p>
      <div class="actions">
        <a class="waitlist-button" href="mailto:info@g5labs.ai?subject=Join%20G5%20Waitlist">Join waitlist</a>
      </div>
      <div class="divider"></div>
    </section>
  </main>

</body>
</html>
