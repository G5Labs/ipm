# Gitleaks configuration for the G5 source repository (INF-01 follow-up).
# Run locally or in CI: gitleaks detect --source . --config .gitleaks.toml
# History scan (operator, pre-purge verification):
#   gitleaks detect --source . --config .gitleaks.toml --log-opts="--all"
#
# Extends the default ruleset and adds G5-specific secret env keys observed in
# the INF-01 incident.

[extend]
useDefault = true

[[rules]]
id = "g5-secret-env-assignment"
description = "G5 deployment secret env vars assigned non-empty values"
regex = '''(?i)\b(G5_JWT_PRIVATE_KEY|G5_JWT_SECRET|G5_BLOB_SIGNING_KEY|G5_SCM_ENCRYPTION_KEY|G5_(GITHUB|GITLAB|GOOGLE)_CLIENT_SECRET|G5D_REGISTRATION_TOKEN|ANTHROPIC_API_KEY|OPENAI_API_KEY|OPENROUTER_API_KEY)\s*=\s*['"]?[^\s'"#]{8,}'''
tags = ["g5", "env", "secret"]

[[rules]]
id = "g5-private-key-block"
description = "PEM private key material"
regex = '''-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----'''
tags = ["key", "pem"]

[allowlist]
description = "Template/example placeholder values only"
paths = [
    '''\.gitleaks\.toml''',
]
regexes = [
    '''CHANGE_ME''',
    '''<your-[a-z-]+>''',
]
