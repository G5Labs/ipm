[build]
# Limit parallel jobs to avoid OOM when linking multiple large test binaries.
# Dev container has ~7.7GB RAM, VS Code extensions consume ~3GB, leaving ~4GB.
# Each linker invocation can use 500MB-1GB. jobs=2 prevents concurrent links.
jobs = 2
rustflags = ["-Awarnings"]

# ---------------------------------------------------------------------------
# Environment variables — defaults for sqlx compile-time checks and tests.
# These use `force = false` so they never override variables already set in
# the shell or by Docker Compose.  The .env file takes priority for sqlx
# proc macros (sqlx reads .env directly), but these cover `cargo test` and
# `cargo run` scenarios when no .env is present.
# ---------------------------------------------------------------------------
[env]
# Used by sqlx proc macros at compile time to verify queries.
# Also used by g5-api at runtime when started via `cargo run`.
DATABASE_URL = { value = "postgres://g5:g5_dev@127.0.0.1:5432/g5_dev", force = false }

# Used by the integration-test harness (TestDb::create) to spin up
# throwaway databases. Explicit shell/.env values still win, and the harness
# itself now probes the conventional local dev/test URLs if this default does
# not match the current stack.
TEST_DATABASE_URL = { value = "postgres://g5:g5_dev@127.0.0.1:5432/g5_dev", force = false }

# When set to "true", sqlx uses the checked-in .sqlx/ query cache instead
# of connecting to a live database.  Useful in CI or when Postgres is down.
SQLX_OFFLINE = { value = "true", force = false }
