name: self-hosted-install

# Manual only: Cloud Build is the CI system for G5-Lean (design v6 §13, Q48).
# Re-add a push trigger deliberately if this contract is ever wanted on push.
on:
  workflow_dispatch:

jobs:
  contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned just
        uses: ./.github/actions/setup-just

      - name: Self-hosted bundle contract
        run: bash scripts/test-self-hosted-bundle.sh

  smoke:
    runs-on: ubuntu-24.04
    needs: contract
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Free runner disk space
        run: |
          set -euo pipefail
          df -h /
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h /

      - name: Install pinned just
        uses: ./.github/actions/setup-just

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend assets and install Playwright
        working-directory: frontend
        run: |
          set -euo pipefail
          npm ci
          npm run build
          npx playwright install --with-deps chromium

      - name: Build common base image tiers
        run: |
          set -euo pipefail
          # Dockerfile.g5-api is FROM g5/base-rust:26.04 (builder) + g5/base:26.04
          # (runtime) and Dockerfile.edge-prebuilt is FROM g5/base:26.04
          # (docker_images D18). These dev base tags are local-only (D5), so
          # build them here first; the plain `docker build`s below then resolve
          # their base ARG defaults. base-rust implies base.
          G5_BASE_DOCKERFILE_DIR=infra/docker \
          G5_BASE_BUILD_CONTEXT=. \
            bash scripts/ensure-base-images.sh base-rust
          df -h /

      - name: Build self-hosted API image
        run: |
          set -euo pipefail
          docker build \
            --build-arg BUILDER_BASE_IMAGE=g5/base-rust:26.04 \
            --build-arg RUNTIME_BASE_IMAGE=g5/base:26.04 \
            --tag g5-selfhost-api:smoke \
            --file infra/docker/Dockerfile.g5-api \
            .

      - name: Build self-hosted edge image
        run: |
          set -euo pipefail
          docker build \
            --build-arg BASE_IMAGE=g5/base:26.04 \
            --tag g5-selfhost-edge:smoke \
            --file infra/docker/Dockerfile.edge-prebuilt \
            .

      - name: Reclaim docker build cache
        run: |
          set -euo pipefail
          docker builder prune --all --force
          # The Ubuntu base tiers (docker_images D18) are larger than the Alpine
          # bases they replaced, so this 14GB hosted runner has less headroom
          # before the smoke stack pulls its compose images
          # (experience: ci_hosted_runner_disk_exhaustion_smoke). Untag the base
          # tiers now that both :smoke images are built: the multi-GB
          # g5/base-rust toolchain layers are NOT present in the slim runtime
          # images, so dropping the tag lets them be reclaimed, while the layers
          # the built images still share stay referenced.
          docker image rm -f g5/base-rust:26.04 g5/base:26.04 || true
          docker image prune --force
          df -h /

      - name: Run self-hosted smoke
        env:
          G5_SELFHOST_SMOKE_API_IMAGE: g5-selfhost-api:smoke
          G5_SELFHOST_SMOKE_EDGE_IMAGE: g5-selfhost-edge:smoke
        run: bash scripts/test-self-hosted-smoke.sh

  notify-failure:
    name: Notify Slack on automatic main failure
    needs:
      - contract
      - smoke
    if: ${{ failure() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    uses: ./.github/workflows/slack-notify.yml
    secrets:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
    with:
      title: ":x: GitHub Actions failed: self-hosted-install"
      summary: "self-hosted-install failed on an automatic main-branch run"
