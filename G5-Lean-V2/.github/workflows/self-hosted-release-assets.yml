name: self-hosted-release-assets

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Semver tag to package, such as v1.0.7"
        required: true
        type: string

permissions:
  contents: read

env:
  G5_PUBLIC_INSTALLER_RELEASE_REPO: G5Labs/Releases

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: Resolve release tag
        id: tag
        run: |
          set -euo pipefail
          tag="${{ inputs.tag }}"
          case "$tag" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "Expected semver tag vMAJOR.MINOR.PATCH, got: $tag" >&2; exit 1 ;;
          esac
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Package public self-hosted installer assets
        env:
          G5_RELEASE_TAG: ${{ steps.tag.outputs.tag }}
          G5_GITHUB_RELEASE_REPO: ${{ env.G5_PUBLIC_INSTALLER_RELEASE_REPO }}
        run: bash scripts/package-self-hosted-release-assets.sh dist/self-hosted-release-assets

      - name: Verify gated binaries are absent
        run: |
          set -euo pipefail
          tar -tzf dist/self-hosted-release-assets/g5-self-hosted-bundle.tar.gz > /tmp/g5-self-hosted-bundle-files.txt
          if grep -E '(^|/)g5d(-|$)' /tmp/g5-self-hosted-bundle-files.txt; then
            echo "g5d binary unexpectedly present in public bundle" >&2
            exit 1
          fi

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.G5_PUBLIC_INSTALLER_RELEASE_TOKEN }}
          RELEASE_REPO: ${{ env.G5_PUBLIC_INSTALLER_RELEASE_REPO }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "G5_PUBLIC_INSTALLER_RELEASE_TOKEN is required to publish public installer assets to $RELEASE_REPO" >&2
            exit 1
          fi
          if ! gh release view "$TAG" --repo "$RELEASE_REPO" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --repo "$RELEASE_REPO" \
              --title "$TAG" \
              --notes "Public G5 self-hosted installer assets. Runtime images and g5d binary downloads remain license-gated."
          fi
          gh release upload "$TAG" \
            --repo "$RELEASE_REPO" \
            dist/self-hosted-release-assets/install.sh \
            dist/self-hosted-release-assets/g5-self-hosted-bundle.tar.gz \
            dist/self-hosted-release-assets/SHA256SUMS \
            --clobber
