# cargo-deny configuration
# https://embarkstudios.github.io/cargo-deny/
#
# Run: cargo deny check

[graph]
# Exclude dev-only and build-only dependencies from license checks
# since they don't ship in the final binary.
exclude-dev = true

# ── Advisories ───────────────────────────────────────────────────────────────

[advisories]
# Pin cargo-deny's documented default for advisory DB fetches so future
# toolchain updates do not opt into the git CLI fetch path.
git-fetch-with-cli = false
# Ignore unmaintained crate advisories — we pin versions explicitly
# and monitor for replacements.
# Valid values: "all", "workspace", "transitive", "none"
unmaintained = "none"
# Yanked crates are an error — they indicate a recalled release.
yanked = "deny"

ignore = []

# ── Licenses ─────────────────────────────────────────────────────────────────

[licenses]
# Confidence threshold for license detection (0.0–1.0).
confidence-threshold = 0.8

# Allow common permissive open-source licenses.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "ISC",
    "0BSD",
    "Unlicense",
    "Zlib",
    "CC0-1.0",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
]

# Some crates are dual-licensed (e.g., MIT OR Apache-2.0).
# cargo-deny evaluates license expressions — an OR means the user can
# pick either side, so as long as one side is in the allow list the
# crate passes.

# r-efi is triple-licensed "MIT OR Apache-2.0 OR LGPL-2.1-or-later".
# We accept it under MIT/Apache-2.0; LGPL is not in the allow list
# but doesn't need to be since the OR expression satisfies with MIT.

# Private / workspace crates — not published, no SPDX license required.
[licenses.private]
ignore = true
registries = []

[[licenses.exceptions]]
# ring uses a custom ISC-style license that cargo-deny can't always
# auto-detect. Explicitly allow it.
name = "ring"
allow = ["ISC", "MIT", "OpenSSL"]

# ── Bans ─────────────────────────────────────────────────────────────────────

[bans]
# Warn on multiple versions of the same crate (common in large dep trees).
multiple-versions = "warn"
# Wildcards in version requirements are sloppy — warn about them.
wildcards = "warn"

# ── Sources ──────────────────────────────────────────────────────────────────

[sources]
# Only allow crates from crates.io and our own git repos.
unknown-registry = "deny"
unknown-git = "warn"

[sources.allow-org]
github = ["G5Labs"]
