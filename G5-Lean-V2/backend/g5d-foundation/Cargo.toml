[package]
name = "g5d-foundation"
version = "0.1.0"
edition = "2021"
publish = false

[features]
default = []
test-helpers = []
workspace-integration = []

[dependencies]
g5-contracts = { path = "../g5-contracts" }
g5-internal-api = { path = "../g5-internal-api", features = ["http-client"] }
g5-scm = { path = "../g5-scm", default-features = false, features = ["native"] }
g5-auth = { path = "../g5-auth" }

tokio = { workspace = true }
axum = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = "0.9"
uuid = { workspace = true }
tracing = { workspace = true }
jsonwebtoken = { workspace = true }
reqwest = { workspace = true }
chrono = { workspace = true }

http = "1"
portable-pty = "0.8"
regex = "1"
ignore = "0.4"
libc = "0.2"
sha2 = "0.10"
async-trait = "0.1"
futures-util = "0.3"
tokio-tungstenite = { version = "0.24", features = ["connect", "rustls-tls-native-roots"] }
tokio-util = { version = "0.7.18", features = ["rt"] }
base64 = "0.22"
thiserror = "2"
hmac = "0.12"
flate2 = "1"
tar = "0.4"
hex = "0.4"
bytes = "1"
tempfile = { workspace = true }

[dev-dependencies]
wiremock = "0.6"
serial_test = "3"
tokio = { workspace = true, features = ["test-util"] }
