[package]
name = "g5-contracts"
version = "0.1.0"
edition = "2021"
publish = false

[features]
default = []
jwt-errors = ["dep:jsonwebtoken"]
sqlx = ["dep:sqlx"]
tracing-compat = ["dep:tracing", "dep:tracing-subscriber"]
test-helpers = []
render = ["dep:tera"]
# Dispatcher test fixtures on the terminal `open` message.
terminal-test-hooks = []

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = "0.9"
tera = { version = "1", default-features = false, optional = true }
strum = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
thiserror = "2"
http = "1"
regex = "1"
sha2 = "0.10"
unicode-normalization = "0.1"
tracing = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, optional = true }

[dependencies.jsonwebtoken]
workspace = true
optional = true

[dependencies.sqlx]
workspace = true
optional = true

[dev-dependencies]
g5-contracts = { path = ".", features = ["render"] }
tempfile = "3"
