[package]
name = "g5d-agent"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
g5-contracts = { path = "../g5-contracts" }
g5-scm = { path = "../g5-scm", default-features = false, features = ["native"] }
g5-internal-api = { path = "../g5-internal-api", features = ["http-client", "stream-mux"] }
g5d-foundation = { path = "../g5d-foundation" }
# The statement rule for the turn's ontology changes card (`g5.chat.ontology-card`).
g5-semantic = { path = "../g5-semantic" }

tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true, features = ["raw_value"] }
uuid = { workspace = true }
tracing = { workspace = true }
chrono = { workspace = true }
sha2 = { workspace = true }
tempfile = { workspace = true }

async-trait = "0.1"
base64 = "0.22"
# Browser screenshot downscaling (provided_agent_runtime D98) and inline-image
# attachment validation: decode/resize/re-encode png + jpeg captures; gif and
# webp are the other attachment formats the validator accepts.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
libc = "0.2"
toml_edit = "0.22"

[dev-dependencies]
g5-scm = { path = "../g5-scm", features = ["libgit2", "test-helpers"] }
g5-contracts = { path = "../g5-contracts", features = ["render"] }
serial_test = "3"
tokio = { workspace = true, features = ["test-util"] }
wiremock = "0.6"
