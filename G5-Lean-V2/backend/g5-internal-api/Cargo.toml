[package]
name = "g5-internal-api"
version = "0.1.0"
edition = "2021"
publish = false

[features]
default = []
stream-mux = ["dep:tokio"]
test-support = ["stream-mux"]
http-client = [
    "dep:reqwest",
    "dep:backon",
    "dep:tokio",
    "dep:tracing",
    "dep:serde_path_to_error",
]

[dependencies]
base64 = "0.22"
g5-contracts = { path = "../g5-contracts" }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
sha2 = "0.10"
thiserror = "2"
zstd = "0.14"
reqwest = { workspace = true, optional = true }
backon = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
serde_path_to_error = { version = "0.1.20", optional = true }

[dev-dependencies]
tempfile = "3"
