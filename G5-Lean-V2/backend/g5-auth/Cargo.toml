[package]
name = "g5-auth"
version = "0.1.0"
edition = "2021"
publish = false

[features]
default = []
sqlx = ["dep:sqlx"]

[dependencies]
g5-contracts = { path = "../g5-contracts", features = ["jwt-errors"] }
base64 = "0.22"
chrono = { workspace = true }
jsonwebtoken = { workspace = true }
regex = "1"
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }

[dependencies.sqlx]
workspace = true
optional = true
