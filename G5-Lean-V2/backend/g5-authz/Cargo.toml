[package]
name = "g5-authz"
version = "0.1.0"
edition = "2021"
publish = false
description = "Authorization service — AuthzService trait, DbCapability, ScopedDb, InProcessAuthz"

[dependencies]
# Workspace deps
uuid = { workspace = true }
chrono = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
sqlx = { workspace = true }
tokio = { workspace = true }

# Local deps
g5-contracts = { path = "../g5-contracts", features = ["sqlx"] }

# Crate-specific deps
async-trait = "0.1"
thiserror = "2"
jsonwebtoken = { workspace = true }
sha2 = "0.10"
