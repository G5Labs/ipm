[package]
name = "g5-scm"
version = "0.1.0"
edition = "2021"
publish = false

[features]
default = ["libgit2"]
libgit2 = ["dep:git2", "native"]
native = ["dep:tokio", "dep:base64", "dep:libc", "dep:tempfile"]
providers = ["dep:reqwest", "dep:tokio", "dep:base64", "dep:bytes"]
test-helpers = ["dep:tempfile"]

[dependencies]
g5-contracts = { path = "../g5-contracts" }
chrono = { workspace = true }
# Local object/ref/diff work only; network Git runs through the native runner.
git2 = { version = "0.21.0", default-features = false, optional = true }
tokio = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
bytes = { version = "1", optional = true }
base64 = { version = "0.22", optional = true }
libc = { version = "0.2", optional = true }
regex = "1"
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tracing = { workspace = true }
url = "2"
uuid = { workspace = true }
tempfile = { version = "3", optional = true }

[dev-dependencies]
wiremock = "0.6"
openssl = "0.10"
g5-contracts = { path = "../g5-contracts", features = ["test-helpers"] }
serial_test = "3"
tempfile = "3"
