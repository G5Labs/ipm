[package]
name = "g5-api-data"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
g5-api-foundation = { path = "../g5-api-foundation" }
g5-contracts = { path = "../g5-contracts", features = ["sqlx"] }
g5-internal-api = { path = "../g5-internal-api" }

sqlx = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
tracing = { workspace = true }
chrono = { workspace = true }
tokio = { workspace = true }

thiserror = "2"
rust_decimal = { version = "1", features = ["serde-with-str"] }
