[package]
name = "fake-provider-cli"
version = "0.1.0"
edition = "2021"
publish = false
description = "Fake `claude` and `codex` binaries that replay recorded provider frames so the G5 provider runner can be tested without provider credentials"

[lib]
path = "src/lib.rs"

[[bin]]
name = "fake-claude"
path = "src/bin/fake-claude.rs"

[[bin]]
name = "fake-codex"
path = "src/bin/fake-codex.rs"

[[bin]]
name = "fake-g5-tools"
path = "src/bin/fake-g5-tools.rs"

[dependencies]
base64 = "0.22"
sha2 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = "0.8"
uuid = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
