[package]
name = "g5-e2e"
version = "0.1.0"
edition = "2021"
publish = false

# Disable auto-detected bin target — main.rs is only a test harness.
autobins = false

[[test]]
name = "e2e"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
# rustls-tls (workspace convention): the TC-CODEX-034 oracle calls
# https://api.github.com test-side; everything else is plain-http localhost.
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
uuid = { version = "1", features = ["v4", "v5", "serde"] }
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
futures-util = "0.3"
anyhow = "1"
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-native-tls", "postgres", "uuid", "chrono"] }
url = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
assert_cmd = "2"
predicates = "3"
tempfile = "3"
chrono = "0.4"
g5-contracts = { path = "../../backend/g5-contracts" }
g5-auth = { path = "../../backend/g5-auth" }
g5-internal-api = { path = "../../backend/g5-internal-api", features = ["http-client"] }
g5d = { path = "../../backend/g5d", default-features = false }
strum = { workspace = true }
libc = "0.2"
base64 = "0.22"
regex = "1"
sha2 = "0.10"

[features]
default = []
kata-e2e = []
## Enable tests that call real LLM provider APIs (costs money!).
## Requires ANTHROPIC_API_KEY, OPENROUTER_API_KEY, or OPENAI_API_KEY in env.
live-llm = []
