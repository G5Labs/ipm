# =============================================================================
# .g5/preview_profiles/full-stack-process.yaml — the whole stack, process host
# =============================================================================
# The `full-stack` profile with the previewed instance's worker host in
# explicit process isolation mode (ontology
# g5.runtime.boot.backend.process-local) instead of the default microvm. For
# machines that cannot boot Cloud Hypervisor guests: macOS and ARM developer
# hosts, and workspace VMs on a host whose nested virtualization switch is
# off (`full-stack` fails there with a pointer here; it never falls back by
# itself, g5.host.isolation). Workspaces then run as host processes; where the
# VM's filesystem has no reflink the host copies the bare cache. The previewed
# API admits that host because `dev-stack-up` derives
# G5_ALLOW_PROCESS_ISOLATION_HOSTS=true from the exports below, exactly as on
# a developer's machine. The g5dev guest image ships docker-ce, the compose
# plugin, the Rust toolchain and the sudoers-scoped `g5-dev-dockerd-start`
# helper for this.
#
# Everything else is the `full-stack` profile: the same stack identity and
# ports (project and volumes named after this incarnation, image tag
# `preview`, edge on 13000), the same seeds after the host is ready, the same
# `just dev-down` Close, the same dockerd start under `setsid`, the same
# bounded lifetime loop. See full-stack.yaml for the field semantics
# `g5d preview-serve` reads. The isolation mode and its acknowledgement are
# exported here, in the preview's own shell, so the previewed host is a
# deliberate localhost choice of this profile and nothing outside the preview
# selects it; `cleanup_command` carries the same selection so
# `worker-host-stop` finds the process host it recorded under `.dev/`.

description: Whole G5 stack with a process-mode worker host (macOS, ARM, or hosts without nested virtualization) via `just dev-up`
port: 13000
env:
  G5_PORT_EDGE: "13000"
  G5_PORT_API: "17500"
  G5_PORT_POSTGRES: "15433"
  G5_PORT_OAUTH_STUB: "19876"
  G5_IMAGE_TAG: preview
  # Keep both Source Control examples running, with a slot for normal browsing.
  G5D_HOST_MAX_MICROVMS: "3"
command: 'export PATH="/usr/local/bin:$PATH" G5_COMPOSE_PROJECT="g5-preview-${G5D_PROCESS_INCARNATION:-vm}" G5D_ISOLATION_MODE=process G5D_ALLOW_PROCESS_ISOLATION=1; export G5_COMPOSE_VOLUMES="$G5_COMPOSE_PROJECT"; if command -v g5-dev-dockerd-start >/dev/null 2>&1; then setsid g5-dev-dockerd-start || exit 1; fi; just dev-up && { node scripts/seed-source-control-preview.mjs || echo "Source Control preview seeding failed; the stack stays up" >&2; } && { python3 scripts/seed-preview-workspaces.py || echo "preview seeding failed; the stack stays up without sample workspaces" >&2; } && while :; do sleep 3600; done'
cleanup_command: 'export PATH="/usr/local/bin:$PATH" G5_COMPOSE_PROJECT="g5-preview-${G5D_PROCESS_INCARNATION:-vm}" G5D_ISOLATION_MODE=process G5D_ALLOW_PROCESS_ISOLATION=1; export G5_COMPOSE_VOLUMES="$G5_COMPOSE_PROJECT"; just dev-down'
