# =============================================================================
# .g5/preview_profiles/frontend-only.yaml — the G5 frontend alone
# =============================================================================
# Runs the Vite dev server for `frontend/` in its built-in mock mode
# (`VITE_MOCK=true` installs the fetch interceptor from `src/mocks`, so every
# `/api/*` call is answered in the browser): no containers, no API, no
# workspace host, no Docker. For UI work that needs only the client. The
# interceptor advertises the dev stack's default instance features (UI v3,
# top panel, alignment UI, guided journey, provider accounts) on top of the
# test fixture's, so the same five UI gates are on as under `full-stack` (the
# fixture's other defaults, such as its workspace layout, stay as they are);
# `VITE_MOCK_FEATURES` (comma list) replaces that set. Mock mode also takes
# the dev stack's `alignment` default layout and answers the organization
# Home from `src/mocks/home-preview.ts` (a connected GitHub account, issue
# domains with open issues, attention, running compute), so `/<org>/home`
# shows the shipped alignment Home with every tile populated; its journeys
# run with `npm run test:e2e:mock-preview`. The
# `full-stack-no-worker` profile adds the real API and the `full-stack`
# profile the whole stack with a worker host; neither has issue data unless
# a GitHub App is configured.
#
# `g5d preview-serve` runs `command` via /bin/sh -c in `working_dir` (relative
# to this repository's root) and forces PORT=<port>; Vite is told that port
# explicitly and refuses to pick another. The port is off Vite's own 5174 so
# that, on a process host, a developer's running dev server is never taken
# for this preview nor collided with. Dependencies are installed into the
# checkout's own node_modules first. Closing the preview stops the process
# group; nothing is left behind, so there is no cleanup command.

description: The real frontend with a mocked API and demo data, Home tiles included (UI work only; no API, no stack)
port: 15174
working_dir: frontend
env:
  VITE_MOCK: "true"
command: 'export PATH="/usr/local/bin:$PATH"; npm ci --no-audit --no-fund && exec npm run dev -- --host 127.0.0.1 --port "$PORT" --strictPort'
