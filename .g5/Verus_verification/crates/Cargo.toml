[workspace]
resolver = "2"
members = ["ipm-load-history"]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
vstd = "=0.0.0-2026-09-20-0158"
verus_state_machines_macros = "=0.0.0-2026-09-06-0133"
explorer = { path = "../vendor/explorer" }

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(verus_only)', 'cfg(verus_keep_ghost)', 'cfg(verus_keep_ghost_body)'] }
